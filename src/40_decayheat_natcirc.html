<script>
SECT('02 · 작아지면 무엇이 달라지는가');
S({bare:true, cls:'div', ov:'§02 작아지면 무엇이 달라지는가',
html:`<div class="no">02</div><h2>작아지면 무엇이 달라지는가</h2><div class="ln"></div>
<p>SMR의 안전 논리를 지탱하는 두 개의 물리. 하나는 붕괴열의 <b>절대량</b>이고, 다른 하나는 자연순환의 <b>구동수두</b>다.
이 두 숫자가 이후 모든 계통 설계를 규정한다.</p>`});

S({tag:'DECAY HEAT', ov:'붕괴열 — 비율은 같고 절대량이 준다',
src:'<b>계산</b> Way–Wigner 근사 <span class="mono">P_d/P₀ = 0.0622 [ t<sup>−0.2</sup> − (t+t₀)<sup>−0.2</sup> ]</span>, t₀ = 10⁸ s. 인허가 해석에는 ANSI/ANS-5.1을 쓴다 · 정격 열출력 출처 IAEA SMR Booklet 2022 · KHNP',
html:`<h2 class="t">비율은 같다. <em>절대량</em>이 다르다 — 슬라이더로 시간을 흘려보자</h2>
<ul class="b">
  <li>붕괴열 <b>비율</b>은 노심 크기와 거의 무관. 정지 1시간 뒤 어느 노형이든 정격의 약 <code>1 %</code></li>
  <li>달라지는 건 <b class="hot">절대량</b> — 3,983 MWt의 1 %는 40 MW, 250 MWt의 1 %는 2.6 MW. <b>15배</b> 차이</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 1120 330" role="img" aria-label="정지 후 시간에 따른 붕괴열 비율 곡선과 세 노형의 절대 붕괴열 비교">
    <g id="dk-ax"></g>
    <path id="dk-c" d="" fill="none" stroke="var(--cool)" stroke-width="2.4"/>
    <line id="dk-v" y1="292" y2="40" stroke="var(--hot)" stroke-width="1.2"/>
    <circle id="dk-p" r="6.5" fill="var(--hot)"/>
    <text x="300" y="18" text-anchor="middle" class="lbl b">붕괴열 / 정격 열출력</text>
    <text x="860" y="18" text-anchor="middle" class="lbl b">붕괴열 절대량 (MW, 로그 눈금)</text>
    <g id="dk-bars"></g>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">정지 후 경과</span><span class="v" id="dk-t">1<small>시간</small></span></div>
    <div class="readout hi"><span class="k">정격 대비 비율</span><span class="v" id="dk-f">1.05<small>%</small></span></div>
    <div class="ctl"><label>시간 <span id="dk-s">1 시간</span></label>
      <input type="range" id="dk-sl" min="0" max="600" step="1" value="257"></div>
    <div class="src">1 초 → 1 주. 로그 눈금이라 슬라이더 한 칸이 뒤로 갈수록 긴 시간을 뜻한다.</div>
  </div>
</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const LX=t=>70+(Math.log10(t))/6*450;               // 1 .. 1e6 s → 70..520
  const LY=f=>292-(Math.log10(f)-Math.log10(0.1))/(Math.log10(20)-Math.log10(0.1))*252;
  const BX=mw=>640+(Math.log10(Math.max(mw,0.1))+1)/(Math.log10(300)+1)*430;
  let ax='';
  [[1,'1 s'],[60,'1 분'],[3600,'1 시간'],[86400,'1 일'],[604800,'1 주']].forEach(d=>{
    const x=LX(d[0]); ax+=`<line x1="${x}" y1="292" x2="${x}" y2="40" class="grid"/>`
      +`<text x="${x}" y="312" class="lbl" text-anchor="middle">${d[1]}</text>`; });
  [0.1,1,10].forEach(f=>{ const y=LY(f);
    ax+=`<line x1="70" y1="${y}" x2="520" y2="${y}" class="grid"/>`
      +`<text x="62" y="${y+4}" class="lbl" text-anchor="end">${f} %</text>`; });
  ax+='<line x1="70" y1="292" x2="520" y2="292" class="axis"/><line x1="70" y1="292" x2="70" y2="34" class="axis"/>';
  [0.1,1,10,100].forEach(m=>{ const x=BX(m);
    ax+=`<line x1="${x}" y1="60" x2="${x}" y2="300" class="grid"/>`
      +`<text x="${x}" y="318" class="lbl" text-anchor="middle">${m}</text>`; });
  el.querySelector('#dk-ax').innerHTML=ax;
  let d=''; for(let i=0;i<=300;i++){ const t=Math.pow(10,i/300*6);
    d+=(d?'L':'M')+LX(t).toFixed(1)+','+LY(decay(t)*100).toFixed(1); }
  el.querySelector('#dk-c').setAttribute('d',d);
  const REA=[['APR1400',3983,'var(--ink-2)'],['BWRX-300',870,'var(--amber)'],['NuScale NPM',250,'var(--ok)']];
  const bg=el.querySelector('#dk-bars'); const bars=[];
  REA.forEach((r,i)=>{ const y=110+i*62;
    bg.insertAdjacentHTML('beforeend',
      `<text x="640" y="${y-10}" class="lbl b">${r[0]} · ${fmt(r[1])} MWt</text>`
      +`<rect x="640" y="${y}" height="22" width="0" fill="${r[2]}" opacity=".85" data-b="${i}"/>`
      +`<text x="646" y="${y+40}" class="val" fill="${r[2]}" data-v="${i}"></text>`); });
  const sl=el.querySelector('#dk-sl'), vl=el.querySelector('#dk-v'), pt=el.querySelector('#dk-p');
  function upd(v){
    const t=Math.pow(10,v/600*6), f=decay(t);
    vl.setAttribute('x1',LX(t));vl.setAttribute('x2',LX(t));
    vl.setAttribute('y2',LY(f*100));
    pt.setAttribute('cx',LX(t));pt.setAttribute('cy',LY(f*100));
    const lab = t<90? fmt(t,0)+' 초' : t<5400? fmt(t/60,0)+' 분' : t<172800? fmt(t/3600,1)+' 시간' : fmt(t/86400,1)+' 일';
    el.querySelector('#dk-t').innerHTML=lab.split(' ')[0]+'<small>'+lab.split(' ')[1]+'</small>';
    el.querySelector('#dk-f').innerHTML=(f*100).toFixed(2)+'<small>%</small>';
    el.querySelector('#dk-s').textContent=lab;
    REA.forEach((r,i)=>{ const mw=f*r[1];
      el.querySelector(`[data-b="${i}"]`).setAttribute('width',Math.max(0,BX(mw)-640));
      el.querySelector(`[data-v="${i}"]`).textContent=(mw>=10?fmt(mw,0):mw.toFixed(2))+' MW'; });
  }
  sl.oninput=()=>upd(+sl.value); upd(257);
  if(RM) return;
  const c=el.querySelector('#dk-c'), L=c.getTotalLength();
  c.style.strokeDasharray=L;c.style.strokeDashoffset=L;
  c.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,fill:'forwards'});
  raf(t=>{ if(t<1.1||t>4.6) return; const u=(t-1.1)/3.5; sl.value=Math.round(u*600); upd(+sl.value); });
}});

S({tag:'NATURAL CIRCULATION', ov:'자연순환 — 구동수두 인터랙티브',
src:'<b>계산</b> Δp = (ρ_c − ρ_h) g H, u = √[2Δp / ρ(fL/D + ΣK)] · 압축수 밀도 근사(10~16 MPa) · 유로 K = 25, 단면적 2 m², 저온측 250 °C 기준. 펌프 양정 600 kPa는 대형 PWR의 개념적 대표값',
html:`<h2 class="t">펌프가 없으면 <em>밀도차</em>가 밀어야 한다 — 그 힘은 얼마인가</h2>
<ul class="b">
  <li>열중심 높이차 <code>H</code>와 온도차 <code>ΔT</code>가 만드는 부력이 유일한 구동력</li>
  <li>구동수두가 작으니 <b>유량도 작다</b> → 같은 출력을 빼려면 노심 출입구 <b class="hot">온도차가 커진다</b></li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 340" role="img" aria-label="자연순환 루프의 구동수두와 유속이 높이차·온도차에 따라 변하는 모습">
    <path id="nc-p" d="M260,300 L260,90 L470,90 L470,300 Z" fill="none" stroke="var(--rule)" stroke-width="11"/>
    <rect x="222" y="238" width="76" height="74" rx="4" fill="var(--hot)"/>
    <text x="260" y="282" text-anchor="middle" font-size="13" fill="#fff" font-family="var(--sans)">노심</text>
    <rect x="432" y="72" width="76" height="96" rx="4" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.5"/>
    <text x="470" y="126" text-anchor="middle" class="lbl" fill="var(--cool)">열교환기</text>
    <line id="nc-h" x1="150" x2="150" stroke="var(--ok)" stroke-width="1.6"/>
    <path id="nc-h1" d="" stroke="var(--ok)" stroke-width="1.6"/>
    <text id="nc-ht" x="140" y="190" text-anchor="end" class="val" fill="var(--ok)">H</text>
    <text x="365" y="72" text-anchor="middle" class="lbl" fill="var(--hot)">뜨거운 쪽 (가벼움)</text>
    <text x="365" y="326" text-anchor="middle" class="lbl" fill="var(--cool)">차가운 쪽 (무거움)</text>
    <g id="nc-cmp">
      <text x="560" y="200" class="lbl b">구동 압력 비교</text>
      <rect x="560" y="212" width="110" height="16" fill="var(--ink-3)" opacity=".5"/>
      <text x="560" y="246" class="lbl">대형 PWR 펌프 600 kPa</text>
      <rect id="nc-bar" x="560" y="262" width="4" height="16" fill="var(--ok)"/>
      <text id="nc-bart" x="560" y="296" class="lbl" fill="var(--ok)">자연순환</text>
    </g>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">구동수두 Δp</span><span class="v" id="nc-dp">11.3<small>kPa</small></span></div>
    <div class="readout hi"><span class="k">자연순환 유속</span><span class="v" id="nc-u">0.87<small>m/s</small></span></div>
    <div class="readout warn"><span class="k">노심 ΔT · 250 MWt</span><span class="v" id="nc-dt">36<small>K</small></span></div>
    <div class="ctl"><label>열중심 높이차 <span id="nc-hs">10.0 m</span></label>
      <input type="range" id="nc-sh" min="2" max="14" step="0.2" value="10"></div>
    <div class="ctl"><label>노심 출입구 온도차 <span id="nc-ts">67 K</span></label>
      <input type="range" id="nc-st" min="20" max="110" step="1" value="67"></div>
  </div>
</div>`,
init(el){
  const p=el.querySelector('#nc-p'), f=flow(p,{n:16,speed:0.12,r:4.2,color:'var(--cool)'});
  const sh=el.querySelector('#nc-sh'), stt=el.querySelector('#nc-st');
  const hl=el.querySelector('#nc-h'), h1=el.querySelector('#nc-h1');
  let target=0.12;
  function upd(){
    const H=+sh.value, dT=+stt.value, Tc=250;
    const drho=rhoW(Tc)-rhoW(Tc+dT), dp=drho*9.81*H, u=Math.sqrt(2*dp/(750*25));
    const mdot=750*u*2, dTc=250e6/(mdot*5300);
    el.querySelector('#nc-dp').innerHTML=(dp/1000).toFixed(1)+'<small>kPa</small>';
    el.querySelector('#nc-u').innerHTML=u.toFixed(2)+'<small>m/s</small>';
    el.querySelector('#nc-dt').innerHTML=fmt(dTc,0)+'<small>K</small>';
    el.querySelector('#nc-hs').textContent=H.toFixed(1)+' m';
    el.querySelector('#nc-ts').textContent=dT+' K';
    // 높이 치수선 (H = 2..14 m → 화면 210 px 내에서)
    const y0=290, y1=290-(H/14)*200;
    hl.setAttribute('y1',y0);hl.setAttribute('y2',y1);
    h1.setAttribute('d',`M142,${y0} H158 M142,${y1} H158`);
    el.querySelector('#nc-ht').setAttribute('y',(y0+y1)/2+5);
    el.querySelector('#nc-ht').textContent='H '+H.toFixed(1)+' m';
    const w=Math.max(3,(dp/1000)/600*110);
    el.querySelector('#nc-bar').setAttribute('width',w);
    el.querySelector('#nc-bart').textContent='자연순환 '+(dp/1000).toFixed(1)+' kPa';
    target=0.030+u*0.115;
  }
  sh.oninput=upd; stt.oninput=upd; upd();
  raf(()=>{ f.speed=lerp(f.speed,target,0.08); });
  if(RM) return;
  raf(t=>{ if(t>2.4) return; const u=clamp(t/2.2,0,1);
    sh.value=(lerp(3,10,u)).toFixed(1); stt.value=Math.round(lerp(30,67,u)); upd(); });
}});

S({tag:'THERMAL INERTIA', ov:'열관성 — 5배 느리게 데워진다',
src:'<b>계산</b> dT/dt = P_d /(M c_p), c_p = 5.3 kJ/(kg·K), 정지 1시간 후 붕괴열(SMR 2.6 MW / 대형로 41.8 MW) 기준. 냉각이 <b>완전히 끊긴</b> 가장 보수적인 상한이며 실제로는 용기 열손실과 잔열제거계통이 함께 작동한다',
html:`<h2 class="t">대처시간이 길다는 말의 <em>물리적 내용</em></h2>
<ul class="b">
  <li>붕괴열이 적고 물이 많으면 온도가 <b>천천히</b> 오른다 — 그 느림이 운전원과 피동계통이 쓰는 시간</li>
  <li>SMR <code>17.7 K/h</code> vs 대형 경수로 <code>94.6 K/h</code> — <b class="ok">약 5배</b></li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 1120 320" role="img" aria-label="냉각이 끊긴 뒤 SMR과 대형 경수로의 1차계통 온도 상승 속도 비교">
    <g id="ti-ax"></g>
    <polyline id="ti-a" points="" fill="none" stroke="var(--ok)" stroke-width="3"/>
    <polyline id="ti-b" points="" fill="none" stroke="var(--hot)" stroke-width="3"/>
    <line id="ti-sat" x1="120" x2="1030" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text id="ti-satt" x="1030" class="lbl" fill="var(--amber)" text-anchor="end">포화온도 약 330 °C (12.8 MPa)</text>
    <circle id="ti-pa" r="6" fill="var(--ok)"/><circle id="ti-pb" r="6" fill="var(--hot)"/>
    <text x="140" y="40" class="lbl" fill="var(--ok)">250 MWt 일체형 SMR · 1차계통 물 100 t</text>
    <text x="140" y="62" class="lbl" fill="var(--hot)">3,983 MWt 대형 경수로 · 1차계통 물 300 t</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">SMR 온도</span><span class="v" id="ti-ta">250<small>°C</small></span></div>
    <div class="readout warn"><span class="k">대형 경수로 온도</span><span class="v" id="ti-tb">250<small>°C</small></span></div>
    <div class="readout"><span class="k">경과 시간</span><span class="v" id="ti-cl">0.0<small>시간</small></span></div>
    <div class="src">두 곡선이 같은 포화온도 선에 닿는 데 걸리는 시간의 차이가 곧 <b>대처시간의 차이</b>다.</div>
  </div>
</div>`,
init(el){
  const X=h=>120+h/3.2*910, Y=T=>270-(T-250)/110*220;
  let ax='<line x1="120" y1="270" x2="1035" y2="270" class="axis"/><line x1="120" y1="270" x2="120" y2="70" class="axis"/>';
  [0,1,2,3].forEach(h=>{ ax+=`<line x1="${X(h)}" y1="270" x2="${X(h)}" y2="76" class="grid"/>`
    +`<text x="${X(h)}" y="292" class="lbl" text-anchor="middle">${h} 시간</text>`; });
  [250,290,330,350].forEach(T=>{ ax+=`<text x="112" y="${Y(T)+4}" class="lbl" text-anchor="end">${T} °C</text>`; });
  ax+='<text x="1035" y="310" class="lbl" text-anchor="end">냉각이 끊긴 뒤 경과시간</text>';
  el.querySelector('#ti-ax').innerHTML=ax;
  el.querySelector('#ti-sat').setAttribute('y1',Y(330));
  el.querySelector('#ti-sat').setAttribute('y2',Y(330));
  el.querySelector('#ti-satt').setAttribute('y',Y(330)-8);
  const RA=17.7, RB=94.6;
  const A=el.querySelector('#ti-a'), B=el.querySelector('#ti-b'),
        pa=el.querySelector('#ti-pa'), pb=el.querySelector('#ti-pb');
  function draw(h){
    const ha=Math.min(h,(330-250)/RA), hb=Math.min(h,(330-250)/RB);
    A.setAttribute('points',poly([[X(0),Y(250)],[X(ha),Y(250+RA*ha)]]));
    B.setAttribute('points',poly([[X(0),Y(250)],[X(hb),Y(250+RB*hb)]]));
    pa.setAttribute('cx',X(ha));pa.setAttribute('cy',Y(250+RA*ha));
    pb.setAttribute('cx',X(hb));pb.setAttribute('cy',Y(250+RB*hb));
    el.querySelector('#ti-ta').innerHTML=fmt(250+RA*ha,0)+'<small>°C</small>';
    el.querySelector('#ti-tb').innerHTML=fmt(250+RB*hb,0)+'<small>°C</small>';
    el.querySelector('#ti-cl').innerHTML=h.toFixed(1)+'<small>시간</small>';
  }
  if(RM){ draw(3.2); return; }
  draw(0);
  raf(t=>{ const c=(t%9)/9*3.2; draw(c); });
}});
</script>
