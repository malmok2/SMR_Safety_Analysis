<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{code}} {{title_ko}}</title>
<style>
/*@FONTS@*/
/*@TOKENS@*/
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:72px 32px 96px}
.kick{font-family:var(--mono);font-size:13px;letter-spacing:.22em;color:var(--cool);
  text-transform:uppercase}
h1{font-size:52px;line-height:1.1;margin:18px 0 0;font-weight:600;letter-spacing:-.03em}
h1 span{color:var(--cool)}
.sub{font-size:19px;color:var(--ink-2);font-weight:300;margin:10px 0 0;line-height:1.5}
.ln{width:110px;height:2px;background:var(--hot);margin:28px 0 0}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;
  margin:22px 0 0;line-height:1.8}
h2.sec{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin:64px 0 16px;padding-bottom:9px;
  border-bottom:1px solid var(--rule)}
.card{background:var(--panel);border:1px solid var(--rule);padding:22px 26px 20px;margin:0 0 14px;
  display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.card .wk{font-family:var(--mono);font-size:15px;color:var(--cool);letter-spacing:.06em;
  flex:none;width:96px;padding-top:3px}
.card .body{flex:1;min-width:260px}
.card .t{font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.card .te{font-size:15px;color:var(--ink-3);font-weight:300;margin-top:3px}
.card .lead{font-size:16px;color:var(--ink-2);font-weight:300;margin-top:10px;line-height:1.5}
.card .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.card a{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--ink-2);
  background:var(--ground);border:1px solid var(--rule);padding:8px 13px;text-decoration:none;
  transition:color .15s,border-color .15s}
.card a:hover{color:var(--cool);border-color:var(--cool)}
.card a.go{color:var(--on-accent);background:var(--cool);border-color:var(--cool)}
.card a.go:hover{filter:brightness(1.1)}
.card .links .dl{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;
  align-self:center;padding:0 2px 0 10px;white-space:nowrap}
.card .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:12px;letter-spacing:.05em}
.note{font-size:14.5px;color:var(--ink-3);font-weight:300;margin:-4px 0 18px;line-height:1.65}
.note b{color:var(--ink-2);font-weight:500}
.note kbd{font-family:var(--mono);font-size:12.5px;color:var(--cool);border:1px solid var(--rule);
  border-radius:3px;padding:1px 5px}
.foot{margin-top:72px;padding-top:18px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media (max-width:640px){ h1{font-size:38px} .wrap{padding:48px 20px 64px} .card .wk{width:auto} }
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">{{org_ko}}</div>
  <h1>{{code}} <span>{{title_ko}}</span></h1>
  <p class="sub">{{title_en}}</p>
  <div class="ln"></div>
  <div class="meta">{{term_ko}} · {{instructor_ko}}<br>{{org_en}}</div>

  <h2 class="sec">강의 자료 · Lecture materials</h2>
  <p class="note">HTML 한 파일에 글꼴 · 그림 · 애니메이션이 모두 들어 있음. <b>내려받아 LMS 에 올리거나</b> 인터넷 없는 강의실에서 그대로 열 수 있음 — 열고 <kbd>P</kbd> 를 누르면 그 자리에서 PDF 로도 뽑힘.</p>
<!--CARDS-->
  <div class="foot"><span>THINK LAB · HANYANG</span><span>{{built}}</span></div>
</div>
</body>
</html>
