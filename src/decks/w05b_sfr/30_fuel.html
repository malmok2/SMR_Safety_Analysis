<script>
/* ================================================================
   SECTION 08 — 금속연료, 녹는점이 낮은데 더 안전하다  (교재 8장)
   ================================================================ */
SECT('08 · [[금속연료||Metal fuel]]');

S({bare:true, cls:'div', ov:'[[&#167;08 금속연료 — 녹는점이 낮은데 더 안전하다||&#167;08 Metal fuel - a lower melting point, yet safer]]',
html:`[[<div class="no">08</div><h2>금속연료</h2><div class="ln"></div>
<p>U-Pu-Zr의 고상선은 1077 °C, MOX는 약 2700 °C다. 그런데 1986년 제어봉 없이 유량상실을 견딘 것은 금속연료 노심이었고,
오늘날 소형 SFR은 전부 금속연료를 쓴다. 그 역설을 <b>열전도도</b> 하나로 푼다.</p>||<div class="no">08</div><h2>Metal fuel</h2><div class="ln"></div>
<p>U-Pu-Zr becomes solidus at 1077 °C; MOX at about 2700 °C. Yet the core that rode out a loss of flow without rods in 1986 was metal,
and every small SFR today uses metal fuel. <b>Thermal conductivity</b> resolves the paradox.</p>]]`});


/* ---------------------------------------------------------------- 역설 */
S({tag:'THE PARADOX', ov:'[[같은 선출력에서의 금속 · 산화물 연료 온도||Metal and oxide fuel temperatures at the same linear power]]',
src:'[[<b>계산</b> 본 교재 8.1절 그림 8.1 · ΔT = q′/(4πk) · k<sub>금속</sub> ≈ 16, k<sub>산화물</sub> ≈ 2.5 W/(m·K) · 연료 표면 500 °C, 반경 4 mm(그림 8.1 과 같은 조건)||<b>Calculation</b> This textbook &#167;8.1, Fig. 8.1 · ΔT = q′/(4πk) · k<sub>metal</sub> ≈ 16, k<sub>oxide</sub> ≈ 2.5 W/(m·K) · fuel surface 500 °C, radius 4 mm (as in Fig. 8.1)]]',
abbr:'[[<b>고상선</b> 녹기 시작하는 온도 · <b>MOX</b> 우라늄·플루토늄 혼합산화물 연료 · <b>선출력 q′</b> 연료봉 1 m 당 열출력(kW/m)||<b>solidus</b> the temperature where melting begins · <b>MOX</b> mixed uranium-plutonium oxide fuel · <b>linear power q′</b> heat per metre of fuel rod (kW/m)]]',
html:`<h2 class="t">[[같은 선출력에서의 <em>금속 · 산화물</em> 연료 온도||<em>Metal and oxide</em> fuel temperatures at the same linear power]]</h2>
<ul class="b">
  <li>[[열전도도가 약 6배 차이 — 25 kW/m에서 중심–표면 온도차가 금속 <b class="ok">124 K</b>, 산화물 <b class="hot">796 K</b>||Conductivity differs about six-fold - at 25 kW/m the centre-to-surface rise is <b class="ok">124 K</b> for metal, <b class="hot">796 K</b> for oxide]]</li>
  <li>[[금속연료는 냉각재보다 <b>겨우 124 K</b> 뜨거움 — 녹는점까지의 거리가 아니라 <b>연료가 냉각재에 붙어 있다는 사실</b>이 안전을 만듦(다음 장)||Metal fuel runs <b>only 124 K</b> above the coolant - what makes it safe is not distance to melting but <b>the fuel staying tied to the coolant</b> (next slide)]]</li>
</ul>
<div class="body">
  <div class="fig">
  <div class="formula" style="font-size:20px;padding:0 0 6px">ΔT <span class="op">=</span> q′ / (4πk)</div>
  <svg viewBox="0 0 800 360" role="img" aria-label="[[선출력에 따른 금속·산화물 연료의 반경방향 온도 분포와 금속연료 고상선 1077 °C||Radial temperature in metal and oxide fuel against linear power, with the 1077 °C metal solidus]]">
    <g id="mf-ax"></g>
    <path id="mf-o" d="" fill="none" stroke="var(--hot)" stroke-width="3"/>
    <path id="mf-m" d="" fill="none" stroke="var(--cool)" stroke-width="3"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout hi"><span class="k">[[금속 U-10Zr 중심||Metal U-10Zr centre]]</span><span class="v" id="mf-tm">624<small>°C</small></span></div>
    <div class="readout warn"><span class="k">[[산화물 MOX 중심||Oxide MOX centre]]</span><span class="v" id="mf-to">1296<small>°C</small></span></div>
    <div class="ctl"><label>[[선출력 q′||Linear power q′]] <span id="mf-qs">25 kW/m</span></label>
      <input type="range" id="mf-sl" min="10" max="40" step="0.5" value="25"></div>
  </div>
</div>`,
init(el){
  const mk=svgEl, ax=el.querySelector('#mf-ax'), Ts=500, R=4;
  const X0=70, X1=760, Y0=310, Y1=14, sx=r=>X0+r/R*(X1-X0), sy=T=>Y0-(T-400)/(1800-400)*(Y0-Y1);
  for(let T=400;T<=1800;T+=200){ ax.appendChild(mk('line',{x1:X0,x2:X1,y1:sy(T),y2:sy(T),class:'grid'}));
    ax.appendChild(mk('text',{x:X0-10,y:sy(T)+4,'text-anchor':'end',class:'lbl'})).textContent=T+' °C'; }
  for(let r=0;r<=4;r++) ax.appendChild(mk('text',{x:sx(r),y:Y0+20,'text-anchor':'middle',class:'lbl'})).textContent=r+' mm';
  ax.appendChild(mk('text',{x:X1,y:Y0+44,'text-anchor':'end',class:'lbl'})).textContent=TX('연료 반경','fuel radius');
  ax.appendChild(mk('line',{x1:X0,x2:X1,y1:sy(1077),y2:sy(1077),stroke:'var(--cool)','stroke-dasharray':'7 5'}));
  ax.appendChild(mk('text',{x:X1,y:sy(1077)-8,'text-anchor':'end',class:'lbl',fill:'var(--cool)'})).textContent=TX('금속연료 고상선 1077 °C','metal solidus 1077 °C');
  ax.appendChild(mk('text',{x:X1,y:sy(500)-8,'text-anchor':'end',class:'lbl'})).textContent=TX('냉각재 쪽 표면 500 °C','surface 500 °C');
  const prof=(q,k)=>{ let d=''; for(let i=0;i<=40;i++){ const r=R*i/40, T=Ts+q/(4*Math.PI*k)*(1-(r/R)*(r/R));
    d+=(d?'L':'M')+sx(r).toFixed(1)+','+sy(T).toFixed(1); } return d; };
  const sl=el.querySelector('#mf-sl');
  function upd(){
    const q=+sl.value*1000;
    el.querySelector('#mf-m').setAttribute('d',prof(q,16)); el.querySelector('#mf-o').setAttribute('d',prof(q,2.5));
    el.querySelector('#mf-tm').innerHTML=fmt(Ts+q/(4*Math.PI*16))+'<small>°C</small>';
    el.querySelector('#mf-to').innerHTML=fmt(Ts+q/(4*Math.PI*2.5))+'<small>°C</small>';
    el.querySelector('#mf-qs').textContent=(+sl.value).toFixed(1)+' kW/m';
  }
  sl.oninput=upd; upd();
  if(RM) return;
  raf(t=>{ if(t>2.4) return; sl.value=lerp(10,25,clamp(t/2.2,0,1)).toFixed(1); upd(); });
}});


/* ---------------------------------------------------------------- 세 결론 */
S({tag:'THREE CONSEQUENCES', ov:'[[연료가 냉각재에 붙어 있다는 것 — 세 가지 결론||Fuel tied to the coolant - three consequences]]',
src:'[[<b>출처</b> 본 교재 8.1절 · 금속연료의 도플러 계수는 산화물의 약 1/3 · 실험적 근거는 10장 EBR-II 시험||<b>Source</b> This textbook &#167;8.1 · metal-fuel Doppler coefficient is about one third of oxide&#8217;s · the experimental proof is the EBR-II tests in ch. 10]]',
abbr:'[[<b>저장 에너지</b> 연료가 품고 있는 열 — 정지 뒤에도 빼내야 함 · <b>도플러 피드백</b> 연료 온도가 오르면 반응도가 줄어드는 효과 · <b>구조 열팽창 피드백</b> 노심 구조물·나트륨·제어봉 구동축이 팽창하며 넣는 음의 반응도||<b>stored energy</b> heat held in the fuel that must still be removed after shutdown · <b>Doppler feedback</b> reactivity falling as fuel heats · <b>structural expansion feedback</b> negative reactivity from expanding core structures, sodium and rod drivelines]]',
html:`<h2 class="t">[[연료가 냉각재에 붙어 있다는 것 — <em>세 가지 결론</em>||Fuel tied to the coolant - <em>three consequences</em>]]</h2>
<ul class="b">
  <li>[[금속연료는 <b>노심 전체를 하나의 온도계</b>로 만듦 — 도플러라는 국소 피드백 대신 <b class="ok">구조 열팽창이라는 전역 피드백</b>에 안전을 검||Metal fuel turns <b>the whole core into one thermometer</b> - safety rests on <b class="ok">global structural-expansion feedback</b> rather than local Doppler]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 380" role="img" aria-label="[[저장 에너지가 적음, 도플러가 약함, 그래서 구조 열팽창이 지배함이라는 세 결론의 사슬||A chain of three conclusions - little stored energy, weak Doppler, so structural expansion dominates]]">
  <g id="c3-g"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#c3-g'), gs=[];
  [['1',TX('저장 에너지가 거의 없음','Almost no stored energy'),TX('산화물은 정지 순간 796 K 분의 열을 품고 그걸 마저 빼야 함. 금속은 124 K 분뿐 — 사고 초기 거동이 완전히 다름.','Oxide holds 796 K worth of heat at shutdown that must still come out; metal holds 124 K. Early accident behaviour is entirely different.'),'var(--cool)'],
   ['2',TX('도플러 피드백이 약함','Weak Doppler feedback'),TX('출력이 변해도 연료 온도가 크게 안 움직임. 금속연료의 도플러 계수는 산화물의 약 1/3.','Fuel temperature barely moves with power. Metal-fuel Doppler is about a third of oxide’s.'),'var(--amber)'],
   ['3',TX('그래서 구조 열팽창이 지배함','So structural expansion dominates'),TX('연료가 냉각재 온도를 따라감. 유량이 줄면 노심 구조물 · 나트륨 · 제어봉 구동축이 같이 팽창해 도플러보다 큰 음의 반응도를 넣음.','Fuel follows the coolant. When flow falls, structures, sodium and rod drivelines expand together and insert more negative reactivity than Doppler.'),'var(--ok)']]
  .forEach((c,i)=>{
    const g=mk('g',{transform:'translate('+(i*378)+',0)',opacity:0});
    g.appendChild(mk('rect',{width:362,height:370,fill:'var(--panel)',stroke:i===2?c[3]:'var(--rule)','stroke-width':i===2?2:1}));
    g.appendChild(mk('rect',{width:362,height:4,fill:c[3]}));
    g.appendChild(mk('text',{x:22,y:66,'font-family':'var(--mono)','font-size':44,fill:c[3],'font-weight':600})).textContent=c[0];
    wrapT(c[1],17).slice(0,2).forEach((ln,j)=>g.appendChild(mk('text',{x:22,y:118+j*28,'font-family':'var(--sans)','font-size':21,fill:c[3],'font-weight':600})).textContent=ln);
    wrapT(c[2],19).slice(0,7).forEach((ln,j)=>g.appendChild(mk('text',{x:22,y:190+j*27,'font-family':'var(--sans)','font-size':16.5,fill:'var(--ink-2)','font-weight':300})).textContent=ln);
    if(i<2) g.appendChild(mk('path',{d:'M364,185 L376,185 M370,179 L376,185 L370,191',stroke:'var(--ink-3)','stroke-width':1.8,fill:'none'}));
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:380,delay:260*i,fill:'forwards'}));
}});


/* ---------------------------------------------------------------- 스미어 밀도 */
S({tag:'SMEAR DENSITY 75 %', ov:'[[스미어 밀도 75 % 의 근거 — 팽윤 30 % 에서 기포가 이어짐||Why the smear density is 75 %]]',
src:'[[<b>출처</b> 본 교재 8.2절 · 초기 설계 연소도 1~3 at.% &#8594; EBR-II Mark-II 8~8.9 at.%, Mark-III 10 at.% · 기체 플레넘 부피는 연료의 1.4~1.5배||<b>Source</b> This textbook &#167;8.2 · early designs 1-3 at.% &#8594; EBR-II Mark-II 8-8.9 at.%, Mark-III 10 at.% · gas plenum 1.4-1.5 times the fuel volume]]',
abbr:'[[<b>스미어 밀도</b> 연료를 피복재 안지름까지 펴 발랐을 때의 밀도/이론밀도 · <b>팽윤</b> 핵분열 기체 기포로 연료 부피가 부푸는 현상 · <b>at.%</b> 원자 백분율 연소도 · <b>나트륨 본드</b> 연료와 피복재 틈을 채운 액체 나트륨||<b>smear density</b> fuel density if spread to the cladding bore, over theoretical density · <b>swelling</b> fuel growth from fission-gas bubbles · <b>at.%</b> burnup in atom percent · <b>sodium bond</b> liquid sodium filling the fuel-cladding gap]]',
html:`<h2 class="t">[[<em>스미어 밀도 75 %</em> 의 근거 — 팽윤 30 % 에서 기포가 이어짐||Why the <em>smear density</em> is 75 %]]</h2>
<ul class="b">
  <li>[[처음부터 <b>25 %를 빈 공간</b>으로 둠 — 팽윤이 30 %에 이르러 기체가 빠져나가기 전에 연료가 피복재를 세게 밀지 않게 하려는 것||<b>A quarter of the space is left empty</b> from the start - so the fuel does not press hard on the cladding before swelling reaches 30 % and the gas escapes]]</li>
  <li>[[빈틈은 <b>액체 나트륨(본드)</b>으로 채움 — 열전도가 높은 열교이자, 연소도 1 at.% 무렵 연료가 피복재에 닿을 때까지의 완충||The gap is filled with <b>liquid sodium (the bond)</b> - a high-conductivity bridge and a cushion until the fuel touches the cladding around 1 at.%]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 360" role="img" aria-label="[[핵분열 기체 기포 성장부터 스미어 밀도 75 % 까지의 다섯 단계 사슬과 연소도 향상||Five steps from fission-gas bubbles to a 75 % smear density, and the burnup it bought]]">
  <g id="sd-g"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#sd-g'), gs=[];
  const S5=[TX('핵분열 기체가 기포로 자람 — 산화물보다 빨리 부풂','fission gas grows as bubbles - faster than in oxide'),
            TX('체적 팽윤 약 30 % 에서 기포가 서로 연결됨','at about 30 % swelling the bubbles link up'),
            TX('기체가 상부 플레넘으로 빠짐 — 발생량의 70~80 %','gas escapes to the plenum - 70-80 % of it'),
            TX('그 전까지 피복재를 세게 밀지 않게 여유를 줌','leave room so the fuel does not push the cladding before then'),
            TX('= 스미어 밀도 75 %','= a 75 % smear density')];
  S5.forEach((t,i)=>{
    const y=i*52, g=mk('g',{transform:'translate(0,'+y+')',opacity:0});
    g.appendChild(mk('rect',{width:640,height:44,fill:'var(--panel)',stroke:i===4?'var(--ok)':'var(--rule)','stroke-width':i===4?2:1}));
    g.appendChild(mk('text',{x:18,y:29,'font-family':'var(--mono)','font-size':16,fill:i===4?'var(--ok)':'var(--cool)','font-weight':600})).textContent=String(i+1);
    g.appendChild(mk('text',{x:50,y:29,'font-family':'var(--sans)','font-size':17,fill:i===4?'var(--ok)':'var(--ink)','font-weight':i===4?600:300})).textContent=t;
    G.appendChild(g); gs.push(g);
  });
  const X0=720, k=300/10, bars=[];
  G.appendChild(mk('text',{x:X0,y:14,class:'lbl'})).textContent=TX('달성 연소도 (at.%)','burnup reached (at.%)');
  [[TX('초기 설계','early'),3,'var(--ink-3)','1~3'],['Mark-II',8.9,'var(--cool)','8~8.9'],['Mark-III',10,'var(--ok)','10']].forEach((b,i)=>{
    const y=34+i*70;
    G.appendChild(mk('text',{x:X0,y:y+18,'font-family':'var(--sans)','font-size':16,fill:'var(--ink)','font-weight':600})).textContent=b[0];
    const r=mk('rect',{x:X0,y:y+26,width:'0',height:28,fill:b[2],opacity:0.85}); G.appendChild(r); bars.push([r,b[1]*k]);
    G.appendChild(mk('text',{x:X0+b[1]*k+8,y:y+46,'font-family':'var(--mono)','font-size':15,fill:b[2],'font-weight':600})).textContent=b[3];
  });
  G.appendChild(mk('text',{x:X0,y:268,'font-family':'var(--sans)','font-size':15.5,fill:'var(--ink-2)','font-weight':300})).textContent=TX('기체 플레넘 = 연료 부피의 1.4~1.5배','gas plenum = 1.4-1.5 × fuel volume');
  G.appendChild(mk('text',{x:0,y:300,class:'lbl'})).textContent=TX('75 % 를 도입하기 전의 설계는 1~3 at.% 에서 한계에 걸렸다','designs before 75 % hit their limit at 1-3 at.%');
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); bars.forEach(b=>b[0].setAttribute('width',b[1])); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:300,delay:220*i,fill:'forwards'}));
  bars.forEach((b,i)=>b[0].animate([{width:'0px'},{width:b[1]+'px'}],{duration:700,delay:1300+200*i,fill:'forwards',easing:'ease-out'}));
}});


/* ---------------------------------------------------------------- FCCI */
S({tag:'FCCI LIMIT', ov:'[[온도 상한을 정하는 것 — 녹는점이 아니라 FCCI 공정반응||What sets the temperature limit - the FCCI eutectic, not melting]]',
src:'[[<b>출처</b> 본 교재 8.3절 · 란탄족(Ce, Pr, Nd, La, Sm)과 Pd 가 계면에 모여 피복재를 침식 — 실측 최대 170 μm(HT-9, U-23Zr, 660 °C) · U-Fe · Pu-Fe 공정 650~725 °C||<b>Source</b> This textbook &#167;8.3 · lanthanides (Ce, Pr, Nd, La, Sm) and Pd collect at the interface and erode the cladding - up to 170 μm measured (HT-9, U-23Zr, 660 °C) · U-Fe and Pu-Fe eutectics at 650-725 °C]]',
abbr:'[[<b>FCCI</b> 연료–피복재 화학 상호작용 · <b>공정(eutectic)</b> 두 성분이 섞여 각각보다 낮은 온도에서 녹는 조성 · <b>란탄족</b> 원자번호 57~71 희토류 핵분열생성물 · <b>HT-9</b> 페라이트-마르텐사이트계 피복재||<b>FCCI</b> fuel-cladding chemical interaction · <b>eutectic</b> a mixture melting below either component · <b>lanthanides</b> the rare-earth fission products, Z = 57-71 · <b>HT-9</b> a ferritic-martensitic cladding steel]]',
html:`<h2 class="t">[[온도 상한을 정하는 것 — 녹는점이 아니라 <em>FCCI 공정반응</em>||What sets the temperature limit - <em>the FCCI eutectic</em>, not melting]]</h2>
<ul class="b">
  <li>[[냉각재는 883 °C까지 액체, 연료는 1077 °C까지 고체인데도 <b>실제 상한은 금속학적 공정반응(650~725 °C)</b>이 정함 — 그래서 출구가 510 °C||Coolant is liquid to 883 °C and fuel solid to 1077 °C, yet <b>the real limit is a metallurgical eutectic at 650-725 °C</b> - hence a 510 °C outlet]]</li>
