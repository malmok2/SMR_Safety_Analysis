init(el){

  const h1=el.querySelector('h1'), ln=el.querySelector('.ln');
  h1.style.opacity=0; ln.style.width='0px';
  h1.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],
    {duration:700,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});

src:'[[<b>출처</b> 본 교재 1.3절 · 섹션 번호는 교재 장 번호와 같음(07~11) · 인허가·건설 현황은 <b>2026년 9월 기준</b>||<b>Source</b> This textbook &#167;1.3 · section numbers match the chapters (07-11) · licensing and construction status <b>as of September 2026</b>]]',
html:`<h2 class="t">[[제2부의 구성 — <em>원리 · 연료 · 계통 · 안전 · 계통코드</em>||How Part 2 is built - <em>principle, fuel, systems, safety, system code</em>]]</h2>

  <li>[[그 근거가 1986년 4월 3일 EBR-II의 두 시험임 — 10장이 이 덱의 중심||The evidence is two tests at EBR-II on 3 April 1986 - chapter 10 is the centre of this deck]]</li>

</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#rm-g'), gs=[];
  const C=[['07',TX('나트륨','Sodium'),TX('감속하지 않으면서 열을 잘 나르는 유일한 실용 후보','the only practical coolant that carries heat without moderating'),'var(--cool)'],
           ['08',TX('금속연료','Metal fuel'),TX('녹는점이 낮은데 왜 더 안전한가','lower melting point - so why safer?'),'var(--amber)'],
           ['09',TX('4S와 풀형 계통','4S and the pool layout'),TX('30년 무재장전 원자로는 어떻게 생겼나','what a 30-year no-refuelling reactor looks like'),'var(--ok)'],
           ['10',TX('SFR 안전','SFR safety'),TX('제어봉 없이 스스로 멈춘 1986년의 원자로','the reactor that shut itself down in 1986'),'var(--hot)'],
           ['11',TX('나트륨 계통코드','Sodium system code'),TX('헬륨보다 쉽고, 어떤 면에서는 더 어렵다','easier than helium, and harder in places'),'var(--cool)']];
  C.forEach((c,i)=>{
    const y=4+i*75, g=mk('g',{transform:'translate(0,'+y+')',opacity:0});
    g.appendChild(mk('rect',{width:1120,height:64,fill:'var(--panel)',stroke:i===3?c[3]:'var(--rule)','stroke-width':i===3?1.8:1}));
    g.appendChild(mk('rect',{width:4,height:64,fill:c[3]}));
    g.appendChild(mk('text',{x:24,y:42,'font-family':'var(--mono)','font-size':24,fill:c[3],'font-weight':600})).textContent=c[0];
    g.appendChild(mk('text',{x:90,y:40,'font-family':'var(--sans)','font-size':20,fill:c[3],'font-weight':600})).textContent=c[1];
    g.appendChild(mk('text',{x:360,y:40,'font-family':'var(--sans)','font-size':18,fill:'var(--ink)','font-weight':300})).textContent=c[2];
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:340,delay:140*i,fill:'forwards'}));
