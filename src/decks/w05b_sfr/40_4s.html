S({bare:true, cls:'div', ov:'[[&#167;09 4S — 풀형 SFR 의 계통||&#167;09 4S - the systems of a pool-type SFR]]',
html:`[[<div class="no">09</div><h2>4S를 뜯어본다</h2><div class="ln"></div>
<p>30년 동안 연료를 갈지 않는 원자로는 어떻게 생겼는가. 4S는 상업성보다 <b>설계가 극단적으로 단순해서</b> 교육에 좋다.
목표 하나(30년 무재장전)가 기기 전체를 어떻게 바꾸는지가 선명하게 보인다.</p>||<div class="no">09</div><h2>Taking 4S apart</h2><div class="ln"></div>
<p>What does a reactor that is not refuelled for thirty years look like? 4S is useful for teaching because <b>its design is radically simple</b>.
You can see clearly how one goal - thirty years without refuelling - reshapes every component.</p>]]`});


/* ---------------------------------------------------------------- 풀형 · 루프형 */
S({tag:'POOL VS LOOP', ov:'[[풀형과 루프형 — 현대 소형 SFR 이 전부 풀형인 이유||Pool and loop - why every modern small SFR is a pool]]',
src:'[[<b>출처</b> 본 교재 9.1절 표 9.1 · 풀형 — PFR · Phénix · SuperPhénix · BN-600/800 · EBR-II · PRISM · Natrium · CEFR · CFR-600 · PFBR · ARC-100 · 4S · Aurora / 루프형 — Monju · 조요 · FFTF||<b>Source</b> This textbook &#167;9.1, Table 9.1 · pool: PFR, Phénix, SuperPhénix, BN-600/800, EBR-II, PRISM, Natrium, CEFR, CFR-600, PFBR, ARC-100, 4S, Aurora / loop: Monju, Joyo, FFTF]]',
abbr:'[[<b>보호용기</b> 원자로용기를 한 겹 더 둘러싼 용기 — 누설 나트륨을 받음 · <b>가동중검사</b> 운전 중 정기적으로 기기를 검사하는 것 · <b>RVACS</b> 원자로용기 보조냉각계통(10장)||<b>guard vessel</b> a second vessel round the reactor vessel that catches leaked sodium · <b>in-service inspection</b> periodic inspection of components during plant life · <b>RVACS</b> Reactor Vessel Auxiliary Cooling System (ch. 10)]]',
html:`<h2 class="t">[[풀형과 루프형 — 현대 소형 SFR 이 전부 <em>풀형</em>인 이유||Pool and loop - why every modern small SFR is a <em>pool</em>]]</h2>
<ul class="b">
  <li>[[피동 잔열제거(RVACS)가 <b>용기 표면적</b>을 통해 일어나므로 노심이 용기 안에 있어야 하고, <b>큰 나트륨 재고</b>가 첫 몇 시간을 벌어 줌||Passive decay-heat removal (RVACS) works through <b>the vessel surface</b>, so the core must be inside it, and <b>a large sodium inventory</b> buys the first hours]]</li>
</ul>
<div class="body"><div class="fig">
<table class="d">
  <tr><th></th><th>[[풀형||Pool]]</th><th>[[루프형||Loop]]</th></tr>

  <tr class="mark"><td>[[열관성||Thermal inertia]]</td><td>[[매우 크다 &#8594; 과도가 느리다||very large &#8594; slow transients]]</td><td>[[작다||small]]</td></tr>
  <tr><td>[[1차 경계 누설||Primary leaks]]</td><td>[[보호용기가 받음 — 나트륨 상실 경로 없음||caught by the guard vessel - no loss-of-sodium path]]</td><td>[[배관이 누설 경로 · 이중관 필요||pipes are a leak path · double wall]]</td></tr>
  <tr><td>[[자연순환||Natural circulation]]</td><td>[[쉽다 (높이차 확보)||easy (height available)]]</td><td>[[어렵다||harder]]</td></tr>
  <tr><td>[[단점||Drawback]]</td><td>[[용기가 크고 가동중검사·재장전이 까다로움||large vessel, awkward inspection and refuelling]]</td><td>[[나트륨 배관이 길어 화재 노출면이 넓음||long sodium piping, more fire exposure]]</td></tr>
</table>
</div></div>`});


/* ---------------------------------------------------------------- 자연순환 */
S({tag:'NATURAL CIRCULATION', ov:'[[SFR 에서 자연순환이 잘 되는 이유||Why natural circulation works so well in an SFR]]',
src:'[[<b>출처</b> 본 교재 9.2절 · 부력 ρgβΔTΔH 와 마찰 ½Kṁ²/(ρA²) 의 균형 · 400 °C 나트륨 동점성 3.2×10⁻⁷ m²/s · EBR-II · Phénix 자연순환 시험이 오늘날 계통코드 검증의 기준||<b>Source</b> This textbook &#167;9.2 · buoyancy ρgβΔTΔH balancing friction ½Kṁ²/(ρA²) · sodium kinematic viscosity at 400 °C 3.2×10⁻⁷ m²/s · the EBR-II and Phénix natural-circulation tests are today&#8217;s validation standard]]',
abbr:'[[<b>β</b> 열팽창계수 · <b>ΔH</b> 열원(노심)과 열침원(IHX)의 높이차 · <b>K</b> 루프 전체의 형상·마찰 손실계수 · <b>동점성계수</b> 점성계수/밀도||<b>β</b> thermal expansion coefficient · <b>ΔH</b> height between heat source (core) and sink (IHX) · <b>K</b> total loop loss coefficient · <b>kinematic viscosity</b> viscosity over density]]',
html:`<h2 class="t">[[SFR 에서 <em>자연순환</em>이 잘 되는 이유||Why <em>natural circulation</em> works so well in an SFR]]</h2>
<ul class="b">
  <li>[[식 하나에 이유가 다 들어 있음 — <b>ΔH가 크고, ΔT를 크게 가져갈 수 있고, ρ가 크고, 점성이 낮음</b>||One formula holds every reason - <b>ΔH is large, ΔT can be large, ρ is large, and viscosity is low</b>]]</li>
  <li>[[그래서 SFR은 강제순환이 완전히 멎어도 <b class="ok">자연순환만으로 붕괴열을 뺄 수 있음</b> — EBR-II와 Phénix가 실측으로 남김||So an SFR can <b class="ok">remove decay heat by natural circulation alone</b> once forced flow stops - measured at EBR-II and Phénix]]</li>
</ul>
<div class="body">
  <div class="fig">
  <div class="formula" style="font-size:24px;padding:4px 0 12px">ṁ <span class="op">∝</span> √( 2ρ²A² g β ΔT ΔH / K )</div>
  <svg viewBox="0 0 800 380" role="img" aria-label="[[자연순환 유량 식의 네 인자가 SFR에서 각각 유리한 이유||Why each of the four factors in the natural-circulation formula favours the SFR]]">
    <g id="nc-g"></g>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">ρ · [[헬륨 대비||against helium]]</span><span class="v">×260</div>
    <div class="readout hi"><span class="k">[[동점성 · 물 20 °C 대비||viscosity · vs water at 20 °C]]</span><span class="v">1/3</div>
  </div>
</div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#nc-g'), gs=[];
  [['ΔH',TX('높이차','height'),TX('풀형 용기 20 m급 · 노심–IHX 수 m','20 m-class pool vessel, core-IHX a few m')],
   ['ΔT',TX('온도차','temperature rise'),TX('비등 여유 330 K — 사고 때 100 K 도 문제없음','330 K to boiling - 100 K in an accident is fine')],
   ['ρ',TX('밀도','density'),TX('850 kg/m³ — 물과 비슷, 헬륨의 260배','850 kg/m³ - near water, 260 × helium')],
   ['ν',TX('동점성','kinematic viscosity'),TX('3.2×10⁻⁷ m²/s — 같은 유속에서 Re 가 크고 마찰이 작음','3.2×10⁻⁷ m²/s - higher Re, less friction')]]
  .forEach((c,i)=>{
    const x=(i%2)*404, y=Math.floor(i/2)*190, g=mk('g',{transform:'translate('+x+','+y+')',opacity:0});
    g.appendChild(mk('rect',{width:392,height:176,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('text',{x:22,y:62,'font-family':'var(--mono)','font-size':38,fill:'var(--ok)','font-weight':600})).textContent=c[0];
    g.appendChild(mk('text',{x:110,y:56,'font-family':'var(--sans)','font-size':19,fill:'var(--ink)','font-weight':600})).textContent=c[1];
    wrapT(c[2],19).slice(0,3).forEach((ln,j)=>g.appendChild(mk('text',{x:22,y:108+j*26,'font-family':'var(--sans)','font-size':16.5,fill:'var(--ink-2)','font-weight':300})).textContent=ln);
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:320,delay:180*i,fill:'forwards'}));
}});

S({tag:'4S INTERNALS', ov:'[[4S 내부구조물과 전체 절개도||4S internals and the full cutaway]]',

S({tag:'REFLECTOR CONTROL', ov:'[[제어봉 대신 반사체 — 4S 의 반응도 제어||A reflector instead of rods - reactivity control in 4S]]',
src:'[[<b>출처</b> 본 교재 9.3절 그림 9.3 · 9.4 · 연료집합체 18개 · 중앙 고정 흡수체 · 정지봉(정상 시 노심 위 대기) · 6분할 반사체||<b>Source</b> This textbook &#167;9.3, Figs. 9.3-9.4 · 18 fuel assemblies, a fixed central absorber, a shutdown rod waiting above the core, a six-segment reflector]]',
abbr:'[[<b>반사체</b> 노심 밖으로 나가는 중성자를 되돌려 보내는 구조물 · <b>연소보상</b> 연료가 타며 줄어드는 반응도를 채워 주는 조작 · <b>반응도 삽입 사고</b> 반응도가 갑자기 들어와 출력이 치솟는 사고 · <b>스크램</b> 비상 정지||<b>reflector</b> a structure that returns escaping neutrons · <b>burnup compensation</b> making up reactivity lost as fuel burns · <b>reactivity-insertion accident</b> a sudden reactivity jump and power surge · <b>scram</b> emergency shutdown]]',
html:`<h2 class="t">[[제어봉 대신 <em>반사체</em> — 4S 의 반응도 제어||A <em>reflector</em> instead of rods - reactivity control in 4S]]</h2>

S({tag:'EM PUMP', ov:'[[전자기펌프 — F = J × B 와 관성이 없다는 약점||The electromagnetic pump - F = J × B, and no inertia]]',
src:'[[<b>출처</b> 본 교재 9.3절 · 4S 는 환형 선형유도형 2대 직렬, 합계 10.6 m³/min · 각 0.05 MPa · 효율 보통 40 % 이하 · 그림은 원리 개념도||<b>Source</b> This textbook &#167;9.3 · 4S uses two annular linear-induction pumps in series, 10.6 m³/min in all, 0.05 MPa each · efficiency usually under 40 % · the drawing is a principle sketch]]',
abbr:'[[<b>로렌츠 힘</b> 전류가 자기장 속에서 받는 힘 · <b>선형유도</b> 코일이 만든 이동 자기장이 유체에 전류를 유도해 미는 방식 · <b>코스트다운</b> 펌프 전원이 끊긴 뒤 유량이 줄어드는 과정 · <b>플라이휠</b> 회전 관성을 늘리는 무거운 바퀴||<b>Lorentz force</b> the force on a current in a magnetic field · <b>linear induction</b> a travelling field from coils induces current in the fluid and pushes it · <b>coast-down</b> flow decaying after pump power is lost · <b>flywheel</b> a heavy wheel adding rotational inertia]]',
html:`<h2 class="t">[[<em>전자기펌프</em> — F = J × B 와 관성이 없다는 약점||The <em>electromagnetic pump</em> - F = J × B, and no inertia]]</h2>

  const f2=flow(p2,{n:8,color:'var(--hot)',r:3.8,speed:0.2});
  flow(p3,{n:8,color:'var(--cool)',r:3.4,speed:0.12}); flow(p4,{n:10,color:'var(--cool)',r:3.4,speed:0.12});
  const L=(x,y,t,c,a)=>{ const e=mk('text',{x:x,y:y,class:'lbl',fill:c||'var(--ink-2)','text-anchor':a||'start'}); e.textContent=t; G.appendChild(e); };
  L(95,84,TX('원자로 · 일정 출력','reactor · constant power'),'var(--hot)','middle');
  L(680,84,TX('터빈 · 수요 추종','turbine · follows demand'),'var(--ok)','middle');
  L(225,140,TX('나트륨 → 염','sodium → salt'),null,'middle');
  if(RM) return;
  raf(t=>{ const d=0.5+0.5*Math.sin(t*0.9), P=345+155*d;
    f2.speed=0.1+0.25*d; hot.setAttribute('y',(130+110*d).toFixed(1)); hot.setAttribute('height',(206-110*d).toFixed(1));
    cold.setAttribute('y',(240-110*d).toFixed(1)); cold.setAttribute('height',(96+110*d).toFixed(1));
    el.querySelector('#na-p').innerHTML=Math.round(P)+'<small>MWe</small>'; });
}});

S({tag:'THE INTERMEDIATE LOOP', ov:'[[노형별 열전달 경로와 SFR 중간 루프의 값||Heat paths by reactor type, and what the SFR intermediate loop is worth]]',
src:'[[<b>출처</b> 본 교재 9.6절 그림 9.13 · Na-23 이 중성자를 흡수하면 반감기 15 h 의 Na-24 — 강한 감마선 · 나트륨–물 반응의 전파 기구는 마모(wastage)와 과열(overheating)||<b>Source</b> This textbook &#167;9.6, Fig. 9.13 · Na-23 absorbing a neutron becomes Na-24 (15 h half-life), a strong gamma emitter · sodium-water reactions propagate by wastage and overheating]]',

html:`<h2 class="t">[[노형별 열전달 경로와 SFR <em>중간 루프</em>의 값||Heat paths by reactor type, and what the SFR <em>intermediate loop</em> is worth]]</h2>
