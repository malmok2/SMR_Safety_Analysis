<script>
/* ================================================================
   SECTION 05 — 식히지 않아도 되는 원자로, HTGR 안전  (교재 5장)
   ================================================================ */
SECT('05 · [[HTGR 안전||HTGR safety]]');

S({bare:true, cls:'div', ov:'[[&#167;05 HTGR 안전 — 냉각 없는 냉각||&#167;05 HTGR safety - cooling without coolant]]',
html:`[[<div class="no">05</div><h2>HTGR 안전</h2><div class="ln"></div>
<p>경수로 안전의 문장은 &#8220;냉각재를 계속 공급하라&#8221;다. HTGR의 문장은 &#8220;아무것도 하지 마라&#8221;다.
2023년 HTR-PM 실증시험이 그 문장을 상용 규모에서 무엇까지 증명했는지 정확히 읽는다.</p>||<div class="no">05</div><h2>HTGR safety</h2><div class="ln"></div>
<p>The light-water safety sentence is &#8220;keep supplying coolant&#8221;. The HTGR&#8217;s is &#8220;do nothing&#8221;.
We read exactly how much of that the 2023 HTR-PM tests proved at commercial scale.</p>]]`});


/* ---------------------------------------------------------------- 세 조건 */
S({tag:'THREE CONDITIONS', ov:'[[냉각 없이 버티기 위한 세 가지 조건||Three conditions for surviving without cooling]]',
src:'[[<b>출처</b> 본 교재 5.1절 · 열은 흑연을 타고 바깥으로 전도되고 원자로용기 표면에서 공동(cavity) 벽으로 복사되어 나감||<b>Source</b> This textbook &#167;5.1 · heat conducts out through the graphite and radiates from the vessel surface to the cavity wall]]',
abbr:'[[<b>공동(cavity)</b> 원자로용기를 둘러싼 콘크리트 방 · <b>환형 노심</b> 가운데를 흑연 기둥으로 비운 고리 모양 노심||<b>cavity</b> the concrete room around the reactor vessel · <b>annular core</b> a ring-shaped core with a graphite column in the middle]]',
html:`<h2 class="t">[[냉각 없이 버티기 위한 <em>세 가지 조건</em>||<em>Three conditions</em> for surviving without cooling]]</h2>
<ul class="b">
  <li>[[냉각재가 다 빠지고 송풍기가 멎어도 <b>전도 &#8594; 복사</b> 경로만으로 연료가 한계 아래에 머물면, 그 원자로는 냉각을 필요로 하지 않음||With the coolant gone and the circulator stopped, if <b>conduction &#8594; radiation</b> alone keeps the fuel under its limit, the reactor does not need cooling]]</li>
  <li>[[셋 중 <b class="hot">2번이 핵심</b> — 모듈 출력의 상한을 정하는 것은 경제성이 아니라 <b>노심 지름</b>임||Condition <b class="hot">2 is the crux</b> - the cap on module power is set by <b>core diameter</b>, not economics]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 350" role="img" aria-label="[[경수로와 HTGR 안전 논리의 한 문장 대비, 그리고 낮은 출력밀도·가는 노심·큰 열용량의 세 조건||The one-sentence safety logic of an LWR and an HTGR, and the three conditions - low power density, slim core, large heat capacity]]">
  <g id="c3-g"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#c3-g'), gs=[];
  [[TX('경수로','LWR'),TX('“냉각재를 계속 공급하라”','“Keep supplying coolant”'),TX('ECCS · 보조급수 · 격납 살수 — 전부 이 문장의 변주','ECCS, auxiliary feed, sprays - all variations on it'),'var(--ink-3)',0],
   [TX('HTGR','HTGR'),TX('“아무것도 하지 마라”','“Do nothing”'),TX('흑연 전도 → 용기 표면 복사 → 공동 벽','graphite conduction → vessel radiation → cavity wall'),'var(--ok)',570]]
  .forEach(c=>{
    const g=mk('g',{transform:'translate('+c[4]+',0)',opacity:0});
    g.appendChild(mk('rect',{width:550,height:110,fill:'var(--panel)',stroke:c[3]}));
    g.appendChild(mk('text',{x:22,y:32,'font-family':'var(--mono)','font-size':14,fill:c[3],'letter-spacing':'.1em'})).textContent=c[0];
    g.appendChild(mk('text',{x:22,y:66,'font-family':'var(--sans)','font-size':24,fill:'var(--ink)','font-weight':600})).textContent=c[1];
    g.appendChild(mk('text',{x:22,y:94,'font-family':'var(--sans)','font-size':15.5,fill:'var(--ink-2)','font-weight':300})).textContent=c[2];
    G.appendChild(g); gs.push(g);
  });
  [['1',TX('출력밀도가 낮을 것','Low power density'),TX('3.3 MW/m³ — 단위 부피당 빼야 할 열이 적음','3.3 MW/m³ - little heat per unit volume'),'var(--cool)',false],
   ['2',TX('노심이 가늘 것','A slim core'),TX('중심→바깥 전도 거리가 짧아야 함 · 지름 3 m','short conduction path · 3 m across'),'var(--hot)',true],
   ['3',TX('열용량이 클 것','Large heat capacity'),TX('흑연이 첫 몇 시간의 열을 흡수함','graphite soaks up the first hours'),'var(--amber)',false]]
  .forEach((c,i)=>{
    const g=mk('g',{transform:'translate('+(i*378)+',140)',opacity:0});
    g.appendChild(mk('rect',{width:362,height:200,fill:'var(--panel)',stroke:c[4]?c[3]:'var(--rule)','stroke-width':c[4]?2:1}));
    g.appendChild(mk('text',{x:22,y:58,'font-family':'var(--mono)','font-size':40,fill:c[3],'font-weight':600})).textContent=c[0];
    g.appendChild(mk('text',{x:22,y:106,'font-family':'var(--sans)','font-size':20,fill:'var(--ink)','font-weight':600})).textContent=c[1];
    wrapT(c[2],20).slice(0,2).forEach((ln,j)=>g.appendChild(mk('text',{x:22,y:142+j*24,'font-family':'var(--sans)','font-size':16,fill:'var(--ink-2)','font-weight':300})).textContent=ln);
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:360,delay:(i<2?250*i:750+200*(i-2)),fill:'forwards'}));
}});


/* ---------------------------------------------------------------- 전도 */
S({tag:'CONDUCTION ONLY', ov:'[[전도만으로 붕괴열을 뺄 때의 노심 온도 — 원통과 환형||Core temperature with conduction alone - solid and annular cores]]',
src:'[[<b>계산</b> 본 교재 5.2절 · 그림 5.1 과 같은 조건 — 붕괴열 q‴ = 30 kW/m³, k = 25 W/(m·K), 표면 400 °C · 환형은 안쪽 단열 · 연료 사고한계 1620 °C(HTR-PM)||<b>Calculation</b> This textbook &#167;5.2 · same conditions as Fig. 5.1 - decay heat q‴ = 30 kW/m³, k = 25 W/(m·K), surface 400 °C · the annulus is adiabatic inside · accident fuel limit 1620 °C (HTR-PM)]]',
abbr:'[[<b>q‴</b> 단위 부피당 발열량 · <b>k</b> 열전도도 · <b>R<sub>o</sub> · R<sub>i</sub></b> 노심 바깥 · 안 반경 · <b>단열</b> 경계를 통해 열이 나가지 않는 조건||<b>q‴</b> heat generated per unit volume · <b>k</b> thermal conductivity · <b>R<sub>o</sub>, R<sub>i</sub></b> outer and inner core radius · <b>adiabatic</b> no heat crosses the boundary]]',
html:`<h2 class="t">[[<em>전도만으로</em> 붕괴열을 뺄 때의 노심 온도 — 원통과 환형||Core temperature with <em>conduction alone</em> - solid and annular cores]]</h2>
<ul class="b">
  <li>[[중심–표면 온도차가 <b class="hot">R²에 비례</b> — 지름을 2배로 하면 온도차가 4배. 250 MWt를 500 MWt로 키우고 싶어도 노심 지름을 못 키우는 이유임||The centre-to-surface difference goes as <b class="hot">R²</b> - double the diameter, four times the difference. That is why 250 MWt cannot become 500 MWt by widening the core]]</li>
  <li>[[출력을 키우려면 <b class="ok">가운데를 비운 환형 노심</b> — 같은 발열량으로 약 280 K 낮아짐(Xe-100 등)||To grow, <b class="ok">hollow out the centre</b> - an annular core runs about 280 K cooler for the same heat (Xe-100 and others)]]</li>
</ul>
<div class="body">
  <div class="fig">
  <div class="formula" style="font-size:18px;padding:0 0 6px">ΔT<sub>max</sub> <span class="op">=</span> q‴R²/(4k) &nbsp;&nbsp;&nbsp; ΔT<sub>max</sub> <span class="op">=</span> q‴/(4k)·[R<sub>o</sub>² − R<sub>i</sub>² − 2R<sub>i</sub>² ln(R<sub>o</sub>/R<sub>i</sub>)]</div>
  <svg viewBox="0 0 800 330" role="img" aria-label="[[노심 반경에 따른 온도 분포. 연료 한계 1620 °C 선과 비교하며 바깥 반경과 안 반경을 바꿔 볼 수 있음||Radial temperature profile, compared with the 1620 °C fuel limit, as the outer and inner radius are changed]]">
    <g id="cd-ax"></g>
    <path id="cd-ref" d="" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="6 5"/>
    <path id="cd-c" d="" fill="none" stroke="var(--hot)" stroke-width="3.2"/>
    <rect id="cd-in" x="0" y="0" width="0" height="0" fill="var(--ok)" opacity="0.10"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn" id="cd-box"><span class="k">[[최고 온도 · 중심 또는 안쪽 면||Peak temperature · centre or inner face]]</span><span class="v" id="cd-t">1075<small>°C</small></span></div>
    <div class="readout"><span class="k">[[중심–표면 ΔT||Centre-to-surface ΔT]]</span><span class="v" id="cd-d">675<small>K</small></span></div>
    <div class="ctl"><label>[[바깥 반경 R<sub>o</sub>||Outer radius R<sub>o</sub>]] <span id="cd-os">1.50 m</span></label>
      <input type="range" id="cd-so" min="0.8" max="2.4" step="0.05" value="1.5"></div>
    <div class="ctl"><label>[[안 반경 R<sub>i</sub> (0 = 원통)||Inner radius R<sub>i</sub> (0 = solid)]] <span id="cd-is">0.00 m</span></label>
      <input type="range" id="cd-si" min="0" max="1.4" step="0.05" value="0"></div>
    <div class="src" style="font-size:12.5px">[[점선은 기준 원통 노심(R = 1.5 m)||Dashed: the reference solid core (R = 1.5 m)]]</div>
  </div>
</div>`,
init(el){
  const mk=svgEl, ax=el.querySelector('#cd-ax'), q=30000, k=25, Ts=400;
  const X0=70, X1=780, Y0=282, Y1=12, R1=2.4, T1=2000, T0=300;
  const sx=r=>X0+r/R1*(X1-X0), sy=T=>Y0-(T-T0)/(T1-T0)*(Y0-Y1);
  for(let T=400;T<=2000;T+=400){
    ax.appendChild(mk('line',{x1:X0,x2:X1,y1:sy(T),y2:sy(T),class:'grid'}));
    ax.appendChild(mk('text',{x:X0-10,y:sy(T)+4,'text-anchor':'end',class:'lbl'})).textContent=T+' °C';
  }
  for(let r=0;r<=2.4001;r+=0.4)
    ax.appendChild(mk('text',{x:sx(r),y:Y0+20,'text-anchor':'middle',class:'lbl'})).textContent=r.toFixed(1)+' m';
  ax.appendChild(mk('text',{x:X1,y:Y0+40,'text-anchor':'end',class:'lbl'})).textContent=TX('반경 r','radius r');
  ax.appendChild(mk('line',{x1:X0,x2:X1,y1:sy(1620),y2:sy(1620),stroke:'var(--hot)','stroke-width':1.6,'stroke-dasharray':'8 5'}));
  ax.appendChild(mk('text',{x:X1,y:sy(1620)-8,'text-anchor':'end',class:'lbl',fill:'var(--hot)'})).textContent=TX('연료 사고한계 1620 °C','accident fuel limit 1620 °C');
  const prof=(Ro,Ri)=>{ let d=''; const a=Math.max(Ri,0);
    for(let i=0;i<=80;i++){ const r=a+(Ro-a)*i/80;
      const T=Ts+q/(4*k)*((Ro*Ro-r*r)-(a>0?2*a*a*Math.log(Ro/Math.max(r,1e-6)):0));
      d+=(d?'L':'M')+sx(r).toFixed(1)+','+sy(Math.min(T,T1+200)).toFixed(1); }
    return d; };
  el.querySelector('#cd-ref').setAttribute('d',prof(1.5,0));
  const so=el.querySelector('#cd-so'), si=el.querySelector('#cd-si'), inr=el.querySelector('#cd-in');
  function upd(){
    let Ro=+so.value, Ri=Math.min(+si.value, Ro-0.3);
    const dT=q/(4*k)*(Ro*Ro-Ri*Ri-(Ri>0?2*Ri*Ri*Math.log(Ro/Ri):0)), Tm=Ts+dT;
    el.querySelector('#cd-c').setAttribute('d',prof(Ro,Ri));
    inr.setAttribute('x',X0); inr.setAttribute('y',Y1); inr.setAttribute('width',Math.max(0,sx(Ri)-X0)); inr.setAttribute('height',Y0-Y1);
    el.querySelector('#cd-t').innerHTML=fmt(Tm)+'<small>°C</small>';
    el.querySelector('#cd-d').innerHTML=fmt(dT)+'<small>K</small>';
    el.querySelector('#cd-os').textContent=Ro.toFixed(2)+' m';
    el.querySelector('#cd-is').textContent=Ri.toFixed(2)+' m';
    el.querySelector('#cd-box').className='readout '+(Tm>1620?'warn':'good');
  }
  so.oninput=upd; si.oninput=upd; upd();
  if(RM) return;
  raf(t=>{ if(t>3.2) return; const u=clamp((t-0.4)/2.6,0,1);
    so.value=(lerp(1.5,1.8,u)).toFixed(2); si.value=(lerp(0,0.9,u)).toFixed(2); upd(); });
}});


/* ---------------------------------------------------------------- 붕괴열 · 복사 */
S({tag:'DECAY HEAT · RADIATION', ov:'[[붕괴열 곡선과 RCCS 제열이 만나는 시점||When decay heat meets RCCS heat removal]]',
src:'[[<b>출처</b> 본 교재 5.2절 · 그림 5.2 · 붕괴열은 Way–Wigner 식(t 는 정지 후 초) · RCCS 1.5 MW 는 교재 그림의 예시값 · 복사는 T⁴ 에 비례||<b>Source</b> This textbook &#167;5.2, Fig. 5.2 · decay heat from Way–Wigner (t in seconds after shutdown) · the 1.5 MW RCCS is the figure&#8217;s illustrative value · radiation goes as T⁴]]',
abbr:'[[<b>RCCS</b> 원자로공동냉각계통 — 용기 바깥 공동 벽의 공기·물 통로, 굴뚝 효과로 스스로 돎 · <b>ε<sub>eff</sub></b> 유효 방사율 · <b>σ</b> 슈테판–볼츠만 상수||<b>RCCS</b> Reactor Cavity Cooling System - air or water channels on the cavity wall, driven by the chimney effect · <b>ε<sub>eff</sub></b> effective emissivity · <b>σ</b> the Stefan–Boltzmann constant]]',
html:`<h2 class="t">[[붕괴열 곡선과 <em>RCCS 제열</em>이 만나는 시점||When decay heat meets <em>RCCS heat removal</em>]]</h2>
<ul class="b">
  <li>[[붕괴열은 정지 직후 약 6 %, 1시간 뒤 약 1 %. 100시간이면 250 MWt 모듈도 <b>1 MW 아래</b> — 용기 표면 수십 m²에서 복사로 뺄 수 있는 크기임||Decay heat is about 6 % at shutdown and 1 % after an hour. By 100 hours even a 250 MWt module is <b>below 1 MW</b> - small enough to radiate from a few tens of m² of vessel]]</li>
  <li>[[복사는 <b class="ok">T⁴에 비례</b> — 용기가 뜨거워질수록 제열이 급격히 늘어 계통을 스스로 안정시킴. 사고가 심해질수록 제열 능력이 커짐||Radiation goes as <b class="ok">T⁴</b> - the hotter the vessel, the faster it sheds heat, so the system stabilises itself. The worse it gets, the more it removes]]</li>
</ul>
<div class="body">
  <div class="fig">
  ${PH({src:'f5_02', cap:'[[왼쪽 — 붕괴열(250 MWt)과 RCCS 제열용량 예시 1.5 MW 가 약 13 h 에 만남 · 오른쪽 — 냉각재 없이도 한계에 닿지 않는 온도 이력 · 교재 그림 5.2||Left - decay heat (250 MWt) meets an illustrative 1.5 MW RCCS at about 13 h · right - temperatures stay below the limit with no coolant · textbook Fig. 5.2]]'})}
  </div>
  <div class="side" style="width:300px">
    <div class="formula" style="font-size:16px;text-align:left;line-height:1.9">P<sub>d</sub>/P<sub>0</sub> <span class="op">=</span> 0.0622[t<sup>−0.2</sup> − (t+10⁸)<sup>−0.2</sup>]<br>q<sub>rad</sub> <span class="op">=</span> ε<sub>eff</sub> σ A (T<sub>v</sub>⁴ − T<sub>c</sub>⁴)</div>
    <div class="readout"><span class="k">[[정지 직후 · 1시간 뒤||At shutdown · after 1 h]]</span><span class="v">6<small>% · 1 %</small></span></div>
  </div>
</div>`});


/* ---------------------------------------------------------------- 2023 시험 */
S({tag:'2023 HTR-PM TESTS', ov:'[[2023년 HTR-PM 냉각상실 실증시험 결과||The 2023 HTR-PM loss-of-cooling demonstration - results]]',
src:'[[<b>출처</b> 본 교재 5.3절 표 5.1 · 2023-08-13(1호 모듈) · 2023-09-01(2호 모듈) · 각 200 MWt · 헬륨 243~246 &#8594; 685~688 °C · 6.8 MPa 에서 시작 · 송풍기 모두 정지, 비상냉각 없음||<b>Source</b> This textbook &#167;5.3, Table 5.1 · 13 August 2023 (module 1) and 1 September 2023 (module 2) · each from 200 MWt, helium 243-246 &#8594; 685-688 °C, 6.8 MPa · both circulators stopped, no emergency cooling]]',
abbr:'[[<b>미임계</b> 연쇄반응이 스스로 줄어드는 상태 · <b>반사체</b> 노심을 둘러싼 흑연 — 새는 중성자를 되돌림 · <b>RCCS</b> 원자로공동냉각계통||<b>subcritical</b> the chain reaction dying away on its own · <b>reflector</b> graphite round the core that returns leaking neutrons · <b>RCCS</b> Reactor Cavity Cooling System]]',
html:`<h2 class="t">[[2023년 HTR-PM <em>냉각상실 실증시험</em> 결과||The 2023 HTR-PM <em>loss-of-cooling demonstration</em> - results]]</h2>
<ul class="b">
  <li>[[이 교재에서 가장 중요한 실험 데이터 — <b>상용 규모 원자로로 냉각 상실을 실제로 해 본 유일한 사례</b>임||The most important data in this book - <b>the only time loss of cooling has actually been done on a commercial-scale reactor</b>]]</li>
  <li>[[송풍기 두 대를 멈추고 <b>비상노심냉각도, 동력을 쓰는 어떤 냉각도 하지 않았음</b>||Both circulators stopped, with <b>no emergency core cooling and no powered cooling of any kind</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 360" role="img" aria-label="[[정지 후 시간 축 위에 20초 미임계, 3.5시간 상부 반사체 최고온도, 13시간 RCCS 제열과 붕괴열 균형, 35시간 붕괴열 560 kW를 표시||A time line after shutdown - subcritical at 20 s, upper reflector peak at 3.5 h, RCCS matching decay heat at 13 h, 560 kW of decay heat at 35 h]]">
    <g id="t23-g"></g>
  </svg>
  </div>
  <div class="side">
    <table class="d sm">
      <tr><th>[[관측||Observation]]</th><th>[[값||Value]]</th></tr>
      <tr><td>[[미임계 도달||Subcritical]]</td><td class="n">[[약 20 s (제어봉 없이)||~20 s (no rods)]]</td></tr>
      <tr><td>[[상부 반사체 최고||Upper reflector peak]]</td><td class="n">[[870 °C · 3.5 h||870 °C · 3.5 h]]</td></tr>
      <tr><td>[[RCCS = 붕괴열||RCCS = decay heat]]</td><td class="n">[[약 13 h||~13 h]]</td></tr>
      <tr><td>[[35 h 후 붕괴열||Decay heat at 35 h]]</td><td class="n">[[약 560 kWt||~560 kWt]]</td></tr>
      <tr class="mark"><td>[[연료 최고온도||Peak fuel]]</td><td>[[사고한계 1620 °C에 근접조차 안 함||never near the 1620 °C limit]]</td></tr>
    </table>
  </div>
</div>`,
init(el){
