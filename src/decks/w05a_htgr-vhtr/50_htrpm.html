<script>
/* ================================================================
   SECTION 04 — HTR-PM 을 뜯어본다  (교재 4장)
   ================================================================ */
SECT('04 · HTR-PM');

S({bare:true, cls:'div', ov:'[[&#167;04 HTR-PM — 계통과 기기||&#167;04 HTR-PM - systems and components]]',
html:`[[<div class="no">04</div><h2>HTR-PM을 뜯어본다</h2><div class="ln"></div>
<p>세계에서 유일하게 상업운전 중인 4세대 원자로를 기기 단위로 본다. 공개된 설계값이 서로 맞는지
<b>손으로 검산</b>하고, 소개 문구의 &#8220;정격&#8221;과 실제 운전을 구분한다.</p>||<div class="no">04</div><h2>Taking HTR-PM apart</h2><div class="ln"></div>
<p>The only Generation IV reactor in commercial operation, component by component. We <b>check by hand</b>
that the published design values agree, and separate the brochure&#8217;s &#8220;rated&#8221; from how it actually runs.</p>]]`});


/* ---------------------------------------------------------------- 헬륨 유로 */
S({tag:'HELIUM FLOW PATH', ov:'[[HTR-PM 한 모듈의 헬륨 유로||The helium flow path in one HTR-PM module]]',
src:'[[<b>출처</b> 본 교재 4.1절 · 그림은 유로 순서를 보이는 개념도(치수 임의) · 산둥성 스다오완 · 칭화대 INET 설계 · 뿌리는 2000-12 초임계한 HTR-10(10 MWt)||<b>Source</b> This textbook &#167;4.1 · the drawing is a concept sketch of the flow order, not to scale · Shidaowan, Shandong · designed by Tsinghua INET · descended from HTR-10 (10 MWt, critical December 2000)]]',
abbr:'[[<b>HTR-PM</b> High Temperature Reactor – Pebble-bed Module · <b>INET</b> 칭화대 핵능신기술연구원 · <b>열가스덕트</b> 뜨거운 헬륨을 증기발생기로 보내는 굵은 관(동축 — 안은 뜨겁고 바깥은 찬 헬륨)||<b>HTR-PM</b> High Temperature Reactor – Pebble-bed Module · <b>INET</b> Tsinghua&#8217;s Institute of Nuclear and New Energy Technology · <b>hot gas duct</b> the large coaxial pipe to the steam generator - hot inside, cold outside]]',
html:`<h2 class="t">[[HTR-PM 한 모듈의 <em>헬륨 유로</em>||The <em>helium flow path</em> in one HTR-PM module]]</h2>
<ul class="b">
  <li>[[250 MWt 모듈 2기가 터빈 1대를 공유함 — 500 MWt / 211 MWe(총). <b>2021-12 계통 연결 · 2023-12-05 상업운전</b>, 세계 최초의 상용 4세대로||Two 250 MWt modules share one turbine - 500 MWt / 211 MWe gross. <b>Grid December 2021, commercial 5 December 2023</b> - the first commercial Gen IV plant]]</li>
  <li>[[찬 헬륨이 <b class="cool">용기 벽을 따라 올라가</b> 위에서 방향을 바꾸고, 페블 사이를 <b class="hot">아래로 지나며 데워져</b> 하부 열가스덕트로 나감||Cold helium <b class="cool">rises along the vessel wall</b>, turns at the top, and <b class="hot">heats up flowing down</b> through the pebbles to the hot gas duct at the bottom]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 404" role="img" aria-label="[[송풍기에서 나온 찬 헬륨이 용기 벽의 통로로 올라가 노심을 아래로 지나 데워지고, 열가스덕트로 증기발생기에 가서 열을 넘긴 뒤 송풍기로 돌아오는 유로||Cold helium from the circulator rises in the wall passage, heats flowing down the core, goes through the hot gas duct to the steam generator, gives up its heat and returns to the circulator]]">
    <g id="hp-g"></g>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">[[노심 출구 · 열가스덕트||Core outlet · hot duct]]</span><span class="v">750<small>°C</small></span></div>
    <div class="readout hi"><span class="k">[[노심 입구 · 찬 헬륨||Core inlet · cold helium]]</span><span class="v">250<small>°C</small></span></div>
    <div class="readout"><span class="k">[[압력 · 유량 (모듈당)||Pressure · flow (per module)]]</span><span class="v">7.0<small>MPa · 96 kg/s</small></span></div>
    <div class="readout good"><span class="k">[[모듈 열출력||Module thermal power]]</span><span class="v">250<small>MWt × 2</small></span></div>
  </div>
</div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#hp-g');
  /* 원자로용기 */
  G.appendChild(mk('rect',{x:60,y:20,width:200,height:360,rx:34,fill:'var(--panel)',stroke:'var(--ink-3)','stroke-width':2}));
  /* 흑연 반사체 */
  G.appendChild(mk('rect',{x:78,y:40,width:164,height:320,rx:18,fill:'var(--ok)',opacity:0.13,stroke:'var(--ok)','stroke-opacity':0.5}));
  /* 페블 노심 */
  G.appendChild(mk('rect',{x:112,y:78,width:96,height:236,fill:'var(--ground)',stroke:'var(--rule)'}));
  for(let r=0;r<11;r++) for(let c=0;c<4;c++){
    const cx=124+c*24+(r%2)*12, cy=90+r*21; if(cx>202) continue;
    G.appendChild(mk('circle',{cx:cx,cy:cy,r:9,fill:'var(--ink-3)',opacity:0.35}));
  }
  /* 동축 열가스덕트 */
  G.appendChild(mk('rect',{x:258,y:318,width:156,height:44,fill:'var(--panel)',stroke:'var(--ink-3)','stroke-width':1.6}));
  G.appendChild(mk('rect',{x:258,y:333,width:156,height:14,fill:'var(--hot)',opacity:0.28}));
  /* 증기발생기 */
  G.appendChild(mk('rect',{x:412,y:84,width:150,height:296,rx:26,fill:'var(--panel)',stroke:'var(--ink-3)','stroke-width':2}));
  let z='M444,150'; for(let i=0;i<9;i++) z+=' L'+(i%2?444:530)+','+(162+i*18);
  G.appendChild(mk('path',{d:z,fill:'none',stroke:'var(--cool)','stroke-width':2.4,opacity:0.7}));
  /* 송풍기 — 증기발생기 위 */
  G.appendChild(mk('rect',{x:442,y:30,width:90,height:54,rx:8,fill:'var(--panel)',stroke:'var(--amber)','stroke-width':2}));
  G.appendChild(mk('circle',{cx:487,cy:57,r:15,fill:'none',stroke:'var(--amber)','stroke-width':2}));
  /* 유로 — 찬 쪽, 뜨거운 쪽, 증기발생기 안에서 식는 쪽 */
  const pc=mk('path',{d:'M510,58 H548 V326 H232 V40 H160',fill:'none',stroke:'var(--cool)','stroke-width':1.2,'stroke-dasharray':'3 5',opacity:0.5});
  const ph=mk('path',{d:'M160,72 V340 H487 V270',fill:'none',stroke:'var(--hot)','stroke-width':1.2,'stroke-dasharray':'3 5',opacity:0.5});
  const pg=mk('path',{d:'M487,270 V150 M487,150 V78',fill:'none',stroke:'none'});
  const pg2=mk('path',{d:'M487,270 V74',fill:'none',stroke:'none'});
  [pc,ph,pg2].forEach(p=>G.appendChild(p));
  flow(pc,{n:16,color:'var(--cool)',r:4,speed:0.07});
  flow(ph,{n:14,color:'var(--hot)',r:4,speed:0.08});
  flow(pg2,{n:6,color:'var(--amber)',r:3.6,speed:0.18});
  /* 라벨 */
  const L=(x,y,t,c,a)=>{ const e=mk('text',{x:x,y:y,class:'lbl',fill:c||'var(--ink-2)','text-anchor':a||'start'}); e.textContent=t; G.appendChild(e); };
  L(160,396,TX('원자로용기','reactor vessel'),null,'middle');
  L(160,66,TX('페블 노심','pebble bed'),'var(--ink)','middle');
  L(487,396,TX('증기발생기','steam generator'),null,'middle');
  L(487,20,TX('주헬륨송풍기','helium circulator'),'var(--amber)','middle');
  L(336,310,TX('열가스덕트 (동축)','hot gas duct (coaxial)'),null,'middle');
  L(572,200,TX('찬 헬륨 250 °C','cold helium 250 °C'),'var(--cool)');
  L(572,220,TX('&#8594; 용기 벽 통로로 상승','→ up the wall passage').replace('&#8594;','→'),'var(--cool)');
  L(572,352,TX('뜨거운 헬륨 750 °C','hot helium 750 °C'),'var(--hot)');
  const rl=mk('text',{x:95,y:200,class:'lbl',fill:'var(--ok)','text-anchor':'middle',transform:'rotate(-90 95 200)'});
  rl.textContent=TX('흑연 반사체','graphite reflector'); G.appendChild(rl);
}});


/* ---------------------------------------------------------------- 배치 */
S({tag:'LAYOUT', ov:'[[1차 루프 배치의 세 가지 특징||Three features of the primary-loop layout]]',
src:'[[<b>출처</b> 본 교재 4.1절 그림 4.1 · 원자로용기(왼쪽)와 증기발생기(오른쪽), 송풍기는 증기발생기 위||<b>Source</b> This textbook &#167;4.1, Fig. 4.1 · reactor vessel on the left, steam generator on the right, circulator on top of the steam generator]]',
abbr:'[[<b>SA-508</b> 원자로 압력용기에 흔히 쓰는 저합금강 · <b>LOCA</b> 냉각재상실사고 · <b>부력</b> 밀도차로 생기는 뜨는 힘||<b>SA-508</b> the low-alloy steel common in reactor pressure vessels · <b>LOCA</b> loss-of-coolant accident · <b>buoyancy</b> the lift that density differences produce]]',
html:`<h2 class="t">[[1차 루프 배치의 <em>세 가지 특징</em>||<em>Three features</em> of the primary-loop layout]]</h2>
<div class="body">
  <div class="fig" style="flex:0 0 380px">
  ${PH({src:'f4_01', cap:'[[HTR-PM 1차 루프 — 교재 그림 4.1||The HTR-PM primary loop - textbook Fig. 4.1]]'})}
  </div>
  <div class="fig">
  <svg viewBox="0 0 760 470" role="img" aria-label="[[1차 루프 배치의 세 가지 특징 — 나란한 용기와 증기발생기, 찬 헬륨이 씻는 용기 벽, 아래로 흐르는 헬륨||Three layout features - vessel and steam generator side by side, a vessel wall washed by cold helium, and downward helium flow]]">
    <g id="ly-g"></g>
  </svg>
  </div>
</div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#ly-g'), gs=[];
  const C=[['1',TX('용기와 증기발생기가 나란히 섬','Vessel and SG stand side by side'),'var(--hot)',
            TX('경수로처럼 증기발생기가 위에 있지 않고 굵은 덕트로 이어짐. 이 덕트가 파단하면 그것이 이 노형의 LOCA 임.',
               'Unlike an LWR the SG is not above the core; a large duct joins them. A break in that duct is this reactor&#8217;s LOCA.')],
           ['2',TX('찬 헬륨이 용기 벽을 먼저 씻음','Cold helium washes the vessel wall first'),'var(--cool)',
            TX('750 °C 노심을 담고도 용기 자체는 250 °C 근처에 머묾. 일반 압력용기강(SA-508 계열)을 쓸 수 있는 이유임.',
               'The vessel stays near 250 °C around a 750 °C core, which is why ordinary vessel steel (SA-508 family) will do.')],
           ['3',TX('헬륨이 위에서 아래로 흐름','Helium flows top to bottom'),'var(--ok)',
            TX('페블 더미가 눌려 안정됨. 강제순환이 멎으면 부력 자연순환은 반대 방향(위로)이 되어 유동이 스스로 멎음.',
               'The pebble bed is pressed down and stable. When forced flow stops, buoyancy acts upward, against it, and flow halts by itself.')]];
  C.forEach((c,i)=>{
    const g=mk('g',{transform:'translate(0,'+(i*158)+')',opacity:0});
    g.appendChild(mk('rect',{width:760,height:144,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:3,height:144,fill:c[2]}));
    g.appendChild(mk('text',{x:24,y:44,'font-family':'var(--mono)','font-size':26,fill:c[2],'font-weight':600})).textContent=c[0];
    g.appendChild(mk('text',{x:62,y:42,'font-family':'var(--sans)','font-size':21,fill:c[2],'font-weight':600})).textContent=c[1];
    wrapT(c[3],40).slice(0,3).forEach((ln,j)=>g.appendChild(mk('text',{x:62,y:78+j*25,'font-family':'var(--sans)',
      'font-size':17,fill:'var(--ink-2)','font-weight':300})).textContent=ln);
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:360,delay:200*i,fill:'forwards'}));
}});


/* ---------------------------------------------------------------- 발전소 계통 */
S({tag:'PLANT SCHEMATIC', ov:'[[발전소 계통 — 원자로 2기가 터빈 1대를 공유||Plant schematic - two reactors share one turbine]]',
src:'[[<b>출처</b> 본 교재 4.1절 그림 4.2 · 총 211 MWe / 순 150 MWe||<b>Source</b> This textbook &#167;4.1, Fig. 4.2 · 211 MWe gross / 150 MWe net]]',
html:`<h2 class="t">[[발전소 계통 — 원자로 2기가 <em>터빈 1대</em>를 공유||Plant schematic - two reactors share <em>one turbine</em>]]</h2>
<ul class="b">
  <li>[[모듈마다 원자로 · 증기발생기 · 송풍기 한 벌. 두 모듈의 증기가 <b>하나의 터빈</b>으로 모임||Each module has its own reactor, steam generator and circulator. Steam from both goes to <b>one turbine</b>]]</li>
  <li>[[증기 조건 <b>13.25 MPa / 567 °C</b> — 경수로(약 7 MPa 포화증기)보다 훨씬 좋아 효율이 올라감||Steam at <b>13.25 MPa / 567 °C</b> - far better than an LWR&#8217;s saturated steam near 7 MPa, hence the higher efficiency]]</li>
</ul>
<div class="body"><div class="fig">
${PH({src:'f4_02', cap:'[[HTR-PM 실증 발전소 단순 계통도 — 왼쪽 두 모듈(원자로·증기발생기·송풍기), 가운데 터빈·발전기, 오른쪽 급수가열기 · 교재 그림 4.2||Simplified HTR-PM demonstration plant - two modules on the left, turbine-generator in the middle, feedwater heaters on the right · textbook Fig. 4.2]]'})}
</div></div>`});


/* ---------------------------------------------------------------- 설계값 표 */
S({tag:'DESIGN DATA', ov:'[[HTR-PM 주요 설계값||HTR-PM principal design data]]',
src:'[[<b>출처</b> 본 교재 4.2절 표 4.1 · 증기 조건은 터빈 입구 기준 자료에 14.1 MPa / 570 °C 로도 나옴 · 2023년 시험은 6.8 MPa||<b>Source</b> This textbook &#167;4.2, Table 4.1 · steam is also quoted as 14.1 MPa / 570 °C at the turbine inlet · the 2023 tests ran at 6.8 MPa]]',
abbr:'[[<b>농축도</b> 우라늄 중 U-235 비율 · <b>온도계수</b> 온도 1 K 당 반응도 변화 — 음이면 스스로 출력을 줄임 · <b>MWe · MWt</b> 전기출력 · 열출력||<b>enrichment</b> the U-235 share of the uranium · <b>temperature coefficient</b> reactivity change per kelvin - negative means self-limiting · <b>MWe, MWt</b> electrical and thermal megawatts]]',
html:`<h2 class="t">[[HTR-PM <em>주요 설계값</em>||HTR-PM <em>principal design data</em>]]</h2>
<div class="body">
  <div class="fig">
  <table class="d sm">
    <tr><th>[[항목||Item]]</th><th>[[값||Value]]</th><th>[[비고||Note]]</th></tr>
    <tr><td>[[모듈 열출력||Module thermal power]]</td><td class="n">250 MWt × 2</td><td></td></tr>
    <tr><td>[[총 전기출력||Electrical output]]</td><td class="n">[[211 MWe (총) / 150 MWe (순)||211 MWe gross / 150 MWe net]]</td><td>[[터빈 1대 공유||one shared turbine]]</td></tr>
    <tr class="mark"><td>[[헬륨 온도 · 압력||Helium temperature · pressure]]</td><td class="n">250 &#8594; 750 °C · 7.0 MPa</td><td>[[2023년 시험은 6.8 MPa||6.8 MPa in the 2023 tests]]</td></tr>
    <tr><td>[[헬륨 유량||Helium flow]]</td><td class="n">[[96 kg/s (모듈당)||96 kg/s per module]]</td><td>[[ṁ = Q/(c<sub>p</sub>ΔT) 로 확인||checked with ṁ = Q/(c<sub>p</sub>ΔT)]]</td></tr>
    <tr><td>[[노심 치수||Core size]]</td><td class="n">∅ 3.0 m × 11.0 m, 77.8 m³</td><td></td></tr>
    <tr><td>[[출력밀도||Power density]]</td><td class="n">3.3 MW/m³</td><td>[[경수로의 약 1/30||about 1/30 of an LWR]]</td></tr>
    <tr><td>[[페블||Pebbles]]</td><td class="n">[[∅ 60 mm · 평형 420,000개/모듈||∅ 60 mm · 420,000 per module]]</td><td>[[연료영역 50 mm||50 mm fuelled zone]]</td></tr>
    <tr><td>[[농축도 · 연소도||Enrichment · burnup]]</td><td class="n">8.5 % · 90 GWd/tU</td><td>[[페블당 중금속 7.0 g||7.0 g heavy metal per pebble]]</td></tr>
    <tr><td>[[증기 조건||Steam conditions]]</td><td class="n">13.25 MPa / 567 °C</td><td>[[자료에 따라 14.1 MPa / 570 °C||14.1 MPa / 570 °C in some sources]]</td></tr>
    <tr><td>[[온도계수||Temperature coefficient]]</td><td class="n">[[약 −5 × 10⁻⁵ /K||about −5 × 10⁻⁵ /K]]</td><td>[[음의 값||negative]]</td></tr>
    <tr class="mark"><td>[[연료 온도한계||Fuel temperature limit]]</td><td class="n">[[정상 1600 · 사고 1620 °C||1600 normal · 1620 °C accident]]</td><td>[[정상운전 최고 약 1200 °C||about 1200 °C peak in normal operation]]</td></tr>
  </table>
  </div>
</div>`});


/* ---------------------------------------------------------------- 검산 */
S({tag:'SPECIFIC POWER CHECK', ov:'[[출력밀도와 비출력 — 부피 기준과 질량 기준||Power density and specific power - per volume and per mass]]',
src:'[[<b>계산</b> 본 교재 4.2절 · 420,000 × 7.0 g = 2.94 tU · 250 MW / 2.94 tU = 85 MW/tU · 90,000 MWd/tU ÷ 85 MW/tU = 1,059 d ≈ 2.9 년 · 평균 15회 통과 &#8594; 1회 약 70일||<b>Calculation</b> This textbook &#167;4.2 · 420,000 × 7.0 g = 2.94 tU · 250 MW / 2.94 tU = 85 MW/tU · 90,000 MWd/tU ÷ 85 MW/tU = 1,059 d ≈ 2.9 years · 15 passes on average &#8594; about 70 days a pass]]',
abbr:'[[<b>출력밀도</b> 노심 부피당 열출력(MW/m³) · <b>비출력</b> 연료 질량당 열출력(MW/tU) · <b>체류시간</b> 연료가 노심에 머무는 총 기간||<b>power density</b> thermal power per core volume (MW/m³) · <b>specific power</b> thermal power per fuel mass (MW/tU) · <b>residence time</b> total time the fuel spends in the core]]',
html:`<h2 class="t">[[출력밀도와 <em>비출력</em> — 부피 기준과 질량 기준||Power density and <em>specific power</em> - per volume and per mass]]</h2>
<ul class="b">
  <li>[[부피 기준 출력밀도는 경수로의 1/30인데, 질량 기준 비출력은 <b class="hot">오히려 2배 넘게 높음</b> — 흑연이 노심 부피의 대부분을 차지하기 때문||Per volume it is 1/30 of an LWR, yet per mass of uranium it is <b class="hot">more than twice as high</b> - because graphite fills most of the core]]</li>
  <li>[[두 숫자를 섞어 쓰면 엉뚱한 결론이 나옴. 체류시간 2.9년도 발표자료의 &#8220;약 3년&#8221;과 맞음||Mix the two and the conclusion goes astray. The 2.9-year residence also matches the &#8220;about 3 years&#8221; in presentations]]</li>
</ul>
<div class="body">
  <div class="fig">

init(el){

           [TX('질량 기준 · 비출력','Per mass · specific power'),'MW/tU',[[TX('경수로','LWR'),37.5,'var(--ink-3)','35~40'],['HTR-PM',85,'var(--hot)']],100]];
  P.forEach((p,k)=>{
    const x0=k*410, Y0=340, H=270;
    G.appendChild(mk('text',{x:x0,y:20,'font-family':'var(--sans)','font-size':18,fill:'var(--ink)','font-weight':600})).textContent=p[0];
    G.appendChild(mk('text',{x:x0,y:42,class:'lbl'})).textContent=p[1];
    G.appendChild(mk('line',{x1:x0,x2:x0+360,y1:Y0,y2:Y0,stroke:'var(--rule)'}));
    p[2].forEach((b,i)=>{
      const x=x0+40+i*170, h=b[1]/p[3]*H;
      const r=mk('rect',{x:x,y:Y0,width:110,height:'0',fill:b[2],opacity:0.85}); G.appendChild(r); bars.push([r,h,Y0]);
      G.appendChild(mk('text',{x:x+55,y:Y0-h-10,'text-anchor':'middle','font-family':'var(--mono)','font-size':20,fill:b[2],'font-weight':600})).textContent=b[3]||String(b[1]);
      G.appendChild(mk('text',{x:x+55,y:Y0+26,'text-anchor':'middle','font-family':'var(--sans)','font-size':17,fill:'var(--ink)','font-weight':600})).textContent=b[0];
    });
  });
  G.appendChild(mk('text',{x:205,y:396,'text-anchor':'middle',class:'lbl',fill:'var(--cool)'})).textContent=TX('약 1/30','about 1/30');
  G.appendChild(mk('text',{x:615,y:396,'text-anchor':'middle',class:'lbl',fill:'var(--hot)'})).textContent=TX('2배 이상','more than 2×');
  if(RM){ bars.forEach(b=>{ b[0].setAttribute('y',b[2]-b[1]); b[0].setAttribute('height',b[1]); }); return; }
  bars.forEach((b,i)=>b[0].animate([{y:b[2]+'px',height:'0px'},{y:(b[2]-b[1])+'px',height:b[1]+'px'}],
    {duration:700,delay:180*i,fill:'forwards',easing:'cubic-bezier(.2,.7,.3,1)'}));
}});

html:`<h2 class="t">[[HTR-PM 의 <em>정격 출력</em>과 실제 운전 출력||HTR-PM <em>rated output</em> against actual operation]]</h2>
<ul class="b">
  <li>[[두 모듈 모두 <b>165 MWt</b>로 운전 중, 계통 출력 약 116 MWe. 현재 인가 최대는 200 MWt이고 노심이 평형에 도달하는 2~3년 뒤 출력 상승 예정||Both modules run at <b>165 MWt</b>, about 116 MWe to the grid. The present licence limit is 200 MWt, with uprating planned once the core reaches equilibrium in 2-3 years]]</li>
  <li>[[실패가 아니라 초도호기의 정상적인 모습임. 다만 <b class="amb">&#8220;4세대가 상용화되었다&#8221;와 &#8220;정격 출력으로 안정 운전 중&#8221;은 전혀 다른 문장</b>임||This is normal for a first-of-a-kind, not a failure. But <b class="amb">&#8220;Gen IV is commercial&#8221; and &#8220;running steadily at rated power&#8221; are very different sentences</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 800 390" role="img" aria-label="[[모듈 열출력의 정격 250, 인가 최대 200, 실제 165 MWt를 비교한 막대||Module thermal power bars - rated 250, licensed maximum 200, actual 165 MWt]]">
    <g id="ra-g"></g>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">[[누적 이용률 (WNA)||Cumulative capacity factor (WNA)]]</span><span class="v">29.7<small>%</small></span></div>
    <div class="readout"><span class="k">[[계통 출력 (2026-05)||Grid output (May 2026)]]</span><span class="v">~116<small>MWe</small></span></div>
  </div>
</div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#ra-g'), X0=180, k=560/250, bars=[];
  [0,50,100,150,200,250].forEach(v=>{
    G.appendChild(mk('line',{x1:X0+v*k,x2:X0+v*k,y1:8,y2:320,class:'grid'}));
    G.appendChild(mk('text',{x:X0+v*k,y:344,'text-anchor':'middle',class:'lbl'})).textContent=v;
  });
  G.appendChild(mk('text',{x:X0+560,y:370,'text-anchor':'end',class:'lbl'})).textContent=TX('모듈 열출력 MWt','module thermal power, MWt');
  [[TX('정격','Rated'),250,'var(--ink-3)'],[TX('현재 인가 최대','Licensed maximum'),200,'var(--cool)'],[TX('실제 운전 (2026-05)','Actual (May 2026)'),165,'var(--hot)']]
    .forEach((b,i)=>{
      const y=24+i*100;
      G.appendChild(mk('text',{x:X0-14,y:y+36,'text-anchor':'end','font-family':'var(--sans)','font-size':17,fill:'var(--ink)','font-weight':600})).textContent=b[0];
      const r=mk('rect',{x:X0,y:y,width:'0',height:58,fill:b[2],opacity:0.85}); G.appendChild(r); bars.push([r,b[1]*k]);
      G.appendChild(mk('text',{x:X0+b[1]*k-10,y:y+37,'text-anchor':'end','font-family':'var(--mono)','font-size':18,fill:'var(--on-accent)','font-weight':600})).textContent=b[1];
    });
  if(RM){ bars.forEach(b=>b[0].setAttribute('width',b[1])); return; }
  bars.forEach((b,i)=>b[0].animate([{width:'0px'},{width:b[1]+'px'}],{duration:650,delay:220*i,fill:'forwards',easing:'ease-out'}));
}});


/* ---------------------------------------------------------------- 공정열 */
S({tag:'PROCESS HEAT', ov:'[[용도별 필요 온도와 HTGR 출구 750 °C||Temperatures that each use needs, against the 750 °C HTGR outlet]]',
src:'[[<b>출처</b> 본 교재 4.6절 · HTR-PM 은 2024-03 룽청시 지역난방망에 연결 — 19만 m², 약 1,850세대, 12 MW||<b>Source</b> This textbook &#167;4.6 · HTR-PM joined the Rongcheng district-heating grid in March 2024 - 190,000 m², about 1,850 homes, 12 MW]]',
abbr:'[[<b>공정열</b> 전기가 아니라 산업 공정에 바로 쓰는 열 · <b>고온수전해</b> 고온 수증기를 전기분해해 수소를 만드는 방법 · <b>메탄 수증기 개질</b> 천연가스와 수증기로 수소를 만드는 방법 · <b>황-요오드(SI)</b> 열화학 수소 생산 공정||<b>process heat</b> heat used directly by industry rather than turned into power · <b>high-temperature electrolysis</b> splitting steam electrically at high temperature · <b>steam methane reforming</b> hydrogen from natural gas and steam · <b>sulfur-iodine (SI)</b> a thermochemical hydrogen cycle]]',
html:`<h2 class="t">[[용도별 필요 온도와 <em>HTGR 출구 750 °C</em>||Temperatures that each use needs, against the <em>750 °C HTGR outlet</em>]]</h2>
<ul class="b">
  <li>[[HTGR의 진짜 시장은 전기가 아니라 <b>열</b>임 — Xe-100의 첫 고객은 화학회사, BANR은 군, 한국 과제 참여사는 제철·석유화학||The HTGR&#8217;s real market is <b>heat</b>, not power - Xe-100&#8217;s first customer is a chemical firm, BANR&#8217;s is the army, Korea&#8217;s partners are steel and petrochemicals]]</li>
  <li>[[750 °C를 노리는 이유는 이 목록의 <b class="ok">대부분을 덮기 때문</b>임. HTR-PM은 2024-03부터 지역난방 12 MW 공급 중(4세대 원자로의 첫 도시 난방)||750 °C is the target because it <b class="ok">covers most of this list</b>. HTR-PM has supplied 12 MW of district heat since March 2024 - the first Gen IV reactor to heat a city]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 330" role="img" aria-label="[[지역난방, 공정증기, 고온수전해, 메탄 개질, 황-요오드 수소 생산의 필요 온도 구간과 HTGR 출구 750 °C 선||Temperature bands for district heating, process steam, high-temperature electrolysis, methane reforming and sulfur-iodine hydrogen, with the 750 °C HTGR outlet line]]">
  <g id="ph-g"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#ph-g'), X0=300, X1=1050, sx=T=>X0+T/1000*(X1-X0), bars=[];
  [0,200,400,600,800,1000].forEach(T=>{
    G.appendChild(mk('line',{x1:sx(T),x2:sx(T),y1:0,y2:270,class:'grid'}));
    G.appendChild(mk('text',{x:sx(T),y:292,'text-anchor':'middle',class:'lbl'})).textContent=T+' °C';
  });
  const U=[[TX('지역난방','District heating'),100,200,'var(--ok)'],
           [TX('정유·석유화학 공정증기','Refinery / petrochemical steam'),250,550,'var(--cool)'],
           [TX('고온수전해','High-temperature electrolysis'),700,850,'var(--amber)'],
           [TX('메탄 수증기 개질','Steam methane reforming'),700,900,'var(--amber)'],
           [TX('황-요오드 수소 생산','Sulfur-iodine hydrogen'),850,950,'var(--hot)']];
  U.forEach((u,i)=>{
    const y=12+i*52;
    G.appendChild(mk('text',{x:X0-16,y:y+24,'text-anchor':'end','font-family':'var(--sans)','font-size':17,fill:'var(--ink)','font-weight':600})).textContent=u[0];
    const r=mk('rect',{x:sx(u[1]),y:y,width:'0',height:36,fill:u[3],opacity:0.75}); G.appendChild(r); bars.push([r,sx(u[2])-sx(u[1])]);
    const last=i===U.length-1;
    G.appendChild(mk('text',{x:last?sx(u[1])-10:sx(u[2])+10,y:y+24,class:'lbl','text-anchor':last?'end':'start'})).textContent=u[1]+'~'+u[2];
  });
  const L=mk('line',{x1:sx(750),x2:sx(750),y1:0,y2:270,stroke:'var(--hot)','stroke-width':2.4,'stroke-dasharray':'8 5'}); G.appendChild(L);
  G.appendChild(mk('text',{x:sx(750)-8,y:318,'text-anchor':'end','font-family':'var(--mono)','font-size':15,fill:'var(--hot)','font-weight':600})).textContent=TX('HTGR 출구 750 °C','HTGR outlet 750 °C');
  if(RM){ bars.forEach(b=>b[0].setAttribute('width',b[1])); return; }
  bars.forEach((b,i)=>b[0].animate([{width:'0px'},{width:b[1]+'px'}],{duration:600,delay:150*i,fill:'forwards',easing:'ease-out'}));
}});
</script>
