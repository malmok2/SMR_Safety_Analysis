<script>
/* ================================================================
   표지 · 여정 지도
   ================================================================ */
S({bare:true, cls:'cover', ov:'[[표지||Cover]]',
html:`<div class="kick">[[한양대학교 원자력공학과 · THINK Lab · NUE4067||Hanyang University · Dept. of Nuclear Engineering · THINK Lab · NUE4067]]</div>
<h1>[[SMR <span>설계요건</span>과<br>공학적안전설비||SMR <span>Design Requirements</span><br>and Engineered Safety Features]]</h1>
<div class="ln"></div>
<div class="meta">
  [[왜 이렇게 설계했는가를 <b>계산으로</b> 답하기 위한 최소 원리<br>
  2~3주차 강의 · 지도교수 <b>송민섭</b> · Rev1.0 · 2026년 9월||The minimum set of principles needed to answer <b>with numbers</b> why the design looks the way it does<br>
  Weeks 2-3 · Instructor <b>Minseop Song</b> · Rev1.0 · September 2026]]
</div>
<div class="hint">[[<kbd>→</kbd> 다음 &nbsp; <kbd>←</kbd> 이전 &nbsp; <kbd>O</kbd> 목차 &nbsp; <kbd>L</kbd> 한/영 &nbsp; <kbd>T</kbd> 배경 &nbsp; <kbd>P</kbd> 인쇄·PDF &nbsp; <kbd>F</kbd> 전체화면||<kbd>→</kbd> Next &nbsp; <kbd>←</kbd> Prev &nbsp; <kbd>O</kbd> Index &nbsp; <kbd>L</kbd> KO/EN &nbsp; <kbd>T</kbd> Theme &nbsp; <kbd>P</kbd> Print·PDF &nbsp; <kbd>F</kbd> Fullscreen]]</div>`,
init(el){
  if(RM) return;
  const h1=el.querySelector('h1'), ln=el.querySelector('.ln');
  h1.style.opacity=0; ln.style.width='0px';
  h1.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],
    {duration:700,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  ln.animate([{width:'0px'},{width:'120px'}],{duration:600,delay:500,fill:'forwards'});
}});

S({tag:'ROADMAP', ov:'[[세 가지 기본안전기능과 그것을 담당하는 계통||The three fundamental safety functions and the systems for them]]',
src:'IAEA SSR-2/1 (Rev.1) Requirement 4 · 10 CFR 50 Appendix A',
html:`<h2 class="t">[[세 가지 <em>기본안전기능</em>과 그것을 담당하는 계통||The three <em>fundamental safety functions</em> and the systems for them]]</h2>
<ul class="b">
  <li>[[계통 이름부터 외우면 왜 거기 있는지 알 수 없음. <b>요건 → 기능 → 계통</b> 순서로 읽음||Memorising system names first tells you nothing about why they exist. Read it as <b>requirement &#8594; function &#8594; system</b>]]</li>
  <li>[[앞 기능이 실패하면 뒤 기능의 부담이 커지는 <b>사슬</b>임 — 순서에 의미가 있음||It is a <b>chain</b>: when an upstream function fails the burden on the next one grows - the order carries meaning]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 395" role="img" aria-label="[[세 가지 기본안전기능과 그것을 담당하는 공학적안전설비의 대응 관계||The three fundamental safety functions and the engineered safety features that carry them out]]">
  <defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--rule)"/></marker></defs>
  <g id="rm-fn">
    <g transform="translate(0,8)">
      <rect x="30" y="20" width="300" height="100" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.5"/>
      <text x="48" y="54" class="lbl" fill="var(--hot)">[[기본안전기능 ①||Safety function &#9312;]]</text>
      <text x="48" y="90" font-family="var(--sans)" font-size="24" fill="var(--ink)" font-weight="500">[[반응도 제어||Reactivity control]]</text>
    </g>
    <g transform="translate(0,140)">
      <rect x="30" y="20" width="300" height="100" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.5"/>
      <text x="48" y="54" class="lbl" fill="var(--cool)">[[기본안전기능 ②||Safety function &#9313;]]</text>
      <text x="48" y="90" font-family="var(--sans)" font-size="24" fill="var(--ink)" font-weight="500">[[노심 열 제거||Core heat removal]]</text>
    </g>
    <g transform="translate(0,272)">
      <rect x="30" y="20" width="300" height="100" fill="var(--panel)" stroke="var(--ok)" stroke-width="1.5"/>
      <text x="48" y="54" class="lbl" fill="var(--ok)">[[기본안전기능 ③||Safety function &#9314;]]</text>
      <text x="48" y="90" font-family="var(--sans)" font-size="24" fill="var(--ink)" font-weight="500">[[방사성물질 격납||Confining radioactivity]]</text>
    </g>
  </g>
  <g id="rm-ln" stroke="var(--rule)" stroke-width="1.4" fill="none" marker-end="url(#ar1)">
    <path d="M334,78 H470"/><path d="M334,210 H470"/><path d="M334,210 H420 V342 H470"/><path d="M334,342 H470"/>
  </g>
  <g id="rm-sys">
    <g transform="translate(480,42)"><rect width="300" height="72" fill="none" stroke="var(--rule)"/>
      <text x="18" y="30" class="lbl">[[6장||Ch. 6]]</text>
      <text x="18" y="56" font-family="var(--sans)" font-size="19" fill="var(--ink-2)">[[제어봉 · 붕산 주입||Control rods · boron injection]]</text></g>
    <g transform="translate(480,174)"><rect width="400" height="72" fill="none" stroke="var(--rule)"/>
      <text x="18" y="30" class="lbl">[[7장||Ch. 7]]</text>
      <text x="18" y="56" font-family="var(--sans)" font-size="19" fill="var(--ink-2)">[[잔열제거 · PRHR · DHRS||Residual heat removal · PRHR · DHRS]]</text></g>
    <g transform="translate(480,306)"><rect width="330" height="72" fill="none" stroke="var(--rule)"/>
      <text x="18" y="30" class="lbl">[[8장||Ch. 8]]</text>
      <text x="18" y="56" font-family="var(--sans)" font-size="19" fill="var(--ink-2)">[[안전주입 · 축압기 · CMT||Safety injection · accumulator · CMT]]</text></g>
    <g transform="translate(826,306)"><rect width="264" height="72" fill="none" stroke="var(--rule)"/>
      <text x="18" y="30" class="lbl">[[9장||Ch. 9]]</text>
      <text x="18" y="56" font-family="var(--sans)" font-size="19" fill="var(--ink-2)">[[격납건물 · 살수 · PAR||Containment · spray · PAR]]</text></g>
  </g>
  <path id="rm-chain" d="M180,128 V160 M180,260 V292" stroke="var(--ink-3)" stroke-width="1.2"
        stroke-dasharray="3 4" fill="none"/>
  <text x="196" y="150" class="lbl">[[실패하면 부담 증가||failure &#8594; heavier burden]]</text>
  <text x="196" y="282" class="lbl">[[실패하면 부담 증가||failure &#8594; heavier burden]]</text>
</svg>
</div></div>`,
init(el){
  if(RM) return;
  const gs=[...el.querySelectorAll('#rm-fn > g')], ls=[...el.querySelectorAll('#rm-ln path')],
        ss=[...el.querySelectorAll('#rm-sys > g')];
  gs.concat(ss).forEach(g=>g.style.opacity=0);
  ls.forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;});
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],
    {duration:450,delay:120*i,fill:'forwards',easing:'ease-out'}));
  ls.forEach((p,i)=>p.animate([{strokeDashoffset:p.getTotalLength()},{strokeDashoffset:0}],
    {duration:500,delay:520+110*i,fill:'forwards'}));
  ss.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:400,delay:760+110*i,fill:'forwards'}));
}});

/* ================================================================
   SECTION 01 — SMR이란 무엇인가
   ================================================================ */
SECT('01 · [[SMR이란 무엇인가||What is an SMR]]');
S({bare:true, cls:'div', ov:'[[§01 SMR이란 무엇인가||&#167;01 What is an SMR]]',
html:`[[<div class="no">01</div><h2>SMR이란 무엇인가</h2><div class="ln"></div>
<p>이름에 담긴 두 단어, 그리고 “작게 만든다”는 선택이 치르는 대가.
이 장을 이해하지 못하면 이후 모든 설계 선택의 동기를 놓친다.</p>||<div class="no">01</div><h2>What is an SMR</h2><div class="ln"></div>
<p>Two words in the name, and the price paid for the choice to build it small.
Miss this chapter and you miss the motive behind every design choice that follows.</p>]]`});

S({tag:'DEFINITION', ov:'[[SMR의 정의 — 300 MWe 경계와 모듈화||Defining an SMR - the 300 MWe line and modularity]]',
src:'[[<b>출처</b> IAEA, <i>Advances in SMR Technology Developments</i>, 2022 Edition · 300 MWe는 법적 정의가 아니라 분류를 위한 관례적 상한||<b>Source</b> IAEA, <i>Advances in SMR Technology Developments</i>, 2022 Edition · 300 MWe is not a legal definition but a conventional upper bound used for classification]]',
html:`<h2 class="t">[[SMR의 정의 — <em>300 MWe</em> 경계와 모듈화||Defining an SMR - the <em>300 MWe</em> line and modularity]]</h2>
<ul class="b">
  <li>[[<b>Small</b> — 전기출력 <code>300 MWe</code> 이하. 열출력이 아니라 <b>전기출력</b> 기준임에 주의||<b>Small</b> - <code>300 MWe</code> or less. Note the yardstick is <b>electrical</b> output, not thermal]]</li>
  <li>[[<b>Modular</b> — ① 공장에서 만들어 옮기는 <b>제작 단위</b>, ② 여러 대를 이어 붙이는 <b>출력 단위</b>||<b>Modular</b> - &#9312; a <b>fabrication unit</b> built in a factory and shipped, &#9313; a <b>power unit</b> added one at a time]]</li>
  <li>[[공장 제작이 가능하려면 운반 한계 안에 들어와야 하고, 그러려면 작아야 함 — <b class="cool">모듈화를 가능하게 하려는 선택</b>||Factory fabrication demands it fit inside transport limits, which demands it be small - <b class="cool">small is what makes modular possible</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 365" role="img" aria-label="[[주요 원자로의 정격 전기출력을 한 행씩 늘어놓고 300 MWe SMR 경계를 표시한 그림||Rated electrical output of representative reactors, one per row, against the 300 MWe SMR boundary]]">
  <rect id="smrzone" x="200" y="22" width="0" height="296" fill="var(--cool)" opacity="0.10"/>
  <g id="dots"></g>
  <line x1="200" y1="318" x2="1010" y2="318" class="axis"/>
  <g class="lbl" text-anchor="middle" fill="var(--ink-3)" id="ticks"></g>
  <text x="1010" y="356" class="lbl" text-anchor="end">[[정격 전기출력 (MWe)||Rated electrical output (MWe)]]</text>
  <line id="bline" x1="360" y1="318" x2="360" y2="318" stroke="var(--cool)" stroke-width="2" stroke-dasharray="5 4"/>
  <text id="blbl" x="360" y="16" text-anchor="middle" font-family="var(--mono)" font-size="14"
        fill="var(--cool)" opacity="0">[[SMR 경계 · 300 MWe||SMR boundary · 300 MWe]]</text>
</svg>
</div></div>`,
init(el){
  const X=p=>200+p/1500*800;                 // 0..1500 MWe → 200..1000 px
  const data=[['CAREM-25',30],['RITM-200N',55],['NuScale NPM',77],['SMART100',110],
    ['i-SMR',170],['BWRX-300',300],['IRIS',335],['AP1000',1110],['APR1400',1400]];
  let tk=''; [0,300,600,900,1200,1500].forEach(v=>{ tk+=`<text x="${X(v)}" y="340">${v}</text>`; });
  el.querySelector('#ticks').innerHTML=tk;
  const g=el.querySelector('#dots');
  data.forEach((d,i)=>{                      // 한 노형에 한 행 — 라벨이 겹칠 자리가 없다
    const y=40+i*31, smr=d[1]<=300, x=X(d[1]);
    const col=smr?'var(--cool)':'var(--hot)', tc=smr?'var(--cool)':'var(--ink-2)';
    g.insertAdjacentHTML('beforeend',
      `<g data-r="${i}" opacity="0">`
      +`<text x="188" y="${y+4}" text-anchor="end" font-family="var(--mono)" font-size="14" fill="${tc}">${d[0]}</text>`
      +`<line x1="200" y1="${y}" x2="${x}" y2="${y}" stroke="var(--rule)" stroke-width="1.2"/>`
      +`<circle cx="${x}" cy="${y}" r="6.5" fill="${col}"/>`
      +`<text x="${x+13}" y="${y+5}" font-family="var(--mono)" font-size="14" fill="${tc}">${fmt(d[1])} MWe</text>`
      +`</g>`); });
  const rows=[...g.querySelectorAll('[data-r]')];
  const b=el.querySelector('#bline'), z=el.querySelector('#smrzone'), bl=el.querySelector('#blbl');
  if(RM){ rows.forEach(r=>r.setAttribute('opacity',1)); b.setAttribute('y2',22);
          z.setAttribute('width',160); bl.setAttribute('opacity',1); return; }
  b.setAttribute('opacity',0);
  rows.forEach((r,i)=>r.animate([{opacity:0},{opacity:1}],{duration:340,delay:420+i*70,fill:'forwards'}));
  b.setAttribute('y2',22);
  b.animate([{opacity:0},{opacity:1}],{duration:420,delay:380,fill:'forwards'});
  bl.animate([{opacity:0},{opacity:1}],{duration:300,delay:480,fill:'forwards'});
  z.animate([{width:'0px'},{width:'160px'}],{duration:600,delay:520,fill:'forwards',easing:'ease-out'});
}});
</script>
