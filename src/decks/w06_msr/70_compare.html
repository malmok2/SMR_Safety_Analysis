<script>
/* ================================================================
   SECTION 17 — 세 노형을 같은 자로 잰다  (교재 17장)
   ================================================================ */
SECT('17 · [[세 노형 비교||All three compared]]');

S({bare:true, cls:'div', ov:'[[&#167;17 세 노형을 같은 자로 재면||&#167;17 All three on one ruler]]',
html:`[[<div class="no">17</div><h2>세 노형을 같은 자로 재면</h2><div class="ln"></div>
<p>VHTR · SFR · MSR 을 하나의 표로 접는다. &#8220;어느 노형이 더 좋은가&#8221;에는 답이 없다 —
<b>용도와 기준</b>이 먼저 정해져야 답이 생긴다.</p>||<div class="no">17</div><h2>All three on one ruler</h2><div class="ln"></div>
<p>VHTR, SFR and MSR folded into one table. &#8220;Which reactor is better?&#8221; has no answer -
it gets one only once <b>the use and the yardstick</b> are fixed.</p>]]`});


/* ---------------------------------------------------------------- 여섯 축 */
S({tag:'SIX AXES', ov:'[[노형 비교의 여섯 축||Six axes for comparing reactors]]',
src:'[[<b>출처</b> 본 교재 17.1절||<b>Source</b> This textbook &#167;17.1]]',
html:`<h2 class="t">[[노형 비교의 <em>여섯 축</em>||<em>Six axes</em> for comparing reactors]]</h2>
<ul class="b">
  <li>[[축을 먼저 정하고 나누어 보면 각 노형의 자리가 분명해짐 — 축마다 1등이 다름(뒤의 표 17.3)||Fix the axes first and each reactor&#8217;s place becomes clear - each axis has a different leader (Table 17.3 later)]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 400" role="img" aria-label="[[열역학, 안전 논리, 연료 사이클, 재료·화학, 성숙도, 해석의 여섯 축||Six axes - thermodynamics, safety logic, fuel cycle, materials and chemistry, maturity, analysis]]">
  <g id="ax6"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#ax6'), gs=[];
  [[TX('열역학','Thermodynamics'),TX('얼마나 뜨겁게, 얼마나 낮은 압력으로','how hot, and at how low a pressure'),'var(--hot)'],
   [TX('안전 논리','Safety logic'),TX('무엇이 사고를 막는가','what stops an accident'),'var(--ok)'],
   [TX('연료 사이클','Fuel cycle'),TX('무엇을 태우고 무엇을 남기는가','what it burns and what it leaves'),'var(--cool)'],
   [TX('재료 · 화학','Materials · chemistry'),TX('무엇이 수명을 정하는가','what sets its lifetime'),'var(--amber)'],
   [TX('성숙도','Maturity'),TX('실제로 돌아간 적이 있는가','has it ever actually run'),'var(--cool)'],
   [TX('해석','Analysis'),TX('어떤 코드로, 어떤 데이터로 검증하는가','which code, validated on which data'),'var(--ok)']]
  .forEach((c,i)=>{
    const x=(i%3)*378, y=Math.floor(i/3)*204, g=mk('g',{transform:'translate('+x+','+y+')',opacity:0});
    g.appendChild(mk('rect',{width:362,height:190,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:362,height:3,fill:c[2]}));
    g.appendChild(mk('text',{x:22,y:58,'font-family':'var(--mono)','font-size':30,fill:c[2],'font-weight':600})).textContent=String(i+1);
    g.appendChild(mk('text',{x:22,y:108,'font-family':'var(--sans)','font-size':23,fill:'var(--ink)','font-weight':600})).textContent=c[0];
    wrapT(c[1],19).slice(0,2).forEach((ln,j)=>g.appendChild(mk('text',{x:22,y:146+j*25,'font-family':'var(--sans)','font-size':17,fill:'var(--ink-2)','font-weight':300})).textContent=ln);
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:340,delay:140*i,fill:'forwards'}));
}});


/* ---------------------------------------------------------------- 물성 총괄 */
S({tag:'PROPERTIES ON ONE PAGE', ov:'[[냉각재 물성 총괄 — 튀는 칸 네 개||Coolant properties on one page - four cells that stand out]]',
src:'[[<b>출처</b> 본 교재 표 17.1 · 물 15.5 MPa 310 °C · 헬륨 7 MPa 750 °C · 나트륨 0.1 MPa 500 °C · FLiBe 0.1 MPa 650 °C · 체적 열용량 = ρc<sub>p</sub>||<b>Source</b> This textbook, Table 17.1 · water 15.5 MPa 310 °C · helium 7 MPa 750 °C · sodium 0.1 MPa 500 °C · FLiBe 0.1 MPa 650 °C · volumetric heat capacity = ρc<sub>p</sub>]]',
abbr:'[[<b>체적 열용량</b> 1 m³ 를 1 K 올리는 데 드는 열 · <b>프란틀수 Pr</b> 운동량 확산 ÷ 열 확산 · <b>비점 여유</b> 운전 온도에서 끓는점까지 남은 온도||<b>volumetric heat capacity</b> heat to raise 1 m³ by 1 K · <b>Prandtl number Pr</b> momentum diffusion ÷ heat diffusion · <b>boiling margin</b> temperature left between operation and boiling]]',
html:`<h2 class="t">[[냉각재 물성 총괄 — <em>튀는 칸</em> 네 개||Coolant properties on one page - <em>four cells</em> that stand out]]</h2>
<ul class="b">
  <li>[[각 노형의 &#8220;고유 난제&#8221;는 이 표의 <b>어느 한 칸</b>에서 나옴 — 외울 것이 아니라 어느 칸이 튀는지를 보면 그 노형의 문제가 예측됨||Each reactor&#8217;s own hard problem comes from <b>one cell</b> of this table - not to memorise, but to read which cell stands out]]</li>
</ul>
<div class="body">
  <div class="fig">
  <table class="d sm" id="pt">
    <tr><th>[[물성||Property]]</th><th>[[물||Water]]</th><th>[[헬륨||Helium]]</th><th>[[나트륨||Sodium]]</th><th>FLiBe</th></tr>
    <tr><td>[[밀도 kg/m³||Density kg/m³]]</td><td class="n">727</td><td class="n">3.29</td><td class="n">835</td><td class="n">1,969</td></tr>
    <tr><td>[[비열 J/(kg·K)||c<sub>p</sub> J/(kg·K)]]</td><td class="n">5,320</td><td class="n">5,195</td><td class="n">1,264</td><td class="n">2,390</td></tr>
    <tr data-r="1"><td>[[체적 열용량 kJ/(m³·K)||ρc<sub>p</sub> kJ/(m³·K)]]</td><td class="n">3,870</td><td class="n" data-h="1">17</td><td class="n">1,055</td><td class="n">4,707</td></tr>
    <tr><td>[[열전도도 W/(m·K)||Conductivity W/(m·K)]]</td><td class="n">0.54</td><td class="n">0.37</td><td class="n">64.2</td><td class="n">1.0</td></tr>
    <tr><td>[[점성 mPa·s||Viscosity mPa·s]]</td><td class="n">0.086</td><td class="n">0.047</td><td class="n">0.236</td><td class="n">6.8</td></tr>
    <tr data-r="2"><td>[[프란틀수||Prandtl number]]</td><td class="n">0.86</td><td class="n">0.66</td><td class="n" data-h="2">0.0046</td><td class="n">16</td></tr>
    <tr data-r="4"><td>[[융점 °C||Melting point °C]]</td><td class="n">0</td><td class="n">—</td><td class="n" data-h="4">97.8</td><td class="n" data-h="4">459</td></tr>
    <tr><td>[[비점 °C||Boiling point °C]]</td><td class="n">[[345 (포화)||345 (sat.)]]</td><td class="n">—</td><td class="n">883</td><td class="n">&gt;1400</td></tr>
    <tr data-r="3"><td>[[운전–비점 여유 K||Margin to boiling K]]</td><td class="n" data-h="3">20</td><td class="n">—</td><td class="n">373</td><td class="n">&gt;750</td></tr>
  </table>
  </div>
  <div class="side">
    <div class="btnrow" id="pt-b">
      <button class="btn act" data-k="1">&#9312; ρc<sub>p</sub></button><button class="btn" data-k="2">&#9313; Pr</button>
      <button class="btn" data-k="3">&#9314; [[비점 여유||boiling margin]]</button><button class="btn" data-k="4">&#9315; [[융점||melting]]</button>
    </div>
    <div class="readout hi" style="margin-top:14px"><span class="k" id="pt-k"></span><span class="v" id="pt-v" style="font-size:17px;line-height:1.5"></span></div>
  </div>
</div>`,
init(el){
  const R={1:[TX('체적 열용량 — 헬륨만 두 자릿수 아래','heat per volume - only helium is two orders down'),TX('FLiBe > 물 > 나트륨 ≫ 헬륨. 그래서 HTGR 만 7 MPa 가압이 필요함','FLiBe > water > sodium ≫ helium. So only the HTGR needs 7 MPa')],
           2:[TX('프란틀수 — 나트륨만 두 자릿수 아래','Prandtl - only sodium is two orders down'),TX('그래서 SFR 만 전열 상관식을 통째로 갈아야 함','so only the SFR must replace its heat-transfer correlations wholesale')],
           3:[TX('비점 여유 — 물만 20 K','Boiling margin - only water has 20 K'),TX('그래서 경수로만 임계열유속과 싸움','so only the LWR fights critical heat flux')],
           4:[TX('융점 — 나트륨 97.8 °C, FLiBe 459 °C','Melting - sodium 97.8 °C, FLiBe 459 °C'),TX('그래서 SFR 과 MSR 만 동결을 걱정함','so only the SFR and MSR worry about freezing')]};
  const bs=el.querySelectorAll('#pt-b .btn');
  const set=k=>{
    bs.forEach(b=>b.classList.toggle('act',b.dataset.k==k));
    el.querySelectorAll('#pt tr').forEach(tr=>{ const on=tr.dataset.r==k;
      tr.querySelectorAll('td').forEach(td=>{ const h=on&&td.dataset.h==k;
        td.style.background=h?'var(--act)':''; td.style.color=h?'var(--hot)':(on?'var(--ink)':'');
        td.style.fontWeight=h?'600':''; }); });
    el.querySelector('#pt-k').textContent=R[k][0]; el.querySelector('#pt-v').textContent=R[k][1];
  };
  bs.forEach(b=>b.onclick=e=>{ e.stopPropagation(); set(b.dataset.k); });
  set(1);
}});


/* ---------------------------------------------------------------- 총괄 비교 1 */
S({tag:'THE THREE COMPARED 1/2', ov:'[[세 노형 총괄 비교 (1/2) — 설계 변수||The three compared (1 of 2) - design parameters]]',

abbr:'[[<b>TRISO</b> 세 겹 피복 연료 입자 · <b>중간 루프</b> 1차 냉각재와 증기 계통 사이에 한 번 더 두는 루프 · <b>고속</b> 감속재 없이 빠른 중성자로 핵분열||<b>TRISO</b> tri-structural isotropic particle · <b>intermediate loop</b> one more loop between the primary and the steam side · <b>fast</b> fission by unmoderated neutrons]]',
html:`<h2 class="t">[[세 노형 <em>총괄 비교</em> (1/2) — 설계 변수||The three <em>compared</em> (1 of 2) - design parameters]]</h2>
<ul class="b">

<table class="d">
  <tr><th>[[항목||Item]]</th><th>VHTR (HTGR)</th><th>SFR</th><th>[[MSR (액체연료)||MSR (liquid fuel)]]</th></tr>
  <tr><td>[[냉각재||Coolant]]</td><td>[[헬륨||helium]]</td><td>[[나트륨||sodium]]</td><td>[[불화물 · 염화물 염||fluoride or chloride salt]]</td></tr>
  <tr><td>[[감속재||Moderator]]</td><td>[[흑연||graphite]]</td><td>[[없음 (고속)||none (fast)]]</td><td>[[흑연 또는 없음||graphite or none]]</td></tr>
  <tr><td>[[연료||Fuel]]</td><td>[[TRISO 입자||TRISO particles]]</td><td>[[금속 또는 산화물 봉||metal or oxide pins]]</td><td>[[염에 용해||dissolved in salt]]</td></tr>
  <tr><td>[[1차 압력||Primary pressure]]</td><td class="n">6~7 MPa</td><td class="n">~0.1 MPa</td><td class="n">~0.1 MPa</td></tr>
  <tr><td>[[출구 온도||Outlet temperature]]</td><td class="n">750~950 °C</td><td class="n">500~550 °C</td><td class="n">650~700 °C</td></tr>
  <tr class="mark"><td>[[출력밀도 MW/m³||Power density MW/m³]]</td><td class="n">3~6</td><td class="n">230~450</td><td class="n">[[3 (열) ~ 300 (고속)||3 (thermal) - 300 (fast)]]</td></tr>
  <tr><td>[[중간 루프||Intermediate loop]]</td><td>[[없음||none]]</td><td>[[있음||yes]]</td><td>[[있음 (2차 염)||yes (secondary salt)]]</td></tr>
  <tr><td>[[열효율||Efficiency]]</td><td class="n">~40 %</td><td class="n">~40 %</td><td class="n">~45 %</td></tr>
</table>
</div></div>`});


/* ---------------------------------------------------------------- 총괄 비교 2 */
S({tag:'THE THREE COMPARED 2/2', ov:'[[세 노형 총괄 비교 (2/2) — 안전과 성숙도||The three compared (2 of 2) - safety and maturity]]',
src:'[[<b>출처</b> 본 교재 표 17.2 · 운전 실적은 <b>2026년 9월 기준</b>||<b>Source</b> This textbook, Table 17.2 · operating record <b>as of September 2026</b>]]',
abbr:'[[<b>RCCS</b> 원자로 공동 냉각계통 · <b>RVACS · DRACS</b> 용기 외부 공기냉각 · 직접 잔열제거 계통 · <b>FCCI</b> 연료–피복재 화학 상호작용 · <b>BN-600 · 800</b> 러시아 나트륨 고속로 · <b>TMSR-LF1</b> 중국 2 MWt 액체연료 시험로||<b>RCCS</b> reactor cavity cooling system · <b>RVACS · DRACS</b> vessel air cooling and direct decay-heat removal · <b>FCCI</b> fuel-cladding chemical interaction · <b>BN-600 · 800</b> Russian sodium fast reactors · <b>TMSR-LF1</b> China&#8217;s 2 MWt liquid-fuel test reactor]]',
html:`<h2 class="t">[[세 노형 <em>총괄 비교</em> (2/2) — 안전과 성숙도||The three <em>compared</em> (2 of 2) - safety and maturity]]</h2>

  <li>[[세 노형 모두 온도계수는 음이지만 <b>음이 되는 이유가 다름</b> — 도플러 · 구조 팽창 · 연료 팽창. <b class="hot">보이드는 대형 SFR 에서만 양</b>||All three have negative temperature feedback <b>for different reasons</b> - Doppler, structural expansion, fuel expansion. <b class="hot">Void is positive only in a large SFR</b>]]</li>

</table>
</div></div>`});


/* ---------------------------------------------------------------- 열전달 경로 */
S({tag:'HEAT PATH', ov:'[[노형별 열전달 경로 — 중간 루프의 개수||Heat path by reactor - how many loops]]',
src:'[[<b>출처</b> 본 교재 그림 17.1 을 다시 그림 · 칸의 수는 열이 거치는 유체 · 기기의 수 · MSR 은 연료염 자체가 1차 유체임||<b>Source</b> Redrawn from textbook Fig. 17.1 · the number of boxes is the number of fluids and components heat passes through · in the MSR the fuel salt is itself the primary fluid]]',
abbr:'[[<b>증기발생기(SG)</b> 1차 쪽 열로 물을 끓이는 열교환기 · <b>중간 Na</b> 방사화된 1차 나트륨과 물 사이에 두는 비방사성 나트륨 루프 · <b>2차 염</b> 연료염과 발전 계통 사이의 깨끗한 염 루프||<b>steam generator (SG)</b> boils water with primary-side heat · <b>intermediate Na</b> a non-radioactive sodium loop between activated primary sodium and water · <b>secondary salt</b> a clean salt loop between fuel salt and the power cycle]]',
html:`<h2 class="t">[[노형별 <em>열전달 경로</em> — 중간 루프의 개수||<em>Heat path</em> by reactor - how many loops]]</h2>
<ul class="b">
  <li>[[<b class="hot">SFR 만 중간 루프를 하나 더 둠</b> — 방사화된 1차 나트륨과 물을 떼어 놓기 위함. 나트륨–물 반응이 일어나도 1차 계통까지 번지지 않게 하는 칸막이임||<b class="hot">Only the SFR adds an intermediate loop</b> - to keep activated primary sodium away from water. A sodium-water reaction then cannot reach the primary circuit]]</li>
  <li>[[MSR 은 <b>노심이 곧 연료염</b> — 방사성 연료염을 발전 계통에서 떼어 놓으려고 깨끗한 2차 염을 둠||In the MSR <b>the core is the fuel salt</b> - a clean secondary salt keeps it away from the power cycle]]</li>

init(el){
  const mk=svgEl, G=el.querySelector('#hp'), X0=120, W=156, GAP=20, H=66, fl=[], gs=[];

              ['MSR','var(--ok)',[TX('노심 = 연료염','Core = fuel salt'),TX('2차 염','Secondary salt'),TX('증기 또는 가스터빈','Steam or gas turbine')]]];

      if(j){ const p=mk('path',{d:'M'+(x-GAP+3)+','+(y+H/2)+' L'+(x-4)+','+(y+H/2),stroke:r[1],'stroke-width':2,fill:'none'});
        g.appendChild(p); g.appendChild(mk('path',{d:'M'+(x-10)+','+(y+H/2-5)+' L'+(x-3)+','+(y+H/2)+' L'+(x-10)+','+(y+H/2+5),stroke:r[1],'stroke-width':2,fill:'none'})); }

  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:380,delay:260*i,fill:'forwards'}));
  fl.forEach(f=>flow(f[0],{n:10,color:f[1],r:2.6,speed:70}));
}});

src:'[[<b>출처</b> 본 교재 그림 17.3 을 다시 그림 · 17.5절 · 헬륨 음속 1880 m/s 는 750 °C 값(물질 Courant 조건 기준 유속 30 m/s)||<b>Source</b> Redrawn from textbook Fig. 17.3 · &#167;17.5 · helium sound speed 1880 m/s at 750 °C (material Courant limit on 30 m/s flow)]]',

html:`<h2 class="t">[[계통코드에서 노형마다 <em>갈아끼울 네 칸</em>||<em>Four slots</em> to swap in a system code, per reactor]]</h2>

    .forEach((h,j)=>G.appendChild(mk('text',{x:X0+j*(W+GX)+W/2,y:24,'text-anchor':'middle','font-family':'var(--sans)','font-size':17,fill:'var(--cool)','font-weight':600})).textContent=h);

   ['MSR','var(--ok)',[TX('염 물성표 (불확실 10~50 %)','salt tables (10-50 % uncertain)'),TX('물 기준 상관식 재평가','reassess water correlations'),TX('동결 판정 T < T_melt','freeze check T < T_melt'),TX('선구핵종 수송, 유체 내 발열','precursor transport, heat in the fluid')]]]
  .forEach((r,i)=>{

    G.appendChild(mk('text',{x:76,y:y+H/2+6,'text-anchor':'middle','font-family':'var(--mono)','font-size':17,fill:r[1],'font-weight':600})).textContent=r[0];

      G.appendChild(g); cells.push(g);

  cells.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:300,delay:90*((i%4)*3+Math.floor(i/4)),fill:'forwards'}));
}});

S({tag:'WHICH ONE, FOR WHAT', ov:'[[용도별 노형 선택||Choosing a reactor by use]]',
src:'[[<b>출처</b> 본 교재 17.6절 · 경수로형 SMR(NuScale · i-SMR)은 3~4주차 덱 참조||<b>Source</b> This textbook &#167;17.6 · for LWR SMRs (NuScale, i-SMR) see the weeks 3-4 deck]]',
abbr:'[[<b>공정열</b> 전기가 아니라 열 자체를 공장에 공급하는 것 · <b>파이로프로세싱</b> 사용후핵연료를 고온 용융염 속에서 전기화학적으로 분리하는 건식 재처리 · <b>초도호기</b> 같은 설계로 처음 짓는 호기||<b>process heat</b> heat itself supplied to industry, not electricity · <b>pyroprocessing</b> dry electrochemical separation of spent fuel in molten salt · <b>first-of-a-kind</b> the first unit of a design]]',
html:`<h2 class="t">[[용도별 <em>노형 선택</em>||Choosing a <em>reactor</em> by use]]</h2>
<ul class="b">
  <li>[[이 교재의 세 노형은 <b>전부 초도호기 단계이거나 그 이전</b> — 인허가 경로의 명확성에서 경수로형 SMR 과 차이가 큼||All three are <b>at first-of-a-kind or earlier</b> - far behind LWR SMRs in how clear the licensing path is]]</li>
  <li>[[<b class="ok">THINK Lab 의 자리</b> — 세 노형 모두 열수력 해석 도구와 실험 데이터가 부족함. 특히 해상 MSR 은 선체 운동이라는 새 축이 붙음. 가장 덜 채워진 칸이 가장 좋은 연구 주제임||<b class="ok">Where THINK Lab fits</b> - all three lack TH tools and data, and the sea-going MSR adds hull motion. The emptiest cell is the best research topic]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 366" role="img" aria-label="[[고온 공정열은 HTGR, 사용후핵연료 소각은 SFR, 해상은 MSR, 지금 지을 것은 경수로형 SMR||Process heat - HTGR; burning spent fuel - SFR; at sea - MSR; build now - LWR SMR]]">
  <g id="ch"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#ch'), gs=[];
  [[TX('고온 공정열','High-temperature process heat'),'HTGR','var(--amber)',TX('제철 · 수소 · 석유화학. 750~950 °C 를 내는 유일한 실용 노형 — 포스코 · 롯데케미칼이 과제에 참여','steel, hydrogen, petrochemicals. The only practical reactor for 750-950 °C - POSCO and Lotte Chemical are in the project')],
   [TX('사용후핵연료 소각','Burning spent fuel'),'SFR','var(--hot)',TX('고속 스펙트럼이 필요한 일에는 대안이 없음. 파이로프로세싱과 짝을 이룸','no alternative when a fast spectrum is needed. Pairs with pyroprocessing')],
   [TX('해상 · 부유식','At sea, floating'),'MSR','var(--ok)',TX('상압 · 단상 · 중력 구동 정지 · 작은 노심. 대가는 동결과 정비','atmospheric, single phase, gravity-driven shutdown, small core. The price is freezing and maintenance')],
   [TX('지금 지을 수 있는 것','What can be built now'),TX('경수로형 SMR','LWR SMR'),'var(--cool)',TX('NuScale · i-SMR. 인허가 경로가 가장 명확함','NuScale, i-SMR. The clearest licensing path')]]
  .forEach((c,i)=>{
    const x=i*283, g=mk('g',{transform:'translate('+x+',0)',opacity:0});
    g.appendChild(mk('rect',{width:270,height:360,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:270,height:3,fill:c[2]}));
    wrapT(c[0],12.5).slice(0,2).forEach((ln,j)=>g.appendChild(mk('text',{x:20,y:40+j*23,'font-family':'var(--sans)','font-size':18,fill:'var(--ink-2)','font-weight':400})).textContent=ln);
    g.appendChild(mk('text',{x:20,y:130,'font-family':'var(--mono)','font-size':c[1].length>6?25:32,fill:c[2],'font-weight':600})).textContent=c[1];
    wrapT(c[3],14.5).slice(0,8).forEach((ln,j)=>g.appendChild(mk('text',{x:20,y:176+j*24,'font-family':'var(--sans)','font-size':15.5,fill:'var(--ink)','font-weight':300})).textContent=ln);
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:340,delay:160*i,fill:'forwards'}));
}});
</script>
