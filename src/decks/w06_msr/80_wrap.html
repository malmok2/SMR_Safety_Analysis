/* ---------------------------------------------------------------- 한 문장 */
S({tag:'ONE SENTENCE', ov:'[[세 덱의 한 문장 — 물성표의 한 칸이 노형을 만든다||The three decks in one sentence - one cell of the property table makes the reactor]]',
src:'[[<b>출처</b> 본 교재 18.1절 · 헬륨 ρc<sub>p</sub> 17 kJ/(m³·K) · 나트륨 Pr 0.005 · FLiBe 융점 459 °C — 표 17.1||<b>Source</b> This textbook &#167;18.1 · helium ρc<sub>p</sub> 17 kJ/(m³·K) · sodium Pr 0.005 · FLiBe melting point 459 °C - Table 17.1]]',
html:`<h2 class="t">[[세 덱의 한 문장 — <em>물성표의 한 칸</em>이 노형을 만든다||The three decks in one sentence - <em>one cell</em> makes the reactor]]</h2>
<ul class="b">
  <li>[[냉각재를 바꾸면 물성표의 어느 한 칸이 튀고, <b>그 한 칸이 그 노형의 모든 설계 결정과 고유 난제를 만듦</b>||Change the coolant and one cell of the property table stands out - <b>and that cell drives every design decision and the hard problem</b>]]</li>
  <li>[[분석 순서는 셋 다 같음 — <b class="ok">물성 → 전열 → 계통 배치 → 안전 논리 → 해석 도구</b>. 납냉각로 · 히트파이프로 · 초임계 CO₂ 사이클도 이 순서로 접근||The order of analysis is the same for all three - <b class="ok">properties → heat transfer → layout → safety logic → tools</b>. Lead, heat pipes and sCO₂ yield to the same order]]</li>

<div class="body"><div class="fig">

</div></div>`,
init(el){

   [TX('나트륨','Sodium'),'Pr 0.005','var(--hot)',[TX('전열 상관식 교체','new correlations'),TX('축방향 전도','axial conduction'),TX('강한 자연순환','strong natural circulation'),TX('화학 반응성 → 중간 루프','reactivity → intermediate loop')]],
   [TX('용융염','Molten salt'),TX('액체연료 · 459 °C','liquid fuel · 459 °C'),'var(--ok)',[TX('선구핵종 이동','precursor drift'),TX('유체 내 발열 · 온라인 정제','heat in fluid, online cleanup'),TX('오프가스 선원항','off-gas source term'),TX('동결','freezing')]]]

S({tag:'FIVE EQUATIONS', ov:'[[꼭 기억할 다섯 개의 식||Five equations to keep]]',
src:'[[<b>출처</b> 본 교재 18.2절 · 전도 냉각 — 원통 노심 중심과 표면의 온도차(5장) · Mikityuk 상관식(7장) · 선구핵종 수송(13장) · 붕괴열 Way–Wigner, 운전 10⁸ s 가정||<b>Source</b> This textbook &#167;18.2 · conduction - centre-to-surface difference of a cylindrical core (ch. 5) · Mikityuk correlation (ch. 7) · precursor transport (ch. 13) · Way-Wigner decay heat with 10⁸ s of operation]]',
abbr:'[[<b>q‴</b> 단위 부피당 발열 · <b>R</b> 노심 반지름 · <b>P/D</b> 봉 간격 ÷ 봉 지름 · <b>Pe</b> 페클레수 = Re·Pr · <b>v<sub>f</sub></b> 연료염 유속 · <b>Λ</b> 중성자 세대시간||<b>q‴</b> heat per unit volume · <b>R</b> core radius · <b>P/D</b> pitch ÷ pin diameter · <b>Pe</b> Péclet number = Re·Pr · <b>v<sub>f</sub></b> fuel-salt velocity · <b>Λ</b> neutron generation time]]',
html:`<h2 class="t">[[꼭 기억할 <em>다섯 개의 식</em>||<em>Five equations</em> to keep]]</h2>
<div class="body"><div class="fig">
<table class="d">
  <tr><th>[[식||Equation]]</th><th>[[무엇을 말하나||What it says]]</th></tr>
  <tr><td style="font-family:var(--mono);font-size:19px">ṁ = Q / (c<sub>p</sub> ΔT)</td><td>[[유량과 온도차 — 헬륨의 큰 송풍기, 염의 작은 배관||flow and temperature rise - helium&#8217;s big circulator, salt&#8217;s small pipes]]</td></tr>
  <tr><td style="font-family:var(--mono);font-size:19px">ΔT<sub>max</sub> = q‴R² / (4k)</td><td>[[전도 냉각의 한계 — <b>노심 지름이 출력을 정함</b>||the limit of conduction cooling - <b>core diameter sets the power</b>]]</td></tr>
  <tr><td style="font-family:var(--mono);font-size:19px">Nu = 0.047(1 − e<sup>−3.8(P/D−1)</sup>)(Pe<sup>0.77</sup> + 250)</td><td>[[액체금속 전열 — Pr 대신 Pe 하나로||liquid-metal heat transfer - Pe instead of Pr]]</td></tr>
  <tr><td style="font-family:var(--mono);font-size:19px">∂c<sub>i</sub>/∂t + ∇·(c<sub>i</sub><b>v</b><sub>f</sub>) = (β<sub>i</sub>/Λ)n − λ<sub>i</sub>c<sub>i</sub></td><td>[[순환연료의 선구핵종 — 이류항 하나가 더 붙음||precursors in circulating fuel - one advection term more]]</td></tr>
  <tr class="mark"><td style="font-family:var(--mono);font-size:19px">P<sub>d</sub>/P<sub>0</sub> = 0.0622[t<sup>−0.2</sup> − (t+10⁸)<sup>−0.2</sup>]</td><td>[[붕괴열 — <b>모든 피동안전 논거의 출발점</b>||decay heat - <b>where every passive-safety argument starts</b>]]</td></tr>
</table>
</div></div>`});

init(el){
  const mk=svgEl, G=el.querySelector('#lp'), gs=[];
  [[TX('직접 계산해 본다','Calculate it yourself'),TX('2.3절 송풍기 동력 · 5.2절 전도 냉각 · 7.3절 전열 상관식 비교의 코드를 돌려 볼 것','run the codes for §2.3 circulator power, §5.2 conduction cooling and §7.3 correlation comparison'),'var(--cool)'],
   [TX('계통코드에 노형을 넣는다','Put a reactor in the code'),TX('III권 코드에 6.3절(헬륨)이나 11.3절(나트륨) 예제를 넣고 정상상태를 맞춰 볼 것','add the §6.3 helium or §11.3 sodium example to the Volume III code and reach steady state'),'var(--ok)'],
   [TX('벤치마크를 하나 푼다','Solve a benchmark'),TX('① EBR-II SHRT-45R — 우리 코드로도 정성 재현 ② MSRE 펌프 기동 — 코드 수정 필요, 물리 선명 ③ HTTR LOFC — 고체 열구조 모델이 핵심','① EBR-II SHRT-45R - qualitative with our code ② MSRE pump start - code changes, clear physics ③ HTTR LOFC - solid heat structures are key'),'var(--amber)'],
   [TX('1차 출처를 확인한다','Check a primary source'),TX('각주 하나를 골라 1차 출처를 직접 찾아갈 것 — 「SMR 자료를 찾는 법」의 실전 연습','pick one footnote and trace it to the primary source - practice for Finding SMR Data'),'var(--hot)']]

    wrapT(c[0],13).slice(0,2).forEach((ln,j)=>g.appendChild(mk('text',{x:20,y:94+j*24,'font-family':'var(--sans)','font-size':19,fill:'var(--ink)','font-weight':600})).textContent=ln);

    if(i<3) g.appendChild(mk('path',{d:'M272,176 L281,176',stroke:c[2],'stroke-width':2}));
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:340,delay:220*i,fill:'forwards'}));

S({tag:'TEN COMMON MISTAKES', ov:'[[발표에서 틀리기 쉬운 열 가지||Ten common mistakes in presentations]]',
src:'[[<b>출처</b> 본 교재 18.5절 · 각 항목의 1차 출처는 해당 장(2 · 7 · 9 · 14 · 5장) · HTR-PM 출력은 2026년 5월 기준||<b>Source</b> This textbook &#167;18.5 · primary sources in the relevant chapters (2, 7, 9, 14, 5) · HTR-PM power as of May 2026]]',
abbr:'[[<b>FCCI</b> 연료–피복재 화학 상호작용 · <b>MWt · MWe</b> 열출력 · 전기출력 · <b>NaOH</b> 수산화나트륨 — 감속재 후보였던 것||<b>FCCI</b> fuel-cladding chemical interaction · <b>MWt · MWe</b> thermal and electric power · <b>NaOH</b> sodium hydroxide - once a moderator candidate]]',
html:`<h2 class="t">[[발표에서 <em>틀리기 쉬운</em> 열 가지||Ten <em>common mistakes</em> in presentations]]</h2>
<ul class="b">
  <li>[[모두 <b>1차 출처를 한 번만 확인하면 걸러짐</b> — 언론 기사와 오래된 발표자료를 재인용하는 습관이 이런 오류를 퍼뜨림||All are <b>caught by checking the primary source once</b> - re-quoting press articles and old slides is what spreads them]]</li>
</ul>
<div class="body"><div class="fig">
<table class="d sm">
  <tr><th>[[흔히 쓰는 말||Often said]]</th><th>[[사실||Actually]]</th></tr>
  <tr><td>[[HTR-PM 은 정격 500 MWt 로 운전 중||HTR-PM runs at its rated 500 MWt]]</td><td>[[모듈당 165 MWt, 인가 최대 200 MWt — 평형 노심 도달 후 상승 예정||165 MWt per module, licensed to 200 - rising after the equilibrium core]]</td></tr>
  <tr><td>[[헬륨 음속은 약 1000 m/s||Helium sound speed is ~1000 m/s]]</td><td>[[실온 값 — 750 °C 에서는 1882 m/s||room temperature - 1882 m/s at 750 °C]]</td></tr>
  <tr><td>[[나트륨 ρ = 1014 − 0.235T 의 T 는 섭씨||Sodium ρ = 1014 − 0.235T takes °C]]</td><td>[[켈빈 — 섭씨로 쓰면 7 % 틀림||kelvin - 7 % off in °C]]</td></tr>
  <tr><td>[[4S 는 루프형||4S is a loop design]]</td><td>[[풀형 (도시바 NRC 제출 문서)||pool (Toshiba&#8217;s NRC submittal)]]</td></tr>
  <tr><td>[[Oklo Aurora 는 히트파이프로||Oklo Aurora is a heat-pipe reactor]]</td><td>[[2020 설계는 폐기 — 현재는 풀형 나트륨 고속로||the 2020 design was dropped - now a sodium pool fast reactor]]</td></tr>
  <tr><td>[[SEALER 는 나트륨로||SEALER is sodium-cooled]]</td><td>[[납 냉각||lead-cooled]]</td></tr>
  <tr><td>[[Seaborg CMSR 은 NaOH 감속||Seaborg&#8217;s CMSR is NaOH-moderated]]</td><td>[[2023년 흑연으로 바뀜 — 회사명도 Saltfoss||graphite since 2023 - and the company is now Saltfoss]]</td></tr>
