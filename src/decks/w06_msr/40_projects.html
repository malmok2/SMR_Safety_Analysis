S({tag:'POWER AT LOW PRESSURE', ov:'[[상압인데 출력이 나오는 이유 — 체적 열용량과 배관 하나||Why low pressure still gives high power - heat capacity and one pipe]]',
src:'[[<b>계산</b> 본 교재 14.2절 · FLiBe 650 °C ρc<sub>p</sub> = 1969 × 2390 = 4.71×10⁶ J/(m³·K) · V̇ = Q/(ρc<sub>p</sub>ΔT) · 배관 유속 3 m/s · IMSR 초기 설계 400 MWt, ΔT 100 K &#8594; 0.85 m³/s, 단면 0.28 m², 지름 약 60 cm||<b>Calculation</b> This textbook &#167;14.2 · FLiBe at 650 °C ρc<sub>p</sub> = 1969 × 2390 = 4.71×10⁶ J/(m³·K) · V̇ = Q/(ρc<sub>p</sub>ΔT) · pipe velocity 3 m/s · early IMSR 400 MWt with ΔT 100 K &#8594; 0.85 m³/s, 0.28 m², about 60 cm bore]]',
abbr:'[[<b>체적 열용량</b> 같은 부피가 1 K 데워질 때 담는 열 · <b>V̇</b> 체적유량 · <b>IMSR</b> Terrestrial Energy 일체형 용융염로||<b>volumetric heat capacity</b> heat stored per volume per kelvin · <b>V̇</b> volume flow · <b>IMSR</b> Terrestrial Energy&#8217;s Integral Molten Salt Reactor]]',
html:`<h2 class="t">[[상압인데 출력이 나오는 이유 — <em>체적 열용량과 배관 하나</em>||Why low pressure still gives high power - <em>heat capacity and one pipe</em>]]</h2>
<ul class="b">
  <li>[[FLiBe ρc<sub>p</sub> <b>4707 kJ/(m³·K)</b>는 물(15.5 MPa, 310 °C)의 3870보다 큼 — 같은 부피유량으로 물보다 많은 열을 나름||FLiBe&#8217;s ρc<sub>p</sub> of <b>4707 kJ/(m³·K)</b> beats water&#8217;s 3870 at 15.5 MPa and 310 °C - more heat per volume moved]]</li>
  <li>[[<b class="ok">상압 배관 하나로 400 MW를 나름</b> — 15 MPa 배관과는 제작 난이도가 완전히 다름||<b class="ok">One low-pressure pipe carries 400 MW</b> - a completely different fabrication problem from 15 MPa piping]]</li>
</ul>
<div class="body">
  <div class="fig">
  <div class="formula" style="font-size:22px;padding:4px 0 10px">Q <span class="op">=</span> ρ V̇ c<sub>p</sub> ΔT &nbsp;&nbsp; &#8594; &nbsp;&nbsp; V̇ <span class="op">=</span> Q / (ρc<sub>p</sub>ΔT)</div>
  <svg viewBox="0 0 800 330" role="img" aria-label="[[열출력과 노심 온도차에 따라 필요한 배관 지름이 바뀌는 모습 — 3 m/s 기준||The pipe bore needed for a given power and core ΔT, at 3 m/s]]">
    <g id="pw-g"></g>
    <circle id="pw-c" cx="400" cy="160" r="60" fill="var(--amber)" opacity="0.35" stroke="var(--amber)" stroke-width="2"/>
    <text id="pw-t" x="400" y="166" text-anchor="middle" class="val" fill="var(--ink)">60 cm</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout hi"><span class="k">[[체적유량 V̇||Volume flow V̇]]</span><span class="v" id="pw-v">0.85<small>m³/s</small></span></div>
    <div class="readout good"><span class="k">[[배관 지름 (3 m/s)||Pipe bore (3 m/s)]]</span><span class="v" id="pw-d">60<small>cm</small></span></div>
    <div class="ctl"><label>[[열출력 Q||Thermal power Q]] <span id="pw-qs">400 MWt</span></label>
      <input type="range" id="pw-q" min="50" max="900" step="10" value="400"></div>
    <div class="ctl"><label>[[노심 ΔT||Core ΔT]] <span id="pw-ts">100 K</span></label>
      <input type="range" id="pw-dt" min="20" max="200" step="5" value="100"></div>
  </div>
</div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#pw-g'), rc=4.71e6;
  G.appendChild(mk('text',{x:400,y:24,'text-anchor':'middle',class:'lbl'})).textContent=TX('상압 배관 단면 (축척 — 원 지름 1 px = 1 cm × 2)','low-pressure pipe section (scale - 1 cm = 2 px)');
  const q=el.querySelector('#pw-q'), dt=el.querySelector('#pw-dt');
  function upd(){
    const Q=+q.value*1e6, T=+dt.value, V=Q/(rc*T), A=V/3, d=Math.sqrt(4*A/Math.PI);
    el.querySelector('#pw-v').innerHTML=V.toFixed(2)+'<small>m³/s</small>';
    el.querySelector('#pw-d').innerHTML=Math.round(d*100)+'<small>cm</small>';
    el.querySelector('#pw-c').setAttribute('r',Math.min(150,d*100));
    el.querySelector('#pw-t').textContent=Math.round(d*100)+' cm';
    el.querySelector('#pw-qs').textContent=q.value+' MWt'; el.querySelector('#pw-ts').textContent=dt.value+' K';
  }
  q.oninput=upd; dt.oninput=upd; upd();
}});

S({tag:'WHY AT SEA', ov:'[[왜 해상인가 — 잘 맞는 넷, 더 어려워지는 셋||Why at sea - four things that fit, three that get harder]]',
src:'[[<b>출처</b> 본 교재 14.6절 · 경사 상태의 드레인 탱크 임계 안전은 아직 아무도 제대로 다루지 않은 주제||<b>Source</b> This textbook &#167;14.6 · drain-tank criticality with the ship heeled is a topic no one has properly addressed yet]]',
abbr:'[[<b>슬로싱</b> 용기 속 자유표면이 출렁이는 현상 · <b>건선거 입거</b> 배를 물 밖 도크에 올리는 것 · <b>선원항</b> 사고 시 환경으로 나갈 수 있는 방사성물질의 양과 종류||<b>sloshing</b> a free surface rocking in its tank · <b>dry-docking</b> lifting a ship out of the water · <b>source term</b> the amount and kind of radioactivity that could reach the environment]]',
html:`<h2 class="t">[[왜 해상인가 — <em>잘 맞는 넷</em>, 더 어려워지는 셋||Why at sea - <em>four things that fit</em>, three that get harder]]</h2>
<ul class="b">
  <li>[[<b class="hot">동결 위험은 배에서 더 나쁨</b> — 장기 정박 · 비상 정전 · 건선거 입거 때마다 전 계통을 450 °C 이상으로 유지해야 함||<b class="hot">Freezing is worse on a ship</b> - every long lay-up, blackout or dry-docking means holding the whole plant above 450 °C]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 380" role="img" aria-label="[[MSR이 해상에 잘 맞는 네 가지와 해상에서 더 어려워지는 세 가지||Four ways the MSR suits the sea, and three that get harder]]">
  <g id="ws-g"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#ws-g'), gs=[];
  const A=[[TX('잘 맞는 것','What fits'),'var(--ok)',[TX('상압 — 흔들리는 플랫폼에서 15 MPa 배관을 유지할 필요 없음','low pressure - no 15 MPa piping on a moving deck'),TX('상변화 없음 — 슬로싱과 비등의 결합이 없음(자유표면은 남음)','no phase change - no sloshing-boiling coupling (free surface remains)'),TX('정지 수단이 중력 — 배가 기울어도 중력은 있음','gravity shutdown - still works heeled'),TX('출력밀도가 높아 노심이 작음 — 선박 배치에 유리','high power density, small core - fits a hull')]],
           [TX('더 어려워지는 것','What gets harder'),'var(--hot)',[TX('동결(459 °C) — 정박 · 정전 · 입거마다 450 °C 이상 유지','freezing (459 °C) - above 450 °C at every lay-up, blackout, docking'),TX('정비 — 1차계통 전체가 고방사성, 해상에서 훨씬 큰 제약','maintenance - a hot primary, far harder at sea'),TX('선원항 — 오프가스 · 삼중수소(15장)','source term - off-gas and tritium (ch. 15)'),'']]];
  A.forEach((a,i)=>{
    const g=mk('g',{transform:'translate('+(i*570)+',0)',opacity:0});
    g.appendChild(mk('rect',{width:550,height:372,fill:'var(--panel)',stroke:a[1]}));
    g.appendChild(mk('rect',{width:550,height:4,fill:a[1]}));
    g.appendChild(mk('text',{x:24,y:46,'font-family':'var(--sans)','font-size':22,fill:a[1],'font-weight':600})).textContent=a[0];
    a[2].forEach((t,j)=>{ if(!t) return;
      g.appendChild(mk('text',{x:24,y:104+j*72,'font-family':'var(--mono)','font-size':16,fill:a[1],'font-weight':600})).textContent=String(j+1);
      wrapT(t,26).slice(0,2).forEach((ln,k)=>g.appendChild(mk('text',{x:54,y:104+j*72+k*25,'font-family':'var(--sans)','font-size':17,fill:k?'var(--ink-2)':'var(--ink)','font-weight':300})).textContent=ln); });
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:380,delay:350*i,fill:'forwards'}));
}});
