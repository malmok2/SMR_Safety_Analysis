<script>
/* ================================================================
   표지 · 이 덱의 구성
   교재 「물을 쓰지 않는 SMR — VHTR · SFR · MSR」(Rev1.0, 2026-09) 12~18장.
   섹션 번호는 교재 장 번호를 그대로 쓴다 — 12 ~ 18.
   ================================================================ */
S({bare:true, cls:'cover', ov:'[[표지||Cover]]',
html:`<div class="kick">[[한양대학교 원자력공학과 · THINK Lab · NUE4067 · 비경수로 편 ③||Hanyang University · Dept. of Nuclear Engineering · THINK Lab · NUE4067 · Non-LWR part 3]]</div>
<h1>[[물을 쓰지 않는 SMR<br><span>용융염로(MSR)</span>와 세 노형 종합||SMRs without water<br><span>the molten salt reactor</span>, and all three]]</h1>
<div class="ln"></div>
<div class="meta">
  [[선구핵종 이동 · 동결 마개와 오프가스 · 바다 위의 MSR · 용융염 계통코드 · 세 노형을 같은 자로<br>
  6주차 강의 · 지도교수 <b>송민섭</b> · Rev1.0 · 2026년 9월||Precursor drift · freeze plugs and off-gas · MSRs at sea · a molten-salt system code · all three on one ruler<br>
  Week 6 · Instructor <b>Minseop Song</b> · Rev1.0 · September 2026]]
</div>
<div class="hint">[[<kbd>&#8594;</kbd> 다음 &nbsp; <kbd>&#8592;</kbd> 이전 &nbsp; <kbd>O</kbd> 목차 &nbsp; <kbd>L</kbd> 한/영 &nbsp; <kbd>T</kbd> 배경 &nbsp; <kbd>P</kbd> 인쇄·PDF &nbsp; <kbd>F</kbd> 전체화면||<kbd>&#8594;</kbd> Next &nbsp; <kbd>&#8592;</kbd> Prev &nbsp; <kbd>O</kbd> Index &nbsp; <kbd>L</kbd> KO/EN &nbsp; <kbd>T</kbd> Theme &nbsp; <kbd>P</kbd> Print·PDF &nbsp; <kbd>F</kbd> Fullscreen]]</div>`,
init(el){
  if(RM) return;
  const h1=el.querySelector('h1'), ln=el.querySelector('.ln');
  h1.style.opacity=0; ln.style.width='0px';
  h1.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],
    {duration:700,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  ln.animate([{width:'0px'},{width:'120px'}],{duration:600,delay:500,fill:'forwards'});
}});


S({tag:'ROADMAP', ov:'[[제3 · 4부의 구성 — MSR 다섯 장과 종합 두 장||Parts 3 and 4 - five MSR chapters and two of synthesis]]',
src:'[[<b>출처</b> 본 교재 1.3절 · 섹션 번호는 교재 장 번호와 같음(12~18) · 인허가·건설 현황은 <b>2026년 9월 기준</b> — 14장이 가장 빨리 낡음||<b>Source</b> This textbook &#167;1.3 · section numbers match the chapters (12-18) · licensing and construction status <b>as of September 2026</b> - ch. 14 ages fastest]]',
html:`<h2 class="t">[[제3 · 4부의 구성 — <em>MSR 다섯 장</em>과 종합 두 장||Parts 3 and 4 - <em>five MSR chapters</em> and two of synthesis]]</h2>
<ul class="b">
  <li>[[지금까지의 모든 원자로는 <b>연료가 고체이고 제자리에 있다</b>고 가정했음. MSR은 그 전제를 버림 — 원자력공학 교과서의 거의 모든 식이 이 전제 위에 서 있었음||Every reactor so far assumed <b>the fuel is solid and stays put</b>. The MSR drops that - and almost every textbook equation stood on it]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 420" role="img" aria-label="[[교재 12장부터 18장까지의 주제||Chapters 12 to 18]]">
  <g id="rm-g"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#rm-g'), gs=[];
  const C=[['12',TX('연료가 흐른다','The fuel flows'),TX('고체 연료라는 전제를 버리면 무엇이 달라지나','what changes without solid fuel'),'var(--amber)'],
           ['13',TX('순환연료의 핵특성','Circulating-fuel kinetics'),TX('선구핵종이 노심 밖으로 흘러 나감','delayed-neutron precursors drift out of the core'),'var(--amber)'],
           ['14',TX('지어지는 MSR과 바다','MSRs being built, and the sea'),TX('2026-09 현황 — 가장 빨리 낡는 장','status in Sept 2026 - ages fastest'),'var(--cool)'],
           ['15',TX('MSR 안전','MSR safety'),TX('얼려 놓은 마개와 오프가스','freeze plugs and off-gas'),'var(--hot)'],
           ['16',TX('용융염 계통코드','Molten-salt system code'),TX('물성만 바꿔서는 안 되는 유일한 노형','the only one where properties are not enough'),'var(--cool)'],
           ['17',TX('세 노형을 같은 자로','All three on one ruler'),TX('물성표의 어느 칸이 튀는가','which cell of the property table stands out'),'var(--ok)'],
           ['18',TX('정리와 다음 걸음','Wrap-up and next steps'),TX('다섯 개의 식과 남은 질문','five equations and the open questions'),'var(--ok)']];
  C.forEach((c,i)=>{
    const y=2+i*59, g=mk('g',{transform:'translate(0,'+y+')',opacity:0});
    g.appendChild(mk('rect',{width:1120,height:50,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:4,height:50,fill:c[3]}));
    g.appendChild(mk('text',{x:24,y:34,'font-family':'var(--mono)','font-size':21,fill:c[3],'font-weight':600})).textContent=c[0];
    g.appendChild(mk('text',{x:84,y:33,'font-family':'var(--sans)','font-size':19,fill:c[3],'font-weight':600})).textContent=c[1];
    g.appendChild(mk('text',{x:420,y:33,'font-family':'var(--sans)','font-size':17,fill:'var(--ink)','font-weight':300})).textContent=c[2];
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:320,delay:110*i,fill:'forwards'}));
}});
</script>
