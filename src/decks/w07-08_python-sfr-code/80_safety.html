<script>
/* ================================================================
   SECTION 12 — 안전해석: 사고 네 가지  (교재 12장)
   PYD 열: [t, P, F, T_f, T_c(출구), T_in, ρ_f, ρ_c, ρ_g, ρ_ext]
   ================================================================ */
SECT('12 · [[사고 네 가지||Four accidents]]');

S({bare:true, cls:'div', ov:'[[&#167;12 안전해석 — 사고 네 가지||&#167;12 Safety analysis - four accidents]]',
html:`[[<div class="no">12</div><h2>안전해석 — 사고 네 가지</h2><div class="ln"></div>
<p>검증한 코드로 보호 유량상실(PLOF)과 비보호 사고 셋(ULOF · UTOP · ULOHS)을 계산하고,
<b>판정 기준과 비교한 뒤 준정적 균형식으로 해석</b>함.</p>||<div class="no">12</div><h2>Safety analysis - four accidents</h2><div class="ln"></div>
<p>With the verified code: a protected loss of flow (PLOF) and three unprotected events (ULOF, UTOP, ULOHS) -
<b>compared with acceptance criteria and read through the quasi-static balance</b>.</p>]]`});


/* ---------------------------------------------------------------- 분류와 기준 */
S({tag:'EVENTS · CRITERIA', ov:'[[사고 분류와 판정 기준 — 비등 883 °C, 피복 안쪽 700 °C||Event classes and criteria - boiling 883 °C, inner clad 700 °C]]',
src:'[[<b>출처</b> 본 교재 12.1절 · 판정 기준은 교육용 가정 · 비등점 883 °C 는 대기압 값(실제 노심 압력에서는 조금 높아 보수적) · 공정반응: 저연소도 U-10Zr/HT9 양립성 시험에서 액상 반응이 700–750 °C 사이에서 시작(ANL, OSTI 5737029) — 하한 700 °C 를 씀(앞 덱은 FCCI 공정 650~725 °C 로 소개) · 피복 안쪽 = 노심 출구 + q&#8242;(R&#8242;<sub>막</sub> + R&#8242;<sub>피복</sub>), 평균 봉, 축 방향 첨두 없음||<b>Source</b> This textbook &#167;12.1 · educational criteria · 883 °C is the 1 atm boiling point (slightly higher at core pressure, so conservative) · eutectic: low-burnup U-10Zr/HT9 tests saw liquid-phase attack start between 700 and 750 °C (ANL, OSTI 5737029) - the 700 °C lower bound is used (the previous deck quoted 650-725 °C for FCCI) · inner clad = core outlet + q&#8242;(R&#8242;<sub>film</sub> + R&#8242;<sub>clad</sub>), average pin, no axial peaking]]',
abbr:'[[<b>PLOF</b> 보호 유량상실 — 펌프 정지 + 0.5 s 뒤 제어봉 −5 $ 1 s 삽입 · <b>UTOP</b> 비보호 과출력 — 제어봉 인출 +0.3 $(10 s) · <b>ULOHS</b> 비보호 열제거원 상실 — IHX 10 s 동안 상실 · <b>공정반응</b> 연료–피복 경계에 녹는점 낮은 상이 생김||<b>PLOF</b> protected loss of flow - pump trip, −5 $ rods over 1 s from 0.5 s · <b>UTOP</b> unprotected overpower - +0.3 $ withdrawal over 10 s · <b>ULOHS</b> unprotected loss of heat sink - IHX lost over 10 s · <b>eutectic</b> a low-melting phase at the fuel-clad interface]]',
html:`<h2 class="t">[[사고 분류와 <em>판정 기준</em>||Event classes and <em>acceptance criteria</em>]]</h2>
<ul class="b">
  <li>[[초기사건 셋 × 제어봉 성공·실패. 비보호 사고는 정지 실패를 겹친 <b>설계기준초과 사고</b>임||Three initiators × scram success or failure. Unprotected events add a failed scram - <b>beyond design basis</b>]]</li>
  <li>[[기준 둘: <b>냉각재 비등 없음</b>(노심 출구 &lt; 883 °C), <b>연료–피복 공정반응 없음</b>(피복 안쪽 &lt; 700 °C)||Two criteria: <b>no coolant boiling</b> (core outlet &lt; 883 °C) and <b>no fuel-clad eutectic</b> (inner clad &lt; 700 °C)]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 300" role="img" aria-label="[[유량 상실, 반응도 삽입, 열제거원 상실과 정지 성공·실패에서 PLOF, ULOF, UTOP, ULOHS 로 가는 분류||From loss of flow, reactivity insertion and loss of heat sink, with scram success or failure, to PLOF, ULOF, UTOP and ULOHS]]">
  <g id="ev-g"></g>
</svg>
</div></div>`,
init(el){
  const G=el.querySelector('#ev-g'), mk=svgEl, gs=[];
  const box=(x,y,w,h,t,c,fill)=>{ const g=mk('g',{transform:'translate('+x+','+y+')',opacity:0});
    g.appendChild(mk('rect',{width:w,height:h,fill:fill?c:'var(--panel)',stroke:c,'stroke-width':1.6,opacity:fill?0.9:1}));
    g.appendChild(mk('text',{x:w/2,y:h/2+6,'text-anchor':'middle','font-family':'var(--sans)','font-size':16.5,fill:fill?'var(--on-accent)':'var(--ink)','font-weight':600})).textContent=t;
    G.appendChild(g); gs.push(g); };
  const ar=(x1,y1,x2,y2)=>G.appendChild(mk('path',{d:'M'+x1+','+y1+' L'+x2+','+y2,stroke:'var(--ink-3)','stroke-width':1.6,fill:'none','marker-end':''}));
  box(0,20,230,56,TX('유량 상실 (펌프 정지)','loss of flow (pump trip)'),'var(--amber)');
  box(0,130,230,56,TX('반응도 삽입 (제어봉 인출)','reactivity insertion (rod out)'),'var(--hot)');
  box(0,240,230,56,TX('열제거원 상실 (2차 계통)','loss of heat sink (secondary)'),'var(--cool)');
  box(320,0,170,44,TX('정지 성공','scram works'),'var(--ok)'); box(320,64,170,44,TX('정지 실패','scram fails'),'var(--hot)');
  box(580,0,150,44,'PLOF','var(--ok)',true); box(580,64,150,44,'ULOF','var(--hot)',true);
  box(580,136,150,44,'UTOP','var(--hot)',true); box(580,246,150,44,'ULOHS','var(--hot)',true);
  ar(232,40,318,22); ar(232,56,318,86); ar(492,22,578,22); ar(492,86,578,86); ar(232,158,578,158); ar(232,268,578,268);
  G.appendChild(mk('text',{x:405,y:150,'text-anchor':'middle',class:'lbl'})).textContent=TX('정지 실패','scram fails');
  G.appendChild(mk('text',{x:405,y:260,'text-anchor':'middle',class:'lbl'})).textContent=TX('정지 실패','scram fails');
  const c=mk('g',{transform:'translate(800,40)',opacity:0});
  c.appendChild(mk('rect',{width:320,height:220,fill:'var(--panel)',stroke:'var(--rule)'}));
  c.appendChild(mk('text',{x:20,y:36,class:'lbl b'})).textContent=TX('판정 기준 (교육용)','criteria (educational)');
  c.appendChild(mk('text',{x:20,y:90,'font-family':'var(--mono)','font-size':26,fill:'var(--hot)','font-weight':600})).textContent='883 °C';
  c.appendChild(mk('text',{x:20,y:116,'font-family':'var(--sans)','font-size':15.5,fill:'var(--ink-2)'})).textContent=TX('노심 출구 — 비등 없음','core outlet - no boiling');
  c.appendChild(mk('text',{x:20,y:170,'font-family':'var(--mono)','font-size':26,fill:'var(--hot)','font-weight':600})).textContent='700 °C';
  c.appendChild(mk('text',{x:20,y:196,'font-family':'var(--sans)','font-size':15.5,fill:'var(--ink-2)'})).textContent=TX('피복 안쪽 — 공정반응 없음','inner clad - no eutectic');
  G.appendChild(c); gs.push(c);
  pyFade(gs,90);
}});


/* ---------------------------------------------------------------- PLOF vs ULOF */
S({tag:'PLOF VS ULOF', ov:'[[PLOF 와 ULOF — 제어봉 하나의 차이||PLOF and ULOF - the difference a scram makes]]',
src:'[[<b>계산</b> 본 교재 12.2절 run.py · 크랭크–니콜슨, 간격 0.01–5 s · PLOF: 최고 출구 511.1 °C(1 s), 60 s 출력 3.8 % · ULOF: 45 s 에 출구 635.7 °C, 피복 안쪽 639.9 °C, 600 s 출력 18 %·유량 22.5 kg/s · 1시간 뒤 ULOF 출력 0.2064 대 준정적 0.2066(s12b.py) · 자료 data.py||<b>Calculation</b> This textbook &#167;12.2, run.py · Crank-Nicolson, steps 0.01-5 s · PLOF: peak outlet 511.1 °C (1 s), power 3.8 % at 60 s · ULOF: outlet 635.7 °C and inner clad 639.9 °C at 45 s, power 18 % and flow 22.5 kg/s at 600 s · after an hour ULOF power 0.2064 against quasi-static 0.2066 (s12b.py) · data from data.py]]',
html:`<h2 class="t">[[PLOF 와 ULOF — <em>제어봉 하나의 차이</em>||PLOF and ULOF - <em>the difference a scram makes</em>]]</h2>
<ul class="b">
  <li>[[같은 펌프 정지. PLOF 는 정격 510 °C 를 넘지 않음. ULOF 는 45 s 에 635.7 °C 까지 오른 뒤 <b>스스로 출력을 낮춰</b> 자연순환으로 안정 — 공정반응 기준에 <b>60 K</b> 여유||Same pump trip. PLOF never exceeds the rated 510 °C. ULOF climbs to 635.7 °C at 45 s, then <b>cuts its own power</b> and settles on natural circulation - <b>60 K</b> from the eutectic limit]]</li>
  <li>[[점근값 ΔT<sub>c</sub>A/B = 26.9 K 보다 100 K 높은 첨두는 <b>유량이 출력보다 빨리 주는 첫 45초</b>가 만듦 — 펌프 관성이 크면 줆||The peak sits 100 K above the A/B asymptote of 26.9 K because <b>flow falls faster than power in the first 45 s</b> - more pump inertia lowers it]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 320" role="img" aria-label="[[PLOF 와 ULOF 600초: 열출력(왼쪽)과 노심 출구 온도(오른쪽)||PLOF and ULOF over 600 s: power (left) and core outlet temperature (right)]]">
  <g id="pu-a"></g><g id="pu-b"></g>
</svg>
</div></div>`,
init(el){
  const A=el.querySelector('#pu-a'), B=el.querySelector('#pu-b');
  const a1=pyAxes(A,{x0:60,y0:24,w:440,h:250,xr:[0,600],yr:[0,1],xt:[0,200,400,600],yt:[0,0.25,0.5,0.75,1],xl:TX('시간 (s)','time (s)'),yl:TX('열출력 (정격 대비)','power (fraction)')});
  const a2=pyAxes(B,{x0:640,y0:24,w:440,h:250,xr:[0,600],yr:[350,720],xt:[0,200,400,600],yt:[400,500,600,700],xl:TX('시간 (s)','time (s)'),yl:TX('노심 출구 (°C)','core outlet (°C)')});
  B.appendChild(svgEl('line',{x1:640,x2:1080,y1:a2.fy(700),y2:a2.fy(700),stroke:'var(--hot)','stroke-dasharray':'5 5','stroke-width':1.4}));
  B.appendChild(svgEl('text',{x:1074,y:a2.fy(700)-7,'text-anchor':'end',class:'lbl',fill:'var(--hot)'})).textContent=TX('피복 기준 700 °C','clad limit 700 °C');
  [['plof','var(--ok)','PLOF'],['ulof','var(--hot)','ULOF']].forEach((s,i)=>{
    pyLine(A,a1,pyCol(PYD[s[0]],1),s[1],{w:3,delay:250*i}); pyLine(B,a2,pyCol(PYD[s[0]],4),s[1],{w:3,delay:250*i});
    pyKey(A,380,60+i*24,s[1],s[2]); pyKey(B,960,80+i*24,s[1],s[2]); });
}});


/* ---------------------------------------------------------------- UTOP */
S({tag:'UTOP · REACTIVITY', ov:'[[UTOP — 무엇이 출력을 멈추는가, 반응도 성분별로||UTOP - what stops the power, component by component]]',
src:'[[<b>계산</b> 본 교재 12.3절 · +0.3 $ = 99 pcm 를 10 s 동안 · 1,000 s 에 연료 −76.5, 냉각재 −17.4, 지지판 −5.0 pcm → 합 0 · 출력 최고 1.686(140 s), 이후 입구가 데워져 1.627 · 출구 616.0 °C, 피복 안쪽 최고 635.9 °C, 연료 중심 709.1 °C · 자료 data.py||<b>Calculation</b> This textbook &#167;12.3 · +0.3 $ = 99 pcm over 10 s · at 1,000 s fuel −76.5, coolant −17.4, grid −5.0 pcm → sum 0 · power peaks at 1.686 (140 s), then the inlet warms and it settles at 1.627 · outlet 616.0 °C, inner clad peak 635.9 °C, fuel centre 709.1 °C · data from data.py]]',
html:`<h2 class="t">[[UTOP — <em>무엇이 출력을 멈추는가</em>||UTOP - <em>what stops the power</em>]]</h2>
<ul class="b">
  <li>[[연료가 먼저 데워져 <b>연료 계수가 가장 크게</b> 상쇄함(−76.5 pcm). 냉각재·지지판이 뒤따라 총 반응도가 0 인 새 정상 상태로 감||The fuel heats first and <b>the fuel coefficient cancels most</b> (−76.5 pcm). Coolant and grid follow until total reactivity returns to zero]]</li>
  <li>[[피복은 기준에 64 K 여유지만 출력 1.69배가 계속됨 — UTOP 의 크기는 <b>제어봉 한 개의 반응도가치</b>가 정함||The clad keeps 64 K of margin, but power stays ×1.69 - UTOP is sized by <b>the worth of a single rod</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 370" role="img" aria-label="[[UTOP 1000초: 열출력(왼쪽)과 외부·연료·냉각재·지지판 반응도와 합(오른쪽)||UTOP over 1000 s: power (left) and external, fuel, coolant, grid reactivity and their sum (right)]]">
  <g id="ut-a"></g><g id="ut-b"></g>
</svg>
</div></div>`,
init(el){
  const R=PYD.utop, A=el.querySelector('#ut-a'), B=el.querySelector('#ut-b');
  const a1=pyAxes(A,{x0:60,y0:28,w:420,h:296,xr:[0,1000],yr:[1,1.8],xt:[0,250,500,750,1000],yt:[1,1.2,1.4,1.6,1.8],xl:TX('시간 (s)','time (s)'),yl:TX('열출력 (정격 대비)','power (fraction)')});
  pyLine(A,a1,pyCol(R,1),'var(--hot)',{w:3});
  const a2=pyAxes(B,{x0:620,y0:28,w:460,h:296,xr:[0,1000],yr:[-90,110],xt:[0,250,500,750,1000],yt:[-80,-40,0,40,80],xl:TX('시간 (s)','time (s)'),yl:TX('반응도 (pcm)','reactivity (pcm)')});
  const sum=R.map(r=>[r[0],r[6]+r[7]+r[8]+r[9]]);
  [[9,'var(--amber)',TX('외부','external')],[6,'var(--hot)',TX('연료','fuel')],[7,'var(--cool)',TX('냉각재','coolant')],[8,'var(--ink-3)',TX('지지판','grid')]].forEach((s,i)=>{
    pyLine(B,a2,pyCol(R,s[0]),s[1],{w:2.4,delay:150*i}); pyKey(B,960,88+i*22,s[1],s[2]); });
  pyLine(B,a2,sum,'var(--ink)',{w:2.2,delay:700}); pyKey(B,960,176,'var(--ink)',TX('합','sum'));
}});


/* ---------------------------------------------------------------- ULOHS 72 h */
S({tag:'ULOHS · 72 H', ov:'[[ULOHS 72시간 — 24시간 뒤 재임계, RVACS 만큼만 핵분열||ULOHS over 72 h - recritical after a day, fission matched to RVACS]]',
src:'[[<b>계산</b> 본 교재 12.4절 s12a.py · 크랭크–니콜슨, 최대 간격 60 s · 30분에 핵분열 10⁻⁶ 수준, 4.5 h 에 저온 풀 507.7 °C 최고, 24 h 근처 재임계 후 감쇠 진동(주기 3.5 → 2.6 h, 적분법·간격을 바꿔도 같음) · 72 h: 열출력 195 kW = RVACS 195 kW, 입구 451.8 °C 대 준정적 452.4 °C · 중성자원 S = 10⁻⁴ s⁻¹(없으면 n 이 10⁻²¹⁶ 까지 떨어져 재임계에서 뉴턴 반복이 실패) · 자료 data.py||<b>Calculation</b> This textbook &#167;12.4, s12a.py · Crank-Nicolson, steps up to 60 s · fission at 10⁻⁶ by 30 min, cold pool peaks at 507.7 °C at 4.5 h, recriticality near 24 h then damped oscillation (period 3.5 → 2.6 h, unchanged by method or step) · 72 h: power 195 kW = RVACS 195 kW, inlet 451.8 °C vs quasi-static 452.4 °C · neutron source S = 10⁻⁴ s⁻¹ (without it n falls to 10⁻²¹⁶ and Newton fails at recriticality) · data from data.py]]',
abbr:'[[<b>재임계</b> 미임계였던 원자로가 다시 임계가 되는 것 · <b>중성자원</b> 자발핵분열·광중성자처럼 출력과 무관하게 생기는 중성자||<b>recriticality</b> a subcritical core becoming critical again · <b>neutron source</b> neutrons from spontaneous fission or photoneutrons, independent of power]]',
html:`<h2 class="t">[[ULOHS 72시간 — <em>원자로가 열 제거에 출력을 맞춤</em>||ULOHS over 72 h - <em>the reactor matches its power to heat removal</em>]]</h2>
<ul class="b">
  <li>[[2차 계통을 잃고 제어봉도 실패 → 풀이 데워져 핵분열이 멎음 → 붕괴열이 RVACS 아래로 내려가 풀이 식음 → <b>452 °C 아래에서 재임계</b> → RVACS 195 kW 만큼만 핵분열||Secondary lost and rods failed → the pool heats and fission stops → decay heat drops below RVACS and the pool cools → <b>recritical below 452 °C</b> → fission settles at the 195 kW RVACS removes]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 320" role="img" aria-label="[[ULOHS 72시간: 노심 입구 온도와 준정적 452.4 °C(왼쪽), 열출력(로그, 오른쪽)||ULOHS over 72 h: core inlet temperature with the quasi-static 452.4 °C (left) and power on a log axis (right)]]">
  <g id="uh-a"></g><g id="uh-b"></g>
</svg>
</div></div>`,
init(el){
  const R=PYD.ulohs, A=el.querySelector('#uh-a'), B=el.querySelector('#uh-b');
  const a1=pyAxes(A,{x0:60,y0:24,w:440,h:250,xr:[0,72],yr:[340,520],xt:[0,12,24,36,48,60,72],yt:[350,400,450,500],xl:TX('시간 (h)','time (h)'),yl:TX('노심 입구 (°C)','core inlet (°C)')});
  A.appendChild(svgEl('line',{x1:60,x2:500,y1:a1.fy(452.4),y2:a1.fy(452.4),stroke:'var(--ink-2)','stroke-dasharray':'6 5','stroke-width':1.4}));
  A.appendChild(svgEl('text',{x:494,y:a1.fy(452.4)+18,'text-anchor':'end',class:'lbl b'})).textContent=TX('준정적 452.4 °C','quasi-static 452.4 °C');
  pyLine(A,a1,R.map(r=>[r[0]/3600,r[5]]),'var(--cool)',{w:3});
  const a2=pyAxes(B,{x0:640,y0:24,w:440,h:250,xr:[0,72],yr:[0.003,1],ylog:true,xt:[0,12,24,36,48,60,72],yt:[0.003,0.01,0.03,0.1,0.3,1],
    xl:TX('시간 (h)','time (h)'),yl:TX('열출력 (정격 대비, 로그)','power (fraction, log)')});
  pyLine(B,a2,R.map(r=>[r[0]/3600,r[1]]),'var(--hot)',{w:2.6,delay:300});
  pyLine(B,a2,R.map(r=>[r[0]/3600,461.538*(r[5]-30)/30e6]),'var(--cool)',{w:2,dash:'6 5'});
  pyKey(B,900,60,'var(--hot)',TX('열출력','power')); pyKey(B,900,84,'var(--cool)',TX('RVACS 제열','RVACS removal'),'6 5');
}});
