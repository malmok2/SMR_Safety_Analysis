<script>
/* ================================================================
   SECTION 01~04 — 계통코드와 파이썬 기초  (교재 1~4장)
   ================================================================ */
SECT('01~04 · [[계통코드와 파이썬 기초||System codes and Python basics]]');

S({bare:true, cls:'div', ov:'[[&#167;01~04 계통코드와 파이썬 기초||&#167;01-04 System codes and Python basics]]',
html:`[[<div class="no">01</div><h2>계통코드와 파이썬 기초</h2><div class="ln"></div>
<p>계통코드는 플랜트를 칸으로 나누고 보존식을 시간 적분함. 파이썬 경험은 가정하지 않음 —
<b>변수 · 반복 · 함수 · 배열 · 그래프</b>를 관통 예제의 숫자로 익힘.</p>||<div class="no">01</div><h2>System codes and Python basics</h2><div class="ln"></div>
<p>A system code cuts the plant into cells and integrates conservation laws in time. No Python experience is assumed -
<b>variables, loops, functions, arrays and plots</b> are learned on the running example&#8217;s numbers.</p>]]`});


/* ---------------------------------------------------------------- 여섯 단계 */
S({tag:'WHAT A SYSTEM CODE DOES', ov:'[[계통코드가 플랜트를 사고 결과로 바꾸는 여섯 단계||Six steps from plant to accident result]]',
src:'[[<b>출처</b> 본 교재 1.1절 · 노드 수와 상태 수는 이 교재의 코드 minisfr 의 값||<b>Source</b> This textbook &#167;1.1 · node and state counts are those of this book&#8217;s code minisfr]]',
abbr:'[[<b>노드(제어체적)</b> 온도 하나로 대표하는 칸 · <b>ODE</b> 상미분방정식 · <b>rhs</b> 우변 함수 f(t, y) — 상태를 받아 변화율을 돌려줌||<b>node (control volume)</b> a cell represented by one temperature · <b>ODE</b> ordinary differential equation · <b>rhs</b> right-hand side f(t, y) - state in, rate of change out]]',
html:`<h2 class="t">[[계통코드가 플랜트를 <em>사고 결과</em>로 바꾸는 여섯 단계||Six steps from plant to <em>accident result</em>]]</h2>
<ul class="b">
  <li>[[물리는 ②·③단계에만 들어감. 시간 적분기는 물리를 모름 — <b>f(t, y) 하나만 받음</b>. 이 분리가 이 교재 코드 구조의 뼈대임||Physics enters only at steps 2 and 3. The integrator knows no physics - <b>it only takes f(t, y)</b>. That split is the backbone of this book&#8217;s code]]</li>
</ul>
<div class="body col">
<div class="formula">dy/dt <span class="op">=</span> f(t, y) &nbsp;&nbsp; <small>[[y = 상태 19개||y = 19 states]]</small></div>
<div class="fig">
<svg viewBox="0 0 1120 380" role="img" aria-label="[[실제 플랜트, 칸 나누기, 보존식, 상미분방정식, 시간 적분, 사고 결과의 여섯 단계||Six steps: plant, cells, conservation laws, ODE system, time integration, accident result]]">
  <g id="sx-g"></g>
</svg>
</div></div>`,
init(el){
  const mk=svgEl, G=el.querySelector('#sx-g'), gs=[];
  const T=[[TX('실제 플랜트','Plant'),TX('풀형 SFR 1차 계통','pool SFR primary'),'var(--ink-3)'],
           [TX('칸 나누기','Cells'),TX('연료·냉각재·풀 2','fuel, coolant, 2 pools'),'var(--cool)'],
           [TX('보존식','Conservation'),TX('에너지·운동량·점동특성','energy, momentum, kinetics'),'var(--cool)'],
           [TX('상미분방정식','ODE system'),TX('상태 19개','19 states'),'var(--amber)'],
           [TX('시간 적분','Integrate'),TX('θ법 + 뉴턴 반복','θ-method + Newton'),'var(--ok)'],
           [TX('사고 결과','Result'),TX('출력·온도·유량·여유','power, T, flow, margin'),'var(--hot)']];
  T.forEach((t,i)=>{
    const x=i*188, g=mk('g',{transform:'translate('+x+',20)',opacity:0});
    g.appendChild(mk('rect',{width:172,height:340,fill:'var(--panel)',stroke:t[2],'stroke-width':1.6}));
    g.appendChild(mk('text',{x:16,y:66,'font-family':'var(--mono)','font-size':38,fill:t[2],'font-weight':600})).textContent=String(i+1);
    g.appendChild(mk('text',{x:16,y:160,'font-family':'var(--sans)','font-size':19,fill:'var(--ink)','font-weight':600})).textContent=t[0];
    wrapT(t[1],9).slice(0,3).forEach((ln,k)=>g.appendChild(mk('text',{x:16,y:210+k*26,'font-family':'var(--sans)','font-size':15.5,fill:'var(--ink-2)','font-weight':300})).textContent=ln);
    if(i<5) g.appendChild(mk('path',{d:'M174,170 H184 M178,164 L184,170 L178,176',stroke:'var(--ink-3)','stroke-width':1.6,fill:'none'}));
    G.appendChild(g); gs.push(g);
  });
  pyFade(gs,170);
}});


/* ---------------------------------------------------------------- 변수와 유량 */
S({tag:'VARIABLES · CORE FLOW', ov:'[[변수와 첫 계산 — 노심 유량||Variables and a first calculation - core flow]]',
src:'[[<b>계산</b> 본 교재 2.2절 목록 2.3(s02b.py) · ṁ = Q / (c<sub>p</sub> ΔT) · c<sub>p</sub> = 1270 J/(kg·K) 가정 · 10장의 정격 유량 151.72 kg/s 는 432.5 °C 의 Fink 비열 1275.7 을 씀||<b>Calculation</b> This textbook &#167;2.2, listing 2.3 (s02b.py) · ṁ = Q / (c<sub>p</sub> ΔT) · c<sub>p</sub> = 1270 J/(kg·K) assumed · the chapter 10 rated flow, 151.72 kg/s, uses the Fink value 1275.7 at 432.5 °C]]',
abbr:'[[<b>f-문자열</b> 따옴표 앞에 f 를 붙여 중괄호 안의 변수를 값으로 바꾸는 문자열 · <b>:.1f</b> 소수점 한 자리 형식 지정자||<b>f-string</b> a string prefixed with f whose braces are replaced by values · <b>:.1f</b> format specifier, one decimal place]]',
html:`<h2 class="t">[[변수와 첫 계산 — <em>노심 유량</em>||Variables and a first calculation - <em>core flow</em>]]</h2>
<ul class="b">
  <li>[[<code>=</code> 는 등호가 아님 — <b>오른쪽을 계산해 그 값에 왼쪽 이름을 붙임</b>. 그래서 <code>T = T + 1</code> 이 옳은 문장임||<code>=</code> is not equality - <b>evaluate the right side, then attach the left name</b>. So <code>T = T + 1</code> is valid]]</li>
  <li>[[식을 기호 그대로 코드로 옮기고, 주석에 단위를 적음. 손계산 30×10⁶ ÷ (1270 × 155) = 152.40 kg/s 와 대조함||Copy the formula symbol for symbol and put units in comments. Check by hand: 30×10⁶ ÷ (1270 × 155) = 152.40 kg/s]]</li>
</ul>
<div class="body">
<div class="fig">
<div class="pyk">s02b.py</div>
<pre class="pyc">q = <span class="n">30.0e6</span>
cp = <span class="n">1270.0</span>
dt = <span class="n">510.0</span> - <span class="n">355.0</span>
mdot = q / (cp * dt)
<span class="new">rho = 850.0</span>
<span class="new">vdot = mdot / rho</span>
<span class="new"><span class="k">print</span>(f"mdot {mdot:.1f} kg/s")</span>
<span class="new"><span class="k">print</span>(f"vdot {vdot:.3f} m3/s")</span></pre>
<div class="pyo">mdot 152.4 kg/s
vdot 0.179 m3/s</div>
<p class="sub" style="font-size:15px">[[초록 줄이 s02a.py 에 더한 줄임 — 한 단계에 몇 줄씩 더함||Green lines are those added to s02a.py - each step adds a few lines]]</p>
</div>
<div class="side">
  <div class="readout hi"><span class="k">[[질량유량 ṁ||Mass flow ṁ]]</span><span class="v" id="vf-m">152.4<small>kg/s</small></span></div>
  <div class="readout"><span class="k">[[체적유량||Volume flow]]</span><span class="v" id="vf-v">0.179<small>m³/s</small></span></div>
  <div class="ctl"><label>[[열출력 Q||Power Q]] <span id="vf-qs">30 MW</span></label>
    <input type="range" id="vf-q" min="5" max="60" step="1" value="30"></div>
  <div class="ctl"><label>[[노심 온도 상승 ΔT||Core ΔT]] <span id="vf-ts">155 K</span></label>
    <input type="range" id="vf-t" min="60" max="250" step="5" value="155"></div>
</div>
</div>`,
init(el){
  const q=el.querySelector('#vf-q'), t=el.querySelector('#vf-t');
  function upd(){
    const m=(+q.value)*1e6/(1270*(+t.value));
    el.querySelector('#vf-m').innerHTML=fmt(m,1)+'<small>kg/s</small>';
    el.querySelector('#vf-v').innerHTML=fmt(m/850,3)+'<small>m³/s</small>';
    el.querySelector('#vf-qs').textContent=q.value+' MW';
    el.querySelector('#vf-ts').textContent=t.value+' K';
  }
  q.oninput=upd; t.oninput=upd; upd();
}});


/* ---------------------------------------------------------------- 함수와 조건 */
S({tag:'LISTS · LOOPS · FUNCTIONS', ov:'[[리스트·반복·함수 — 나트륨 밀도와 상태 판정||Lists, loops, functions - sodium density and phase]]',
src:'[[<b>계산</b> 본 교재 3.2절 목록 3.3(s03b.py) · 선형식 ρ = 1014 − 0.235 T (T 는 켈빈) · 녹는점 97.8 °C · 대기압 비등점 883 °C||<b>Calculation</b> This textbook &#167;3.2, listing 3.3 (s03b.py) · linear fit ρ = 1014 − 0.235 T (T in kelvin) · melting point 97.8 °C · boiling point at 1 atm 883 °C]]',
html:`<h2 class="t">[[리스트·반복·함수 — <em>나트륨 밀도</em>와 상태 판정||Lists, loops, functions - <em>sodium density</em> and phase]]</h2>
<ul class="b">
  <li>[[식은 <b>함수로 한 번만</b> 정의하고 이름으로 부름 — 고칠 때 한 곳만 고침. 들여쓰기가 반복과 함수의 범위임||Define a formula <b>once as a function</b> and call it by name - fix it in one place. Indentation marks the body]]</li>
  <li>[[50 °C 와 900 °C 에서도 값이 나옴 — 함수는 범위 밖 입력을 <b class="hot">스스로 거부하지 않음</b>. 계통코드는 계산 전에 범위를 판정함||It still returns numbers at 50 and 900 °C - a function <b class="hot">does not refuse out-of-range input</b> by itself. A system code checks ranges first]]</li>
</ul>
<div class="body">
<div class="fig">
<div class="pyk">s03b.py</div>
<pre class="pyc"><span class="k">def</span> rho_na(t_c):
    <span class="k">return</span> <span class="n">1014.0</span> - <span class="n">0.235</span> * (t_c + <span class="n">273.15</span>)

<span class="k">def</span> phase(t_c):
    <span class="k">if</span> t_c &lt; <span class="n">97.8</span>:
        <span class="k">return</span> "solid"
    <span class="k">elif</span> t_c &gt;= <span class="n">883.0</span>:
        <span class="k">return</span> "gas"
    <span class="k">return</span> "liquid"

<span class="k">for</span> t <span class="k">in</span> [<span class="n">50.0</span>, <span class="n">355.0</span>, <span class="n">510.0</span>, <span class="n">900.0</span>]:
    <span class="k">print</span>(t, rho_na(t), phase(t))</pre>
</div>
<div class="side">
<table class="d">
  <tr><th>T °C</th><th>ρ kg/m³</th><th>[[상태||phase]]</th></tr>
  <tr><td class="n">50</td><td class="n">938.1</td><td class="hot">[[고체||solid]]</td></tr>
  <tr><td class="n">355</td><td class="n">866.4</td><td>[[액체||liquid]]</td></tr>
  <tr><td class="n">510</td><td class="n">830.0</td><td>[[액체||liquid]]</td></tr>
  <tr><td class="n">900</td><td class="n">738.3</td><td class="hot">[[기체||gas]]</td></tr>
</table>
<p class="sub" style="font-size:15px">[[교재 코드는 상태 이름을 한글로 출력함. 표의 값은 outputs/s03b.txt 와 같음||The book prints phase names in Korean. Values match outputs/s03b.txt]]</p>
</div>
</div>`});


/* ---------------------------------------------------------------- 붕괴열 */
S({tag:'NUMPY · DECAY HEAT', ov:'[[NumPy 배열과 붕괴열 — 지수 7군으로 바꾸기||NumPy arrays and decay heat - recast as seven exponentials]]',
src:'[[<b>계산</b> 본 교재 4.1·4.3절 · Way–Wigner P/P<sub>0</sub> = 0.0622(t<sup>−0.2</sup> − (t + 10⁸)<sup>−0.2</sup>) · 7군 λ = 1, 0.1, …, 10⁻⁶ s⁻¹, 분율 E 는 1 s ~ 3×10⁵ s 에서 상대오차 최소제곱(minisfr/decay.py) · 분율 합 0.0826, 최대 상대오차 4.0 %||<b>Calculation</b> This textbook &#167;4.1, 4.3 · Way-Wigner P/P<sub>0</sub> = 0.0622(t<sup>−0.2</sup> − (t + 10⁸)<sup>−0.2</sup>) · seven groups λ = 1, 0.1, …, 10⁻⁶ s⁻¹, fractions E fitted by relative least squares from 1 s to 3×10⁵ s (minisfr/decay.py) · sum 0.0826, max relative error 4.0 %]]',
abbr:'[[<b>벡터화</b> 반복문 없이 배열 전체에 식을 한 번에 적용하는 것 · <b>최소제곱</b> 오차 제곱합이 가장 작은 계수를 고르는 방법 · <b>모듈</b> 다른 스크립트가 가져다 쓰는 .py 파일||<b>vectorisation</b> applying a formula to a whole array without a loop · <b>least squares</b> choosing coefficients that minimise the summed squared error · <b>module</b> a .py file other scripts import]]',
html:`<h2 class="t">[[NumPy 배열과 <em>붕괴열</em> — 지수 7군으로 바꾸기||NumPy arrays and <em>decay heat</em> - recast as seven exponentials]]</h2>
<ul class="b">
  <li>[[배열에 식을 쓰면 반복문 없이 <b>모든 점이 한 줄에</b> 계산됨. 정지 1시간 뒤 붕괴열은 <b>315.9 kW</b>(정격의 1.05 %), 하루 뒤에도 145.3 kW||Write a formula on an array and <b>every point is computed in one line</b>. One hour after shutdown the decay heat is <b>315.9 kW</b> (1.05 %), still 145.3 kW after a day]]</li>
  <li>[[계통코드는 미분방정식만 풂 → 곡선을 지수 함수 7개의 합으로 바꾸면 <b>상태 7개</b>가 됨: dH<sub>j</sub>/dt = λ<sub>j</sub>(E<sub>j</sub>n − H<sub>j</sub>)||A system code only solves ODEs → recast the curve as seven exponentials and it becomes <b>seven states</b>: dH<sub>j</sub>/dt = λ<sub>j</sub>(E<sub>j</sub>n − H<sub>j</sub>)]]</li>
</ul>
<div class="body">
<div class="fig">
<svg viewBox="0 0 800 330" role="img" aria-label="[[정지 후 시간에 따른 붕괴열 비율: Way–Wigner 식과 지수 7군 근사의 비교(로그-로그)||Decay heat fraction against time after shutdown: Way-Wigner and the seven-group fit (log-log)]]">
  <g id="dh-g"></g>
</svg>
</div>
<div class="side">
  <div class="readout"><span class="k">[[정지 후||After shutdown]] <span id="dh-ts">1 h</span></span><span class="v" id="dh-v">315.9<small>kW</small></span></div>
  <div class="readout hi"><span class="k">[[7군 근사 오차||7-group error]]</span><span class="v" id="dh-e">−1.3<small>%</small></span></div>
  <div class="ctl"><label>[[시간 (로그)||Time (log)]] <span id="dh-tl">3600 s</span></label>
    <input type="range" id="dh-t" min="0" max="5.477" step="0.0001" value="3.5563"></div>
</div>
</div>`,
init(el){
  const G=el.querySelector('#dh-g'), E=[0.030737,0.019774,0.012472,0.0077,0.005197,0.002443,0.004282];
  const grp=t=>E.reduce((s,e,j)=>s+e*Math.exp(-Math.pow(10,-j)*t),0);
  const ax=pyAxes(G,{x0:70,y0:24,w:700,h:250,xr:[1,3e5],yr:[0.001,0.1],xlog:true,ylog:true,
    xt:[1,10,100,1e3,1e4,1e5],yt:[0.001,0.01,0.1],xf:v=>v>=1e3?'1e'+Math.round(Math.log10(v)):v,yf:v=>(v*100)+' %',
    xl:TX('정지 후 시간 (s)','time after shutdown (s)'),yl:TX('붕괴열 / 정격','decay heat / rated')});
  const ts=[]; for(let k=0;k<=110;k++) ts.push(Math.pow(10,k*5.477/110));
  pyLine(G,ax,ts.map(t=>[t,decay(t)]),'var(--hot)',{w:3});
  pyLine(G,ax,ts.map(t=>[t,grp(t)]),'var(--cool)',{dash:'7 5',w:2.2});
  pyKey(G,470,60,'var(--hot)','Way–Wigner');
  pyKey(G,470,84,'var(--cool)',TX('지수 7군 근사','seven-group fit'),'7 5');
  const mk=svgEl, dot=mk('circle',{r:6,fill:'var(--amber)'}); G.appendChild(dot);
  const s=el.querySelector('#dh-t');
  function upd(){
    const t=Math.pow(10,+s.value), w=decay(t), g=grp(t);
    dot.setAttribute('cx',ax.fx(t)); dot.setAttribute('cy',ax.fy(w));
    el.querySelector('#dh-v').innerHTML=fmt(30e3*w,1)+'<small>kW</small>';
    el.querySelector('#dh-e').innerHTML=(g/w-1>=0?'+':'−')+fmt(Math.abs(100*(g/w-1)),1)+'<small>%</small>';
    el.querySelector('#dh-tl').textContent=t<1e4?fmt(t)+' s':fmt(t/3600,1)+' h';
    el.querySelector('#dh-ts').textContent=t<3600?fmt(t)+' s':fmt(t/3600,1)+' h';
  }
  s.oninput=upd; upd();
}});
</script>
