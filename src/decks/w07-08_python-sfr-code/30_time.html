<script>
/* ================================================================
   SECTION 05 — 시간 적분의 첫걸음  (교재 5장)
   풀 한 덩어리: C dT/dt = Q − UA(T − T_air)
   C = 47.2 MJ/K, UA = 461.5 W/K, T_air = 30 °C, T0 = 355 °C
   ================================================================ */
SECT('05 · [[시간 적분의 첫걸음||First steps in time integration]]');

S({bare:true, cls:'div', ov:'[[&#167;05 시간 적분의 첫걸음||&#167;05 First steps in time integration]]',
html:`[[<div class="no">05</div><h2>시간 적분의 첫걸음</h2><div class="ln"></div>
<p>풀 전체를 온도 하나로 보고, 시간을 Δt 로 잘라 한 걸음씩 나아감. 해석해가 있는 문제부터 풀어
<b>오차의 크기와 차수</b>를 잼 — 11장 검증의 기본 도구임.</p>||<div class="no">05</div><h2>First steps in time integration</h2><div class="ln"></div>
<p>Treat the whole pool as one temperature and march in steps of Δt. Start with a problem that has an exact solution
and measure <b>the size and order of the error</b> - the basic tool of chapter 11.</p>]]`});


/* ---------------------------------------------------------------- 전진 오일러 */
S({tag:'FORWARD EULER', ov:'[[집중 열용량 모델과 전진 오일러 — 간격이 오차를 정함||Lumped model and forward Euler - the step sets the error]]',
src:'[[<b>계산</b> 본 교재 5.1–5.2절 · C = 47.2 MJ/K(고온·저온 풀 나트륨 43 m³), Q = 0.30 MW 일정, UA = 461.5 W/K, T<sub>air</sub> = 30 °C · 해석해 T = T<sub>eq</sub> + (T<sub>0</sub> − T<sub>eq</sub>)e<sup>−t/τ</sup>, T<sub>eq</sub> = 680.1 °C, τ = C/UA = 28.4 h · 그림은 브라우저가 같은 식을 직접 계산함||<b>Calculation</b> This textbook &#167;5.1-5.2 · C = 47.2 MJ/K (43 m³ of sodium in both pools), Q = 0.30 MW constant, UA = 461.5 W/K, T<sub>air</sub> = 30 °C · exact T = T<sub>eq</sub> + (T<sub>0</sub> − T<sub>eq</sub>)e<sup>−t/τ</sup>, T<sub>eq</sub> = 680.1 °C, τ = C/UA = 28.4 h · the browser computes the same formulas live]]',
abbr:'[[<b>집중 열용량</b> 덩어리 전체를 온도 하나로 보는 근사 · <b>전진 오일러</b> 지금의 기울기로 Δt 만큼 직선으로 가는 방법 · <b>τ</b> 시간상수||<b>lumped capacitance</b> treating a body as one temperature · <b>forward Euler</b> step Δt along today&#8217;s slope · <b>τ</b> time constant]]',
html:`<h2 class="t">[[집중 열용량 모델과 <em>전진 오일러</em>||Lumped model and <em>forward Euler</em>]]</h2>
<ul class="b">
  <li>[[C dT/dt = Q − UA(T − T<sub>air</sub>) · T<sup>n+1</sup> = T<sup>n</sup> + Δt f(T<sup>n</sup>) — 지금의 기울기로 직선을 그어 나아감. 곡선이 아래로 휘므로 직선은 늘 곡선 위로 나감||C dT/dt = Q − UA(T − T<sub>air</sub>) · T<sup>n+1</sup> = T<sup>n</sup> + Δt f(T<sup>n</sup>) - follow today&#8217;s slope. The curve bends down, so the line always overshoots]]</li>
</ul>
<div class="body">
<div class="fig">
<svg viewBox="0 0 800 360" role="img" aria-label="[[72시간 풀 온도: 해석해 곡선과 전진 오일러의 계단 점||72-hour pool temperature: exact curve and forward-Euler points]]">
  <g id="fe-g"></g><g id="fe-d"></g>
</svg>
</div>
<div class="side">
  <div class="readout warn"><span class="k">[[72 h 오차||Error at 72 h]]</span><span class="v" id="fe-e">+1.15<small>K</small></span></div>
  <div class="readout"><span class="k">[[걸음 수||Steps]]</span><span class="v" id="fe-n">72</span></div>
  <div class="ctl"><label>[[시간 간격 Δt||Time step Δt]] <span id="fe-ds">1 h</span></label>
    <input type="range" id="fe-dt" min="0" max="5" step="1" value="2"></div>
  <p class="sub" style="font-size:15px">[[Δt 를 반으로 → 오차도 반 — 1차 정확도||Halve Δt → halve the error - first order]]</p>
</div>
</div>`,
init(el){
  const C=47.2e6,Q=0.30e6,UA=461.5,Ta=30,T0=355, Te=Ta+Q/UA, tau=C/UA, tend=72*3600;
  const ex=t=>Te+(T0-Te)*Math.exp(-t/tau);
  const G=el.querySelector('#fe-g'), D=el.querySelector('#fe-d');
  const ax=pyAxes(G,{x0:70,y0:24,w:700,h:280,xr:[0,72],yr:[340,680],xt:[0,12,24,36,48,60,72],yt:[350,400,450,500,550,600,650],
    xl:TX('시간 (h)','time (h)'),yl:TX('풀 온도 (°C)','pool temperature (°C)')});
  const pts=[]; for(let k=0;k<=144;k++){ const t=k*tend/144; pts.push([t/3600,ex(t)]); }
  pyLine(G,ax,pts,'var(--cool)',{w:3});
  pyKey(G,520,280,'var(--cool)',TX('해석해','exact'));
  const DT=[14400,7200,3600,1800,900,450], s=el.querySelector('#fe-dt');
  function upd(){
    const dt=DT[+s.value]; D.innerHTML=''; let T=T0, t=0; const P=[[0,T]];
    while(t<tend-1){ T+=dt*(Q-UA*(T-Ta))/C; t+=dt; P.push([t/3600,T]); }
    D.appendChild(svgEl('path',{d:'M'+P.map(p=>ax.fx(p[0]).toFixed(1)+','+ax.fy(p[1]).toFixed(1)).join(' L'),fill:'none',stroke:'var(--hot)','stroke-width':1.6}));
    if(P.length<=80) P.forEach(p=>D.appendChild(svgEl('circle',{cx:ax.fx(p[0]),cy:ax.fy(p[1]),r:3.6,fill:'var(--hot)'})));
    const e=T-ex(tend);
    el.querySelector('#fe-e').innerHTML='+'+fmt(e,e<1?3:2)+'<small>K</small>';
    el.querySelector('#fe-n').textContent=fmt(P.length-1);
    el.querySelector('#fe-ds').textContent=dt>=3600?(dt/3600)+' h':(dt/60)+' min';
  }
  s.oninput=upd; upd();
}});


/* ---------------------------------------------------------------- 차수 */
S({tag:'ORDER OF ACCURACY', ov:'[[정확도 차수 — 전진·후진 오일러와 크랭크–니콜슨||Order of accuracy - forward and backward Euler, Crank-Nicolson]]',
src:'[[<b>계산</b> 본 교재 5.3절 · 11장 B1 · 같은 문제(72 h)를 세 방법으로 풂 · 후진 오일러 T<sup>n+1</sup> = (T<sup>n</sup> + Δt(Q + UA T<sub>air</sub>)/C)/(1 + Δt UA/C) · 크랭크–니콜슨은 두 기울기의 평균 · 교재 실행 기록: BE 차수 1.00, CN 2.00||<b>Calculation</b> This textbook &#167;5.3 and B1 in ch. 11 · the same 72 h problem by three methods · backward Euler T<sup>n+1</sup> = (T<sup>n</sup> + Δt(Q + UA T<sub>air</sub>)/C)/(1 + Δt UA/C) · Crank-Nicolson averages the two slopes · book record: BE order 1.00, CN 2.00]]',
abbr:'[[<b>정확도 차수</b> e ≈ KΔt<sup>p</sup> 의 p — 간격을 반으로 하면 오차가 1/2<sup>p</sup> · <b>음해법</b> 다음 시각의 값으로 우변을 쓰는 방법 · <b>BE</b> 후진 오일러 · <b>CN</b> 크랭크–니콜슨||<b>order of accuracy</b> p in e ≈ KΔt<sup>p</sup> - halving Δt divides the error by 2<sup>p</sup> · <b>implicit method</b> evaluates the right side at the new time · <b>BE</b> backward Euler · <b>CN</b> Crank-Nicolson]]',
html:`<h2 class="t">[[정확도 차수 — <em>기울기가 곧 차수</em>||Order of accuracy - <em>the slope is the order</em>]]</h2>
<ul class="b">
  <li>[[로그–로그 눈금에서 오차가 기울기 1(전진·후진 오일러), 기울기 2(크랭크–니콜슨)로 줄어야 함 — <b>기울기가 다르면 코드가 틀린 것</b>||On log-log axes the error must fall with slope 1 (forward and backward Euler) or slope 2 (Crank-Nicolson) - <b>a different slope means a bug</b>]]</li>
  <li>[[간격 1 h 에서 CN 오차 0.0068 K 는 BE(1.15 K)의 1/170 — 같은 비용에 훨씬 정확함||At Δt = 1 h, CN&#8217;s 0.0068 K is 1/170 of BE&#8217;s 1.15 K - far more accurate at the same cost]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 340" role="img" aria-label="[[시간 간격과 72시간 뒤 오차: 전진 오일러, 후진 오일러, 크랭크–니콜슨(로그-로그)||Error after 72 hours against time step for forward Euler, backward Euler and Crank-Nicolson (log-log)]]">
  <g id="or-g"></g>
</svg>
</div></div>`,
init(el){
  const C=47.2e6,Q=0.30e6,UA=461.5,Ta=30,T0=355, Te=Ta+Q/UA, tau=C/UA, tend=72*3600, ex=Te+(T0-Te)*Math.exp(-tend/tau);
  const G=el.querySelector('#or-g'), DT=[14400,7200,3600,1800,900,450];
  const run=(th,dt)=>{ let T=T0; const a=UA/C; for(let k=0;k<Math.round(tend/dt);k++){
      T=(T+dt*((Q+UA*Ta)/C-(1-th)*a*T))/(1+dt*th*a); } return Math.abs(T-ex); };
  const ax=pyAxes(G,{x0:90,y0:28,w:640,h:262,xr:[400,16000],yr:[1e-4,10],xlog:true,ylog:true,
    xt:[450,900,1800,3600,7200,14400],yt:[1e-4,1e-3,1e-2,0.1,1,10],yf:v=>v>=1?v:'1e'+Math.round(Math.log10(v)),
    xl:TX('시간 간격 Δt (s)','time step Δt (s)'),yl:TX('72 h 뒤 오차 (K)','error at 72 h (K)')});
  [[0,'var(--hot)',TX('전진 오일러','forward Euler')],[1,'var(--amber)',TX('후진 오일러','backward Euler')],[0.5,'var(--cool)',TX('크랭크–니콜슨','Crank-Nicolson')]].forEach((m,i)=>{
    const P=DT.map(dt=>[dt,run(m[0],dt)]);
    pyLine(G,ax,P,m[1],{w:2.6,delay:300*i});
    P.forEach(p=>G.appendChild(svgEl('circle',{cx:ax.fx(p[0]),cy:ax.fy(p[1]),r:4.5,fill:m[1]})));
    pyKey(G,780,60+i*30,m[1],m[2]);
  });
  G.appendChild(svgEl('text',{x:780,y:170,'font-family':'var(--sans)','font-size':15,fill:'var(--ink-2)'})).textContent=TX('전진·후진 오일러: 기울기 1 (겹침)','forward, backward Euler: slope 1 (overlap)');
  G.appendChild(svgEl('text',{x:780,y:196,'font-family':'var(--sans)','font-size':15,fill:'var(--ink-2)'})).textContent=TX('크랭크–니콜슨: 기울기 2','Crank-Nicolson: slope 2');
}});


/* ---------------------------------------------------------------- 붕괴열 72시간 */
S({tag:'DECAY HEAT · 72 H', ov:'[[붕괴열과 RVACS만으로 72시간 — 최고 온도는 두 선이 만날 때||72 hours on decay heat and RVACS - the peak comes where the lines cross]]',
src:'[[<b>계산</b> 본 교재 5.4절 목록 5.5(s05c.py) · 후진 오일러, Δt = 60 s, t = 1 s 에서 시작(Way–Wigner 는 t = 0 에서 발산) · 펌프·IHX 모두 정지한 극한 가정, 구조물 열용량 없음 · 교재 값: UA 461.5 W/K 에서 최고 408.9 °C(11.7 h), 230.75 W/K 에서 547.7 °C(49.4 h)||<b>Calculation</b> This textbook &#167;5.4, listing 5.5 (s05c.py) · backward Euler, Δt = 60 s, starting at t = 1 s (Way-Wigner diverges at t = 0) · bounding case with pumps and IHX lost, no structural heat capacity · book values: peak 408.9 °C (11.7 h) at UA 461.5 W/K, 547.7 °C (49.4 h) at 230.75 W/K]]',
html:`<h2 class="t">[[붕괴열과 RVACS만으로 <em>72시간</em>||<em>72 hours</em> on decay heat and RVACS]]</h2>
<ul class="b">
  <li>[[붕괴열이 RVACS 제열보다 크면 풀에 쌓여 온도가 오름. <b>두 선이 만나는 시각이 최고 온도</b>임 — 그 뒤로는 식음||While decay heat exceeds RVACS removal the pool heats up. <b>The crossing time is the peak</b> - after that the pool cools]]</li>
  <li>[[RVACS 를 반으로 줄이면 최고 온도가 <b>오르고 늦게</b> 옴 — 피동 안전의 72시간 논증이 이 계산의 꼴임||Halve RVACS and the peak comes <b>higher and later</b> - the 72-hour passive-safety argument has exactly this form]]</li>
</ul>
<div class="body">
<div class="fig">
<svg viewBox="0 0 800 380" role="img" aria-label="[[RVACS 열컨덕턴스에 따른 정지 후 72시간 풀 온도와 최고점||Pool temperature over 72 hours after shutdown and its peak, for a chosen RVACS conductance]]">
  <g id="dk-g"></g><g id="dk-d"></g>
</svg>
</div>
<div class="side">
  <div class="readout warn"><span class="k">[[최고 풀 온도||Peak pool T]]</span><span class="v" id="dk-p">408.9<small>°C</small></span></div>
  <div class="readout"><span class="k">[[최고 시각||Time of peak]]</span><span class="v" id="dk-t">11.7<small>h</small></span></div>
  <div class="ctl"><label>[[RVACS 열컨덕턴스||RVACS conductance]] <span id="dk-us">461.5 W/K</span></label>
    <input type="range" id="dk-u" min="150" max="900" step="0.25" value="461.5"></div>
</div>
</div>`,
init(el){
  const C=47.2e6, Ta=30, G=el.querySelector('#dk-g'), D=el.querySelector('#dk-d');
  const ax=pyAxes(G,{x0:70,y0:28,w:700,h:304,xr:[0,72],yr:[250,650],xt:[0,12,24,36,48,60,72],yt:[300,400,500,600],
    xl:TX('정지 후 시간 (h)','time after shutdown (h)'),yl:TX('풀 온도 (°C)','pool temperature (°C)')});
  const s=el.querySelector('#dk-u');
  function upd(){
    const UA=+s.value, dt=60; let T=355, t=1, best=[0,0]; const P=[];
    while(t<72*3600){ const q=30e6*decay(t+dt); T=(T+dt*(q+UA*Ta)/C)/(1+dt*UA/C); t+=dt; if(T>best[1]) best=[t,T]; if((Math.round(t)%1800)<60) P.push([t/3600,T]); }
    D.innerHTML='';
    D.appendChild(svgEl('path',{d:'M'+P.map(p=>ax.fx(p[0]).toFixed(1)+','+ax.fy(p[1]).toFixed(1)).join(' L'),fill:'none',stroke:'var(--hot)','stroke-width':3}));
    D.appendChild(svgEl('circle',{cx:ax.fx(best[0]/3600),cy:ax.fy(best[1]),r:6,fill:'var(--amber)'}));
    el.querySelector('#dk-p').innerHTML=fmt(best[1],1)+'<small>°C</small>';
    el.querySelector('#dk-t').innerHTML=fmt(best[0]/3600,1)+'<small>h</small>';
    el.querySelector('#dk-us').textContent=fmt(UA,1)+' W/K';
  }
  s.oninput=upd; upd();
}});
</script>
