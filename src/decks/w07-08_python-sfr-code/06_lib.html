<script>
/* ================================================================
   이 덱 전용 도우미 — 코드 상자 · 축 · 선 그래프
   색은 모두 토큰(var(--…))만 쓴다. CSS 는 한 번만 head 에 넣는다.
   ================================================================ */
document.head.insertAdjacentHTML('beforeend',`<style>
.pyc{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--cool);
  padding:10px 14px;margin:0;font-family:var(--mono);font-size:14.5px;line-height:1.5;
  color:var(--ink);white-space:pre;overflow:hidden}
.pyc .c{color:var(--ink-3)} .pyc .k{color:var(--cool)} .pyc .n{color:var(--amber)} .pyc .new{color:var(--ok)}
.pyo{background:var(--ground);border:1px dashed var(--rule);padding:8px 14px;margin:8px 0 0;
  font-family:var(--mono);font-size:13.5px;line-height:1.45;color:var(--ink-2);white-space:pre;overflow:hidden}
.pyk{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
</style>`);

/* 축: G 에 격자·눈금을 그리고 좌표 변환 함수를 돌려준다.
   o = {x0,y0,w,h, xr:[a,b], yr:[a,b], xlog, ylog, xt:[…], yt:[…], xl, yl, xf, yf} */
function pyAxes(G, o){
  const mk=svgEl, L=Math.log10;
  const fx=v=>o.x0+(o.xlog? (L(v)-L(o.xr[0]))/(L(o.xr[1])-L(o.xr[0])) : (v-o.xr[0])/(o.xr[1]-o.xr[0]))*o.w;
  const fy=v=>o.y0+o.h-(o.ylog? (L(v)-L(o.yr[0]))/(L(o.yr[1])-L(o.yr[0])) : (v-o.yr[0])/(o.yr[1]-o.yr[0]))*o.h;
  (o.xt||[]).forEach(v=>{ G.appendChild(mk('line',{x1:fx(v),x2:fx(v),y1:o.y0,y2:o.y0+o.h,class:'grid'}));
    G.appendChild(mk('text',{x:fx(v),y:o.y0+o.h+18,'text-anchor':'middle',class:'lbl'})).textContent=o.xf?o.xf(v):v; });
  (o.yt||[]).forEach(v=>{ G.appendChild(mk('line',{x1:o.x0,x2:o.x0+o.w,y1:fy(v),y2:fy(v),class:'grid'}));
    G.appendChild(mk('text',{x:o.x0-8,y:fy(v)+4,'text-anchor':'end',class:'lbl'})).textContent=o.yf?o.yf(v):v; });
  G.appendChild(mk('rect',{x:o.x0,y:o.y0,width:o.w,height:o.h,fill:'none',stroke:'var(--rule)'}));
  if(o.xl) G.appendChild(mk('text',{x:o.x0+o.w,y:o.y0+o.h+36,'text-anchor':'end',class:'lbl b'})).textContent=o.xl;
  if(o.yl) G.appendChild(mk('text',{x:o.x0,y:o.y0-10,class:'lbl b'})).textContent=o.yl;
  return {fx,fy};
}

/* 선: pts=[[x,y],…] → path. 애니메이션은 stroke-dashoffset 만 쓴다(지침 6-1). */
function pyLine(G, ax, pts, color, o={}){
  const ok=pts.filter(p=>isFinite(ax.fx(p[0]))&&isFinite(ax.fy(p[1])));
  const d='M'+ok.map(p=>ax.fx(p[0]).toFixed(1)+','+ax.fy(p[1]).toFixed(1)).join(' L');
  const a={d,fill:'none',stroke:color,'stroke-width':o.w||2.4};
  if(o.dash) a['stroke-dasharray']=o.dash;
  const p=svgEl('path',a); G.appendChild(p);
  if(!RM && !o.dash && o.anim!==false){
    const L=p.getTotalLength ? p.getTotalLength() : 2000;
    p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:o.dur||1300,delay:o.delay||0,fill:'forwards',easing:'ease-out'});
  }
  return p;
}

/* 범례 한 줄 */
function pyKey(G, x, y, color, text, dash){
  const mk=svgEl;
  const a={x1:x,x2:x+26,y1:y-5,y2:y-5,stroke:color,'stroke-width':2.6}; if(dash) a['stroke-dasharray']=dash;
  G.appendChild(mk('line',a));
  G.appendChild(mk('text',{x:x+34,y:y,'font-family':'var(--sans)','font-size':14.5,fill:'var(--ink-2)'})).textContent=text;
}

/* 카드 묶음을 차례로 나타낸다 */
function pyFade(gs, step=150){
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:340,delay:step*i,fill:'forwards'}));
}

/* 자료 열 꺼내기: rows=[[t,c1,c2,…]] → [[t,ck]] */
function pyCol(rows, k, sx=1){ return rows.map(r=>[r[0]*sx, r[k]]); }
</script>
