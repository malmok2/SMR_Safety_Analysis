<script>
/* ================================================================
   SECTION 05 — PWR과 BWR, 그리고 일체형  (교재 5장)
   ================================================================ */
SECT('05 · [[PWR · BWR · 일체형||PWR, BWR, integral]]');

S({bare:true, cls:'div', ov:'[[&#167;05 PWR과 BWR, 그리고 일체형||&#167;05 PWR, BWR, and going integral]]',
html:`[[<div class="no">05</div><h2>PWR과 BWR,<br>그리고 일체형</h2><div class="ln"></div>
<p>2부의 출발점. 경수로 두 계보가 갈라지는 지점은 <b>증기를 어디서 만드는가</b> 하나다.
그리고 SMR이 왜 “일체형”이라는 형태로 수렴했는지를 본다.</p>||<div class="no">05</div><h2>PWR, BWR,<br>and going integral</h2><div class="ln"></div>
<p>Where Part II starts. The two light-water lines split on one question - <b>where the steam is made</b>.
Then: why SMRs converged on the integral layout.</p>]]`});


/* ---------------------------------------------------------------- PWR vs BWR */
S({tag:'WHERE THE STEAM IS MADE', ov:'[[증기를 어디서 만드는가 — PWR과 BWR||Where the steam is made - PWR and BWR]]',
src:'[[<b>출처</b> 본 교재 5.1절 그림 5.1 · 5.2 · 표 5.1 · 운전압력은 대표값(PWR 약 15.5 MPa · BWR 약 7 MPa)||<b>Source</b> This textbook &#167;5.1, Figs. 5.1-5.2 and Table 5.1 · representative pressures: PWR about 15.5 MPa, BWR about 7 MPa]]',
abbr:'[[<b>PWR</b> 가압경수로 · <b>BWR</b> 비등경수로 · <b>랭킨 사이클</b> 물을 끓여 증기로 터빈을 돌리는 열기관 순환 · <b>기수분리기</b> 증기와 물을 갈라 내는 장치||<b>PWR</b> Pressurized Water Reactor · <b>BWR</b> Boiling Water Reactor · <b>Rankine cycle</b> the steam power cycle · <b>steam separator</b> splits steam from water]]',
html:`<h2 class="t">[[갈라지는 지점은 <em>하나</em>뿐임 — 증기를 어디서 만드는가||They split on <em>one thing</em> - where the steam gets made]]</h2>
<ul class="b">
  <li>[[<b>PWR</b>은 1차계통을 높은 압력으로 눌러 <b>노심에서 끓지 않게</b> 함. 열은 증기발생기에서 2차측으로 넘김 — 핵심은 <b class="cool">분리</b>임||A <b>PWR</b> holds the primary at high pressure so <b>the core never boils</b>; heat crosses to the secondary in a steam generator. The point is <b class="cool">separation</b>]]</li>
  <li>[[<b>BWR</b>은 노심에서 직접 끓여 그 증기를 터빈으로 보냄. 증기발생기가 없고 <b class="hot">터빈실도 방사선 구역</b>이 됨||A <b>BWR</b> boils in the core and sends that steam to the turbine. No steam generator - and <b class="hot">the turbine hall becomes a radiation area</b>]]</li>
</ul>
<div class="body"><div class="fig">
${PH({src:'f5_01', cap:'[[<b>PWR</b> — 1차계통(노심~증기발생기)과 2차계통(증기발생기~터빈)이 분리되어 있다||<b>PWR</b> - the primary (core to steam generator) and secondary (steam generator to turbine) are separate]]'},
     {src:'f5_02', cap:'[[<b>BWR</b> — 노심에서 생긴 증기-물 혼합물이 기수분리기와 건조기를 거쳐 바로 터빈으로 간다||<b>BWR</b> - the steam-water mixture from the core passes the separator and dryer straight to the turbine]]'})}
</div></div>`});


/* ---------------------------------------------------------------- 구조적 차이 */
S({tag:'CONTROL ROD DIRECTION', ov:'[[제어봉 삽입 방향 — 전원을 잃으면 어떻게 되는가||Control rod direction - what happens when power is lost]]',
src:'[[<b>출처</b> 본 교재 5.1.2절 표 5.1 · 9장 BWRX-300의 FMCRD를 볼 때 이 차이를 기억할 것||<b>Source</b> This textbook &#167;5.1.2, Table 5.1 · remember this when the BWRX-300 FMCRD comes up in ch. 9]]',
abbr:'[[<b>제어봉</b> 중성자를 흡수해 반응도를 낮추는 봉 · <b>축압기</b> 압축 기체로 힘을 저장해 두는 용기 · <b>FMCRD</b> 미세운동 제어봉구동장치(BWRX-300)||<b>control rod</b> absorbs neutrons to cut reactivity · <b>accumulator</b> a vessel storing force in compressed gas · <b>FMCRD</b> Fine Motion Control Rod Drive (BWRX-300)]]',
html:`<h2 class="t">[[PWR은 전원을 잃으면 제어봉이 <em>떨어진다</em>. BWR은 <s>그렇지 않다</s>||Lose power and a PWR&#8217;s rods <em>fall</em>. A BWR&#8217;s <s>do not</s>]]</h2>
<ul class="b">
  <li>[[BWR은 노심 위쪽이 기수분리기·건조기로 채워지므로 제어봉을 <b>아래에서 밀어 넣어야</b> 함 — 구조가 강제한 선택임||A BWR&#8217;s core is capped by separators and dryers, so rods must be <b>driven in from below</b> - the structure forces it]]</li>
  <li>[[그래서 BWR은 별도의 <b class="amb">수압·전동 구동장치와 축압기</b>가 필요함. 안전해석에서 자주 되돌아오는 항목임||So a BWR needs <b class="amb">hydraulic and electric drives with accumulators</b>. It comes back often in safety analysis]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 415" role="img" aria-label="[[PWR은 위에서 중력으로, BWR은 아래에서 구동력으로 제어봉을 넣는 구조 비교||Rods dropping by gravity from above in a PWR versus being driven up from below in a BWR]]">
    <g id="cr-fig"></g>
  </svg>
  </div>
  <div class="side">
    <table class="d sm">
      <tr><th>[[항목||Item]]</th><th>PWR</th><th>BWR</th></tr>
      <tr><td>[[증기 생성||Steam made in]]</td><td>[[증기발생기||Steam generator]]</td><td>[[노심||The core]]</td></tr>
      <tr><td>[[사이클||Cycle]]</td><td>[[2계통 분리||Two loops]]</td><td>[[1계통||One loop]]</td></tr>
      <tr><td>[[운전압력||Pressure]]</td><td class="n">15.5 MPa</td><td class="n">7 MPa</td></tr>
      <tr><td>[[증기발생기||Steam generator]]</td><td>[[있음||Yes]]</td><td>[[없음||No]]</td></tr>
      <tr class="mark"><td>[[제어봉 삽입||Rod insertion]]</td><td>[[위 &#8594; 아래 · 중력||Top down &#183; gravity]]</td><td>[[아래 &#8594; 위 · 구동력||Bottom up &#183; driven]]</td></tr>
      <tr><td>[[터빈실 방사선||Turbine hall]]</td><td>[[낮음||Low]]</td><td>[[높음||High]]</td></tr>
    </table>
  </div>
</div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#cr-fig');
  const rods=[];
  function side(ox, title, col, down, note){
    const hd=mk('text',{x:ox+110,y:24,'text-anchor':'middle','font-family':'var(--sans)',
      'font-size':19,fill:col,'font-weight':600}); hd.textContent=title; G.appendChild(hd);
    /* 용기 */
    G.appendChild(mk('rect',{x:ox+20,y:48,width:180,height:250,fill:'var(--panel)',
      stroke:'var(--rule)','stroke-width':1.4}));
    /* 노심 */
    G.appendChild(mk('rect',{x:ox+48,y:down?188:96,width:124,height:96,fill:'var(--ground)',
      stroke:'var(--hot)','stroke-width':1.4}));
    const c=mk('text',{x:ox+110,y:down?244:152,'text-anchor':'middle',class:'lbl',fill:'var(--hot)'});
    c.textContent=TX('노심','core'); G.appendChild(c);
    if(!down){
      G.appendChild(mk('rect',{x:ox+48,y:212,width:124,height:70,fill:'var(--ground)',
        stroke:'var(--rule)'}));
      const s=mk('text',{x:ox+110,y:252,'text-anchor':'middle',class:'lbl'});
      s.textContent=TX('기수분리기 · 건조기','separator + dryer'); G.appendChild(s);
    }
    /* 제어봉 세 개 */
    for(let i=0;i<3;i++){
      const x=ox+68+i*38;
      const r=mk('rect',{x:x,y:down?62:284,width:10,height:down?110:0,fill:col});
      G.appendChild(r); rods.push([r,down]);
    }
    const a=mk('path',{d: down ? 'M'+(ox+110)+',312 v-24' : 'M'+(ox+110)+',312 v-24',
      fill:'none',stroke:col,'stroke-width':0});
    G.appendChild(a);
    wrapT(note,13).forEach((ln,j)=>{
      const e=mk('text',{x:ox+110,y:330+j*21,'text-anchor':'middle','font-family':'var(--sans)',
        'font-size':16,fill:col,'font-weight':300}); e.textContent=ln; G.appendChild(e); });
  }
  side(0,   'PWR', 'var(--ok)',  1,
       TX('전원이 끊기면 그대로 떨어진다 — 차단이 곧 작동이다',
          'Cut the power and they drop - cutting it is the action'));
  side(400, 'BWR', 'var(--amber)', 0,
       TX('전원이 끊겨도 저절로 들어가지 않는다 — 수압 축압기가 따로 필요하다',
          'They do not insert on their own - a separate hydraulic accumulator is needed'));
  G.appendChild(mk('line',{x1:380,y1:40,x2:380,y2:376,stroke:'var(--rule)','stroke-dasharray':'4 5'}));
  if(RM){ rods.forEach(r=>r[0].setAttribute('height',r[1]?110:96)); return; }
  rods.forEach((r,i)=>{
    if(r[1]) r[0].animate([{height:'0px'},{height:'110px'}],
      {duration:500,delay:300+90*i,fill:'forwards',easing:'cubic-bezier(.4,0,.6,1)'});
    else {
      r[0].setAttribute('y',284);
      r[0].animate([{height:'0px',y:'284px'},{height:'96px',y:'188px'}],
        {duration:900,delay:900+90*i,fill:'forwards',easing:'linear'});
    }
  });
}});


/* ---------------------------------------------------------------- 일체형 = 사고 제거 */
S({tag:'REMOVE THE ACCIDENT', ov:'[[일체형 — 안전계통을 개선하는 게 아니라 사고를 제거한다||Integral - not a better safety system but a removed accident]]',
src:'[[<b>출처</b> 본 교재 5.2절 · 대형 LOCA 는 1차계통 대구경 배관의 완전 파단 시나리오임||<b>Source</b> This textbook &#167;5.2 · a large LOCA is the double-ended rupture of a large primary pipe]]',
abbr:'[[<b>LOCA</b> 냉각재상실사고 · <b>A<sub>break</sub></b> 파단면적 · <b>ṁ<sub>loss</sub></b> 유출 유량 · <b>축압기</b> 압축 기체로 물을 밀어 넣는 피동 주입 탱크||<b>LOCA</b> Loss-of-Coolant Accident · <b>A<sub>break</sub></b> break area · <b>&#7745;<sub>loss</sub></b> escaping flow · <b>accumulator</b> a passive tank that pushes water in with compressed gas]]',
html:`<h2 class="t">[[안전계통을 <s>더 잘 만드는</s> 게 아니라, 막아야 할 <em>사고를 없앰</em>||Not <s>a better safety system</s> - the accident itself is <em>removed</em>]]</h2>
<ul class="b">
  <li>[[대형 PWR의 안전주입 · 축압기 · 재순환계통은 전부 <b>대구경 배관 파단이라는 한 시나리오</b>에 대비해 존재함||Safety injection, accumulators and recirculation in a large PWR all exist for <b>one scenario</b> - a large pipe break]]</li>
  <li>[[배관이 없으면 그 시나리오 자체가 사라짐. <b class="cool">파단면적이 0이면 유출 유량도 0</b>임||No pipe, no scenario. <b class="cool">Zero break area means zero escaping flow</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 410" role="img" aria-label="[[루프형 배치의 대구경 배관과 일체형 배치에서 그 배관이 사라진 모습, 그리고 남는 냉각재 상실 경로||A loop layout with its large pipes, the integral layout with those pipes gone, and the leak paths that remain]]">
  <g id="ri-loop"></g><g id="ri-int"></g><g id="ri-rest"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  /* 왼쪽 — 루프형. 굵은 배관이 용기 옆구리에 붙어 있다. */
  const A=el.querySelector('#ri-loop');
  A.appendChild(mk('text',{x:20,y:22,'font-family':'var(--sans)','font-size':19,
    fill:'var(--hot)','font-weight':600})).textContent=TX('루프형 — 배관이 있다','Loop layout - the pipes are there');
  A.appendChild(mk('rect',{x:40,y:100,width:96,height:180,fill:'var(--panel)',stroke:'var(--rule)','stroke-width':1.4}));
  A.appendChild(mk('rect',{x:240,y:80,width:70,height:200,fill:'var(--panel)',stroke:'var(--cool)','stroke-width':1.4}));
  A.appendChild(mk('text',{x:88,y:196,'text-anchor':'middle',class:'lbl'})).textContent=TX('원자로용기','RPV');
  A.appendChild(mk('text',{x:275,y:302,'text-anchor':'middle',class:'lbl',fill:'var(--cool)'})).textContent=TX('증기발생기','SG');
  const pipe=mk('path',{d:'M136,136 H240 M240,244 H136',fill:'none',stroke:'var(--hot)','stroke-width':11,
    'stroke-linecap':'butt',opacity:0.85});
  A.appendChild(pipe);
  A.appendChild(mk('text',{x:188,y:120,'text-anchor':'middle',class:'lbl',fill:'var(--hot)'}))
   .textContent=TX('대구경 1차 배관','large primary pipe');
  const burst=mk('g',{opacity:0}); A.appendChild(burst);
  burst.appendChild(mk('circle',{cx:188,cy:136,r:17,fill:'var(--hot-2)'}));
  burst.appendChild(mk('text',{x:188,y:88,'text-anchor':'middle',class:'lbl',fill:'var(--hot-2)'}))
       .textContent=TX('완전 파단 = 대형 LOCA','double-ended break = large LOCA');
  A.appendChild(mk('text',{x:20,y:346,'font-family':'var(--sans)','font-size':16.5,
    fill:'var(--ink-2)','font-weight':300})).textContent=
    TX('안전주입 · 축압기 · 재순환계통이 이 하나에 대비해 존재한다',
       'Injection, accumulators and recirculation all exist for this one case');

  /* 오른쪽 — 일체형. 배관이 통째로 없다. */
  const B=el.querySelector('#ri-int');
  B.appendChild(mk('text',{x:600,y:22,'font-family':'var(--sans)','font-size':19,
    fill:'var(--ok)','font-weight':600})).textContent=TX('일체형 — 배관이 없다','Integral - no pipes at all');
  B.appendChild(mk('rect',{x:620,y:80,width:170,height:200,fill:'var(--panel)',stroke:'var(--ok)','stroke-width':1.6}));
  B.appendChild(mk('rect',{x:648,y:190,width:114,height:76,fill:'var(--ground)',stroke:'var(--hot)','stroke-width':1.3}));
  B.appendChild(mk('text',{x:705,y:236,'text-anchor':'middle',class:'lbl',fill:'var(--hot)'})).textContent=TX('노심','core');
  B.appendChild(mk('rect',{x:648,y:100,width:114,height:66,fill:'var(--ground)',stroke:'var(--cool)','stroke-width':1.3}));
  B.appendChild(mk('text',{x:705,y:138,'text-anchor':'middle',class:'lbl',fill:'var(--cool)'})).textContent=TX('증기발생기','SG');
  B.appendChild(mk('text',{x:705,y:302,'text-anchor':'middle',class:'lbl',fill:'var(--ok)'}))
   .textContent=TX('둘이 한 용기 안에 있다','both inside one vessel');
  const fm=mk('g',{opacity:0}); B.appendChild(fm);
  fm.appendChild(mk('text',{x:600,y:346,'font-family':'var(--mono)','font-size':21,fill:'var(--ok)'}))
    .textContent='A_break → 0    ⇒    ṁ_loss → 0';

  /* 남는 경로 — 사라지는 것은 대형 LOCA 뿐이다 */
  const C=el.querySelector('#ri-rest');
  const rest=mk('g',{opacity:0}); C.appendChild(rest);
  rest.appendChild(mk('rect',{x:600,y:358,width:500,height:48,fill:'var(--panel)',stroke:'var(--amber)'}));
  wrapT(TX('남는 것 — 계측 관통부 · 급수·증기 노즐 · 감압밸브 = 소구경 파단',
           'What remains - instrument penetrations, feed and steam nozzles, relief valves'), 30)
    .forEach((ln,j)=>{
      rest.appendChild(mk('text',{x:616,y:380+j*20,'font-family':'var(--sans)','font-size':15.5,
        fill:'var(--amber)','font-weight':300})).textContent=ln; });

  if(RM){ [burst,fm,rest].forEach(x=>x.setAttribute('opacity',1)); return; }
  burst.animate([{opacity:0},{opacity:1}],{duration:420,delay:500,fill:'forwards'});
  fm.animate([{opacity:0},{opacity:1}],{duration:420,delay:1000,fill:'forwards'});
  rest.animate([{opacity:0},{opacity:1}],{duration:420,delay:1400,fill:'forwards'});
  flow(pipe,{n:5,color:'var(--ink)',r:2.6,speed:0.16});
}});


/* ---------------------------------------------------------------- 득실 */
S({tag:'THE PRICE', ov:'[[일체형이 얻는 것과 잃는 것||What the integral layout gains and loses]]',
src:'[[<b>출처</b> 본 교재 5.2절 표 5.2 · 일체형 SMR 의 안전해석은 대형 LOCA 가 아니라 <b>소구경 파단과 감압 과도</b>가 주된 시나리오가 됨||<b>Source</b> This textbook &#167;5.2, Table 5.2 · for an integral SMR the leading scenarios are <b>small breaks and depressurisation transients</b>, not a large LOCA]]',
html:`<h2 class="t">[[대가가 안 보이면 <em>아직 다 읽지 않은 것</em>임||If you cannot see the price, <em>you have not finished reading</em>]]</h2>
<ul class="b">
  <li>[[일체형에서도 LOCA가 완전히 사라지지는 않음. 용기에는 여전히 <b>관통부 · 노즐 · 감압밸브</b>가 붙어 있음||A LOCA does not vanish entirely. The vessel still carries <b>penetrations, nozzles and relief valves</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 440" role="img" aria-label="[[일체형 배치가 얻는 네 가지와 잃는 네 가지를 짝지어 놓은 그림||Four gains and four losses of the integral layout, paired]]">
  <g id="pz-cols"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const P=[
    [TX('대구경 배관 파단 시나리오 제거','The large-break scenario is removed'),
     TX('용기가 커지고 두꺼워진다','The vessel grows larger and thicker')],
    [TX('안전계통 단순화','The safety systems get simpler'),
     TX('증기발생기를 용기 안에서 정비해야 한다','The steam generator must be serviced inside the vessel')],
    [TX('계통 수 감소로 부지 면적 축소','Fewer systems, so a smaller site'),
     TX('제작 · 수송 난이도 상승','Harder to fabricate and to transport')],
    [TX('방사선 구역 축소','Smaller radiation areas'),
     TX('출력이 용기 크기에 묶인다','Output is tied to how big the vessel can be')]
  ];
  const G=el.querySelector('#pz-cols'), gs=[];
  G.appendChild(mk('text',{x:20,y:18,class:'lbl',fill:'var(--ok)'})).textContent=TX('얻는 것','what it gains');
  G.appendChild(mk('text',{x:592,y:18,class:'lbl',fill:'var(--hot)'})).textContent=TX('잃는 것','what it loses');
  P.forEach((r,i)=>{
    const y=34+i*96, g=mk('g',{opacity:0});
    [[20,r[0],'var(--ok)'],[592,r[1],'var(--hot)']].forEach(c=>{
      g.appendChild(mk('rect',{x:c[0],y:y,width:508,height:84,fill:'var(--panel)',stroke:'var(--rule)'}));
