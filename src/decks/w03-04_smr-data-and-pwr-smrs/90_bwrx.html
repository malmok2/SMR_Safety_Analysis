</ul>
<div class="body"><div class="fig">

     {src:'f9_02', cap:'[[주요 계통 구성 — 원자로용기 · 격리응축기 · 터빈-복수기 계통||The main systems - reactor vessel, isolation condensers, turbine and condenser]]'})}

/* ---------------------------------------------------------------- 굴뚝 */
S({tag:'THE CHIMNEY', ov:'[[굴뚝으로 순환을 만든다 — 노형이 달라도 물리는 같다||A chimney makes the circulation - different line, same physics]]',
src:'[[<b>출처</b> 본 교재 9.2절 그림 9.3 · 9.4 · 원자로용기 내경 4 m · 높이 27 m · 노심 높이 3.8 m · 벽 두께 약 136 mm||<b>Source</b> This textbook &#167;9.2, Figs. 9.3-9.4 · vessel 4 m inside diameter, 27 m tall, 3.8 m core, wall about 136 mm]]',
abbr:'[[<b>굴뚝(chimney)</b> 노심 위에 일부러 만든 긴 통로 · <b>2상 혼합물</b> 물과 기포가 섞인 유체 · <b>시라우드</b> 노심을 감싸 상승·하강 유로를 가르는 원통 · <b>기수분리기 · 건조기</b> 증기에서 물기를 걸러 내는 장치||<b>chimney</b> a long passage built above the core on purpose · <b>two-phase mixture</b> water carrying steam voids · <b>shroud</b> the cylinder separating up-flow from down-flow · <b>separator and dryer</b> remove moisture from the steam]]',
html:`<h2 class="t">[[펌프를 없앤 대가는 <em>높이로 치름</em> — 6장과 같은 논리임||Drop the pump and you pay <em>in height</em> - as in chapter 6]]</h2>
<ul class="b">
  <li>[[기포가 섞인 물은 가볍고 하강관의 물은 무거움. 이 <b>밀도차가 구동수두</b>이고, 기포 구간이 <b>길수록 커짐</b>||Water carrying voids is light; downcomer water is heavy. <b>That density difference is the driving head</b>, and it grows with <b>the length of the voided run</b>]]</li>
  <li>[[그래서 노심 위에 <b class="cool">긴 통로를 일부러</b> 만듦 — 이것이 굴뚝임. 용기가 내경 4 m 에 높이 27 m 로 유난히 긴 이유임||So a <b class="cool">long passage is built above the core on purpose</b> - the chimney. Hence a vessel 4 m across and 27 m tall]]</li>

<div class="body">
  <div class="fig">
  ${PH({src:'f9_03', cap:'[[원자로압력용기와 내부구조물 — 아래에서부터 노심 · 굴뚝 · 기수분리기 · 건조기. <b>제어봉은 아래에서</b> 들어간다||Vessel and internals - core, chimney, separator, dryer from the bottom up. <b>The rods enter from below</b>]]'},
       {src:'f9_04', cap:'[[용기 내 주 유동 경로 — 급수가 하강관에서 분리기 배출수와 섞이고, 노심에서 비등해 굴뚝을 타고 올라간다||The main flow path - feedwater mixes with separator return in the downcomer, boils in the core, climbs the chimney]]'})}
  </div>

/* ---------------------------------------------------------------- 세 가지 결정 */
S({tag:'THREE DECISIONS', ov:'[[세 가지 결정 — RIV · SRV 제거 · 건식 격납||Three decisions - RIV, no SRV, dry containment]]',
src:'[[<b>출처</b> 본 교재 9.3절 · RIV 설계 목표는 호칭경 19 mm(3/4인치)를 넘는 배관 파단에 대해 <b>격리 불가능한 LOCA 제거</b>||<b>Source</b> This textbook &#167;9.3 · the RIV target is to <b>eliminate the unisolable LOCA</b> for any break above DN 19 mm (3/4 in)]]',
abbr:'[[<b>RIV</b> 원자로 격리밸브 · <b>SRV</b> 안전방출밸브 — 과압을 밖으로 흘려 보내는 밸브 · <b>PSA</b> 확률론적 안전성평가 · <b>압력억제형 격납</b> 증기를 수조에 밀어 넣어 응축시키는 방식||<b>RIV</b> reactor isolation valve · <b>SRV</b> safety relief valve, which bleeds off overpressure · <b>PSA</b> probabilistic safety assessment · <b>pressure-suppression containment</b> pushes steam into a pool to condense it]]',
html:`<h2 class="t">[[배관을 <s>없애는</s> 대신 <em>문제가 되기 전에 끊음</em>||Instead of <s>removing</s> the pipes, it <em>cuts them before they matter</em>]]</h2>
<ul class="b">
  <li>[[일체형 SMR이 배관을 없애 문제를 지웠다면, BWRX-300은 <b>배관을 남기되 격리 가능하게</b> 만듦 — 목적지가 같고 경로가 다름||Where an integral SMR erased the problem by removing the pipes, BWRX-300 <b>keeps them but makes every break isolable</b> - same destination, different route]]</li>
  <li>[[&#8220;안전을 위해 단 기기가 사고의 원인이 되는&#8221; 구조는 드물지 않음. <b class="cool">설계 단순화가 안전성 향상과 같은 방향</b>일 수 있음||&#8220;The device added for safety becomes the cause&#8221; is not a rare structure. <b class="cool">Simplifying can point the same way as improving safety</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 410" role="img" aria-label="[[원자로 격리밸브·안전방출밸브 제거·건식 격납 세 결정과 그 인과 관계||Three decisions - isolation valves, removing the relief valves, a dry containment - and how they follow from one another]]">
  <g id="td-cards"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const C=[
    ['var(--cool)','RIV',TX('원자로 격리밸브','Reactor isolation valves'),
     TX('용기에 직접 붙인 이중 격리밸브. 용기를 관통하는 모든 대구경 배관에 두 개씩 달려 있어, 배관이 터지면 즉시 격리한다.',
        'Double isolation valves bolted straight to the vessel. Every large penetration carries two, so a break is isolated at once.'),
     TX('목표 — 19 mm 를 넘는 파단에 대해 격리 불가능한 LOCA 를 제거','Target - no unisolable LOCA for any break above 19 mm')],
    ['var(--hot)','SRV',TX('안전방출밸브를 없앴다','The relief valves were removed'),
     TX('역사적으로 BWR 의 LOCA 원인 중 가장 흔한 것이 안전방출밸브였다. 압력을 지키려고 단 밸브가 냉각재 상실의 주된 경로였다.',
        'Historically the most common cause of a BWR LOCA was the safety relief valve. The device fitted to hold pressure was the main path for losing coolant.'),
     TX('대신 — 용량이 큰 격리응축기계통과 용기 내 큰 증기 공간이 과압 보호를 맡는다','Instead - a large isolation condenser system and a big steam volume handle overpressure')],
    ['var(--ok)',TX('건식','Dry'),TX('건식 격납','A dry containment'),
     TX('원자로용기와 관련 계통을 감싸는 금속 탱크로, 내부가 건식이다. 기존 BWR 의 압력억제형 격납과 다르다.',
        'A metal tank around the vessel and its systems, dry inside - unlike the pressure-suppression containment of earlier BWRs.'),
     TX('가능해진 이유 — RIV 덕분이다. 격리 불가능한 대형 LOCA 가 없으면 밀려들 증기량이 제한된다','Why it works - thanks to the RIVs. With no unisolable large LOCA, the steam that can arrive is bounded')]
  ];
  const G=el.querySelector('#td-cards'), gs=[];
  C.forEach((c,i)=>{
    const g=mk('g',{transform:'translate('+(i*374)+',0)',opacity:0});
    g.appendChild(mk('rect',{width:352,height:400,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:352,height:3,fill:c[0]}));
    const n=mk('text',{x:22,y:40,'font-family':'var(--mono)','font-size':17,fill:c[0],
      'font-weight':600,'letter-spacing':'.08em'}); n.textContent=c[1]; g.appendChild(n);
    let y=76;
    wrapT(c[2],17).forEach((ln,j)=>{
      const h=mk('text',{x:22,y:y+j*25,'font-family':'var(--sans)','font-size':19,
        fill:'var(--ink)','font-weight':600}); h.textContent=ln; g.appendChild(h); });
    y += wrapT(c[2],17).length*25 + 20;
    wrapT(c[3],20).forEach((ln,j)=>{
      const t=mk('text',{x:22,y:y+j*23,'font-family':'var(--sans)','font-size':16,
        fill:'var(--ink-2)','font-weight':300}); t.textContent=ln; g.appendChild(t); });
    g.appendChild(mk('line',{x1:22,y1:286,x2:330,y2:286,stroke:'var(--rule)'}));
    wrapT(c[4],21).slice(0,4).forEach((ln,j)=>{
      const t=mk('text',{x:22,y:314+j*22,'font-family':'var(--sans)','font-size':15.5,
        fill:c[0],'font-weight':400}); t.textContent=ln; g.appendChild(t); });
    G.appendChild(g); gs.push(g);
    if(i<2) G.appendChild(mk('path',{d:'M'+(i*374+354)+',200 h16',stroke:'var(--rule)','stroke-width':1.4}));
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],
    {duration:400,delay:220*i,fill:'forwards',easing:'ease-out'}));
}});


/* ---------------------------------------------------------------- RIV · 건식 격납 */
S({tag:'ISOLATE, NOT PREVENT', ov:'[[격리밸브 하나가 격납 개념 전체를 바꾼다||One isolation valve changes the whole containment concept]]',
src:'[[<b>출처</b> 본 교재 9.3.1 · 9.3.3절 그림 9.5 · 9.6 · 9.7 · 설계 목표는 호칭경 <b>19 mm(3/4인치)를 넘는</b> 파단에 대해 격리 불가능한 LOCA 를 제거하는 것||<b>Source</b> This textbook &#167;&#167;9.3.1 and 9.3.3, Figs. 9.5-9.7 · the target is no unisolable LOCA for any break above <b>DN 19 mm (3/4 in)</b>]]',
abbr:'[[<b>RIV</b> 원자로 격리밸브 — 용기에 직접 붙인 이중 밸브 · <b>유량제한기</b> 파단 시 빠져나가는 유량을 제한하는 좁힌 목 · <b>압력억제형 격납</b> 증기를 수조에 밀어 넣어 응축시키는 방식 · <b>건식 격납</b> 그 수조 없이 견디는 방식||<b>RIV</b> reactor isolation valve, doubled and bolted to the vessel · <b>flow restrictor</b> a throat that caps the escaping flow · <b>pressure-suppression containment</b> pushes steam into a pool · <b>dry containment</b> holds without that pool]]',
html:`<h2 class="t">[[대형 LOCA를 <s>막는</s> 대신 <em>격리 가능하게</em> 만듦||Instead of <s>preventing</s> the large LOCA, it makes every break <em>isolable</em>]]</h2>
<ul class="b">
  <li>[[용기를 관통하는 <b>모든 대구경 배관에 격리밸브가 두 개씩</b> 달려 있어 배관이 터지면 즉시 격리함||<b>Every large penetration carries two isolation valves</b>, so a break is shut off at once]]</li>
  <li>[[건식 격납이 가능해진 이유가 여기 있음 — 격리 불가능한 대형 LOCA가 없으면 <b class="cool">밀려들 증기량이 제한</b>되고, 그러면 압력억제 수조 없이도 격납이 견딤||This is what makes the dry containment possible: with no unisolable large LOCA <b class="cool">the steam that can arrive is bounded</b>, and the containment holds without a suppression pool]]</li>
</ul>
<div class="body"><div class="fig">
${PH({src:'f9_05', cap:'[[<b>격리밸브</b> 설계||The <b>isolation valve</b>]]'},
     {src:'f9_06', cap:'[[주증기 배관의 <b>격리 구성</b>||<b>Isolation</b> on the steam line]]'},
     {src:'f9_07', cap:'[[<b>건식 격납용기</b>||The <b>dry containment</b>]]'})}
</div></div>`});


/* ---------------------------------------------------------------- ICS — 수렴 */
S({tag:'THEY CONVERGE', ov:'[[피동 잔열제거의 해법은 하나로 수렴한다||Passive decay heat removal converges on one answer]]',
src:'[[<b>출처</b> 본 교재 9.4절 · ICS 는 독립 3계열 · 계열당 약 33 MW · 증기를 IC 관 내부에서 응축시켜 닫힌 고리로 용기에 되돌림||<b>Source</b> This textbook &#167;9.4 · three independent trains, about 33 MW each; steam condenses inside the IC tubes and returns to the vessel in a closed loop]]',
abbr:'[[<b>ICS</b> 격리응축기계통 · <b>주복수기</b> 터빈을 나온 증기를 물로 되돌리는 열교환기 · <b>계열</b> 같은 기능을 독립적으로 수행하는 한 벌의 기기||<b>ICS</b> Isolation Condenser System · <b>main condenser</b> the heat exchanger that turns turbine exhaust back into water · <b>train</b> one independent set of equipment performing the function]]',
html:`<h2 class="t">[[노형이 무엇이든 <em>증기 → 수조에서 응축 → 중력 회수</em>로 수렴함||All roads lead to <em>steam &#8594; condense &#8594; gravity return</em>]]</h2>
<ul class="b">
  <li>[[NuScale DHRS, i-SMR PAFS, BWRX-300 ICS는 <b>작동 원리가 정확히 같음</b>. 차이는 <b class="cool">증기를 어디서 가져오느냐</b>임||NuScale&#8217;s DHRS, i-SMR&#8217;s PAFS and BWRX-300&#8217;s ICS <b>work on exactly the same principle</b>. They differ in <b class="cool">where the steam is taken from</b>]]</li>
  <li>[[PWR형은 <b>증기발생기 2차측</b>에서, BWRX-300은 <b>원자로용기에서 직접</b> — BWR에는 2차계통이 없기 때문임||The PWR types take it from <b>the secondary side of a steam generator</b>; BWRX-300 takes it <b>straight from the vessel</b>, because a BWR has no secondary loop]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 410" role="img" aria-label="[[세 설계의 피동 잔열제거계통이 증기를 어디서 가져와 어디서 응축시키는지 나란히 놓은 그림||Where each design's passive decay heat removal takes its steam and where it condenses it]]">
  <g id="cv-three"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#cv-three'), gs=[];
  const T=[
    ['NuScale','DHRS','var(--cool)',TX('증기발생기 2차측','the secondary side of the SG'),
     TX('2계열 · 각 100% 용량','2 trains, each 100%'),TX('응축기가 원자로건물 수조에 잠김','condenser submerged in the reactor building pool')],
    ['i-SMR','PAFS','var(--ok)',TX('증기발생기 2차측','the secondary side of the SG'),
     TX('36 h 냉각 + 36 h 유지','36 h cool + 36 h hold'),TX('응축기가 냉각수조에 잠김','condenser submerged in the cooling tank')],
    ['BWRX-300','ICS','var(--amber)',TX('원자로용기에서 직접','straight from the reactor vessel'),
     TX('3계열 · 계열당 약 33 MW','3 trains, about 33 MW each'),TX('IC 가 격납 외부 수조에 잠김','IC submerged in a pool outside the containment')]
  ];
  T.forEach((t,i)=>{
    const g=mk('g',{transform:'translate('+(i*374)+',0)',opacity:0});
    g.appendChild(mk('rect',{width:352,height:250,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:352,height:3,fill:t[2]}));
    const n=mk('text',{x:22,y:38,'font-family':'var(--mono)','font-size':16,fill:'var(--ink-3)'});
    n.textContent=t[0]; g.appendChild(n);
    const k=mk('text',{x:22,y:74,'font-family':'var(--mono)','font-size':24,fill:t[2],
      'font-weight':600}); k.textContent=t[1]; g.appendChild(k);
    let y=114;
    [[TX('증기를 어디서','steam comes from'),t[3]],
     [TX('구성','configuration'),t[4]],
     [TX('어디서 응축','where it condenses'),t[5]]].forEach(r=>{
      const kk=mk('text',{x:22,y:y,class:'lbl',fill:t[2]}); kk.textContent=r[0]; g.appendChild(kk);
      const L=wrapT(r[1],21);
      L.forEach((ln,j)=>{ const e=mk('text',{x:22,y:y+22+j*21,'font-family':'var(--sans)',
        'font-size':16,fill:'var(--ink-2)','font-weight':300}); e.textContent=ln; g.appendChild(e); });
      y += 22 + L.length*21 + 12;
    });
    G.appendChild(g); gs.push(g);
  });
  /* 아래 — 공통 원리 */
  const c=mk('g',{transform:'translate(0,276)',opacity:0}); G.appendChild(c); gs.push(c);
  c.appendChild(mk('rect',{width:1100,height:124,fill:'var(--ground)',stroke:'var(--ok)','stroke-width':1.8}));
  c.appendChild(mk('text',{x:24,y:34,class:'lbl',fill:'var(--ok)'})).textContent=
    TX('셋의 공통 원리','the principle all three share');
  const STEP=[TX('증기를 만든다','Make steam'),TX('수조에 잠긴 열교환기에서 응축시킨다','Condense it in a submerged exchanger'),
              TX('중력으로 되돌린다','Return it by gravity'),TX('닫힌 고리 — 밖에서 넣지 않는다','A closed loop - nothing added')];
  STEP.forEach((s,i)=>{
    const x=24+i*272;
    c.appendChild(mk('circle',{cx:x+8,cy:74,r:7,fill:'var(--ok)'}));
    wrapT(s,17).forEach((ln,j)=>{
      c.appendChild(mk('text',{x:x+26,y:(wrapT(s,17).length>1?68:79)+j*21,'font-family':'var(--sans)',
        'font-size':16.5,fill:'var(--ink)','font-weight':300})).textContent=ln; });
    if(i<3) c.appendChild(mk('path',{d:'M'+(x+250)+',74 h14',stroke:'var(--ok)','stroke-width':1.4}));
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],
    {duration:380,delay:200*i,fill:'forwards',easing:'ease-out'}));
}});


/* ---------------------------------------------------------------- ICS · PCCS 실물 */
S({tag:'ICS AND PCCS', ov:'[[격리응축기와 피동격납냉각 — 실제 배치||The isolation condenser and passive containment cooling as built]]',
src:'[[<b>출처</b> 본 교재 9.4 · 9.5절 그림 9.8 · 9.9 · ICS 는 독립 3계열 · 계열당 약 33 MW||<b>Source</b> This textbook &#167;&#167;9.4-9.5, Figs. 9.8-9.9 · three independent ICS trains, about 33 MW each]]',
abbr:'[[<b>ICS</b> 격리응축기계통 · <b>PCCS</b> 피동격납냉각계통 · <b>기기 수조</b> 격납의 열을 받아 주는 외부 수조 · <b>주복수기</b> 정상운전에서 증기를 물로 되돌리는 열교환기||<b>ICS</b> Isolation Condenser System · <b>PCCS</b> Passive Containment Cooling System · <b>equipment pool</b> the outside pool that takes the containment heat · <b>main condenser</b> the normal-operation steam-to-water exchanger]]',
html:`<h2 class="t">[[3계열이 <em>격납 외부 수조</em>에 잠겨 있음||Three trains, submerged in <em>a pool outside the containment</em>]]</h2>
<ul class="b">
  <li>[[ICS는 <b>주복수기를 쓸 수 없을 때</b>의 최종 열침원임. 용기에서 나온 증기를 IC 관 내부에서 응축시켜 <b>닫힌 고리</b>로 되돌림||The ICS is the heat sink <b>when the main condenser is unavailable</b>. Steam from the vessel condenses inside the IC tubes and returns in a <b>closed loop</b>]]</li>
  <li>[[PCCS는 사고 시 또는 능동 격납냉각을 잃었을 때 <b class="ok">자연순환과 응축</b>으로 격납의 열을 기기 수조에 넘김||The PCCS moves containment heat to the equipment pool by <b class="ok">natural circulation and condensation</b> in an accident or on loss of active cooling]]</li>
</ul>
<div class="body"><div class="fig">
${PH({src:'f9_08', cap:'[[격리응축기계통 전체 배치 — <b>3계열</b>이 격납 외부 수조에 잠겨 있다||The isolation condenser system - <b>three trains</b> submerged in a pool outside the containment]]'},
     {src:'f9_09', cap:'[[피동격납냉각계통 — 자연순환으로 격납의 열을 <b>기기 수조</b>로 옮긴다||Passive containment cooling - natural circulation carries the heat to the <b>equipment pool</b>]]'})}
</div></div>`});


/* ---------------------------------------------------------------- FMCRD */
S({tag:'FMCRD', ov:'[[미세운동 제어봉구동장치 — BWR의 숙제를 푸는 장치||The fine motion control rod drive - solving the BWR problem]]',
src:'[[<b>출처</b> 본 교재 9.6절 그림 9.10 · 자성 커플링을 써서 축이 <b>압력경계를 뚫지 않게</b> 함||<b>Source</b> This textbook &#167;9.6, Fig. 9.10 · a magnetic coupling keeps the shaft from <b>crossing the pressure boundary</b>]]',
abbr:'[[<b>FMCRD</b> 미세운동 제어봉구동장치 · <b>볼 스크루</b> 회전을 직선 운동으로 바꾸는 나사 · <b>자성 커플링</b> 축을 뚫지 않고 자력으로 회전을 넘기는 이음 · <b>수압 축압기</b> 압축 기체로 물을 밀어 제어봉을 급속 삽입하는 장치||<b>FMCRD</b> Fine Motion Control Rod Drive · <b>ball screw</b> turns rotation into linear motion · <b>magnetic coupling</b> passes torque across a wall without a shaft through it · <b>hydraulic accumulator</b> drives rapid rod insertion with stored gas pressure]]',
html:`<h2 class="t">[[<em>이중 구조</em>임 — 급속 삽입은 수압, 미세 제어는 모터||It is a <em>two-part system</em> - hydraulics for scram, a motor for fine control]]</h2>
<ul class="b">
  <li>[[5장에서 짚은 BWR의 숙제 — <b>제어봉을 아래에서 밀어 올려야 한다</b> — 를 푸는 장치임. 모터로 볼 스크루를 돌려 미세 위치를 제어함||It solves the BWR problem from chapter 5 - <b>the rods must be pushed up from below</b>. A motor turns a ball screw for fine positioning]]</li>
  <li>[[<b class="ok">자성 커플링</b>을 써서 축이 압력경계를 뚫지 않음 — 밀봉부가 없으므로 <b>누설 경로가 하나 줄어듦</b>||A <b class="ok">magnetic coupling</b> keeps the shaft out of the pressure boundary: no seal, so <b>one less leak path</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  ${PH({src:'f9_10', cap:'[[자성 커플링 방식 FMCRD — 볼 스크루를 모터로 돌려 제어봉을 미세하게 움직인다||The magnetically coupled FMCRD - a motor turns the ball screw to position the rod]]'})}
  </div>
  <div class="side">
    <blockquote class="q">[[PWR은 전원을 잃으면 제어봉이 <b>중력으로 떨어지지만</b> BWR은 그렇지 않다.
      그래서 BWR의 정지계통은 <b>수압 축압기</b>로 급속 삽입을 보장하고,
      FMCRD는 정상 운전 중의 미세 제어를 맡는 이중 구조가 된다.
      <span class="cite">GDC 26 의 “두 개의 독립 계통” 요건이 노형마다 다르게 구현되는 예다</span>||In a PWR the rods <b>fall by gravity</b> when power is lost; in a BWR they do not.
      So the BWR shutdown system guarantees rapid insertion with <b>hydraulic accumulators</b>,
      while the FMCRD handles fine control in normal operation - two parts, two jobs.
      <span class="cite">An example of GDC 26&#8217;s “two independent systems” taking a different shape in each line</span>]]</blockquote>
  </div>
</div>`});


/* ---------------------------------------------------------------- 세 노형 종합 */
S({tag:'ALL THREE', ov:'[[세 노형 종합 비교||All three, side by side]]',
src:'[[<b>출처</b> 본 교재 9.7절 표 9.2 · NuScale은 US460 기준 · 값은 각 설계의 1차 자료||<b>Source</b> This textbook &#167;9.7, Table 9.2 · NuScale values are US460 · each figure from that design&#8217;s primary source]]',
abbr:'[[<b>일체형 PWR</b> 증기발생기·가압기까지 용기 안에 넣은 가압경수로 · <b>기포 구동</b> 노심에서 생긴 증기 기포의 부력으로 순환시키는 방식 · <b>격리</b> 파단이 나면 밸브로 끊어 막는 대응||<b>integral PWR</b> a PWR with the steam generator and pressuriser inside the vessel · <b>void-driven</b> circulation by the buoyancy of steam voids made in the core · <b>isolation</b> closing valves to shut off a break]]',
html:`<h2 class="t">[[세 설계가 <em>같은 네 문제</em>에 서로 다르게 답했음||Three designs, <em>four shared problems</em>, three different answers]]</h2>
<ul class="b">

<div class="body"><div class="fig">

  <g id="at-tab"></g>
</svg>
</div></div>`,
init(el){

    [TX('모듈당 열출력','Thermal per module'),'250 MWt','540 MWt','870 MWt'],
    [TX('모듈당 전기출력','Electrical per module'),'77 MWe','170 MWe','300 MWe'],
    [TX('1차 순환','Primary circulation'),TX('자연순환','natural'),TX('강제 · RCP 4대','forced, 4 RCPs'),TX('자연순환 · 기포 구동','natural, void-driven')],
    [TX('운전압력','Operating pressure'),'13.8 MPa','15.5 MPa',TX('약 7 MPa','about 7 MPa')],
    [TX('증기발생기','Steam generator'),TX('나선형 2대','helical ×2'),TX('나선형 1대','helical ×1'),TX('없음','none')],
    [TX('대형 LOCA 대응','Large LOCA approach'),TX('배관 제거','pipes removed'),TX('배관 제거','pipes removed'),TX('격리밸브로 격리','isolated by valves')],
    [TX('잔열 제거','Decay heat removal'),'DHRS','PAFS',TX('ICS — 3계열 × 33 MW','ICS - 3 × 33 MW')],
    [TX('격납','Containment'),TX('수조 침지 강재','submerged steel'),TX('소형 강재','small steel'),TX('건식 강판-콘크리트','dry steel-concrete')],
    [TX('붕산','Soluble boron'),TX('사용','used'),TX('미사용','not used'),TX('사용 (BWR 방식)','used, BWR style')],
    [TX('농축도','Enrichment'),TX('4.95% 미만','under 4.95%'),TX('5% 미만','under 5%'),TX('평균 3.81%','3.81% avg')],
    [TX('설계수명','Design life'),TX('60년','60 years'),TX('80년','80 years'),TX('60년','60 years')]
  ];
  const X=[0,330,600,870], COL=['var(--ink-3)','var(--cool)','var(--ok)','var(--amber)'];
  [[TX('항목','Item'),0],['NuScale US460',330],['i-SMR',600],['BWRX-300',870]].forEach((h,i)=>{

  R.forEach((r,i)=>{

  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:260,delay:65*i,fill:'forwards'}));
