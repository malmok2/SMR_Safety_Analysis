<script>
/* ================================================================
   SECTION 07 — i-SMR  (교재 7장)
   ================================================================ */
SECT('07 · [[i-SMR||i-SMR]]');

S({bare:true, cls:'div', ov:'[[&#167;07 i-SMR — 펌프를 남긴 설계||&#167;07 i-SMR - the pump kept in]]',
html:`[[<div class="no">07</div><h2>i-SMR</h2><div class="ln"></div>
<p>한국형 혁신형 소형모듈원자로. NuScale과 같은 일체형이면서 <b>순환 방식·반응도 제어·격납 개념</b>이 다르다.
사양과 계통 구성은 IAEA ARIS에 등록된 설계기술서를 1차 자료로 삼는다.</p>||<div class="no">07</div><h2>i-SMR</h2><div class="ln"></div>
<p>Korea&#8217;s innovative SMR. Integral like NuScale, but different in <b>circulation, reactivity control and containment</b>.
Its specifications come from the Design Status Report lodged with IAEA ARIS.</p>]]`});


/* ---------------------------------------------------------------- 모듈 구성 */
S({tag:'INSIDE THE MODULE', ov:'[[i-SMR 모듈 — 구성 기기와 유로||Inside the i-SMR module - components and flow path]]',
src:'[[<b>출처</b> 본 교재 7.1 · 7.2절 표 7.1 · IAEA ARIS, i-SMR Design Status Report||<b>Source</b> This textbook &#167;&#167;7.1-7.2, Table 7.1 · IAEA ARIS, i-SMR Design Status Report]]',
abbr:'[[<b>RCP</b> 원자로냉각재펌프 · <b>PZR</b> 가압기 · <b>EDV</b> 비상감압밸브 · <b>ERV</b> 비상재순환밸브 · <b>CSB</b> 노심지지배럴 · <b>UGS</b> 상부안내구조물 · <b>ECT</b> 비상냉각수조||<b>RCP</b> reactor coolant pump · <b>PZR</b> pressuriser · <b>EDV</b> emergency depressurisation valve · <b>ERV</b> emergency recirculation valve · <b>CSB</b> core support barrel · <b>UGS</b> upper guide structure · <b>ECT</b> emergency cooling tank]]',
html:`<h2 class="t">[[구조는 같고 <em>구동원만</em> 다름 — 부력 대신 펌프가 돌림||Same structure, <em>different driver</em> - a pump, not buoyancy]]</h2>
<ul class="b">
  <li>[[둘 다 <b>가운데로 올라가 바깥으로 내려오는 고리</b>이고, 둘 다 증기발생기가 그 하강 경로에 놓여 있음||Both are <b>a loop that rises in the middle and falls on the outside</b>, and both put the steam generator on the descending leg]]</li>
  <li>[[다른 것은 <b class="ok">냉각재펌프 4대를 용기에 직접 붙였다</b>는 것. 배관을 없애는 목적은 그대로 달성함||The difference is <b class="ok">four coolant pumps bolted straight onto the vessel</b>. The pipes are still gone]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 440" role="img" aria-label="[[i-SMR 모듈 단면 — 가압기·냉각재펌프 4대·하강관 안의 나선형 증기발생기·노심과 EDV·ERV||An i-SMR module section - pressuriser, four coolant pumps, the helical steam generator inside the downcomer, the core, and the EDV and ERV]]">
    <g id="is-cut"></g>
  </svg>
  </div>
  <div class="side">
    <table class="d sm" id="is-tab"></table>
  </div>
</div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#is-cut'), CX=290;
  /* 강재 격납용기 */
  G.appendChild(mk('rect',{x:CX-140,y:26,width:280,height:378,rx:26,fill:'var(--ground)',
    stroke:'var(--ok)','stroke-width':2}));
  G.appendChild(mk('text',{x:CX-134,y:398,class:'lbl',fill:'var(--ok)'}))
   .textContent=TX('강재 격납용기 · 설계압력 5 MPa','steel containment · 5 MPa design');
  /* 원자로용기 */
  G.appendChild(mk('rect',{x:CX-96,y:48,width:192,height:326,rx:40,fill:'var(--panel)',
    stroke:'var(--rule)','stroke-width':1.6}));
  /* 가압기 */
  G.appendChild(mk('rect',{x:CX-96,y:48,width:192,height:52,rx:38,fill:'var(--hot)',opacity:0.12}));
  G.appendChild(mk('path',{d:'M'+(CX-96)+',100 h192',stroke:'var(--rule)','stroke-width':1.2}));
  /* 냉각재펌프 4대 — 용기 상부에 직결 */
  [-1,1].forEach(s=>{ [0,1].forEach(j=>{
    G.appendChild(mk('rect',{x:CX+s*(84+j*0)-(s<0?36:0),y:112+j*30,width:36,height:22,
      fill:'var(--cool)',opacity:0.55}));
  });});
  /* 노심지지배럴 안쪽 상승 유로 */
  G.appendChild(mk('rect',{x:CX-34,y:118,width:68,height:150,fill:'var(--hot)',opacity:0.16}));
  G.appendChild(mk('rect',{x:CX-34,y:118,width:68,height:150,fill:'none',stroke:'var(--rule)'}));
  /* 하강관 안의 나선형 증기발생기 — 8구역 */
  [-1,1].forEach(s=>{
    for(let k=0;k<4;k++)
      G.appendChild(mk('rect',{x:CX+s*80-(s>0?0:24),y:156+k*26,width:24,height:20,
        fill:'var(--cool)',opacity:0.32}));
  });
  /* 노심 */
  G.appendChild(mk('rect',{x:CX-52,y:280,width:104,height:62,fill:'var(--hot)',opacity:0.30}));
  G.appendChild(mk('rect',{x:CX-52,y:280,width:104,height:62,fill:'none',stroke:'var(--hot)','stroke-width':1.4}));
  /* 유로 */
  const up=mk('path',{d:'M'+CX+',276 V130',fill:'none',stroke:'none'});
  const dn=mk('path',{d:'M'+(CX+68)+',140 V288',fill:'none',stroke:'none'});
  G.appendChild(up); G.appendChild(dn);
  const defs=mk('defs',{}); G.appendChild(defs);
  [['isup','var(--hot)'],['isdn','var(--cool)']].forEach(m=>{
    const a=mk('marker',{id:m[0],viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});
    a.appendChild(mk('path',{d:'M0,0 L10,5 L0,10 z',fill:m[1]})); defs.appendChild(a);
  });
  G.appendChild(mk('path',{d:'M'+CX+',274 V132',fill:'none',stroke:'var(--hot)','stroke-width':2.2,
    'marker-end':'url(#isup)'}));
  G.appendChild(mk('path',{d:'M'+(CX+70)+',142 V284',fill:'none',stroke:'var(--cool)','stroke-width':2.2,
    'marker-end':'url(#isdn)'}));
  const P=[
    ['①',CX-60,   72,'L',TX('가압기 (PZR)','Pressuriser')],
    ['②',CX+72,   64,'R',TX('비상감압밸브 (EDV) ×2','Emergency depressurisation valves &#215;2')],
    ['③',CX,     108,'L',TX('내장형 제어봉구동장치','Internal control rod drives')],
    ['④',CX+84,  122,'R',TX('원자로냉각재펌프 ×4 — 무밀봉 캔드모터','Coolant pumps &#215;4 - sealless canned motor')],
    ['⑤',CX+80,  208,'R',TX('나선형 관류 증기발생기 — 하강관 안, 8구역','Helical once-through SG - in the downcomer, 8 zones')],
    ['⑥',CX,     260,'L',TX('노심지지배럴 (CSB) · 상부안내구조물','Core support barrel and upper guide structure')],
    ['⑦',CX+96,  318,'R',TX('비상재순환밸브 (ERV) ×2','Emergency recirculation valves &#215;2')],
    ['⑧',CX,     312,'L',TX('노심 — 17×17 · 69다발','Core - 17&#215;17, 69 assemblies')]
  ];
  const marks=[];
  P.forEach(p=>{
    const g=mk('g',{opacity:0});
    g.appendChild(mk('path',{d:'M'+p[1]+','+p[2]+' H'+(p[3]==='L'?152:470),fill:'none',
      stroke:'var(--rule)','stroke-width':1,'stroke-dasharray':'2 3'}));
    g.appendChild(mk('circle',{cx:p[1],cy:p[2],r:3.4,fill:'var(--ok)'}));
    const t=mk('text',{x:p[3]==='L'?146:476,y:p[2]+5,'text-anchor':p[3]==='L'?'end':'start',
      'font-family':'var(--mono)','font-size':15,fill:'var(--ok)','font-weight':600});
    t.textContent=p[0]; g.appendChild(t);
    G.appendChild(g); marks.push(g);
  });
  const T=el.querySelector('#is-tab');
  const R=[['①','PZR',TX('1차계통 압력 유지','holds primary pressure')],
           ['②','EDV ×2',TX('고온·고압수를 격납으로','hot high-pressure water to containment')],
           ['③','CRDM',TX('코일·모터가 전부 용기 안','coils and motor all inside')],
           ['④','RCP ×4',TX('무밀봉 캔드모터형','sealless canned motor')],
           ['⑤',TX('증기발생기','Steam generator'),TX('하강관 안 · 8구역','in the downcomer, 8 zones')],
           ['⑥','CSB · UGS',TX('상승 유로 형성 · 노심 지지','forms the riser, supports the core')],
           ['⑦','ERV ×2',TX('응축수를 용기로 회수','returns condensate to the vessel')],
           ['⑧',TX('노심','Core'),TX('17×17 · 69다발','17&#215;17, 69 assemblies')]];
  T.innerHTML=tr(R.map(r=>'<tr><td style="width:26px;color:var(--ok)">'+r[0]+'</td>'
    +'<td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join(''));
  if(RM){ marks.forEach(m=>m.setAttribute('opacity',1)); return; }
  marks.forEach((m,i)=>m.animate([{opacity:0},{opacity:1}],{duration:280,delay:200+90*i,fill:'forwards'}));
  flow(up,{n:5,color:'var(--hot)',r:3.2,speed:0.2});
  flow(dn,{n:5,color:'var(--cool)',r:3.2,speed:0.2});
}});


/* ---------------------------------------------------------------- 관통부를 줄인다 */
S({tag:'FEWER PENETRATIONS', ov:'[[일체형의 본질은 관통부를 줄이는 것||The point of going integral is fewer penetrations]]',
src:'[[<b>출처</b> 본 교재 7.2.2절 · 설계 자료를 읽을 때 <b>용기에 뚫린 구멍의 목록</b>을 세어 보면 그 설계의 성격이 드러남||<b>Source</b> This textbook &#167;7.2.2 · count <b>the holes in the pressure boundary</b> and the character of a design shows itself]]',
abbr:'[[<b>축봉 파손(seal LOCA)</b> 펌프 축 밀봉부가 깨져 냉각재가 새는 사고 경로 · <b>캔드모터</b> 축이 밖으로 나오지 않는 밀폐형 펌프 · <b>관통부</b> 압력경계를 뚫고 지나는 구멍||<b>seal LOCA</b> coolant escaping through a failed pump shaft seal · <b>canned motor</b> a pump whose shaft never leaves the pressure boundary · <b>penetration</b> a hole through the pressure boundary]]',
html:`<h2 class="t">[[일체형의 본질은 &#8220;배관을 없앤다&#8221;보다 <em>&#8220;구멍을 줄인다&#8221;</em>에 가까움||Integral is about <em>removing holes</em>, not pipes]]</h2>
<ul class="b">
  <li>[[세 가지 선택이 전부 <b>같은 방침</b>으로 묶임 — 압력경계를 뚫는 구멍을 줄인다||All three choices fold into <b>one policy</b> - fewer holes through the pressure boundary]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 440" role="img" aria-label="[[하강관 안 증기발생기·무밀봉 캔드모터 펌프·내장형 제어봉구동장치 세 선택과 각각이 없애는 누설 경로||Three choices - steam generator in the downcomer, sealless canned-motor pumps, internal control rod drives - and the leak path each removes]]">
  <g id="fp-cards"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const C=[
    ['var(--cool)',TX('증기발생기가 하강관 안에 있다','The SG sits inside the downcomer'),
     TX('하강 유동이 지나는 자리에 전열면을 두었다. 별도의 셸측 공간을 만들지 않아 용기 부피를 아낀다.',
        'The heat transfer surface sits where the down-flow already passes. No separate shell space, so vessel volume is saved.'),
     TX('없애는 것 — 용기 부피와 그만큼의 벽 두께','What it removes - vessel volume, and the wall thickness that goes with it')],
    ['var(--ok)',TX('펌프가 무밀봉 캔드모터형이다','The pumps are sealless canned motors'),
     TX('대형 PWR의 냉각재펌프는 축봉이 있고, 축봉 파손은 확률론적 안전성평가에서 무시할 수 없는 사고 경로다.',
        'A large PWR coolant pump has a shaft seal, and seal failure is a path that probabilistic safety assessment cannot ignore.'),
     TX('없애는 것 — 축봉 파손(seal LOCA) 경로','What it removes - the seal LOCA path')],
    ['var(--amber)',TX('제어봉구동장치가 용기 안에 있다','The rod drives are inside the vessel'),
     TX('코일 스택·모터·연장축이 전부 용기 내부에 있다. 대형 PWR에서 용기 상부 헤드 관통부 부식은 실제로 큰 문제였다.',
        'Coil stack, motor and extension shaft are all inside. Corrosion of upper-head penetrations has been a real problem in large PWRs.'),
     TX('없애는 것 — 상부 헤드 관통부','What it removes - the upper-head penetrations')]
  ];
  const G=el.querySelector('#fp-cards'), gs=[];
  C.forEach((c,i)=>{
    const g=mk('g',{transform:'translate('+(i*374)+',6)',opacity:0});
    g.appendChild(mk('rect',{width:352,height:420,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:352,height:3,fill:c[0]}));
    const n=mk('text',{x:22,y:42,'font-family':'var(--mono)','font-size':22,fill:c[0],
      'font-weight':600}); n.textContent='①②③'[i]; g.appendChild(n);
    let y=42;
    wrapT(c[1],16).forEach((ln,j)=>{
      const h=mk('text',{x:56,y:y+j*25,'font-family':'var(--sans)','font-size':18.5,
        fill:'var(--ink)','font-weight':600}); h.textContent=ln; g.appendChild(h); });
    y += wrapT(c[1],16).length*25 + 26;
    wrapT(c[2],20).forEach((ln,j)=>{
      const t=mk('text',{x:22,y:y+j*23,'font-family':'var(--sans)','font-size':16,
        fill:'var(--ink-2)','font-weight':300}); t.textContent=ln; g.appendChild(t); });
    /* 없애는 것 — 카드 아래에 고정 */
    g.appendChild(mk('line',{x1:22,y1:322,x2:330,y2:322,stroke:'var(--rule)'}));
    wrapT(c[3],19).forEach((ln,j)=>{
      const t=mk('text',{x:22,y:350+j*23,'font-family':'var(--sans)','font-size':16.5,
        fill:c[0],'font-weight':400}); t.textContent=ln; g.appendChild(t); });
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],
    {duration:400,delay:200*i,fill:'forwards',easing:'ease-out'}));
}});


/* ---------------------------------------------------------------- 사양 */
S({tag:'SPECIFICATIONS', ov:'[[i-SMR 주요 사양 — 설계값과 목표값을 구분||i-SMR specifications - design values and target values kept apart]]',
src:'[[<b>출처</b> 본 교재 7.3절 표 7.2 · IAEA ARIS, i-SMR Design Status Report · 접근일 2026-09-16||<b>Source</b> This textbook &#167;7.3, Table 7.2 · IAEA ARIS, i-SMR Design Status Report · accessed 2026-09-16]]',
abbr:'[[<b>MW(th)</b> 열출력 · <b>MWe</b> 전기출력 · <b>abs</b> 절대압 · <b>무붕산</b> 붕산을 반응도 제어에 쓰지 않는 운전 · <b>안전정지지진</b> 그 값까지 안전기능을 지켜야 하는 지진 세기||<b>MW(th)</b> thermal power · <b>MWe</b> electrical power · <b>abs</b> absolute pressure · <b>soluble-boron-free</b> no boric acid used for reactivity control · <b>SSE</b> safe shutdown earthquake]]',
html:`<h2 class="t">[[<em>목표값</em>과 <em>설계값</em>은 반드시 구분해 적어야 함||<em>Target values</em> and <em>design values</em> must be written apart]]</h2>
<ul class="b">
  <li>[[노심손상빈도는 <b>확률론적 안전성평가로 확인해야 하는 값</b>이지 사양서에 적어 확정되는 값이 아님. 홍보 자료에서 이 구분이 자주 사라짐||Core damage frequency is <b>a value that probabilistic assessment must establish</b>, not one a spec sheet settles. Promotional material often loses the distinction]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 440" role="img" aria-label="[[i-SMR 의 출력·압력·온도·유량·연료·안전계통 사양과, 그와 구분해 표시한 설계 목표값||i-SMR specifications for power, pressure, temperature, flow, fuel and safety systems, with design targets shown separately]]">
  <g id="sp-tab"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#sp-tab'), gs=[];
  const COL=[
    [TX('출력','Power'),'var(--hot)',
     [[TX('모듈당 정격 열출력','Rated thermal per module'),'540 MW(th)'],
      [TX('모듈당 전기출력','Electrical per module'),'170 MWe'],
      [TX('기준 발전소','Reference plant'),TX('4모듈 · 680 MWe','4 modules · 680 MWe')],
      [TX('주기 길이','Cycle length'),TX('24개월','24 months')]]],
    [TX('열수력','Thermal-hydraulics'),'var(--cool)',
     [[TX('1차계통 운전압력','Primary pressure'),'15.5 MPa (abs)'],
      [TX('노심 입구 / 출구','Core inlet / outlet'),'286 / 321 °C'],
      [TX('1차 유량','Primary flow'),'2 658 kg/s'],
      [TX('증기발생기','Steam generator'),TX('나선형 관류 1대 · 8구역','helical once-through, 8 zones')]]],
    [TX('노심·계통','Core and systems'),'var(--ok)',
     [[TX('핵연료','Fuel'),TX('17×17 · 69다발 · 5% 미만','17×17 · 69 assemblies · under 5%')],
      [TX('붕산','Soluble boron'),TX('사용하지 않음','not used')],
      [TX('안전계통','Safety systems'),'PAFS · PECCS · PCCS'],
      [TX('무조작 대처시간','Unattended coping'),TX('72시간 이상','72 hours or more')]]]
  ];
  COL.forEach((c,i)=>{
    const g=mk('g',{transform:'translate('+(i*374)+',0)',opacity:0});
    g.appendChild(mk('rect',{width:352,height:262,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:352,height:3,fill:c[1]}));
    const h=mk('text',{x:22,y:36,class:'lbl',fill:c[1]}); h.textContent=c[0]; g.appendChild(h);
    c[2].forEach((r,j)=>{
      const y=70+j*48;
      const k=mk('text',{x:22,y:y,'font-family':'var(--sans)','font-size':15,fill:'var(--ink-3)',
        'font-weight':300}); k.textContent=r[0]; g.appendChild(k);
      const v=mk('text',{x:22,y:y+22,'font-family':'var(--mono)','font-size':17,fill:'var(--ink)',
        'font-weight':500}); v.textContent=r[1]; g.appendChild(v);
      if(j<3) g.appendChild(mk('line',{x1:22,y1:y+32,x2:330,y2:y+32,stroke:'var(--rule)'}));
    });
    G.appendChild(g); gs.push(g);
