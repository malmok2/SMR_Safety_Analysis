<script>
/* ================================================================
   SECTION 06 — NuScale VOYGR  (교재 6장)
   ================================================================ */
SECT('06 · [[NuScale VOYGR||NuScale VOYGR]]');

S({bare:true, cls:'div', ov:'[[&#167;06 NuScale VOYGR — 펌프를 없앤 설계||&#167;06 NuScale VOYGR - the pump taken out]]',
html:`[[<div class="no">06</div><h2>NuScale VOYGR</h2><div class="ln"></div>
<p>미국에서 처음으로 설계승인을 받은 SMR이다. 원자로·증기발생기·가압기·<b>격납용기까지</b>
하나의 원통에 담았다. 용기 안의 구성 기기부터 시작해 공학적안전설비를 하나씩 뜯어본다.</p>||<div class="no">06</div><h2>NuScale VOYGR</h2><div class="ln"></div>
<p>The first SMR to win a design approval in the United States. Reactor, steam generator, pressuriser
and <b>even the containment</b> in one cylinder. We start inside the vessel and take the safety systems apart one by one.</p>]]`});


/* ---------------------------------------------------------------- 모듈의 크기 */
S({tag:'NPM · DIMENSIONS', ov:'[[NuScale 모듈(NPM)의 구성과 치수||The NuScale Power Module - layout and dimensions]]',
src:'[[<b>출처</b> 본 교재 6.1절 그림 6.1 · 6.2 · 모듈 높이 <b>76 ft(약 23 m)</b> · 직경 <b>15 ft(약 4.6 m)</b>||<b>Source</b> This textbook &#167;6.1, Figs. 6.1-6.2 · module <b>76 ft (about 23 m)</b> tall and <b>15 ft (about 4.6 m)</b> across]]',
abbr:'[[<b>NPM</b> NuScale Power Module · <b>격납용기</b> 방사성물질을 가두는 압력경계 · <b>상승관(riser)</b> 가열된 물이 올라가는 통로||<b>NPM</b> NuScale Power Module · <b>containment</b> the pressure boundary that confines radioactivity · <b>riser</b> the passage the heated water climbs]]',
html:`<h2 class="t">[[NuScale 모듈(<em>NPM</em>)의 구성과 치수||The NuScale Power Module - <em>layout and dimensions</em>]]</h2>
<ul class="b">
  <li>[[바깥 원통이 <b>격납용기</b>, 안쪽이 <b>원자로용기</b>. 가운데 긴 관이 상승관이고 그 옆 환상부에 나선형 증기발생기가 감겨 있음||The outer cylinder is the <b>containment</b>, the inner one the <b>reactor vessel</b>. The long central tube is the riser, with the helical steam generator wound in the annulus beside it]]</li>
  <li>[[사람과 나란히 놓으면 보이는 것 — <b class="cool">수송 가능한 규모</b>임. 공장에서 만들어 옮긴다는 전제가 이 치수에서 나옴||Set beside a person it shows: this is <b class="cool">a transportable size</b>. The whole factory-build premise follows from these dimensions]]</li>
</ul>
<div class="body"><div class="fig">
${PH({src:'f6_01', cap:'[[NPM <b>단면</b>||NPM <b>section</b>]]'},
     {src:'f6_02', cap:'[[<b>높이 23 m · 직경 4.6 m</b>||<b>23 m tall, 4.6 m across</b>]]'},
     {src:'f6_13', cap:'[[<b>공장</b>에서 제작 중||In the <b>factory</b>]]'})}
</div></div>`});


/* ---------------------------------------------------------------- 모듈 단면 */
S({tag:'INSIDE THE MODULE', ov:'[[모듈 내부 구성 기기||Components inside the module]]',
src:'[[<b>출처</b> 본 교재 6.2절 그림 6.3 · 표 6.1 · 붉은 화살표가 가열되어 올라가는 흐름, 푸른 화살표가 식어서 내려가는 흐름임||<b>Source</b> This textbook &#167;6.2, Fig. 6.3 and Table 6.1 · red arrows are the heated upward flow, blue the cooled downward flow]]',
abbr:'[[<b>RVV</b> 원자로 배기밸브 · <b>RRV</b> 원자로 재순환밸브 · <b>CRDM</b> 제어봉구동장치 · <b>CNV</b> 격납용기 · <b>DHRS</b> 잔열제거계통 · <b>CIV</b> 격납격리밸브||<b>RVV</b> reactor vent valve · <b>RRV</b> reactor recirculation valve · <b>CRDM</b> control rod drive · <b>CNV</b> containment vessel · <b>DHRS</b> decay heat removal system · <b>CIV</b> containment isolation valve]]',
html:`<h2 class="t">[[모듈 <em>내부 구성 기기</em>||<em>Components inside</em> the module]]</h2>
<ul class="b">
  <li>[[원자로용기와 격납용기가 <b>이중으로 겹쳐</b> 있고, 두 용기 모두 <b class="cool">수조에 잠겨</b> 있음 — 이 한 가지가 뒤의 모든 안전 논리를 만듦||The reactor vessel and containment are <b>nested</b>, and both sit <b class="cool">submerged in a pool</b>. That one fact drives every safety argument that follows]]</li>
</ul>
<div class="body">
  <div class="fig">
  ${PH({src:'f6_03', cap:'[[NuScale 모듈의 구성 기기 — 두 용기가 겹쳐 있고 둘 다 수조에 잠겨 있다||The NuScale module component by component - two nested vessels, both submerged]]'})}
  </div>
  <div class="side">
    <table class="d sm" id="np-tab"></table>
  </div>
</div>`,
init(el){
  const T=el.querySelector('#np-tab');
  const R=[['CRDM',TX('상부 헤드 · 전원 상실 시 중력 낙하','upper head; gravity drop on loss of power')],
           [TX('가압기','Pressuriser'),TX('용기 최상부 증기공간','steam space at the very top')],
           ['RVV ×2',TX('가압기 영역 · 증기를 격납으로','pressuriser region; vents steam to containment')],
           [TX('증기발생기 ×2','Steam generators ×2'),TX('상승관 바깥 환상부 · 두 대가 독립','in the annulus; two independent units')],
           [TX('상승관','Riser'),TX('노심 위 중앙 · 높이차의 근원','centre, above the core; source of the head')],
           [TX('하강관','Downcomer'),TX('용기 벽과 상승관 사이','between vessel wall and riser')],
           ['RRV ×2',TX('하강관 높이의 용기 측면','vessel side, at downcomer level')],
           [TX('노심','Core'),TX('연료 37다발 · 유효높이 약 2 m','37 assemblies, about 2 m active')],
           ['CNV',TX('압력경계 + 사고 시 응축면','pressure boundary and condensing surface')],
           [TX('수조','Pool'),TX('최종 열침원 · 차폐 · 이송 경로','heat sink, shielding, transport route')],
           ['CIV',TX('전부 피동 fail-closed','all passive, fail-closed')]];
  T.innerHTML = tr(R.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join(''));
}});


/* ---------------------------------------------------------------- 왜 용기가 길어야 하는가 */
S({tag:'FLOW vs HEIGHT', ov:'[[자연순환 유량과 용기 높이||Natural-circulation flow and vessel height]]',
src:'[[<b>출처</b> 본 교재 6.3절 · 구동수두 <code>Δp = (ρ<sub>c</sub> − ρ<sub>h</sub>) g H</code>가 유로 압력손실 <code>K ṁ² / 2ρA²</code>과 같아지는 곳에서 유량이 정해짐||<b>Source</b> This textbook &#167;6.3 · flow settles where the driving head <code>&#916;p = (&#961;<sub>c</sub> &#8722; &#961;<sub>h</sub>) g H</code> equals the loop loss <code>K &#7745;&#178; / 2&#961;A&#178;</code>]]',
abbr:'[[<b>H</b> 열원(노심) 중심과 열침원(증기발생기) 중심 사이의 높이차 · <b>K</b> 유로 전체의 압력손실 계수 · <b>ρ<sub>c</sub> · ρ<sub>h</sub></b> 찬 쪽과 더운 쪽의 밀도||<b>H</b> height between the centre of the core and the centre of the steam generator · <b>K</b> total loop loss coefficient · <b>&#961;<sub>c</sub>, &#961;<sub>h</sub></b> cold-side and hot-side density]]',
html:`<h2 class="t">[[자연순환 유량과 <em>용기 높이</em>||Natural-circulation flow and <em>vessel height</em>]]</h2>
<ul class="b">
  <li>[[펌프를 없애면 순환은 부력이 만듦. 유량이 <b class="cool">높이차의 제곱근에 비례</b>함 — 이것이 가늘고 긴 형상의 이유임||Drop the pump and buoyancy drives the loop. Flow goes as <b class="cool">the square root of the height</b> - hence the long, slim shape]]</li>
  <li>[[압력손실 계수 <b>K</b>를 줄이는 일도 높이를 벌리는 일만큼 중요함 — <b class="ok">CFD가 실제로 쓰이는 지점</b>임||Cutting the loss coefficient <b>K</b> matters as much as adding height - <b class="ok">this is where CFD actually earns its keep</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 412" role="img" aria-label="[[높이차에 따라 자연순환 유량이 제곱근으로 늘어나는 곡선과 NuScale 모듈의 위치||Natural-circulation flow against height, rising as a square root, with the NuScale module marked]]">
    <g id="nh-plot"></g>
  </svg>
  </div>
  <div class="side">
    <div class="formula" style="font-size:18px;padding:4px 0">ṁ ∝ √( Δρ · H )</div>
    <div class="ctl"><label>[[높이차 H||Height H]] <span id="nh-hv">17.0 m</span></label>
      <input id="nh-h" type="range" min="2" max="30" value="17" step="0.5"></div>
    <div class="readout hi"><span class="k">[[상대 유량||Relative flow]]</span>
      <span class="v" id="nh-q">1.00 <small>&#215;</small></span></div>
    <div class="readout"><span class="k">[[같은 유량에 필요한 높이||Height for the same flow]]</span>
      <span class="v" id="nh-n" style="font-size:20px">[[기준||reference]]</span></div>
    <blockquote class="q" style="font-size:15px;padding:10px 14px">[[모듈이 직경 4.6 m 에 높이 23 m — 가늘고 긴 이유가 여기 있음.
      <b>펌프를 없앤 대가를 형상으로 치른 것</b>임.||The module is 4.6 m across and 23 m tall. <b>The price of dropping the pump is paid in shape.</b>]]</blockquote>
  </div>
</div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#nh-plot');
  const X0=74, X1=756, Y0=336, Y1=36, HMAX=30;
  const X=h=>X0+h/HMAX*(X1-X0), Y=q=>Y0-q/1.4*(Y0-Y1);
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X1,y2:Y0,class:'axis'}));
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X0,y2:Y1,class:'axis'}));
  for(let h=0;h<=HMAX;h+=5){
    G.appendChild(mk('line',{x1:X(h),y1:Y0,x2:X(h),y2:Y0+6,class:'axis'}));
    const e=mk('text',{x:X(h),y:Y0+24,'text-anchor':'middle',class:'lbl'});
    e.textContent=String(h); G.appendChild(e);
  }
  [0.5,1.0].forEach(q=>{
    G.appendChild(mk('line',{x1:X0,y1:Y(q),x2:X1,y2:Y(q),class:'grid'}));
    const e=mk('text',{x:X0-10,y:Y(q)+4,'text-anchor':'end',class:'lbl'});
    e.textContent=q.toFixed(1)+'×'; G.appendChild(e);
  });
  G.appendChild(mk('text',{x:X1,y:Y0+50,'text-anchor':'end',class:'lbl'}))
   .textContent=TX('열원과 열침원의 높이차 H (m)','height between core and steam generator, H (m)');
  const pts=[]; for(let i=0;i<=60;i++){ const h=HMAX*i/60; pts.push([X(h),Y(Math.sqrt(h/17))]); }
  const cv=mk('polyline',{points:poly(pts),fill:'none',stroke:'var(--cool)','stroke-width':2.6});
  G.appendChild(cv);
  /* 기준점 — NuScale 모듈 */
  G.appendChild(mk('circle',{cx:X(17),cy:Y(1),r:6,fill:'var(--ok)'}));
  G.appendChild(mk('text',{x:X(17)+14,y:Y(1)-12,'font-family':'var(--sans)','font-size':16,
    fill:'var(--ok)','font-weight':500})).textContent=TX('NuScale 모듈 — 높이 23 m 급','NuScale module - 23 m class');
  const gl=mk('line',{x1:X(17),y1:Y0,x2:X(17),y2:Y(1),stroke:'var(--ok)','stroke-width':1,
    'stroke-dasharray':'3 4'}); G.appendChild(gl);
  const dot=mk('circle',{cx:X(17),cy:Y(1),r:8,fill:'none',stroke:'var(--cool)','stroke-width':2.4});
  G.appendChild(dot);
  const drop=mk('line',{x1:X(17),y1:Y0,x2:X(17),y2:Y(1),stroke:'var(--cool)','stroke-width':1.4});
  G.appendChild(drop);

  const h=el.querySelector('#nh-h'), hv=el.querySelector('#nh-hv'),
        q=el.querySelector('#nh-q'), n=el.querySelector('#nh-n');
  function upd(){
    const H=+h.value, Q=Math.sqrt(H/17);
    hv.textContent=fmt(H,1)+' m';
    q.innerHTML=fmt(Q,2)+' <small>&#215;</small>';
    dot.setAttribute('cx',X(H)); dot.setAttribute('cy',Y(Q));
    drop.setAttribute('x1',X(H)); drop.setAttribute('x2',X(H)); drop.setAttribute('y2',Y(Q));
    n.innerHTML = fmt(17*Q*Q,1)+' <small>m</small>';
  }
  h.oninput=upd; upd();
  if(RM) return;
  const L=cv.getTotalLength(); cv.style.strokeDasharray=L; cv.style.strokeDashoffset=L;
  cv.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,delay:200,fill:'forwards'});
}});


/* ---------------------------------------------------------------- 세 가지 유로 */
S({tag:'THREE FLOW MODES', ov:'[[운전 모드별 유로 — 정상 · DHRS · ECCS||Flow path by mode - normal, DHRS, ECCS]]',
src:'[[<b>출처</b> 본 교재 6.4절 그림 6.4 · 6.5 · (A) 정상운전 자연순환 (B) 잔열제거계통 (C) 비상노심냉각계통||<b>Source</b> This textbook &#167;6.4, Figs. 6.4-6.5 · (A) normal natural circulation, (B) DHRS, (C) ECCS]]',
abbr:'[[<b>DHRS</b> 잔열제거계통 — 2차측에서 도는 닫힌 고리 · <b>ECCS</b> 비상노심냉각계통 · <b>RVV</b> 원자로 배기밸브 · <b>RRV</b> 원자로 재순환밸브||<b>DHRS</b> Decay Heat Removal System, a closed loop on the secondary side · <b>ECCS</b> Emergency Core Cooling System · <b>RVV</b> reactor vent valve · <b>RRV</b> reactor recirculation valve]]',
html:`<h2 class="t">[[운전 모드별 유로 — <em>정상 · DHRS · ECCS</em>||Flow path by mode - <em>normal, DHRS, ECCS</em>]]</h2>
<ul class="b">
  <li>[[정상 &#8594; 과도 &#8594; 사고로 가면서 <b>같은 용기 안에서 경로만 바뀜</b>. 밖에서 물을 넣는 단계가 없음||Normal &#8594; transient &#8594; accident: <b>only the path changes, inside the same vessel</b>. At no point is water pumped in from outside]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 412" role="img" aria-label="[[정상운전·잔열제거·비상노심냉각 세 모드에서 냉각재가 지나는 경로||The coolant path in normal operation, decay heat removal and emergency core cooling]]">
    <g id="nm-fig"></g>
  </svg>
  </div>
  <div class="side">
    <div class="btnrow" style="flex-direction:column">
      <button class="btn act" id="nm-a" style="text-align:left">[[A · 정상운전 — 자연순환||A &#183; Normal - natural circulation]]</button>
      <button class="btn" id="nm-b" style="text-align:left">[[B · 과도 — DHRS 비등·응축||B &#183; Transient - DHRS boil and condense]]</button>
      <button class="btn" id="nm-c" style="text-align:left">[[C · 사고 — ECCS 비등·응축||C &#183; Accident - ECCS boil and condense]]</button>
    </div>
    <div class="readout" id="nm-out"><span class="k" id="nm-k">[[무엇이 일어나는가||what happens]]</span>
      <span class="v" id="nm-v" style="font-size:16px;line-height:1.45"></span></div>
  </div>
</div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#nm-fig'), CX=290;
  G.appendChild(mk('rect',{x:0,y:12,width:600,height:392,fill:'var(--cool)',opacity:0.07}));
  G.appendChild(mk('rect',{x:CX-118,y:28,width:236,height:352,rx:100,fill:'var(--ground)',
    stroke:'var(--ok)','stroke-width':2}));
  G.appendChild(mk('rect',{x:CX-86,y:48,width:172,height:312,rx:74,fill:'var(--panel)',
    stroke:'var(--rule)','stroke-width':1.6}));
  G.appendChild(mk('rect',{x:CX-26,y:126,width:52,height:146,fill:'var(--hot)',opacity:0.14}));
  G.appendChild(mk('rect',{x:CX-44,y:280,width:88,height:58,fill:'var(--hot)',opacity:0.30}));
  G.appendChild(mk('rect',{x:CX-44,y:280,width:88,height:58,fill:'none',stroke:'var(--hot)','stroke-width':1.4}));
  [-1,1].forEach(s=>G.appendChild(mk('rect',{x:CX+s*72-(s>0?0:26),y:134,width:26,height:104,
    fill:'var(--cool)',opacity:0.26})));
  /* DHRS 응축기 — 격납 밖, 수조 안 */
  G.appendChild(mk('rect',{x:454,y:96,width:58,height:96,fill:'var(--panel)',stroke:'var(--ok)','stroke-width':1.4}));
  G.appendChild(mk('text',{x:483,y:210,'text-anchor':'middle',class:'lbl',fill:'var(--ok)'}))
   .textContent=TX('DHRS 응축기','DHRS condenser');
  G.appendChild(mk('text',{x:14,y:396,class:'lbl',fill:'var(--cool)'}))
   .textContent=TX('원자로건물 수조','reactor building pool');
  /* 세 경로 */
  const pA=mk('path',{d:'M'+CX+',276 V140',fill:'none',stroke:'none'});
  const pA2=mk('path',{d:'M'+(CX+62)+',140 V286',fill:'none',stroke:'none'});
  const pB=mk('path',{d:'M'+(CX+72)+',140 H454 M454,178 H'+(CX+72),fill:'none',stroke:'none'});
  const pC=mk('path',{d:'M'+CX+',70 H'+(CX+106)+' V330 H'+(CX+44),fill:'none',stroke:'none'});
  [pA,pA2,pB,pC].forEach(p=>G.appendChild(p));
  const vA =flow(pA ,{n:5,color:'var(--hot)', r:3.4,speed:0.13});
  const vA2=flow(pA2,{n:5,color:'var(--cool)',r:3.4,speed:0.13});
  const vB =flow(pB ,{n:6,color:'var(--ok)',  r:3.4,speed:0.16});
  const vC =flow(pC ,{n:7,color:'var(--hot-2)',r:3.6,speed:0.18});
  const rvv=mk('circle',{cx:CX,cy:70,r:7,fill:'var(--hot-2)',opacity:0});
  const rrv=mk('circle',{cx:CX+44,cy:330,r:7,fill:'var(--cool)',opacity:0});
  G.appendChild(rvv); G.appendChild(rrv);
  const k=el.querySelector('#nm-k'), v=el.querySelector('#nm-v'), out=el.querySelector('#nm-out');
  const M={
    a:['var(--cool)',TX('정상운전 · 자연순환','Normal &#183; natural circulation'),
       TX('노심에서 가열 → 상승관 → 가압기 배플판에서 방향 전환 → 증기발생기 셸측을 지나며 열을 넘김 → 하강관 → 노심. 펌프는 어디에도 없다.',
          'Heated in the core, up the riser, turned at the pressuriser baffle, down past the steam generator shell side, down the downcomer, back to the core. No pump anywhere.')],
    b:['var(--ok)',TX('과도 · DHRS','Transient &#183; DHRS'),
       TX('주증기·급수 격리밸브가 닫히고 DHRS 격리밸브가 열린다. 2차측에서만 도는 닫힌 고리다. 응축기가 수조에 잠겨 있어 응축수는 중력으로 돌아온다.',
          'The main steam and feed isolation valves shut and the DHRS valves open. A closed loop entirely on the secondary side; the condenser sits in the pool and the condensate returns by gravity.')],

S({tag:'DHRS', ov:'[[DHRS — 2계열 × 100 % 구성||DHRS - two trains, each rated 100%]]',
src:'[[<b>출처</b> 본 교재 6.5.1절 표 6.2 · 각 계열이 붕괴열 전량(100%)을 제거할 수 있음||<b>Source</b> This textbook &#167;6.5.1, Table 6.2 · each train alone can remove the full decay heat]]',

    g.appendChild(mk('text',{x:cx,y:250,'text-anchor':'middle',class:'lbl',fill:'var(--ok)'}))
     .textContent=TX('DHRS 응축기 '+t[1],'DHRS condenser '+t[1]);
    g.appendChild(mk('text',{x:cx,y:386,'text-anchor':'middle',class:'lbl',fill:'var(--cool)'}))

    const p=mk('path',{d: s<0 ? 'M486,120 H'+(cx+42)+' M'+(cx+42)+',200 H486'

    const h=mk('text',{x:48,y:34,'font-family':'var(--sans)','font-size':18.5,fill:s[0],
      'font-weight':600}); h.textContent=s[1]; g.appendChild(h);
    wrapT(s[2],30).slice(0,2).forEach((ln,j)=>{

/* ---------------------------------------------------------------- 최종 열침원 */
S({tag:'ULTIMATE HEAT SINK', ov:'[[최종 열침원 — 수조 · 비등 · 공랭||The ultimate heat sink - pool, boiling, air]]',
src:'[[<b>출처</b> 본 교재 6.5.5절 표 6.3 · 6.6절 · 수조 약 280만 갤런(6모듈) · ELAP 해석에서 99일까지 노심 위 수위 유지||<b>Source</b> This textbook &#167;&#167;6.5.5 (Table 6.3) and 6.6 · about 2.8 million gallons for six modules; the ELAP analysis keeps water above the core to 99 days]]',
abbr:'[[<b>ELAP</b> 장기 교류전원상실 — 설계기준을 넘는 시나리오 · <b>붕괴열</b> 정지 후에도 핵분열 생성물이 계속 내는 열 · <b>최종 열침원</b> 열이 마지막에 버려지는 곳||<b>ELAP</b> Extended Loss of AC Power, a beyond-design-basis scenario · <b>decay heat</b> heat from fission products after shutdown · <b>ultimate heat sink</b> where the heat finally goes]]',
html:`<h2 class="t">[[<em>최종 열침원</em> — 수조 · 비등 · 공랭||The <em>ultimate heat sink</em> - pool, boiling, air]]</h2>
<ul class="b">
  <li>[[정지 직후의 붕괴열은 공랭으로 감당되지 않음. <b>물 &#8594; 비등 &#8594; 공랭</b>의 순서와 시점이 설계의 본체임||Air cooling cannot carry the decay heat right after shutdown. <b>Water &#8594; boiling &#8594; air</b>, in that order and at those times, is the design]]</li>
  <li>[[MW당 보유 수량이 기존 PWR의 <b class="cool">약 4배</b>임. 분모가 4배면 <b>온도 상승률이 1/4</b> — 대처시간은 이 식 하나로 정해짐||Water inventory per MW is about <b class="cool">four times</b> a conventional PWR&#8217;s. Four times the denominator means <b>a quarter of the temperature rise rate</b> - that one relation sets the coping time]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 412" role="img" aria-label="[[붕괴열이 시간에 따라 줄어드는 곡선 위에 물 냉각·비등·공랭 구간을 표시한 그림||Decay heat falling with time, with the water, boiling and air-cooled stretches marked]]">
    <g id="uh-plot"></g>
  </svg>
  </div>
  <div class="side">
    <div class="formula" style="font-size:19px;padding:4px 0">dT/dt = Q<sub>decay</sub> / M c<sub>p</sub></div>
    <table class="d sm">
      <tr><td>[[수조 용량 (6모듈)||Pool (6 modules)]]</td><td class="n">[[약 280만 갤런||about 2.8 M gal]]</td></tr>
      <tr><td>[[전 모듈 붕괴열 흡수||Full decay heat absorbed]]</td><td class="n">[[30일 이상||30+ days]]</td></tr>
      <tr><td>[[30일 이후||After 30 days]]</td><td class="n">[[증발 + 공랭||evaporation + air]]</td></tr>
      <tr class="mark"><td>[[ELAP 해석 결과||ELAP analysis]]</td><td class="n">[[99일까지 확인||verified to 99 days]]</td></tr>
    </table>
    <blockquote class="q" style="font-size:14.5px;padding:10px 14px">[[발표에서 이 그림을 쓸 때는 <b>반드시 시간축을 함께</b> 보여야 함.
      마지막 상태만 떼어 인용하면 틀린 인상을 줌.||When you show this, <b>always show the time axis with it</b>.
      Quoting the final state alone gives a false impression.]]</blockquote>
  </div>
</div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#uh-plot');
  const X0=74, X1=756, Y0=320, Y1=40;
  const X=t=>X0+(Math.log10(Math.max(t,1))/Math.log10(8.64e7))*(X1-X0);   /* 1 s ~ 1 000 일 */
  const Y=f=>Y0-(Math.log10(Math.max(f,1e-4))+4)/4*(Y0-Y1);
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X1,y2:Y0,class:'axis'}));
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X0,y2:Y1,class:'axis'}));
  [[1,'1 s'],[3600,TX('1시간','1 h')],[86400,TX('1일','1 d')],[2.59e6,TX('30일','30 d')],
   [3.15e7,TX('1년','1 y')]].forEach(t=>{
    G.appendChild(mk('line',{x1:X(t[0]),y1:Y0,x2:X(t[0]),y2:Y0+6,class:'axis'}));
    const e=mk('text',{x:X(t[0]),y:Y0+24,'text-anchor':'middle',class:'lbl'});
    e.textContent=t[1]; G.appendChild(e);
  });
  [[0.1,'10%'],[0.01,'1%'],[0.001,'0.1%']].forEach(f=>{
    G.appendChild(mk('line',{x1:X0,y1:Y(f[0]),x2:X1,y2:Y(f[0]),class:'grid'}));
    const e=mk('text',{x:X0-10,y:Y(f[0])+4,'text-anchor':'end',class:'lbl'});
    e.textContent=f[1]; G.appendChild(e);
  });
  G.appendChild(mk('text',{x:X0-10,y:Y1+4,'text-anchor':'end',class:'lbl'})).textContent=
    TX('정격 대비','of rated');
  const pts=[]; for(let i=0;i<=120;i++){ const t=Math.pow(10,i/120*Math.log10(8.64e7));
    pts.push([X(t),Y(decay(t))]); }
  const cv=mk('polyline',{points:poly(pts),fill:'none',stroke:'var(--hot)','stroke-width':2.6});
  G.appendChild(cv);
  /* 세 구간 */
  const Z=[[1,2.59e6,'var(--cool)',TX('물 냉각 — 수조가 흡수','water - the pool absorbs it')],
           [2.59e6,1.0e7,'var(--amber)',TX('비등','boiling')],
           [1.0e7,8.64e7,'var(--ok)',TX('공랭','air-cooled')]];
  const bands=[];
  Z.forEach((z,i)=>{
    const g=mk('g',{opacity:0});
    g.appendChild(mk('rect',{x:X(z[0]),y:Y1,width:X(z[1])-X(z[0]),height:Y0-Y1,fill:z[2],opacity:0.12}));
    g.appendChild(mk('line',{x1:X(z[1]),y1:Y1,x2:X(z[1]),y2:Y0,stroke:z[2],'stroke-width':1,
      'stroke-dasharray':'4 4'}));
    const t=mk('text',{x:(X(z[0])+X(z[1]))/2,y:Y1-10,'text-anchor':'middle',class:'lbl',fill:z[2]});
    t.textContent=z[3]; g.appendChild(t);
    G.appendChild(g); bands.push(g);
  });
  G.appendChild(mk('text',{x:X1,y:Y0+50,'text-anchor':'end',class:'lbl'}))
   .textContent=TX('정지 후 시간 (로그)','time after shutdown (log)');
  const note=mk('text',{x:X0,y:390,'font-family':'var(--sans)','font-size':16,
    fill:'var(--ink-2)','font-weight':300,opacity:0}); G.appendChild(note);
  note.textContent=TX('펌프 없음 · 외부 전원 없음 · 외부 급수 없음 — 그 조건에서 셋을 차례로 넘어간다',
                      'No pump, no external power, no external water - it moves through the three in turn');
  if(RM){ bands.forEach(b=>b.setAttribute('opacity',1)); note.setAttribute('opacity',1); return; }
  const L=cv.getTotalLength(); cv.style.strokeDasharray=L; cv.style.strokeDashoffset=L;
  cv.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,fill:'forwards'});
  bands.forEach((b,i)=>b.animate([{opacity:0},{opacity:1}],
    {duration:400,delay:700+250*i,fill:'forwards'}));
  note.animate([{opacity:0},{opacity:1}],{duration:400,delay:1250,fill:'forwards'});
}});

S({tag:'HELICAL COIL SG', ov:'[[나선형 관류 증기발생기||The helical once-through steam generator]]',
src:'[[<b>출처</b> 본 교재 6.8절 그림 6.11 · 6.12 · 1차측이 관 바깥(셸측), 2차측이 관 안을 지나는 <b>관류식</b>임||<b>Source</b> This textbook &#167;6.8, Figs. 6.11-6.12 · primary on the shell side, secondary inside the tubes - a <b>once-through</b> design]]',
abbr:'[[<b>관류식</b> 한 번 지나가며 물이 증기로 바뀌는 방식 · <b>셸측</b> 관 다발 바깥 공간 · <b>다공성 매질 근사</b> 관 하나하나 대신 덩어리로 푸는 모델||<b>once-through</b> water becomes steam in a single pass · <b>shell side</b> outside the tube bundle · <b>porous-medium approximation</b> modelling the bundle as a block]]',
html:`<h2 class="t">[[<em>나선형 관류 증기발생기</em>||The <em>helical once-through steam generator</em>]]</h2>
<ul class="b">
  <li>[[일체형에서는 증기발생기를 <b>용기 안에 넣어야</b> 하므로 부피가 절대적 제약임. 여기서 나선형이 유리함||In an integral design the steam generator <b>must fit inside the vessel</b>, so volume is the binding constraint - and that is where helical wins]]</li>
  <li>[[관 안은 관류식으로 끓고, 관 바깥은 <b>경사 교차류</b>임. 이 둘이 겹치는 곳의 열전달 예측이 <b class="hot">일체형 SMR 해석의 난제</b>임||Once-through boiling inside the tubes, <b>inclined cross-flow</b> outside. Where they meet is <b class="hot">the hard problem of integral SMR analysis</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  ${PH({src:'f6_11', w:1, cap:'[[나선형 <b>코일</b>||The helical <b>coil</b>]]'},
       {src:'f6_12', w:2, cap:'[[증기발생기 <b>실물</b> — 두 개의 독립 관다발||The <b>real thing</b> - two independent bundles]]'})}
  </div>
  <div class="side">
    <blockquote class="q">[[나선형 증기발생기의 열수력 해석은 <b>THINK Lab 이 i-SMR 과제에서 다루고 있는 주제</b>다.
      관 다발 바깥을 지나는 유동은 관군을 비스듬히 가로지르는 <b>경사 교차류</b>이고,
      관다발이 커지면 관 하나하나를 모델링할 수 없어 <b>다공성 매질 근사</b>를 쓴다.
      <span class="cite">ATHOS 계열 코드가 그 목적으로 쓰인다</span>||The thermal-hydraulics of helical steam generators is <b>a THINK Lab topic on the i-SMR project</b>.

      <span class="cite">ATHOS-class codes are used for this</span>]]</blockquote>
  </div>
</div>`});

<div class="body"><div class="fig">
<svg viewBox="0 0 1120 410" role="img" aria-label="[[2016년 설계인증신청부터 2026년 루마니아 최종투자결정까지의 경과를 시간축에 놓은 그림||A timeline from the 2016 design certification application to the 2026 Romanian final investment decision]]">
  <g id="lc-time"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#lc-time');
  const E=[
    ['2016-12','var(--ink-3)',TX('US600 설계인증신청(DCA) 제출','US600 design certification application filed')],
    ['2020-09','var(--ok)',   TX('US600 설계 승인 — 미국 최초의 SMR 설계승인','US600 approved - the first SMR design approval in the US')],
    ['2023-01','var(--ink-3)',TX('US460 표준설계승인(SDA) 신청 접수','US460 standard design approval application docketed')],
    ['2025-05','var(--ok)',   TX('US460 SDA 승인 — 당초 일정보다 2개월 조기','US460 approved - two months ahead of schedule')],
    ['2026-02','var(--amber)',TX('루마니아 Doicești 최종투자결정(FID) — 조건부','Romania Doicesti final investment decision - conditional')]
  ];
  const Y=96, X0=150, X1=970;
  G.appendChild(mk('line',{x1:X0,y1:Y,x2:X1,y2:Y,class:'axis'}));
  const gs=[];
  E.forEach((e,i)=>{
    const x=X0+i*(X1-X0)/(E.length-1), g=mk('g',{opacity:0});
    g.appendChild(mk('circle',{cx:x,cy:Y,r:7,fill:e[1]}));
    const d=mk('text',{x:x,y:Y-22,'text-anchor':'middle','font-family':'var(--mono)','font-size':15,
      fill:e[1],'font-weight':600}); d.textContent=e[0]; g.appendChild(d);
    wrapT(e[2],13).forEach((ln,j)=>{
      const t=mk('text',{x:x,y:Y+34+j*22,'text-anchor':'middle','font-family':'var(--sans)',
        'font-size':16,fill:'var(--ink-2)','font-weight':300}); t.textContent=ln; g.appendChild(t); });
    G.appendChild(g); gs.push(g);
  });
  /* 아래 — 결정의 종류를 구분한다 */
  const K=[['var(--ok)',   TX('설계승인이 보장하는 것','What a design approval guarantees'),
            TX('규제기관이 그 설계의 안전성을 검토해 받아들였다는 것. 어디에 언제 지어지는지는 말하지 않는다.',
               'That the regulator reviewed and accepted the design’s safety. It says nothing about where or when anything gets built.')],
           ['var(--amber)',TX('FID 가 보장하는 것','What an FID guarantees'),
            TX('사업자가 투자를 결정했다는 것. 조건부인 경우가 흔하고 조건은 대개 비공개다. 착공이 아니다.',
               'That the owner has decided to invest. It is often conditional, the conditions are usually private, and it is not a construction start.')]];
  K.forEach((k,i)=>{
    const g=mk('g',{transform:'translate('+(60+i*512)+',224)',opacity:0});
    g.appendChild(mk('rect',{width:488,height:150,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:488,height:3,fill:k[0]}));
    const h=mk('text',{x:22,y:42,'font-family':'var(--sans)','font-size':19,fill:k[0],
      'font-weight':600}); h.textContent=k[1]; g.appendChild(h);
    wrapT(k[2],27).forEach((ln,j)=>{
      const t=mk('text',{x:22,y:76+j*24,'font-family':'var(--sans)','font-size':17,
        fill:'var(--ink-2)','font-weight':300}); t.textContent=ln; g.appendChild(t); });
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],
    {duration:340,delay:150*i,fill:'forwards',easing:'ease-out'}));
}});
</script>
