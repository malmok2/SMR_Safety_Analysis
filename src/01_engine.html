<script>
/* ================================================================
   덱 엔진 — 슬라이드 등록·렌더·내비게이션, 애니메이션 프리미티브
   ================================================================ */
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const D = [];                       // 슬라이드 목록
const SEC = [];                     // 섹션 경계 { at, name }
function S(o){ D.push(o); return D.length-1; }
function SECT(name){ SEC.push({at:D.length, name}); }

/* ---------- 정리 대상(슬라이드 떠날 때 멈춤) ---------- */
let CLEAN = [];
function onClean(fn){ CLEAN.push(fn); }
function raf(fn){
  let id, t0 = performance.now(), live = true;
  function step(t){ if(!live) return; fn((t-t0)/1000, t); id = requestAnimationFrame(step); }
  id = requestAnimationFrame(step);
  onClean(()=>{ live=false; cancelAnimationFrame(id); });
  return ()=>{ live=false; cancelAnimationFrame(id); };
}

/* ---------- 수치 유틸 ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function decay(t,t0=1e8){ return 0.0622*(Math.pow(t,-0.2)-Math.pow(t+t0,-0.2)); }
function rhoW(T){ return 1006.0-0.2646*T-0.002424*T*T; }

/* ---------- SVG 경로 위를 흐르는 입자 ---------- */
function flow(path, opt={}){
  const n=opt.n||10, col=opt.color||'var(--cool)', r=opt.r||3.6;
  const L=path.getTotalLength(), g=path.ownerSVGElement, dots=[];
  const layer=document.createElementNS('http://www.w3.org/2000/svg','g');
  path.parentNode.appendChild(layer);
  for(let i=0;i<n;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',r); c.setAttribute('fill',col); layer.appendChild(c); dots.push(c);
  }
  const st={speed:opt.speed==null?0.14:opt.speed, on:true, dir:1};
  raf((t)=>{
    for(let i=0;i<n;i++){
      let p=((t*st.speed*st.dir)+i/n)%1; if(p<0)p+=1;
      const pt=path.getPointAtLength(p*L);
      dots[i].setAttribute('cx',pt.x); dots[i].setAttribute('cy',pt.y);
      dots[i].setAttribute('opacity', st.on? (opt.fade? 0.35+0.65*Math.sin(Math.PI*p):1) : 0);
    }
  });
  st.el=layer; return st;
}

/* ---------- 값이 부드럽게 따라가는 판독기 ---------- */
function track(obj,key,get,k=6){
  raf((t,abs)=>{ obj[key]=lerp(obj[key],get(),Math.min(1,k*0.016)); });
}

/* ---------- 선 그래프 ---------- */
function poly(pts){ return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }

/* ---------- 렌더 ---------- */
const stage=document.getElementById('stage');
let cur=-1;
function go(i,dir){
  i=clamp(i,0,D.length-1); if(i===cur) return;
  CLEAN.forEach(f=>{try{f()}catch(e){}}); CLEAN=[];
  cur=i; const s=D[i];
  const sec = SEC.filter(x=>x.at<=i).slice(-1)[0];
  stage.innerHTML =
    '<div class="slide on'+(s.cls?' '+s.cls:'')+'">'
    + (s.bare? '' :
      '<div class="rail"><span class="tag">'+(s.tag||(sec?sec.name:''))+'</span>'
      +'<span class="sp"></span><span class="num">'+String(i+1).padStart(2,'0')+' / '+D.length+'</span></div>')
    + s.html
    + (s.bare? '' :
      '<div class="foot"><span class="src">'+(s.src||'')+'</span><span class="sp"></span>'
      +'<span class="brand">THINK LAB · HANYANG</span></div>')
    + '</div>';
  document.getElementById('prog').style.width=((i+1)/D.length*100)+'%';
  if(s.init){ try{ s.init(stage.querySelector('.slide')); }catch(e){ console.error(e); } }
}
function replay(){ const i=cur; cur=-1; go(i); }

/* ---------- 스케일 ---------- */
function fit(){
  const k=Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform='scale('+k+')';
}
addEventListener('resize',fit); fit();

/* ---------- 내비게이션 ---------- */
addEventListener('keydown',e=>{
  const ov=document.getElementById('ov');
  if(e.key==='Escape'){ ov.classList.remove('on'); return; }
  if(e.key==='o'||e.key==='O'){ ov.classList.toggle('on'); return; }
  if(ov.classList.contains('on')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(D.length-1); }
  else if(e.key==='r'||e.key==='R'){ replay(); }
  else if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
});
addEventListener('click',e=>{
  if(e.target.closest('input,button,#ov,label')) return;
  if(document.getElementById('ov').classList.contains('on')) return;
  go(cur + (e.clientX < innerWidth*0.28 ? -1 : 1));
});

/* ---------- 조작 안내 자동 숨김 ---------- */
(function(){ const h=document.getElementById('help'); let tm;
  function poke(){ h.style.opacity=.72; clearTimeout(tm); tm=setTimeout(()=>h.style.opacity=0,4000); }
  h.style.transition='opacity .5s'; addEventListener('mousemove',poke); addEventListener('keydown',poke); poke();
})();

/* ---------- 오버뷰 ---------- */
function buildOv(){
  const g=document.getElementById('ovg'); let h='';
  D.forEach((s,i)=>{
    const sec=SEC.filter(x=>x.at===i)[0];
    h+='<div class="it" data-i="'+i+'"><span class="n">'+String(i+1).padStart(2,'0')
      +'</span><span class="t">'+(s.ov||s.tag||'')+'</span></div>';
  });
  g.innerHTML=h;
  g.querySelectorAll('.it').forEach(el=>el.onclick=()=>{
    document.getElementById('ov').classList.remove('on'); go(+el.dataset.i);
  });
}
</script>
