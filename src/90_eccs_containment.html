<script>
SECT('08 · 안전주입계통');
S({bare:true, cls:'div', ov:'§08 안전주입계통',
html:`<div class="no">08</div><h2>안전주입계통</h2><div class="ln"></div>
<p>기본안전기능 ②의 두 번째. 잃은 냉각재를 어떻게 되채우는가.
그리고 규제가 요구하는 다섯 개의 정량 판정 기준.</p>`});

S({tag:'10 CFR 50.46', ov:'ECCS 허용기준 — 다섯 개의 합격선',
src:'<b>출처</b> 10 CFR 50.46 (최종 개정 2007-08-28, 72 FR 49494) eCFR 원문. <b>유의</b> 성능기반 대체기준 50.46c는 2024-04 위원회 반려로 <b>2026년 현재 미제정</b>이며, 50.46a는 ECCS가 아니라 <b>원자로냉각재계통 배기계통</b> 조문이다',
html:`<h2 class="t">인허가 안전해석의 <em>합격선</em> — 정확히 외울 값</h2>
<div class="body">
  <div class="fig" style="justify-content:flex-start">
  <table class="d">
    <tr><th style="width:12%">항</th><th style="width:36%">기준</th><th>수치</th></tr>
    <tr class="mark"><td class="mono">(b)(1)</td><td>최고 피복재 온도 (PCT)</td><td class="n"><b>2,200 °F</b> (약 1,204 °C) 초과 금지</td></tr>
    <tr><td class="mono">(b)(2)</td><td>최대 국부 산화율</td><td class="n">산화 전 피복재 두께의 <b>0.17배</b>를 어디에서도 초과 금지</td></tr>
    <tr><td class="mono">(b)(3)</td><td>총 수소 발생량</td><td class="n">전부 반응했을 때 가상 발생량의 <b>0.01배</b> 초과 금지</td></tr>
    <tr><td class="mono">(b)(4)</td><td>냉각 가능 형상</td><td>노심 형상 변화가 <b>냉각 가능한 상태</b>를 유지</td></tr>
    <tr><td class="mono">(b)(5)</td><td>장기 냉각</td><td>초기 ECCS 성공 후에도 <b>장기간 붕괴열을 제거</b></td></tr>
  </table>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">왜 온도가 기준인가</span>
      <div style="font-size:16px;line-height:1.5;color:var(--ink);font-weight:300;margin-top:6px">
        <span class="mono">Zr + 2H₂O → ZrO₂ + 2H₂ + Q</span><br><br>
        이 반응은 <b>발열</b>이다. 온도가 오르면 빨라지고, 반응열이 다시 온도를 올린다 —
        <b class="hot">양의 되먹임</b>.<br><br>
        1,204 °C는 그 폭주가 일어나지 않고 피복재가 급랭 시 부서지지 않을 연성을 유지하는 경계.
        부산물인 수소는 격납에서 폭발 위험이 되므로 (b)(3)이 총량을 묶는다 —
        <b class="cool">여기서 8장과 9장이 이어진다</b>.</div></div>
  </div>
</div>`});

S({tag:'PRESSURE TIERS', ov:'압력 계층 — 주입계통의 순차 인계',
src:'<b>개념도</b> 자체 작성. 압력 이력은 소형 파단의 전형적 형태 예시이며 특정 설계의 해석 결과가 아니다. 축압기 충전압 4.9 MPa(약 700 psig)는 AP1000 기준값 (NRC ADAMS ML15230A043)',
html:`<h2 class="t">압력이 떨어지며 <em>차례로 인계</em>한다 — 하나로는 안 된다</h2>
<ul class="b">
  <li>사고 초기에는 압력이 높아 저압 펌프가 못 밀고, 나중에는 고압 계통의 유량이 부족함</li>
  <li>그래서 <b class="cool">압력 구간마다 다른 주입 수단</b>을 준비한다 — 이것이 ECCS의 기본 골격</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 780 320" role="img" aria-label="냉각재상실사고 중 압력이 떨어지면서 고압주입, 축압기, 저압주입이 순차적으로 작동하는 영역">
    <g id="pt-band"></g><g id="pt-ax"></g>
    <path id="pt-c" d="" fill="none" stroke="var(--ink)" stroke-width="2.8"/>
    <circle id="pt-p" r="7" fill="var(--hot)"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">RCS 압력</span><span class="v" id="pt-P">15.5<small>MPa</small></span></div>
    <div class="readout hi"><span class="k">지금 인계한 계통</span><span class="v" id="pt-S" style="font-size:21px">고압주입 · CMT</span></div>
    <div class="readout"><span class="k">사고 후 경과</span><span class="v" id="pt-t">1<small>초</small></span></div>
    <div class="src">축압기는 밸브 조작 없이 <b>체크밸브만으로</b> 열린다 — Category C 피동.
      CMT는 RCS 전압력에서도 <b>중력</b>으로 흐른다.</div>
  </div>
</div>`,
init(el){
  const X=t=>70+Math.log10(t)/4*660, Y=p=>270-p/16*228;
  const B=[[8,16,'고압안전주입 (HPSI) · CMT','var(--cool)'],
           [3.5,8,'축압기 (Accumulator)','var(--amber)'],
           [0,3.5,'저압안전주입 (LPSI) · 중력 보충','var(--ok)']];
  let bh='';
  B.forEach(b=>{ bh+=`<rect x="70" y="${Y(b[1])}" width="660" height="${Y(b[0])-Y(b[1])}" fill="${b[3]}" opacity=".07"/>`
    +`<text x="82" y="${(Y(b[0])+Y(b[1]))/2+5}" class="lbl" fill="${b[3]}" font-size="13.5">${b[2]}</text>`; });
  bh+=`<line x1="70" y1="${Y(4.9)}" x2="730" y2="${Y(4.9)}" stroke="var(--hot)" stroke-width="1.2" stroke-dasharray="5 4"/>`
     +`<text x="726" y="${Y(4.9)-7}" class="lbl" fill="var(--hot)" text-anchor="end">축압기 질소 충전압 4.9 MPa</text>`;
  el.querySelector('#pt-band').innerHTML=bh;
  let ax='<line x1="70" y1="270" x2="736" y2="270" class="axis"/><line x1="70" y1="270" x2="70" y2="34" class="axis"/>';
  [1,10,100,1000,10000].forEach(t=>ax+=`<text x="${X(t)}" y="292" class="lbl" text-anchor="middle">${t>=1000?fmt(t):t} s</text>`);
  [0,4,8,12,16].forEach(p=>ax+=`<text x="62" y="${Y(p)+4}" class="lbl" text-anchor="end">${p}</text>`);
  ax+='<text x="736" y="312" class="lbl" text-anchor="end">사고 후 경과시간</text>'
     +'<text x="70" y="24" class="lbl">RCS 압력 (MPa)</text>';
  el.querySelector('#pt-ax').innerHTML=ax;
  const P=t=>15.5*Math.exp(-Math.pow(Math.log10(t)/1.55,2.2))+0.15;
  let d=''; for(let i=0;i<=200;i++){ const t=Math.pow(10,i/200*4); d+=(d?'L':'M')+X(t)+','+Y(P(t)); }
  el.querySelector('#pt-c').setAttribute('d',d);
  const pt=el.querySelector('#pt-p');
  function at(t){ const p=P(t);
    pt.setAttribute('cx',X(t));pt.setAttribute('cy',Y(p));
    el.querySelector('#pt-P').innerHTML=p.toFixed(1)+'<small>MPa</small>';
    el.querySelector('#pt-t').innerHTML=(t<1000?fmt(t,0):fmt(t/60,0))+'<small>'+(t<1000?'초':'분')+'</small>';
    const b=B.find(x=>p>=x[0]&&p<x[1])||B[2];
    el.querySelector('#pt-S').textContent=b[2].split(' (')[0];
    el.querySelector('#pt-S').parentNode.className='readout hi';
    pt.setAttribute('fill',b[3]);
  }
  if(RM){ at(300); return; }
  at(1); raf(t=>{ const u=(t%8)/8; at(Math.pow(10,u*4)); });
}});

S({tag:'NuScale ECCS', ov:'폐루프 — 물을 밖에서 넣지 않는다',
src:'<b>개념도</b> 자체 작성. NuScale NPM의 ECCS는 RVV 3개 + RRV 2개로 구성되며 펌프·축압기가 없다 (IAEA SMR Booklet 2022). 8장·9장의 경계가 사라지는 지점',
html:`<h2 class="t">잃은 물을 밖에서 넣는 대신 <em>가둬 두고 순환</em>시킨다</h2>
<ul class="b">
  <li>① <b>RVV</b>를 열어 증기를 격납으로 방출 → ② 침수된 격납 벽면에서 <b class="cool">응축</b>, 열은 수조로 → ③ <b>RRV</b>로 응축수를 용기로 복귀</li>
  <li>수원이 계 밖에 없어도 순환이 유지되므로 <b class="ok">50.46(b)(5) 장기 냉각</b>이 성립한다</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 760 320" role="img" aria-label="NuScale ECCS의 폐루프 — 원자로 벤트밸브로 증기를 내보내고 격납 벽면에서 응축된 물을 재순환밸브로 되돌린다">
    <rect x="120" y="34" width="520" height="256" fill="var(--cool)" opacity=".10" stroke="var(--cool)" stroke-width="1.4"/>
    <text x="380" y="26" text-anchor="middle" class="ttl">침수 격납용기 (CNV) · 정상운전 중 진공</text>
    <rect x="255" y="68" width="250" height="204" rx="22" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>
    <text x="266" y="110" text-anchor="start" class="lbl b">원자로용기</text>
    <rect x="342" y="216" width="76" height="50" rx="3" fill="var(--hot)"/>
    <text x="380" y="246" text-anchor="middle" font-size="13" fill="#fff" font-family="var(--sans)">노심</text>
    <path id="ec-r" d="M380,214 L380,92 L560,92 L560,262 L418,262 Z" fill="none" stroke="var(--rule)" stroke-width="8"/>
    <path id="ec-l" d="M380,214 L380,92 L200,92 L200,262 L342,262 Z" fill="none" stroke="var(--rule)" stroke-width="8"/>
    <rect x="356" y="62" width="14" height="12" fill="var(--ok)"/><rect x="390" y="62" width="14" height="12" fill="var(--ok)"/>
    <text x="380" y="52" text-anchor="middle" class="lbl" fill="var(--ok)">RVV · 증기 방출</text>
    <rect x="246" y="256" width="12" height="14" fill="var(--ok)"/><rect x="502" y="256" width="12" height="14" fill="var(--ok)"/>
    <text x="380" y="290" text-anchor="middle" class="lbl" fill="var(--ok)">RRV · 응축수 재순환</text>
    <g id="ec-drop"></g>
    <text x="132" y="60" class="lbl" fill="var(--cool)">벽면 응축</text>
    <text x="648" y="150" class="lbl" fill="var(--cool)" text-anchor="start">열은</text>
    <text x="648" y="168" class="lbl" fill="var(--cool)" text-anchor="start">수조로</text>
    <path d="M642,140 L676,140 M642,182 L676,182" stroke="var(--cool)" stroke-width="2"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">외부 수원</span><span class="v" style="font-size:22px">필요 없음</span></div>
    <div class="readout"><span class="k">구동력</span><span class="v" style="font-size:22px">응축 압력차</span></div>
    <blockquote class="q" style="border-left-color:var(--cool)">
      일체형 SMR에서 <b>안전주입계통과 격납계통은 사실상 하나의 계통</b>이다.
      나눠 배웠지만 실제 설계에서는 그 경계가 사라진다.
      <span class="cite">i-SMR의 EDV 3 + ERV 2도 같은 논리</span></blockquote>
  </div>
</div>`,
init(el){
  flow(el.querySelector('#ec-r'),{n:9,speed:0.13,r:4,color:'var(--hot)'});
  flow(el.querySelector('#ec-l'),{n:9,speed:0.13,r:4,color:'var(--hot)'});
  if(RM) return;
  const SV='http://www.w3.org/2000/svg', g=el.querySelector('#ec-drop'), dr=[];
  for(let i=0;i<14;i++){ const c=document.createElementNS(SV,'circle');
    c.setAttribute('r',2.6); c.setAttribute('fill','var(--cool)');
    c.dataset.x=(i%2? 130+Math.random()*14 : 616+Math.random()*14);
    c.dataset.p=Math.random(); g.appendChild(c); dr.push(c); }
  raf(t=>{ dr.forEach(c=>{ const p=((t*0.30)+ +c.dataset.p)%1;
    c.setAttribute('cx',+c.dataset.x); c.setAttribute('cy',44+236*p);
    c.setAttribute('opacity',0.85*Math.sin(Math.PI*p)); }); });
}});

/* ================================================================
   SECTION 09 — 격납계통
   ================================================================ */
SECT('09 · 격납계통');
S({bare:true, cls:'div', ov:'§09 격납계통',
html:`<div class="no">09</div><h2>격납계통</h2><div class="ln"></div>
<p>기본안전기능 ③. 네 겹의 방벽 중 마지막.
요구되는 성질은 하나다 — <b>새지 않을 것</b>. 그런데 그것을 지키려면 열을 빼야 한다.</p>`});

S({tag:'ISOLATION', ov:'격리밸브 — 구멍 관리가 전부',
src:'<b>출처</b> 10 CFR 50 Appendix A, GDC 16·50~57. <b>GDC 52</b>는 설계압에서 종합누설률시험(ILRT)을 수행할 수 있도록 요구한다 — “새지 않는다”를 주장이 아니라 <b>측정</b>으로 증명해야 한다',
html:`<h2 class="t">격납에는 <s>필연적으로 구멍</s>이 뚫린다 — 사고 시 닫히는가</h2>
<ul class="b">
  <li>배관 · 전기 관통부 · 인원 출입구. 이 구멍이 닫히지 않으면 아무리 두꺼운 벽도 소용없음</li>
  <li>단순 <b class="hot">체크밸브</b>는 격납 외부 자동 격리밸브로 인정되지 않음 — 막아야 할 방향으로는 닫히지 않으니까</li>
</ul>
<div class="body">
  <div class="fig">
  <table class="d">
    <tr><th style="width:14%">배열</th><th>격납 내부 밸브</th><th>격납 외부 밸브</th></tr>
    <tr><td class="mono">①</td><td>잠금 폐쇄 (locked closed)</td><td>잠금 폐쇄</td></tr>
    <tr><td class="mono">②</td><td>자동 격리</td><td>잠금 폐쇄</td></tr>
    <tr><td class="mono">③</td><td>잠금 폐쇄</td><td>자동 격리</td></tr>
    <tr class="mark"><td class="mono">④</td><td>자동 격리</td><td>자동 격리</td></tr>
  </table>
  </div>
  <div class="side">
    <div class="readout"><span class="k">GDC 55</span>
      <div style="font-size:15.5px;line-height:1.45;color:var(--ink-2);font-weight:300;margin-top:5px">
      원자로냉각재압력경계를 관통하는 배관</div></div>
    <div class="readout"><span class="k">GDC 56</span>
      <div style="font-size:15.5px;line-height:1.45;color:var(--ink-2);font-weight:300;margin-top:5px">
      격납 대기와 직결되는 배관 — 외부 밸브는 격납건물 <b>가까이</b></div></div>
    <div class="readout"><span class="k">GDC 57</span>
      <div style="font-size:15.5px;line-height:1.45;color:var(--ink-2);font-weight:300;margin-top:5px">
      그 밖의 폐회로 관통 배관 — 외부에 자동·잠금폐쇄·원격조작 밸브 <b>최소 1개</b></div></div>
    <div class="src">①은 정상·사고 시 모두 흐를 필요가 없는 배관(시험·시료·배수)에만 쓸 수 있다.</div>
  </div>
</div>`});

S({tag:'CONTAINMENT PRESSURE', ov:'격납 압력 — 계산이 포화압에 막힌다',
src:'<b>예제 조건</b> 자유체적 3,000 m³ · 초기 공기 1기압 20 °C · 평형 온도 150 °C · R_v = 461.5 J/(kg·K) · 150 °C 포화압 0.476 MPa. 이상기체 근사만으로는 답이 틀린다는 것을 보이기 위한 예제',
html:`<h2 class="t">이상기체로 계산하면 <s>틀린다</s> — 초과분은 <em>응축</em>한다</h2>
<ul class="b">
  <li>계산된 증기 분압이 그 온도의 <b>포화압</b>을 넘으면 물리적으로 불가능 → 증기 일부가 액체가 됨</li>
  <li>결국 <b class="cool">격납 압력은 증기 질량이 아니라 평형 온도가 결정</b>한다. 그래서 격납 해석의 핵심은 열 균형</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 300" role="img" aria-label="방출 증기 질량에 따른 격납 압력 — 이상기체 계산값과 포화압에 의해 제한된 실제 압력 비교">
    <g id="cp-ax"></g>
    <rect id="cp-ideal" x="150" width="120" fill="var(--hot)" opacity=".6" stroke="var(--hot)" stroke-width="1.2"/>
    <rect id="cp-real" x="330" width="120" fill="var(--cool)" opacity=".8"/>
    <rect id="cp-air" x="330" width="120" fill="var(--ink-3)" opacity=".55"/>
    <line id="cp-sat" x1="110" x2="620" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text id="cp-satt" x="616" class="lbl" fill="var(--amber)" text-anchor="end">150 °C 포화압 0.476 MPa</text>
    <text x="210" y="292" text-anchor="middle" class="lbl">이상기체 계산 (증기 분압)</text>
    <text x="390" y="292" text-anchor="middle" class="lbl">실제 (포화 제한 + 공기)</text>
    <text id="cp-msg" x="282" y="120" class="lbl" fill="var(--hot)" font-size="14.5"></text>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">이상기체 증기 분압</span><span class="v" id="cp-i">1.30<small>MPa</small></span></div>
    <div class="readout hi"><span class="k">실제 격납 압력</span><span class="v" id="cp-r">0.62<small>MPa</small></span></div>
    <div class="ctl"><label>방출 증기 질량 <span id="cp-ms">20 t</span></label>
      <input type="range" id="cp-m" min="1" max="40" step="0.5" value="20"></div>
    <div class="src">공기 분압은 온도만 보정 — 0.1013 × 423/293 = <b>0.146 MPa</b>.</div>
  </div>
</div>`,
init(el){
  const Y=p=>250-p/1.5*210;
  let ax='<line x1="110" y1="250" x2="626" y2="250" class="axis"/>';
  [0,0.5,1.0,1.5].forEach(p=>{ ax+=`<line x1="110" y1="${Y(p)}" x2="626" y2="${Y(p)}" class="grid"/>`
    +`<text x="102" y="${Y(p)+4}" class="lbl" text-anchor="end">${p.toFixed(1)}</text>`; });
  ax+='<text x="110" y="26" class="lbl">압력 (MPa)</text>';
  el.querySelector('#cp-ax').innerHTML=ax;
  const sat=0.476, air=0.146;
  el.querySelector('#cp-sat').setAttribute('y1',Y(sat));el.querySelector('#cp-sat').setAttribute('y2',Y(sat));
  el.querySelector('#cp-satt').setAttribute('y',Y(sat)-8);
  const sl=el.querySelector('#cp-m');
  function upd(){
    const m=+sl.value*1000, pv=m*461.5*423/3000/1e6, real=air+Math.min(pv,sat);
    const I=el.querySelector('#cp-ideal'), R=el.querySelector('#cp-real'), A=el.querySelector('#cp-air');
    I.setAttribute('y',Y(Math.min(pv,1.5)));I.setAttribute('height',Math.max(1,250-Y(Math.min(pv,1.5))));
    A.setAttribute('y',Y(air));A.setAttribute('height',250-Y(air));
    R.setAttribute('y',Y(real));R.setAttribute('height',Y(air)-Y(real));
    el.querySelector('#cp-i').innerHTML=pv.toFixed(2)+'<small>MPa</small>';
    el.querySelector('#cp-r').innerHTML=real.toFixed(2)+'<small>MPa</small>';
    el.querySelector('#cp-ms').textContent=(+sl.value).toFixed(1)+' t';
    const msg=el.querySelector('#cp-msg');
    if(pv>sat){ msg.textContent='← 초과분 '+((pv-sat)/pv*100).toFixed(0)+' % 는 응축';
      msg.setAttribute('x',282); msg.setAttribute('y',Y(Math.min((pv+sat)/2,1.42))); } else msg.textContent='';
  }
  sl.oninput=upd; upd();
  if(RM) return;
  raf(t=>{ if(t>2.2) return; sl.value=(lerp(4,20,clamp(t/2,0,1))).toFixed(1); upd(); });
}});
