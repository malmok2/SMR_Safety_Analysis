S({bare:true, cls:'div', ov:'[[§10 정리 — 요건에서 계통까지||&#167;10 Wrap-up - from requirement to system]]',
html:`[[<div class="no">10</div><h2>요건에서 계통까지</h2><div class="ln"></div>
<p>아홉 개의 장을 하나의 추적표로 묶는다. 이 표를 거꾸로 읽으면 설계 검토 체크리스트가 된다.</p>||<div class="no">10</div><h2>From requirement to system</h2><div class="ln"></div>

S({tag:'TRACEABILITY', ov:'[[요건 → 기능 → 계통 추적||Requirement &#8594; function &#8594; system]]',
src:'[[<b>출처</b> 10 CFR 50 Appendix A의 GDC, IAEA SSR-2/1 (Rev.1)의 기본안전기능, 그리고 6~9장에서 다룬 계통을 대응시킨 것||<b>Source</b> the GDC of 10 CFR 50 Appendix A, the fundamental safety functions of IAEA SSR-2/1 (Rev.1), and the systems covered in Chapters 6 to 9, mapped onto each other]]',
html:`<h2 class="t">[[설계는 요건에서 시작해 계통으로 끝난다 — <s>거꾸로 읽으면 근거를 잃는다</s>||Requirement &#8594; function &#8594; system - <s>never the other way</s>]]</h2>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 462" role="img" aria-label="[[규제 요건에서 기본안전기능을 거쳐 공학적안전설비로 이어지는 추적 관계||Traceability from regulatory requirement through fundamental safety function to engineered safety feature]]">
  <defs><marker id="tr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--rule)"/></marker></defs>
  <g id="tr-hd">
    <rect x="40" y="14" width="330" height="44" fill="var(--cool)"/>
    <text x="205" y="42" text-anchor="middle" font-family="var(--mono)" font-size="15" fill="var(--on-accent)" [[font-weight="600">규제 요건</text>||font-weight="600">Requirement</text>]]
    <rect x="395" y="14" width="300" height="44" fill="var(--ok)"/>
    <text x="545" y="42" text-anchor="middle" font-family="var(--mono)" font-size="15" fill="var(--on-accent)" [[font-weight="600">기본 안전기능</text>||font-weight="600">Safety function</text>]]
    <rect x="720" y="14" width="360" height="44" fill="var(--hot)"/>
    <text x="900" y="42" text-anchor="middle" font-family="var(--mono)" font-size="15" fill="var(--on-accent)" [[font-weight="600">계통 (ESF)</text>||font-weight="600">System (ESF)</text>]]
  </g>
  <g id="tr-rows"></g>
</svg>
</div></div>`,
init(el){
  const R=[['GDC 25 · 26 · 27',TX('반응도 제어','Reactivity control'),
     TX('제어봉 · 붕산 주입 · (무붕산 설계)','Control rods · boron injection · (boron-free design)')],
    ['GDC 34',TX('노심 잔열 제거','Core residual heat removal'),'PRHR · DHRS · ICS · PAFS'],
    ['GDC 35 · 10 CFR 50.46',TX('노심 냉각재 보충','Core coolant make-up'),
     TX('축압기 · CMT · SI 펌프 · RVV/RRV','Accumulator · CMT · SI pump · RVV/RRV')],
    [TX('GDC 16 · 38 · 41 · 50~57','GDC 16 · 38 · 41 · 50-57'),TX('방사성물질 격납','Confining radioactivity'),
     TX('격납건물 · 살수 · 격리밸브 · PAR','Containment · spray · isolation valves · PAR')]];
  const g=el.querySelector('#tr-rows');
  R.forEach((r,i)=>{ const y=84+i*88;
    g.insertAdjacentHTML('beforeend',
      `<g data-r="${i}" opacity="0">
       <rect x="40" y="${y}" width="330" height="64" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.2"/>
       <text x="58" y="${y+39}" font-family="var(--mono)" font-size="16" fill="var(--cool)">${r[0]}</text>
       <rect x="395" y="${y}" width="300" height="64" fill="var(--panel)" stroke="var(--ok)" stroke-width="1.2"/>
       <text x="545" y="${y+39}" text-anchor="middle" font-family="var(--sans)" font-size="19" fill="var(--ok)">${r[1]}</text>
       <rect x="720" y="${y}" width="360" height="64" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.2"/>
       <text x="900" y="${y+39}" text-anchor="middle" font-family="var(--sans)" font-size="17" fill="var(--hot)">${r[2]}</text>
       <path d="M374,${y+32} H391" stroke="var(--rule)" stroke-width="1.4" marker-end="url(#tr-a)"/>
       <path d="M699,${y+32} H716" stroke="var(--rule)" stroke-width="1.4" marker-end="url(#tr-a)"/></g>`); });
  g.insertAdjacentHTML('beforeend',
    '<text x="560" y="452" text-anchor="middle" class="lbl">'
    +TX('이 표를 거꾸로 읽으면 설계 검토 체크리스트가 된다',
        'Read this table backwards and it becomes a design review checklist')+'</text>');
  const rows=[...g.querySelectorAll('[data-r]')];
  if(RM){ rows.forEach(r=>r.setAttribute('opacity',1)); return; }
  rows.forEach((r,i)=>r.animate([{opacity:0},{opacity:1}],{duration:420,delay:180*i,fill:'forwards'}));
}});

S({tag:'COMPARISON', ov:'[[노형별 ESF 구성 비교||ESF line-up, design by design]]',

html:`<h2 class="t">[[같은 일을 하는데 <em>이름이 다르다</em> — 나란히 놓고 보기||The same job under <em>different names</em> - set side by side]]</h2>

<tr class="mark"><td>NuScale NPM</td>[[<td>제어봉 + 붕산</td>||<td>Rods + boron</td>]]<td>[[DHRS 2계열(각 100 %) · 2상 자연순환||DHRS, 2 trains (100 % each) · two-phase natural circulation]]</td><td>[[별도 수원 없음 · RVV 3 + RRV 2 재순환||No separate water source · 3 RVV + 2 RRV recirculation]]</td><td>[[침수 강재 CNV · 진공||Submerged steel CNV · vacuum]]</td></tr>
<tr><td>i-SMR</td><td>[[제어봉 (<b class="cool">무붕산</b>)||Rods (<b class="cool">boron-free</b>)]]</td><td>[[비LOCA: PAFS 피동보조급수||Non-LOCA: PAFS passive auxiliary feedwater]]</td><td>[[LOCA: EDV 3 + ERV 2||LOCA: 3 EDV + 2 ERV]]</td><td>[[소형 강재 CV + PCCS||Small steel CV + PCCS]]</td></tr>
<tr><td>SMART100</td>[[<td>제어봉 + 붕산</td>||<td>Rods + boron</td>]]<td>[[PRHRS 4계열 (2차측 + 비상냉각탱크)||PRHRS, 4 trains (secondary side + emergency cooldown tank)]]</td><td>[[CMT 4기 + SIT 4기 (피동)||4 CMT + 4 SIT (passive)]]</td><td>CPRSS · IRWST · PAR</td></tr>
<tr><td>BWRX-300</td>[[<td>제어봉 + 붕산</td>||<td>Rods + boron</td>]]<td>[[ICS 3루프 (각 약 33 MW) · 최소 7일||ICS, 3 loops (about 33 MW each) · 7 days minimum]]</td><td>[[일체형 격리밸브로 대구경 파단 배제||Integral isolation valves eliminate the large-pipe break]]</td><td>[[지하 매설 PCV · 약 16 m × 44 m||Below-grade PCV · about 16 m × 44 m]]</td></tr>
<tr><td>[[AP1000 <span class="lbl">(비교 기준)</span>||AP1000 <span class="lbl">(reference)</span>]]</td>[[<td>제어봉 + 붕산</td>||<td>Rods + boron</td>]]<td>[[PRHR HX 1기 (IRWST 침수)||One PRHR HX, submerged in the IRWST]]</td><td>[[CMT 2기 + 축압기 2기 + IRWST · ADS 4단||2 CMT + 2 accumulators + IRWST · 4-stage ADS]]</td><td>[[강재 격납 + PCCS||Steel containment + PCCS]]</td></tr>
<tr><td>CAREM-25</td><td>[[FSS 급속정지봉 + SSS 고압 붕산탱크||FSS fast shutdown rods + SSS high-pressure boron tank]]</td><td>[[PRHRS 2계열 · 36 h||PRHRS, 2 trains · 36 h]]</td><td>[[MPIS 축압기 2기 · <b>파열판</b>으로 개시||2 MPIS accumulators, initiated by a <b>rupture disc</b>]]</td><td>[[압력억제형 · 설계압 0.5 MPa||Pressure suppression · design pressure 0.5 MPa]]</td></tr>

S({tag:'CHECKLIST', ov:'[[마무리 — 네 줄 체크리스트||Closing - a four-line checklist]]',
src:'[[다음 단계: 5~8주차 계통코드. 이 네 질문에 답할 수 있으면 노드화의 요구사항이 이미 정해진 것이다||Next: system codes in weeks 5-8. Answer these four questions and the nodalisation requirements are already settled]]',
html:`<h2 class="t">[[설계 자료를 받았을 때 <em>이 네 줄</em>을 채울 수 있는가||Handed a design, can you fill in <em>these four lines</em>]]</h2>
<div class="body col">
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
    <div class="readout" style="border-left:3px solid var(--hot)">
      <span class="k">[[① 반응도 제어||&#9312; Reactivity control]]</span>
      <div style="font-size:19px;color:var(--ink);font-weight:300;margin-top:4px">
        [[반응도를 죽이는 <b>두 개의 독립 수단</b>은 무엇인가. stuck rod 가정에서도 정지여유도가 확보되는가||What are the <b>two independent means</b> of killing reactivity? Is the shutdown margin still there with a stuck rod assumed?]]</div></div>
    <div class="readout" style="border-left:3px solid var(--cool)">
      <span class="k">[[② 열 제거||&#9313; Heat removal]]</span>
      <div style="font-size:19px;color:var(--ink);font-weight:300;margin-top:4px">
        [[정지 후 붕괴열의 <b>최종 열침원</b>은 무엇인가. 무조작으로 며칠을 버티며, 그 며칠은 <b>무슨 계산</b>에서 나왔는가||What is the <b>ultimate heat sink</b> for decay heat after shutdown? How many days without action, and <b>from what calculation</b> does that number come?]]</div></div>
    <div class="readout" style="border-left:3px solid var(--cool)">
      <span class="k">[[③ 냉각재 보충||&#9314; Coolant make-up]]</span>
      <div style="font-size:19px;color:var(--ink);font-weight:300;margin-top:4px">
        [[냉각재를 잃었을 때 <b>압력 구간별 주입 수단</b>은 무엇인가. 장기 냉각은 어떻게 성립하는가||On losing coolant, what injects <b>in each pressure band</b>? How is long-term cooling established?]]</div></div>
    <div class="readout" style="border-left:3px solid var(--ok)">
      <span class="k">[[④ 격납||&#9315; Containment]]</span>
      <div style="font-size:19px;color:var(--ink);font-weight:300;margin-top:4px">
        [[격납은 방출 에너지를 <b>어디에 흡수</b>시키는가. 수소는 어떻게 처리하는가||<b>Where</b> does the containment absorb the released energy? What happens to the hydrogen?]]</div></div>
  </div>
</div>`});

S({bare:true, cls:'cover', ov:'[[맺음||Closing]]',
html:`<div class="kick">[[다음 단계 · 5~8주차||Next · weeks 5-8]]</div>
<h1>[[코드가 답을 주지는<br><span>않는다</span>||The code does not<br><span>give you the answer</span>]]</h1>
<div class="ln"></div>
<div class="meta">
  [[코드는 여러분이 넣은 가정을 계산할 뿐이다.<br>
  노드화를 어떻게 나눴는지, 어떤 상관식을 어떤 적용 범위에서 썼는지,<br>
  붕괴열 곡선에 얼마의 여유를 뒀는지 — <b>이 선택들이 결과를 만든다.</b><br><br>
  그 선택 하나하나에 근거를 댈 수 있게 하려고 이 자료가 요건과 수식을 함께 실었다.||A code only computes the assumptions you feed it.<br>
  How you split the nodalisation, which correlation you used and over what range,<br>
  how much margin you left on the decay heat curve - <b>those choices make the answer.</b><br><br>
  This material carries the requirements and the equations together so that every one of those choices can be justified.]]
</div>
<div class="hint">[[THINK LAB · 한양대학교 원자력공학과 · 지도교수 송민섭 · 2026년 9월||THINK LAB · Department of Nuclear Engineering, Hanyang University · Instructor Minseop Song · September 2026]]</div>`,
init(el){
  if(RM) return;
  const h1=el.querySelector('h1');
  h1.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],
    {duration:700,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
}});

boot();
</script>
