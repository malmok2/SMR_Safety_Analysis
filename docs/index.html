<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMR 설계요건과 공학적안전설비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   THINK Lab · SMR 설계요건과 공학적안전설비 — 발표용 HTML
   제어실 미믹 패널(control-room mimic) 시각 언어
   ============================================================ */
:root{
  --ground:#070E18;      /* 근흑 네이비 바탕 */
  --panel:#0E1B2C;       /* 패널면 */
  --panel-2:#13263C;     /* 한 단계 밝은 패널 */
  --rule:#1E3450;        /* 미믹 라인·헤어라인 */
  --ink:#FFFFFF;         /* 본문 */
  --ink-2:#C9D9EC;       /* 보조 텍스트 — 회색 아님, 청백색 */
  --ink-3:#8FA8C6;       /* 라벨 전용(캡션·단위). 본문에는 쓰지 않음 */
  --cool:#4CC9F0;        /* 강조색 = 냉각재 */
  --hot:#FF7A45;         /* 열·노심·위험 */
  --ok:#5DD39E;          /* 피동·성공 */
  --amber:#FFC55C;       /* 규제 조문 */
  --sans:'IBM Plex Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--ground);color:var(--ink);
  font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center}

/* ---------- 무대: 1280x720 고정, 뷰포트에 맞춰 스케일 ---------- */
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;
  background:var(--ground);flex:none}
.slide{position:absolute;inset:0;padding:30px 54px 26px;display:none;
  flex-direction:column;opacity:0;transition:opacity .28s ease}
.slide.on{display:flex;opacity:1}

/* ---------- 상단 레일 ---------- */
.rail{display:flex;align-items:baseline;gap:14px;flex:none;
  border-bottom:1px solid var(--rule);padding-bottom:9px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cool)}
.tag b{color:var(--ink);font-weight:600}
.rail .sp{flex:1}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.08em}

/* ---------- 제목 ---------- */
h2.t{font-size:36px;line-height:1.2;font-weight:600;margin:16px 0 0;
  letter-spacing:-.015em;text-wrap:balance}
h2.t em{font-style:normal;color:var(--cool)}
h2.t s{text-decoration:none;color:var(--hot)}
p.sub{margin:8px 0 0;font-size:19px;color:var(--ink-2);font-weight:300;line-height:1.45}

/* ---------- 불릿(상단 2~4개) ---------- */
ul.b{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.b li{font-size:19.5px;line-height:1.42;color:var(--ink);padding-left:20px;position:relative;
  font-weight:300}
ul.b li::before{content:'';position:absolute;left:0;top:.62em;width:8px;height:2px;
  background:var(--cool)}
ul.b li b{font-weight:600}
ul.b li .q{color:var(--ink-2)}
ul.b li code,.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.hot{color:var(--hot)} .ok{color:var(--ok)} .cool{color:var(--cool)} .amb{color:var(--amber)}

/* ---------- 본문 영역 ---------- */
.body{flex:1;min-height:0;display:flex;gap:26px;margin-top:14px}
.body.col{flex-direction:column}
.fig{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:center}
.fig svg{width:100%;height:auto;display:block}
.side{width:330px;flex:none;display:flex;flex-direction:column;gap:12px;justify-content:center}

/* ---------- 하단 레일 ---------- */
.foot{flex:none;display:flex;align-items:center;gap:12px;padding-top:9px;
  border-top:1px solid var(--rule);margin-top:12px}
.src{font-size:12.5px;color:var(--ink-3);font-weight:300;line-height:1.35}
.src b{color:var(--ink-2);font-weight:500}
.foot .sp{flex:1}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-3)}

/* ---------- 계기 판독 ---------- */
.readout{background:var(--panel);border:1px solid var(--rule);padding:11px 14px 12px}
.readout .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:3px}
.readout .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.readout .v small{font-size:15px;font-weight:400;color:var(--ink-2);margin-left:4px}
.readout.hi{border-color:var(--cool)}
.readout.hi .v{color:var(--cool)}
.readout.warn{border-color:var(--hot)} .readout.warn .v{color:var(--hot)}
.readout.good{border-color:var(--ok)} .readout.good .v{color:var(--ok)}

/* ---------- 컨트롤 ---------- */
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline}
.ctl label span{font-size:15px;color:var(--cool);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;
  cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule)}
input[type=range]::-moz-range-track{height:3px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  margin-top:-6px;background:var(--cool);border:0;border-radius:50%}
input[type=range]::-moz-range-thumb{width:15px;height:15px;background:var(--cool);border:0;
  border-radius:50%}
input[type=range]:focus-visible{outline:2px solid var(--cool);outline-offset:4px}
.btn{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);padding:8px 13px;cursor:pointer;
  transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--cool);color:var(--cool)}
.btn.act{border-color:var(--cool);color:var(--cool);background:#0d2438}
.btn.danger:hover{border-color:var(--hot);color:var(--hot)}
.btn:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 표 ---------- */
table.d{width:100%;border-collapse:collapse;font-size:16px}
table.d th{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cool);text-align:left;font-weight:500;padding:0 12px 8px 0;
  border-bottom:1px solid var(--cool)}
table.d td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);color:var(--ink-2);
  font-weight:300;vertical-align:top;line-height:1.35}
table.d td:first-child{color:var(--ink);font-weight:500}
table.d td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
table.d tr.mark td{color:var(--cool)}
table.d tr.mark td:first-child{color:var(--cool)}
table.d.sm{font-size:14.5px}
table.d.sm td{padding:6px 10px 6px 0}

/* ---------- 인용/조문 ---------- */
blockquote.q{margin:0;padding:14px 18px;background:var(--panel);
  border-left:3px solid var(--amber);font-size:17px;line-height:1.5;color:var(--ink-2);
  font-weight:300}
blockquote.q b{color:var(--ink);font-weight:600}
blockquote.q .cite{display:block;margin-top:9px;font-family:var(--mono);font-size:12px;
  color:var(--amber);letter-spacing:.04em}
.formula{font-family:var(--mono);font-size:24px;color:var(--ink);text-align:center;
  padding:16px 0;letter-spacing:.01em}
.formula .op{color:var(--cool)}
.formula small{font-size:14px;color:var(--ink-3)}

/* ---------- 표지 ---------- */
.cover{justify-content:center;padding:0 90px}
.cover .kick{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--cool);
  text-transform:uppercase}
.cover h1{font-size:66px;line-height:1.06;margin:20px 0 0;font-weight:600;letter-spacing:-.03em}
.cover h1 span{color:var(--cool)}
.cover .ln{width:120px;height:2px;background:var(--hot);margin:26px 0}
.cover .meta{font-size:17px;color:var(--ink-2);line-height:1.7;font-weight:300}
.cover .meta b{color:var(--ink);font-weight:500}
.cover .hint{margin-top:26px;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);
  letter-spacing:.04em}
.cover .hint kbd{background:var(--panel);border:1px solid var(--rule);padding:2px 7px;
  color:var(--ink-2);font-family:var(--mono);font-size:12px}

/* ---------- 섹션 구분 ---------- */
.div{justify-content:center;padding:0 90px}
.div .no{font-family:var(--mono);font-size:150px;line-height:.85;font-weight:600;
  color:var(--panel-2);letter-spacing:-.04em}
.div h2{font-size:52px;margin:-46px 0 0;font-weight:600;letter-spacing:-.025em;position:relative}
.div p{font-size:20px;color:var(--ink-2);margin:16px 0 0;max-width:760px;font-weight:300;
  line-height:1.5}
.div .ln{width:90px;height:2px;background:var(--cool);margin:22px 0 0}

/* ---------- 진행 표시 ---------- */
#prog{position:fixed;left:0;bottom:0;height:2px;background:var(--cool);width:0;
  transition:width .28s ease;z-index:40}
#help{position:fixed;right:14px;bottom:12px;font-family:var(--mono);font-size:11px;
  color:var(--ink-3);letter-spacing:.06em;z-index:40;opacity:.7}

/* ---------- 오버뷰 ---------- */
#ov{position:fixed;inset:0;background:rgba(7,14,24,.97);z-index:50;display:none;
  overflow-y:auto;padding:26px}
#ov.on{display:block}
#ov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
#ov .it{background:var(--panel);border:1px solid var(--rule);padding:11px 12px;cursor:pointer;
  min-height:78px;display:flex;flex-direction:column;gap:5px}
#ov .it:hover{border-color:var(--cool)}
#ov .it .n{font-family:var(--mono);font-size:11px;color:var(--cool)}
#ov .it .t{font-size:13.5px;line-height:1.3;color:var(--ink-2);font-weight:300}
#ov h3{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:22px 0 10px;font-weight:500}
#ov h3:first-child{margin-top:0}

/* ---------- SVG 공통 ---------- */
.lbl{font-family:var(--mono);font-size:12px;fill:var(--ink-3);letter-spacing:.04em}
.lbl.b{fill:var(--ink-2)}
.val{font-family:var(--mono);font-size:15px;fill:var(--ink);font-variant-numeric:tabular-nums}
.ttl{font-family:var(--sans);font-size:14px;fill:var(--ink);font-weight:500}
.axis{stroke:var(--rule);stroke-width:1}
.grid{stroke:var(--rule);stroke-width:.6;stroke-dasharray:2 4}

@media (prefers-reduced-motion:reduce){
  .slide{transition:none}
  #prog{transition:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="prog"></div>
<div id="help">← → 이동 · O 목차 · F 전체화면 · R 다시재생</div>
<div id="ov"><div class="grid" id="ovg"></div></div>
<script>
/* ================================================================
   덱 엔진 — 슬라이드 등록·렌더·내비게이션, 애니메이션 프리미티브
   ================================================================ */
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const D = [];                       // 슬라이드 목록
const SEC = [];                     // 섹션 경계 { at, name }
function S(o){ D.push(o); return D.length-1; }
function SECT(name){ SEC.push({at:D.length, name}); }

/* ---------- 정리 대상(슬라이드 떠날 때 멈춤) ---------- */
let CLEAN = [];
function onClean(fn){ CLEAN.push(fn); }
function raf(fn){
  let id, t0 = performance.now(), live = true;
  function step(t){ if(!live) return; fn((t-t0)/1000, t); id = requestAnimationFrame(step); }
  id = requestAnimationFrame(step);
  onClean(()=>{ live=false; cancelAnimationFrame(id); });
  return ()=>{ live=false; cancelAnimationFrame(id); };
}

/* ---------- 수치 유틸 ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function decay(t,t0=1e8){ return 0.0622*(Math.pow(t,-0.2)-Math.pow(t+t0,-0.2)); }
function rhoW(T){ return 1006.0-0.2646*T-0.002424*T*T; }

/* ---------- SVG 경로 위를 흐르는 입자 ---------- */
function flow(path, opt={}){
  const n=opt.n||10, col=opt.color||'var(--cool)', r=opt.r||3.6;
  const L=path.getTotalLength(), g=path.ownerSVGElement, dots=[];
  const layer=document.createElementNS('http://www.w3.org/2000/svg','g');
  path.parentNode.appendChild(layer);
  for(let i=0;i<n;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',r); c.setAttribute('fill',col); layer.appendChild(c); dots.push(c);
  }
  const st={speed:opt.speed==null?0.14:opt.speed, on:true, dir:1};
  raf((t)=>{
    for(let i=0;i<n;i++){
      let p=((t*st.speed*st.dir)+i/n)%1; if(p<0)p+=1;
      const pt=path.getPointAtLength(p*L);
      dots[i].setAttribute('cx',pt.x); dots[i].setAttribute('cy',pt.y);
      dots[i].setAttribute('opacity', st.on? (opt.fade? 0.35+0.65*Math.sin(Math.PI*p):1) : 0);
    }
  });
  st.el=layer; return st;
}

/* ---------- 값이 부드럽게 따라가는 판독기 ---------- */
function track(obj,key,get,k=6){
  raf((t,abs)=>{ obj[key]=lerp(obj[key],get(),Math.min(1,k*0.016)); });
}

/* ---------- 선 그래프 ---------- */
function poly(pts){ return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }

/* ---------- 렌더 ---------- */
const stage=document.getElementById('stage');
let cur=-1;
function go(i,dir){
  i=clamp(i,0,D.length-1); if(i===cur) return;
  CLEAN.forEach(f=>{try{f()}catch(e){}}); CLEAN=[];
  cur=i; const s=D[i];
  const sec = SEC.filter(x=>x.at<=i).slice(-1)[0];
  stage.innerHTML =
    '<div class="slide on'+(s.cls?' '+s.cls:'')+'">'
    + (s.bare? '' :
      '<div class="rail"><span class="tag">'+(s.tag||(sec?sec.name:''))+'</span>'
      +'<span class="sp"></span><span class="num">'+String(i+1).padStart(2,'0')+' / '+D.length+'</span></div>')
    + s.html
    + (s.bare? '' :
      '<div class="foot"><span class="src">'+(s.src||'')+'</span><span class="sp"></span>'
      +'<span class="brand">THINK LAB · HANYANG</span></div>')
    + '</div>';
  document.getElementById('prog').style.width=((i+1)/D.length*100)+'%';
  if(s.init){ try{ s.init(stage.querySelector('.slide')); }catch(e){ console.error(e); } }
}
function replay(){ const i=cur; cur=-1; go(i); }

/* ---------- 스케일 ---------- */
function fit(){
  const k=Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform='scale('+k+')';
}
addEventListener('resize',fit); fit();

/* ---------- 내비게이션 ---------- */
addEventListener('keydown',e=>{
  const ov=document.getElementById('ov');
  if(e.key==='Escape'){ ov.classList.remove('on'); return; }
  if(e.key==='o'||e.key==='O'){ ov.classList.toggle('on'); return; }
  if(ov.classList.contains('on')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(D.length-1); }
  else if(e.key==='r'||e.key==='R'){ replay(); }
  else if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
});
addEventListener('click',e=>{
  if(e.target.closest('input,button,#ov,label')) return;
  if(document.getElementById('ov').classList.contains('on')) return;
  go(cur + (e.clientX < innerWidth*0.28 ? -1 : 1));
});

/* ---------- 조작 안내 자동 숨김 ---------- */
(function(){ const h=document.getElementById('help'); let tm;
  function poke(){ h.style.opacity=.72; clearTimeout(tm); tm=setTimeout(()=>h.style.opacity=0,4000); }
  h.style.transition='opacity .5s'; addEventListener('mousemove',poke); addEventListener('keydown',poke); poke();
})();

/* ---------- 오버뷰 ---------- */
function buildOv(){
  const g=document.getElementById('ovg'); let h='';
  D.forEach((s,i)=>{
    const sec=SEC.filter(x=>x.at===i)[0];
    h+='<div class="it" data-i="'+i+'"><span class="n">'+String(i+1).padStart(2,'0')
      +'</span><span class="t">'+(s.ov||s.tag||'')+'</span></div>';
  });
  g.innerHTML=h;
  g.querySelectorAll('.it').forEach(el=>el.onclick=()=>{
    document.getElementById('ov').classList.remove('on'); go(+el.dataset.i);
  });
}
</script>
<script>
/* ================================================================
   표지 · 여정 지도
   ================================================================ */
S({bare:true, cls:'cover', ov:'표지',
html:`<div class="kick">한양대학교 원자력공학과 · THINK Lab · NUE4067</div>
<h1>SMR <span>설계요건</span>과<br>공학적안전설비</h1>
<div class="ln"></div>
<div class="meta">
  왜 이렇게 설계했는가를 <b>계산으로</b> 답하기 위한 최소 원리<br>
  2~3주차 강의 · 지도교수 <b>송민섭</b> · Rev1.0 · 2026년 9월
</div>
<div class="hint"><kbd>→</kbd> 다음 &nbsp; <kbd>←</kbd> 이전 &nbsp; <kbd>O</kbd> 목차 &nbsp; <kbd>F</kbd> 전체화면 &nbsp; <kbd>R</kbd> 애니메이션 다시재생</div>`,
init(el){
  if(RM) return;
  const h1=el.querySelector('h1'), ln=el.querySelector('.ln');
  h1.style.opacity=0; ln.style.width='0px';
  h1.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],
    {duration:700,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  ln.animate([{width:'0px'},{width:'120px'}],{duration:600,delay:500,fill:'forwards'});
}});

S({tag:'ROADMAP', ov:'이 발표의 구조 — 기능이 계통을 부른다',
src:'IAEA SSR-2/1 (Rev.1) Requirement 4 · 10 CFR 50 Appendix A',
html:`<h2 class="t">원자로가 반드시 해야 하는 <em>세 가지</em> — 그것이 계통을 부른다</h2>
<ul class="b">
  <li>계통 이름부터 외우면 왜 거기 있는지 알 수 없음. <b>요건 → 기능 → 계통</b> 순서로 읽음</li>
  <li>앞 기능이 실패하면 뒤 기능의 부담이 커지는 <b>사슬</b>임 — 순서에 의미가 있음</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 330" role="img" aria-label="세 가지 기본안전기능과 그것을 담당하는 공학적안전설비의 대응 관계">
  <defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--rule)"/></marker></defs>
  <g id="rm-fn">
    <g transform="translate(0,10)">

S({tag:'DEFINITION', ov:'Small + Modular — 300 MWe 경계',
src:'<b>출처</b> IAEA, <i>Advances in SMR Technology Developments</i>, 2022 Edition · 300 MWe는 법적 정의가 아니라 분류를 위한 관례적 상한',
html:`<h2 class="t">Small은 <em>결과가 아니라 선택</em>이다</h2>
<ul class="b">
  <li><b>Small</b> — 전기출력 <code>300 MWe</code> 이하. 열출력이 아니라 <b>전기출력</b> 기준임에 주의</li>
  <li><b>Modular</b> — ① 공장에서 만들어 옮기는 <b>제작 단위</b>, ② 여러 대를 이어 붙이는 <b>출력 단위</b></li>
  <li>공장 제작이 가능하려면 운반 한계 안에 들어와야 하고, 그러려면 작아야 함 — <b class="cool">모듈화를 가능하게 하려는 선택</b></li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 300" role="img" aria-label="주요 원자로의 전기출력 분포와 300 MWe SMR 경계">
  <line x1="60" y1="215" x2="1075" y2="215" class="axis"/>
  <g class="lbl" text-anchor="middle" fill="var(--ink-3)">
    <text x="60" y="240">0</text><text x="262" y="240">300</text><text x="464" y="240">600</text>
    <text x="666" y="240">900</text><text x="868" y="240">1200</text><text x="1070" y="240">1500</text>
  </g>
  <text x="1075" y="268" class="lbl" text-anchor="end">정격 전기출력 (MWe)</text>
  <rect id="smrzone" x="60" y="60" width="0" height="155" fill="var(--cool)" opacity="0.07"/>
  <line id="bline" x1="262" y1="215" x2="262" y2="215" stroke="var(--cool)" stroke-width="2" stroke-dasharray="5 4"/>
  <text id="blbl" x="262" y="48" text-anchor="middle" font-family="var(--mono)" font-size="14"
        fill="var(--cool)" opacity="0">SMR 경계 · 300 MWe</text>
  <g id="dots"></g>
</svg>
</div></div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const X=p=>60+p*(1015/1500);
  const data=[
    ['CAREM-25',30,-108],['RITM-200N',55,-82],['NuScale NPM',77,-56],['SMART100',110,-30],
    ['i-SMR',170,-108],['BWRX-300',300,-82],['IRIS',335,-56],['AP1000',1110,-56],['APR1400',1400,-82]];
  const g=el.querySelector('#dots');
  data.forEach((d,i)=>{
    const smr=d[1]<=300, x=X(d[1]), y=215, col=smr?'var(--cool)':'var(--hot)', ty=y+d[2];
    const c=document.createElementNS(SV,'circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',7);
    c.setAttribute('fill',col); c.setAttribute('opacity',0); g.appendChild(c);
    const stem=document.createElementNS(SV,'line');
    stem.setAttribute('x1',x);stem.setAttribute('y1',y-8);stem.setAttribute('x2',x);
    stem.setAttribute('y2',ty+7);
    stem.setAttribute('stroke','var(--rule)');stem.setAttribute('stroke-width',1);
    stem.setAttribute('opacity',0); g.appendChild(stem);
    const t=document.createElementNS(SV,'text');
    t.setAttribute('x',x); t.setAttribute('y',ty);
    t.setAttribute('text-anchor', x>950?'end':(x<150?'start':'middle'));
    t.setAttribute('font-family','var(--mono)');
    t.setAttribute('font-size','13.5'); t.setAttribute('fill',smr?'var(--cool)':'var(--ink-2)');
    t.setAttribute('opacity',0);
    t.textContent=d[0]+'  '+d[1]+' MWe'; g.appendChild(t);
    if(RM){c.setAttribute('opacity',1);t.setAttribute('opacity',1);stem.setAttribute('opacity',1);return;}
    const dl=700+i*90;
    [c,t,stem].forEach(e=>e.animate([{opacity:0},{opacity:1}],{duration:340,delay:dl,fill:'forwards'}));
  });
  const b=el.querySelector('#bline'), z=el.querySelector('#smrzone'), bl=el.querySelector('#blbl');
  if(RM){ b.setAttribute('y2',44); z.setAttribute('width',202); bl.setAttribute('opacity',1); return; }
  b.animate([{y2:215},{y2:44}],{duration:520,fill:'forwards',easing:'ease-out'});
  bl.animate([{opacity:0},{opacity:1}],{duration:300,delay:480,fill:'forwards'});
  z.animate([{width:0},{width:202}],{duration:600,delay:520,fill:'forwards',easing:'ease-out'});
}});
</script>
<script>
/* ---- 규모의 경제: 공통 스케일 ---- */
const EC={ x0:150,x1:1500,px0:70,px1:670, y1:12500, py0:300,py1:25,
  sx:P=>70+(P-150)/1350*600, sy:C=>300-C/12500*275,
  C:P=>4000*Math.pow(P/1400,-0.49) };
function ecAxes(){
  let g='<line x1="70" y1="300" x2="690" y2="300" class="axis"/>'
       +'<line x1="70" y1="300" x2="70" y2="18" class="axis"/>';
  [0,3000,6000,9000,12000].forEach(c=>{ const y=EC.sy(c);
    g+=`<line x1="70" y1="${y}" x2="690" y2="${y}" class="grid"/>`
      +`<text x="62" y="${y+4}" class="lbl" text-anchor="end">${c?fmt(c):'0'}</text>`; });
  [300,600,900,1200,1500].forEach(p=>{ const x=EC.sx(p);
    g+=`<text x="${x}" y="320" class="lbl" text-anchor="middle">${p}</text>`; });
  g+='<text x="690" y="338" class="lbl" text-anchor="end">정격 전기출력 (MWe)</text>'
    +'<text x="70" y="12" class="lbl">비 자본비 (USD/kWe)</text>';
  return g;
}
function ecCurve(){ let d=''; for(let P=150;P<=1500;P+=10){ d+=(d?'L':'M')+EC.sx(P).toFixed(1)+','+EC.sy(EC.C(P)).toFixed(1); } return d; }

S({tag:'ECONOMY', ov:'규모의 경제 — 작게 만드는 대가',
src:'<b>출처</b> L.M. Boldon, P. Sabharwall, INL/EXT-14-32616 (2014) §6.1 — NEA 평균 <i>n</i> = 0.51 채택. <b>유의</b> 상관식 검증 구간은 300~1300 MWe이므로 그 아래에서는 불확실성이 커진다',
html:`<h2 class="t">출력을 줄이면 <s>kW당 비용이 오른다</s> — 얼마나 오르는지가 전부</h2>
<ul class="b">
  <li>용기·배관·구조물 비용은 <b>표면적</b>에 비례하고 출력은 <b>체적</b>에 비례 → 규모지수 <code>n ≈ 0.4~0.7</code></li>
  <li>총 자본비가 아니라 <b class="cool">kW당 비용</b>을 봐야 함. 두 값은 반대 방향으로 움직임</li>
</ul>
<div class="body">
  <div class="fig">
    <div class="formula" style="white-space:nowrap;font-size:21px;padding:10px 0 14px">C₂/C₁ <span class="op">=</span> (P₂/P₁)<sup>n</sup>
      &nbsp;&nbsp;<span class="op">→</span>&nbsp;&nbsp;
      (C/P)₂/(C/P)₁ <span class="op">=</span> (P₂/P₁)<sup>n−1</sup>,&nbsp; <small>n − 1 &lt; 0</small></div>
    <svg viewBox="0 0 700 345" role="img" aria-label="정격 출력에 따른 비 자본비 곡선. 출력이 작아질수록 kW당 비용이 급격히 오른다">
      ${'{AXES}'}
      <path id="ecc" d="" fill="none" stroke="var(--cool)" stroke-width="2.4"/>
      <line id="ecref" x1="70" y1="0" x2="690" y2="0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 4"/>
      <text id="ecreft" x="686" y="0" class="lbl" text-anchor="end">대형 경수로 기준 1,400 MWe · 4,000</text>
      <line id="ecvl" x1="0" y1="300" x2="0" y2="0" stroke="var(--hot)" stroke-width="1.2"/>
      <circle id="ecpt" r="7" fill="var(--hot)"/>
    </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">정격 전기출력</span><span class="v" id="ro-p">180<small>MWe</small></span></div>
    <div class="readout hi"><span class="k">비 자본비</span><span class="v" id="ro-c">10,900<small>USD/kWe</small></span></div>
    <div class="readout"><span class="k">1,400 MWe 대비</span><span class="v" id="ro-r">2.72<small>배</small></span></div>
    <div class="ctl"><label>출력 조절 <span id="ro-s">180 MWe</span></label>
      <input type="range" id="ec-slider" min="150" max="1400" step="10" value="180"></div>
  </div>
</div>`.replace('{AXES}',''),
init(el){
  const svg=el.querySelector('svg');
  svg.insertAdjacentHTML('afterbegin', ecAxes());
  const cv=el.querySelector('#ecc'); cv.setAttribute('d',ecCurve());
  const L=cv.getTotalLength();
  const ref=el.querySelector('#ecref'), reft=el.querySelector('#ecreft');
  ref.setAttribute('y1',EC.sy(4000)); ref.setAttribute('y2',EC.sy(4000));
  reft.setAttribute('y',EC.sy(4000)-8);
  const vl=el.querySelector('#ecvl'), pt=el.querySelector('#ecpt');
  const sl=el.querySelector('#ec-slider');
  function upd(P){
    const C=EC.C(P), x=EC.sx(P), y=EC.sy(C);
    vl.setAttribute('x1',x);vl.setAttribute('x2',x);vl.setAttribute('y2',y);
    pt.setAttribute('cx',x);pt.setAttribute('cy',y);
    el.querySelector('#ro-p').innerHTML=fmt(P)+'<small>MWe</small>';
    el.querySelector('#ro-c').innerHTML=fmt(C)+'<small>USD/kWe</small>';
    el.querySelector('#ro-r').innerHTML=(C/4000).toFixed(2)+'<small>배</small>';
    el.querySelector('#ro-s').textContent=fmt(P)+' MWe';
  }
  sl.oninput=()=>upd(+sl.value); upd(180);
  if(RM) return;
  cv.style.strokeDasharray=L; cv.style.strokeDashoffset=L;
  cv.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,fill:'forwards',easing:'ease-in-out'});
  // 1400 → 180 으로 미끄러지며 대가를 보여줌
  let t0=null; sl.value=1400; upd(1400);
  raf((t)=>{ if(t<1.0) return; const u=clamp((t-1.0)/1.6,0,1);
    const e=1-Math.pow(1-u,3); const P=lerp(1400,180,e); sl.value=Math.round(P); upd(P); });
}});

S({tag:'ECONOMY', ov:'2.7배를 되돌리는 네 가지 인자',
src:'<b>출처</b> Boldon &amp; Sabharwall, INL/EXT-14-32616 (2014) §5.5·§6.1, Eq.3~6·Eq.12 — 원 보고서는 NEA/OECD(2011), Carelli et al.(2010), Wilton(2012)을 인용. <b>모두 반복 건설을 전제</b>한다',
html:`<h2 class="t">2.7배를 되돌리는 <em>네 가지 인자</em> — 버튼을 눌러 하나씩 적용</h2>

</div>`,
init(el){
  const svg=el.querySelector('svg');

  const ref=el.querySelector('#rc-ref'), reft=el.querySelector('#rc-reft');
  ref.setAttribute('y1',EC.sy(4000));ref.setAttribute('y2',EC.sy(4000));reft.setAttribute('y',EC.sy(4000)-8);
  const VAL=[10900,9700,8100,6300,4700];
  const NAME=['Co-siting','Modular design','Plant configuration','NOAK'];
  const X=EC.sx(180);
  const g=el.querySelector('#rc-steps');
  VAL.slice(1).forEach((v,i)=>{ const y=EC.sy(v);
    g.insertAdjacentHTML('beforeend',
      `<g opacity="0" data-s="${i}"><line x1="${X}" y1="${y}" x2="690" y2="${y}" stroke="var(--ok)" stroke-width="1" stroke-dasharray="5 4"/>`
      +`<text x="686" y="${y-7}" class="lbl" fill="var(--ok)" text-anchor="end">${NAME[i]} → ${fmt(v)}</text></g>`); });
  const bar=el.querySelector('#rc-bar'), pt=el.querySelector('#rc-pt'), vt=el.querySelector('#rc-val');
  bar.setAttribute('x1',X);bar.setAttribute('x2',X);bar.setAttribute('y1',EC.sy(10900));
  let on=0, shown=10900, target=10900;
  function apply(){
    target=VAL[on];
    el.querySelectorAll('#rc-btns .btn').forEach(b=>{
      const i=+b.dataset.i; if(i>=0) b.classList.toggle('act', i<on); });
    [...g.children].forEach((c,i)=>c.setAttribute('opacity', i<on?1:0));
  }
  raf(()=>{ shown=lerp(shown,target,0.10);
    const y=EC.sy(shown); bar.setAttribute('y2',y); pt.setAttribute('cx',X);pt.setAttribute('cy',y);
    vt.setAttribute('x',X+15);vt.setAttribute('y',y+6);vt.textContent=fmt(shown)+' USD/kWe';
    el.querySelector('#rc-ro').innerHTML=fmt(shown)+'<small>USD/kWe</small>';
    pt.setAttribute('fill', shown<5200?'var(--ok)':'var(--hot)');
    bar.setAttribute('stroke', shown<5200?'var(--ok)':'var(--hot)');
    vt.setAttribute('fill', shown<5200?'var(--ok)':'var(--hot)');
  });
  el.querySelectorAll('#rc-btns .btn').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; if(i<0){on=0;} else {on = (i<on)? i : i+1;} apply(); });

<script>
S({tag:'LAYOUT · 루프형', ov:'루프형 대형 경수로 — 대구경 배관이 곧 LBLOCA',
src:'<b>개념도</b> 자체 작성. 배관 수·기기 배치를 축약한 모식도이며 축척은 임의. <b>GDC 4</b>는 파단확률이 극히 낮으면 동적효과를 배제할 수 있게 한다(LBB 근거)',
html:`<h2 class="t">루프형 — 대구경 배관 하나가 <s>최악의 설계기준사고</s>를 정의한다</h2>
<ul class="b">

  <li>냉각재는 <b>펌프</b>가 돌린다. 펌프가 멈추면 유량이 곧바로 사라짐</li>

<div class="body">
  <div class="fig">

    <path id="lp" d="M150,300 L150,110 L480,110 L480,300 Z" fill="none" stroke="var(--rule)" stroke-width="12"/>
    <rect x="105" y="88" width="90" height="234" rx="18" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>
    <rect id="lvl" x="108" y="118" width="84" height="201" fill="var(--cool)" opacity="0.16"/>
    <rect id="lcore" x="127" y="248" width="46" height="56" rx="3" fill="var(--hot)"/>
    <text x="150" y="282" text-anchor="middle" font-size="13" font-family="var(--sans)" fill="#fff">노심</text>
    <text x="150" y="78" text-anchor="middle" class="ttl">원자로용기</text>
    <rect x="435" y="76" width="90" height="208" rx="10" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>
    <text x="480" y="66" text-anchor="middle" class="ttl">증기발생기</text>
    <circle cx="315" cy="300" r="23" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>

    <text x="315" y="98" text-anchor="middle" class="lbl" fill="var(--hot)">고온관 (대구경)</text>
    <text x="240" y="278" text-anchor="middle" class="lbl">저온관 (대구경)</text>
    <g id="brk" opacity="0">
      <circle cx="350" cy="110" r="14" fill="none" stroke="var(--hot)" stroke-width="2"/>
      <text x="350" y="60" text-anchor="middle" font-family="var(--mono)" font-size="15" fill="var(--hot)">파단</text>
    </g>
    <g id="esc"></g>
    <text id="msg" x="350" y="180" text-anchor="middle" font-family="var(--sans)" font-size="26"
          font-weight="600" fill="var(--hot)" opacity="0">대형 LOCA — 노심 노출</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout hi"><span class="k">순환 구동</span><span class="v" id="lp-drv">펌프</span></div>
    <div class="readout" id="lp-lvbox"><span class="k">노심 위 수위</span><span class="v" id="lp-lv">100<small>%</small></span></div>
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn danger" id="lp-break">고온관 파단 (LBLOCA)</button>
      <button class="btn" id="lp-reset">정상운전으로 복귀</button>
    </div>
    <div class="src">파단이 일어나면 감압·수위 하강·열전달 붕괴가 <b>동시에</b> 진행된다. 8장에서 정량화.</div>
  </div>
</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const p=el.querySelector('#lp'), f=flow(p,{n:14,speed:0.13,r:4.2,color:'var(--cool)'});
  const lvl=el.querySelector('#lvl'), core=el.querySelector('#lcore'),
        brk=el.querySelector('#brk'), msg=el.querySelector('#msg'), esc=el.querySelector('#esc');
  let st='ok', lv=1, T=0;
  function reset(){ st='ok'; lv=1; f.speed=0.13; brk.setAttribute('opacity',0);
    msg.setAttribute('opacity',0); esc.innerHTML=''; core.setAttribute('fill','var(--hot)');
    el.querySelector('#lp-drv').textContent='펌프';
    el.querySelector('#lp-lvbox').className='readout'; }
  el.querySelector('#lp-reset').onclick=reset;
  el.querySelector('#lp-break').onclick=()=>{ if(st!=='ok') return; st='brk'; T=0;
    brk.setAttribute('opacity',1); el.querySelector('#lp-drv').textContent='상실';
    el.querySelector('#lp-lvbox').className='readout warn';
    for(let i=0;i<26;i++){ const c=document.createElementNS(SV,'circle');
      c.setAttribute('r',3.4); c.setAttribute('fill','var(--hot)');
      c.dataset.a=(-0.25-Math.random()*2.6); c.dataset.v=(70+Math.random()*130);
      c.dataset.t=(Math.random()*1.4); esc.appendChild(c); } };
  raf((t,abs)=>{
    if(st==='brk'){ T+=1/60;
      lv=Math.max(0.12,1-T*0.30); f.speed=Math.max(0.02,0.13+0.5*Math.exp(-T*1.4)-T*0.05);
      if(T>1.6) msg.setAttribute('opacity',Math.min(1,(T-1.6)));
      core.setAttribute('fill', T>2.0?'#ff3b1f':'var(--hot)');
      [...esc.children].forEach(c=>{ let u=(T-+c.dataset.t); if(u<0){c.setAttribute('opacity',0);return;}
        u=u%2.0; const a=+c.dataset.a, v=+c.dataset.v;
        c.setAttribute('cx',350+Math.cos(a)*v*u); c.setAttribute('cy',110+Math.sin(a)*v*u+40*u*u);
        c.setAttribute('opacity',Math.max(0,1-u/1.6)); });
    }
    const y=118+(319-118)*(1-lv)*0.86;
    lvl.setAttribute('y',y); lvl.setAttribute('height',Math.max(2,319-y));
    el.querySelector('#lp-lv').innerHTML=fmt(lv*100)+'<small>%</small>';
  });
}});

S({tag:'LAYOUT · 일체형', ov:'일체형 SMR — 파단할 배관이 없다',

<div class="body">

S({tag:'DECAY HEAT', ov:'붕괴열 — 비율은 같고 절대량이 준다',
src:'<b>계산</b> Way–Wigner 근사 <span class="mono">P_d/P₀ = 0.0622 [ t<sup>−0.2</sup> − (t+t₀)<sup>−0.2</sup> ]</span>, t₀ = 10⁸ s. 인허가 해석에는 ANSI/ANS-5.1을 쓴다 · 정격 열출력 출처 IAEA SMR Booklet 2022 · KHNP',
html:`<h2 class="t">비율은 같다. <em>절대량</em>이 다르다 — 슬라이더로 시간을 흘려보자</h2>
<ul class="b">
  <li>붕괴열 <b>비율</b>은 노심 크기와 거의 무관. 정지 1시간 뒤 어느 노형이든 정격의 약 <code>1 %</code></li>
  <li>달라지는 건 <b class="hot">절대량</b> — 3,983 MWt의 1 %는 40 MW, 250 MWt의 1 %는 2.6 MW. <b>15배</b> 차이</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 1120 330" role="img" aria-label="정지 후 시간에 따른 붕괴열 비율 곡선과 세 노형의 절대 붕괴열 비교">
    <g id="dk-ax"></g>
    <path id="dk-c" d="" fill="none" stroke="var(--cool)" stroke-width="2.4"/>
    <line id="dk-v" y1="292" y2="40" stroke="var(--hot)" stroke-width="1.2"/>
    <circle id="dk-p" r="6.5" fill="var(--hot)"/>
    <text x="300" y="18" text-anchor="middle" class="lbl b">붕괴열 / 정격 열출력</text>
    <text x="860" y="18" text-anchor="middle" class="lbl b">붕괴열 절대량 (MW, 로그 눈금)</text>
    <g id="dk-bars"></g>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">정지 후 경과</span><span class="v" id="dk-t">1<small>시간</small></span></div>
    <div class="readout hi"><span class="k">정격 대비 비율</span><span class="v" id="dk-f">1.05<small>%</small></span></div>
    <div class="ctl"><label>시간 <span id="dk-s">1 시간</span></label>
      <input type="range" id="dk-sl" min="0" max="600" step="1" value="257"></div>
    <div class="src">1 초 → 1 주. 로그 눈금이라 슬라이더 한 칸이 뒤로 갈수록 긴 시간을 뜻한다.</div>
  </div>
</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const LX=t=>70+(Math.log10(t))/6*450;               // 1 .. 1e6 s → 70..520
  const LY=f=>292-(Math.log10(f)-Math.log10(0.1))/(Math.log10(20)-Math.log10(0.1))*252;
  const BX=mw=>640+(Math.log10(Math.max(mw,0.1))+1)/(Math.log10(300)+1)*430;
  let ax='';
  [[1,'1 s'],[60,'1 분'],[3600,'1 시간'],[86400,'1 일'],[604800,'1 주']].forEach(d=>{
    const x=LX(d[0]); ax+=`<line x1="${x}" y1="292" x2="${x}" y2="40" class="grid"/>`
      +`<text x="${x}" y="312" class="lbl" text-anchor="middle">${d[1]}</text>`; });
  [0.1,1,10].forEach(f=>{ const y=LY(f);
    ax+=`<line x1="70" y1="${y}" x2="520" y2="${y}" class="grid"/>`
      +`<text x="62" y="${y+4}" class="lbl" text-anchor="end">${f} %</text>`; });
  ax+='<line x1="70" y1="292" x2="520" y2="292" class="axis"/><line x1="70" y1="292" x2="70" y2="34" class="axis"/>';
  [0.1,1,10,100].forEach(m=>{ const x=BX(m);
    ax+=`<line x1="${x}" y1="60" x2="${x}" y2="300" class="grid"/>`
      +`<text x="${x}" y="318" class="lbl" text-anchor="middle">${m}</text>`; });
  el.querySelector('#dk-ax').innerHTML=ax;
  let d=''; for(let i=0;i<=300;i++){ const t=Math.pow(10,i/300*6);
    d+=(d?'L':'M')+LX(t).toFixed(1)+','+LY(decay(t)*100).toFixed(1); }
  el.querySelector('#dk-c').setAttribute('d',d);
  const REA=[['APR1400',3983,'var(--ink-2)'],['BWRX-300',870,'var(--amber)'],['NuScale NPM',250,'var(--ok)']];
  const bg=el.querySelector('#dk-bars'); const bars=[];
  REA.forEach((r,i)=>{ const y=110+i*62;
    bg.insertAdjacentHTML('beforeend',
      `<text x="640" y="${y-10}" class="lbl b">${r[0]} · ${fmt(r[1])} MWt</text>`
      +`<rect x="640" y="${y}" height="22" width="0" fill="${r[2]}" opacity=".85" data-b="${i}"/>`
      +`<text x="646" y="${y+40}" class="val" fill="${r[2]}" data-v="${i}"></text>`); });
  const sl=el.querySelector('#dk-sl'), vl=el.querySelector('#dk-v'), pt=el.querySelector('#dk-p');
  function upd(v){
    const t=Math.pow(10,v/600*6), f=decay(t);
    vl.setAttribute('x1',LX(t));vl.setAttribute('x2',LX(t));
    vl.setAttribute('y2',LY(f*100));
    pt.setAttribute('cx',LX(t));pt.setAttribute('cy',LY(f*100));
    const lab = t<90? fmt(t,0)+' 초' : t<5400? fmt(t/60,0)+' 분' : t<172800? fmt(t/3600,1)+' 시간' : fmt(t/86400,1)+' 일';
    el.querySelector('#dk-t').innerHTML=lab.split(' ')[0]+'<small>'+lab.split(' ')[1]+'</small>';
    el.querySelector('#dk-f').innerHTML=(f*100).toFixed(2)+'<small>%</small>';
    el.querySelector('#dk-s').textContent=lab;
    REA.forEach((r,i)=>{ const mw=f*r[1];
      el.querySelector(`[data-b="${i}"]`).setAttribute('width',Math.max(0,BX(mw)-640));
      el.querySelector(`[data-v="${i}"]`).textContent=(mw>=10?fmt(mw,0):mw.toFixed(2))+' MW'; });
  }
  sl.oninput=()=>upd(+sl.value); upd(257);
  if(RM) return;
  const c=el.querySelector('#dk-c'), L=c.getTotalLength();
  c.style.strokeDasharray=L;c.style.strokeDashoffset=L;
  c.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,fill:'forwards'});
  raf(t=>{ if(t<1.1||t>4.6) return; const u=(t-1.1)/3.5; sl.value=Math.round(u*600); upd(+sl.value); });
}});

S({tag:'NATURAL CIRCULATION', ov:'자연순환 — 구동수두 인터랙티브',
src:'<b>계산</b> Δp = (ρ_c − ρ_h) g H, u = √[2Δp / ρ(fL/D + ΣK)] · 압축수 밀도 근사(10~16 MPa) · 유로 K = 25, 단면적 2 m², 저온측 250 °C 기준. 펌프 양정 600 kPa는 대형 PWR의 개념적 대표값',
html:`<h2 class="t">펌프가 없으면 <em>밀도차</em>가 밀어야 한다 — 그 힘은 얼마인가</h2>
<ul class="b">
  <li>열중심 높이차 <code>H</code>와 온도차 <code>ΔT</code>가 만드는 부력이 유일한 구동력</li>
  <li>구동수두가 작으니 <b>유량도 작다</b> → 같은 출력을 빼려면 노심 출입구 <b class="hot">온도차가 커진다</b></li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 340" role="img" aria-label="자연순환 루프의 구동수두와 유속이 높이차·온도차에 따라 변하는 모습">
    <path id="nc-p" d="M260,300 L260,90 L470,90 L470,300 Z" fill="none" stroke="var(--rule)" stroke-width="11"/>
    <rect x="222" y="238" width="76" height="74" rx="4" fill="var(--hot)"/>
    <text x="260" y="282" text-anchor="middle" font-size="13" fill="#fff" font-family="var(--sans)">노심</text>
    <rect x="432" y="72" width="76" height="96" rx="4" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.5"/>
    <text x="470" y="126" text-anchor="middle" class="lbl" fill="var(--cool)">열교환기</text>
    <line id="nc-h" x1="150" x2="150" stroke="var(--ok)" stroke-width="1.6"/>
    <path id="nc-h1" d="" stroke="var(--ok)" stroke-width="1.6"/>
    <text id="nc-ht" x="140" y="190" text-anchor="end" class="val" fill="var(--ok)">H</text>
    <text x="365" y="72" text-anchor="middle" class="lbl" fill="var(--hot)">뜨거운 쪽 (가벼움)</text>
    <text x="365" y="326" text-anchor="middle" class="lbl" fill="var(--cool)">차가운 쪽 (무거움)</text>
    <g id="nc-cmp">
      <text x="560" y="200" class="lbl b">구동 압력 비교</text>
      <rect x="560" y="212" width="110" height="16" fill="var(--ink-3)" opacity=".5"/>
      <text x="560" y="246" class="lbl">대형 PWR 펌프 600 kPa</text>
      <rect id="nc-bar" x="560" y="262" width="4" height="16" fill="var(--ok)"/>
      <text id="nc-bart" x="560" y="296" class="lbl" fill="var(--ok)">자연순환</text>
    </g>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">구동수두 Δp</span><span class="v" id="nc-dp">11.3<small>kPa</small></span></div>
    <div class="readout hi"><span class="k">자연순환 유속</span><span class="v" id="nc-u">0.87<small>m/s</small></span></div>
    <div class="readout warn"><span class="k">노심 ΔT · 250 MWt</span><span class="v" id="nc-dt">36<small>K</small></span></div>
    <div class="ctl"><label>열중심 높이차 <span id="nc-hs">10.0 m</span></label>
      <input type="range" id="nc-sh" min="2" max="14" step="0.2" value="10"></div>
    <div class="ctl"><label>노심 출입구 온도차 <span id="nc-ts">67 K</span></label>
      <input type="range" id="nc-st" min="20" max="110" step="1" value="67"></div>
  </div>
</div>`,
init(el){
  const p=el.querySelector('#nc-p'), f=flow(p,{n:16,speed:0.12,r:4.2,color:'var(--cool)'});
  const sh=el.querySelector('#nc-sh'), stt=el.querySelector('#nc-st');
  const hl=el.querySelector('#nc-h'), h1=el.querySelector('#nc-h1');
  let target=0.12;
  function upd(){
    const H=+sh.value, dT=+stt.value, Tc=250;
    const drho=rhoW(Tc)-rhoW(Tc+dT), dp=drho*9.81*H, u=Math.sqrt(2*dp/(750*25));
    const mdot=750*u*2, dTc=250e6/(mdot*5300);
    el.querySelector('#nc-dp').innerHTML=(dp/1000).toFixed(1)+'<small>kPa</small>';
    el.querySelector('#nc-u').innerHTML=u.toFixed(2)+'<small>m/s</small>';
    el.querySelector('#nc-dt').innerHTML=fmt(dTc,0)+'<small>K</small>';
    el.querySelector('#nc-hs').textContent=H.toFixed(1)+' m';
    el.querySelector('#nc-ts').textContent=dT+' K';
    // 높이 치수선 (H = 2..14 m → 화면 210 px 내에서)
    const y0=290, y1=290-(H/14)*200;
    hl.setAttribute('y1',y0);hl.setAttribute('y2',y1);
    h1.setAttribute('d',`M142,${y0} H158 M142,${y1} H158`);
    el.querySelector('#nc-ht').setAttribute('y',(y0+y1)/2+5);
    el.querySelector('#nc-ht').textContent='H '+H.toFixed(1)+' m';
    const w=Math.max(3,(dp/1000)/600*110);
    el.querySelector('#nc-bar').setAttribute('width',w);
    el.querySelector('#nc-bart').textContent='자연순환 '+(dp/1000).toFixed(1)+' kPa';
    target=0.030+u*0.115;
  }
  sh.oninput=upd; stt.oninput=upd; upd();
  raf(()=>{ f.speed=lerp(f.speed,target,0.08); });
  if(RM) return;
  raf(t=>{ if(t>2.4) return; const u=clamp(t/2.2,0,1);
    sh.value=(lerp(3,10,u)).toFixed(1); stt.value=Math.round(lerp(30,67,u)); upd(); });
}});

S({tag:'THERMAL INERTIA', ov:'열관성 — 5배 느리게 데워진다',
src:'<b>계산</b> dT/dt = P_d /(M c_p), c_p = 5.3 kJ/(kg·K), 정지 1시간 후 붕괴열(SMR 2.6 MW / 대형로 41.8 MW) 기준. 냉각이 <b>완전히 끊긴</b> 가장 보수적인 상한이며 실제로는 용기 열손실과 잔열제거계통이 함께 작동한다',
html:`<h2 class="t">대처시간이 길다는 말의 <em>물리적 내용</em></h2>
<ul class="b">
  <li>붕괴열이 적고 물이 많으면 온도가 <b>천천히</b> 오른다 — 그 느림이 운전원과 피동계통이 쓰는 시간</li>
  <li>SMR <code>17.7 K/h</code> vs 대형 경수로 <code>94.6 K/h</code> — <b class="ok">약 5배</b></li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 1120 320" role="img" aria-label="냉각이 끊긴 뒤 SMR과 대형 경수로의 1차계통 온도 상승 속도 비교">
    <g id="ti-ax"></g>
    <polyline id="ti-a" points="" fill="none" stroke="var(--ok)" stroke-width="3"/>
    <polyline id="ti-b" points="" fill="none" stroke="var(--hot)" stroke-width="3"/>
    <line id="ti-sat" x1="120" x2="1030" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text id="ti-satt" x="1030" class="lbl" fill="var(--amber)" text-anchor="end">포화온도 약 330 °C (12.8 MPa)</text>
    <circle id="ti-pa" r="6" fill="var(--ok)"/><circle id="ti-pb" r="6" fill="var(--hot)"/>
    <text x="140" y="40" class="lbl" fill="var(--ok)">250 MWt 일체형 SMR · 1차계통 물 100 t</text>
    <text x="140" y="62" class="lbl" fill="var(--hot)">3,983 MWt 대형 경수로 · 1차계통 물 300 t</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">SMR 온도</span><span class="v" id="ti-ta">250<small>°C</small></span></div>
    <div class="readout warn"><span class="k">대형 경수로 온도</span><span class="v" id="ti-tb">250<small>°C</small></span></div>
    <div class="readout"><span class="k">경과 시간</span><span class="v" id="ti-cl">0.0<small>시간</small></span></div>
    <div class="src">두 곡선이 같은 포화온도 선에 닿는 데 걸리는 시간의 차이가 곧 <b>대처시간의 차이</b>다.</div>
  </div>
</div>`,
init(el){
  const X=h=>120+h/3.2*910, Y=T=>270-(T-250)/110*220;
  let ax='<line x1="120" y1="270" x2="1035" y2="270" class="axis"/><line x1="120" y1="270" x2="120" y2="70" class="axis"/>';
  [0,1,2,3].forEach(h=>{ ax+=`<line x1="${X(h)}" y1="270" x2="${X(h)}" y2="76" class="grid"/>`
    +`<text x="${X(h)}" y="292" class="lbl" text-anchor="middle">${h} 시간</text>`; });
  [250,290,330,350].forEach(T=>{ ax+=`<text x="112" y="${Y(T)+4}" class="lbl" text-anchor="end">${T} °C</text>`; });
  ax+='<text x="1035" y="310" class="lbl" text-anchor="end">냉각이 끊긴 뒤 경과시간</text>';
  el.querySelector('#ti-ax').innerHTML=ax;
  el.querySelector('#ti-sat').setAttribute('y1',Y(330));
  el.querySelector('#ti-sat').setAttribute('y2',Y(330));
  el.querySelector('#ti-satt').setAttribute('y',Y(330)-8);
  const RA=17.7, RB=94.6;
  const A=el.querySelector('#ti-a'), B=el.querySelector('#ti-b'),
        pa=el.querySelector('#ti-pa'), pb=el.querySelector('#ti-pb');
  function draw(h){
    const ha=Math.min(h,(330-250)/RA), hb=Math.min(h,(330-250)/RB);
    A.setAttribute('points',poly([[X(0),Y(250)],[X(ha),Y(250+RA*ha)]]));
    B.setAttribute('points',poly([[X(0),Y(250)],[X(hb),Y(250+RB*hb)]]));
    pa.setAttribute('cx',X(ha));pa.setAttribute('cy',Y(250+RA*ha));
    pb.setAttribute('cx',X(hb));pb.setAttribute('cy',Y(250+RB*hb));
    el.querySelector('#ti-ta').innerHTML=fmt(250+RA*ha,0)+'<small>°C</small>';
    el.querySelector('#ti-tb').innerHTML=fmt(250+RB*hb,0)+'<small>°C</small>';
    el.querySelector('#ti-cl').innerHTML=h.toFixed(1)+'<small>시간</small>';
  }
  if(RM){ draw(3.2); return; }
  draw(0);
  raf(t=>{ const c=(t%9)/9*3.2; draw(c); });
}});
</script>

  R.forEach((r,i)=>{ const y=56+i*47;
    g.insertAdjacentHTML('beforeend',
      `<text x="170" y="${y+5}" class="lbl b" text-anchor="end">${r[0]}</text>`
      +`<line x1="${X(r[1])}" y1="${y}" x2="${X(r[2])}" y2="${y}" stroke="${r[3]}" stroke-width="5" opacity=".25"/>`);
    r[4].forEach(m=>{
      const mx=X(m[0]);
      g.insertAdjacentHTML('beforeend',
        `<circle cx="${mx}" cy="${y}" r="5.5" fill="${r[3]}" opacity="0" data-y="${m[0]}"/>`
        +`<text x="${mx}" y="${y+(m[2]>0?-13:20)}" class="lbl" font-size="12.5" fill="${r[3]}" text-anchor="middle" opacity="0" data-y="${m[0]}">${m[1]}</text>`);
    });
  });
  const now=el.querySelector('#tl-now'), nowt=el.querySelector('#tl-nowt');
  const all=[...g.querySelectorAll('[data-y]')];
  function at(year){
    now.setAttribute('x1',X(year));now.setAttribute('x2',X(year));nowt.setAttribute('x',X(year));
    all.forEach(e=>e.setAttribute('opacity', (+e.dataset.y)<=year+0.05 ?1:0.22));
  }
  if(RM){ at(2026.7); return; }
  at(2012); raf(t=>{ const u=clamp(t/3.2,0,1); at(lerp(2012,2026.7,1-Math.pow(1-u,2.2))); });
}});

S({tag:'DEFENCE IN DEPTH', ov:'심층방어 5단계 — 사고가 어디서 멈추는가',
src:'<b>출처</b> IAEA, <i>Safety of Nuclear Power Plants: Design</i>, SSR-2/1 (Rev.1) Requirement 7 — “The levels of defence in depth shall be <b>independent as far as is practicable</b>.”',
html:`<h2 class="t">사고는 <em>겹</em>을 하나씩 뚫는다 — 어디서 멈추게 할 것인가</h2>
<ul class="b">
  <li>공학적안전설비(ESF)가 지키는 곳은 <b class="cool">Level 3</b>. 이 교재가 다루는 범위다</li>
  <li>단계를 나눠도 <b class="hot">같은 원인으로 함께 죽으면 겹이 아니다</b> — 후쿠시마가 그랬다</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 860 330" role="img" aria-label="심층방어 5단계를 사고가 통과하는 모습. 정상 설계에서는 Level 3의 공학적안전설비에서 멈춘다">
    <g id="dd-lv"></g>
    <circle id="dd-tok" cx="700" cy="6" r="11" fill="var(--hot)"/>
    <text id="dd-toklbl" x="700" y="-8" class="lbl" fill="var(--hot)" text-anchor="middle">사고</text>
    <text id="dd-res" x="430" y="318" text-anchor="middle" font-family="var(--sans)" font-size="19"
          font-weight="600" fill="var(--ok)" opacity="0"></text>
  </svg>
  </div>
  <div class="side">
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn act" id="dd-n">정상 설계 — 재생</button>
      <button class="btn danger" id="dd-f">후쿠시마 — 공통원인 재생</button>
    </div>
    <blockquote class="q" style="border-left-color:var(--hot)">지진과 쓰나미라는 <b>하나의 사건</b>이 외부전원(Level 1~2 지원),
      비상디젤발전기(Level 3), 최종 열침원(Level 3~4)을 <b>동시에</b> 무력화했다.
      <span class="cite">→ 그래서 SMR은 전원을 필요로 하지 않는 계통을 강조한다</span></blockquote>
  </div>
</div>`,
init(el){
  const LV=[['Level 1','정상운전 이탈 예방','보수적 설계 · 여유도 · 품질보증','var(--cool)'],
    ['Level 2','이탈의 감지와 제어','제어·감시계통 · 운전절차서','var(--cool)'],
    ['Level 3','설계기준사고 제어','공학적안전설비 (ESF)','var(--ok)'],
    ['Level 4','중대사고 완화','중대사고 관리설비 · 격납 건전성','var(--amber)'],
    ['Level 5','소외 영향 완화','비상대응 · 방재계획','var(--ink-3)']];
  const g=el.querySelector('#dd-lv');
  LV.forEach((l,i)=>{ const y=18+i*56;
    g.insertAdjacentHTML('beforeend',
      `<g data-l="${i}"><rect x="30" y="${y}" width="800" height="42" fill="var(--panel)" stroke="${l[3]}" stroke-width="${i===2?2:1.2}"/>`
      +`<text x="48" y="${y+26}" font-family="var(--mono)" font-size="14" fill="${l[3]}">${l[0]}</text>`
      +`<text x="140" y="${y+26}" font-family="var(--sans)" font-size="17" fill="var(--ink)">${l[1]}</text>`
      +`<text x="820" y="${y+26}" class="lbl" text-anchor="end">${l[2]}</text></g>`); });
  const tok=el.querySelector('#dd-tok'), tl=el.querySelector('#dd-toklbl'), res=el.querySelector('#dd-res');
  const rows=[...g.querySelectorAll('[data-l]')];
  let mode='n', T=0, run=false;
  function start(m){ mode=m; T=0; run=true; res.setAttribute('opacity',0);
    rows.forEach(r=>{ r.setAttribute('opacity',1);
      r.querySelector('rect').setAttribute('fill','var(--panel)'); });
    el.querySelector('#dd-n').classList.toggle('act',m==='n');
    el.querySelector('#dd-f').classList.toggle('act',m==='f'); }
  el.querySelector('#dd-n').onclick=()=>start('n');
  el.querySelector('#dd-f').onclick=()=>start('f');
  if(RM){ tok.setAttribute('cy',18+2*56+21); res.setAttribute('opacity',1);
    res.textContent='Level 3 공학적안전설비에서 정지'; return; }
  start('n');
  raf(()=>{ if(!run) return; T+=1/60;
    const stopAt = mode==='n'? 2 : 4;
    if(mode==='f' && T>0.35){ [0,1,2,3].forEach(i=>{
      rows[i].setAttribute('opacity',0.32);
      rows[i].querySelector('rect').setAttribute('fill','#1a1010'); }); }
    const yTarget = 18+stopAt*56+21;
    const y = Math.min(yTarget, -6 + T*150);
    tok.setAttribute('cy',y); tl.setAttribute('y',y-18);
    if(y>=yTarget-0.5){
      run=false;
      if(mode==='n'){ res.setAttribute('fill','var(--ok)');
        res.textContent='Level 3 — 공학적안전설비가 사고를 설계기준 안에서 멈춘다'; }
      else { res.setAttribute('fill','var(--hot)');
        res.textContent='단계가 독립이 아니면, 다섯 겹도 한 겹이다'; }
      res.setAttribute('opacity',1);
      const r=rows[stopAt].querySelector('rect');
      r.animate([{strokeWidth:2},{strokeWidth:5},{strokeWidth:2}],{duration:700,iterations:2});
    }
  });
}});
</script>
<script>
S({tag:'SINGLE FAILURE', ov:'단일고장기준 — 원문과 세 가지 함정',
src:'<b>출처</b> 10 CFR Part 50, Appendix A, “Definitions and Explanations” (eCFR 원문 확인) · IAEA SSR-2/1 (Rev.1) Requirement 25',
html:`<h2 class="t">하나는 고장 났다고 <em>치고</em> 설계한다 — 단, 세 가지를 정확히</h2>

S({tag:'PLANT STATES', ov:'플랜트 상태 — 빈도가 낮을수록 허용 결과가 느슨해진다',
src:'<b>출처</b> IAEA SSR-2/1 (Rev.1) Requirement 19(설계기준사고)·Requirement 20(설계확장조건). 빈도 구간은 관례적 크기이며 규제·설계마다 경계가 다르다',
html:`<h2 class="t">무엇에 대비하는가 — <em>빈도</em>가 <em>허용 결과</em>를 정한다</h2>
<ul class="b">
  <li>매년 일어날 수 있는 이탈에서 연료가 손상되면 안 되지만, 백만 년에 한 번은 <b>격납만 지키면</b> 된다</li>
  <li>심층방어 단계 구분(앞 슬라이드)이 이 <b class="cool">빈도–결과 축</b>과 정확히 대응한다</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 330" role="img" aria-label="발생 빈도에 따른 플랜트 상태 구분과 각 구간에서 허용되는 결과">

init(el){
  const X=e=>120+(-e)/7*900;     // 10^0 .. 10^-7 /yr

  el.querySelector('#ps-ax').innerHTML=ax;
  const B=[['정상운전',0,-2,'var(--ok)','방사선 방출이 규제 한도 이내',236],

    ['설계기준사고 · DBA',-4,-6,'var(--amber)','연료 일부 손상 허용 · 방사선 기준 만족',136],
    ['설계확장조건 · DEC',-6,-7,'var(--hot)','노심용융 포함 · 격납 건전성 유지',86]];
  const g=el.querySelector('#ps-b');
  B.forEach((b,i)=>{ const x0=X(b[1]),x1=X(b[2]),y=b[5];

      +`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${b[3]}" stroke-width="2.5"/>`

  items.forEach((it,i)=>it.animate([{opacity:0},{opacity:1}],{duration:420,delay:220*i,fill:'forwards'}));
}});

S({tag:'PASSIVE CATEGORIES', ov:'피동 Category A~D — 어디까지가 피동인가',
src:'<b>출처</b> IAEA-TECDOC-626, <i>Safety Related Terms for Advanced Nuclear Plants</i> (1991)',
html:`<h2 class="t">“피동”은 <em>이분법이 아니다</em> — 네 등급으로 갈린다</h2>
<ul class="b">
  <li>범주가 오른쪽으로 갈수록 <b class="hot">고장 가능성이 있는 요소</b>가 하나씩 늘어난다</li>

<div class="body"><div class="fig">

  C.forEach((c,i)=>{ const x=40+i*272, w=248;
    let h=`<g data-c="${i}" opacity="0">`
      +`<rect x="${x}" y="24" width="${w}" height="270" fill="var(--panel)" stroke="${c[3]}" stroke-width="1.6"/>`
      +`<rect x="${x}" y="24" width="${w}" height="40" fill="${c[3]}"/>`
      +`<text x="${x+w/2}" y="51" text-anchor="middle" font-family="var(--mono)" font-size="16" fill="#071018" font-weight="600">${c[0]}</text>`;
    c[1].forEach((on,j)=>{ const y=94+j*38;

    h+=`<line x1="${x+18}" y1="216" x2="${x+w-18}" y2="216" stroke="var(--rule)"/>`;

S({tag:'SCRAM', ov:'제어봉 낙하 — S-곡선과 stuck rod',
src:'<b>계산</b> 코사인 중성자속 분포를 가정한 표준 S-곡선 <span class="mono">ρ(x)/ρ_total = x − sin(2πx)/2π</span> · stuck rod 영향 18 % 손실로 예시. 실제 값은 노심 설계·연소도에 따라 다르다',
html:`<h2 class="t">삽입 초기와 말기는 <s>효율이 낮다</s> — 그래서 낙하 시간이 요건이 된다</h2>
<ul class="b">
  <li>중성자속이 높은 <b>노심 중앙부</b>를 지날 때 반응도가 급격히 들어감 — 곡선이 S자인 이유</li>
  <li><b class="hot">GDC 26</b> — 최대 반응도가 봉 1개가 <b>삽입되지 않는다</b>는 가정에서도 요구 성능을 만족해야 함</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 1120 320" role="img" aria-label="제어봉이 노심에 떨어지면서 삽입 반응도가 S자 곡선을 그리는 모습과 stuck rod의 영향">
    <rect x="60" y="60" width="290" height="210" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.5"/>
    <text x="205" y="48" text-anchor="middle" class="ttl">노심 단면</text>
    <g id="sc-rods"></g>
    <g id="sc-ax"></g>
    <path id="sc-a" d="" fill="none" stroke="var(--cool)" stroke-width="2.8"/>
    <path id="sc-b" d="" fill="none" stroke="var(--hot)" stroke-width="2.2" stroke-dasharray="6 4"/>
    <circle id="sc-pa" r="6" fill="var(--cool)"/>
    <text x="470" y="48" class="lbl b">전 제어봉 삽입</text>
    <text x="640" y="48" class="lbl" fill="var(--hot)">최대 반응도가 1개 미삽입 (stuck rod)</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout hi"><span class="k">낙하 경과</span><span class="v" id="sc-t">0.0<small>초</small></span></div>
    <div class="readout warn"><span class="k">삽입 반응도 (전체 대비)</span><span class="v" id="sc-r">0<small>%</small></span></div>
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn act" id="sc-go">원자로 트립 — 재생</button>
      <button class="btn" id="sc-stuck">stuck rod 가정 켜기</button>
    </div>
    <div class="src">전원이 끊기면 전자석이 풀려 <b>중력으로</b> 떨어진다 — GDC 23 fail-safe.</div>
  </div>
</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const X=x=>420+x*640, Y=r=>268-r*208;
  let ax='<line x1="420" y1="268" x2="1075" y2="268" class="axis"/><line x1="420" y1="268" x2="420" y2="56" class="axis"/>';
  [0,25,50,75,100].forEach(p=>{ ax+=`<text x="${X(p/100)}" y="290" class="lbl" text-anchor="middle">${p}</text>`;
    ax+=`<line x1="${X(p/100)}" y1="268" x2="${X(p/100)}" y2="60" class="grid"/>`; });
  [0,50,100].forEach(p=>{ ax+=`<text x="412" y="${Y(p/100)+4}" class="lbl" text-anchor="end">${p} %</text>`; });
  ax+='<text x="1075" y="312" class="lbl" text-anchor="end">제어봉 삽입 분율 (%)</text>'
     +'<text x="420" y="44" class="lbl">삽입 반응도</text>';
  el.querySelector('#sc-ax').innerHTML=ax;
  const S=x=>x-Math.sin(2*Math.PI*x)/(2*Math.PI);
  let da='',db=''; for(let i=0;i<=100;i++){ const x=i/100;
    da+=(da?'L':'M')+X(x)+','+Y(S(x)); db+=(db?'L':'M')+X(x)+','+Y(S(x)*0.82); }
  el.querySelector('#sc-a').setAttribute('d',da); el.querySelector('#sc-b').setAttribute('d',db);
  const rg=el.querySelector('#sc-rods'); const rods=[];
  for(let i=0;i<5;i++){ const x=88+i*54;
    rg.insertAdjacentHTML('beforeend',
      `<rect x="${x}" y="62" width="22" height="200" fill="var(--panel-2)" opacity=".7"/>`);
    const r=document.createElementNS(SV,'rect');
    r.setAttribute('x',x);r.setAttribute('width',22);r.setAttribute('y',62);r.setAttribute('height',12);
    r.setAttribute('fill', i===2?'var(--hot)':'var(--cool)'); rg.appendChild(r); rods.push(r); }
  rg.insertAdjacentHTML('beforeend','<text x="205" y="288" text-anchor="middle" class="lbl">제어봉 5개 · 가운데가 최대 반응도가</text>');
  let T=0, run=true, stuck=false;
  const pa=el.querySelector('#sc-pa');
  el.querySelector('#sc-go').onclick=()=>{T=0;run=true;};
  el.querySelector('#sc-stuck').onclick=(e)=>{ stuck=!stuck; e.target.classList.toggle('act',stuck);
    e.target.textContent = stuck?'stuck rod 가정 끄기':'stuck rod 가정 켜기'; T=0; run=true; };
  if(RM){ rods.forEach(r=>r.setAttribute('height',200)); return; }
  raf(()=>{ if(!run) return; T+=1/60;
    const x=clamp(T/3.0,0,1);
    rods.forEach((r,i)=>{ const f=(stuck&&i===2)?0.12:x; r.setAttribute('height',12+188*f); });
    const rho=S(x)*(stuck?0.82:1);
    pa.setAttribute('cx',X(x));pa.setAttribute('cy',Y(rho));
    pa.setAttribute('fill',stuck?'var(--hot)':'var(--cool)');
    el.querySelector('#sc-t').innerHTML=Math.min(T,3).toFixed(1)+'<small>초</small>';
    el.querySelector('#sc-r').innerHTML=fmt(rho*100,0)+'<small>%</small>';
    if(T>3.4) run=false;
  });
}});

S({tag:'SHUTDOWN MARGIN', ov:'정지여유도 계산기',
src:'<b>식</b> SDM = ρ<sub>rod,total</sub> − ρ<sub>stuck</sub> − ρ<sub>defect</sub> − ρ<sub>uncertainty</sub> · 요구 최소치는 설계별 기술지침서에서 정해지며 흔히 Δρ 기준 1 % 이상',

init(el){

    let h='<line x1="60" y1="250" x2="660" y2="250" class="axis"/>';

}});

S({tag:'FEEDBACK', ov:'고유안전성 — 반응도 계수와 무붕산 설계',
src:'<b>대표 크기</b>이며 실제 값은 연소도·붕소 농도·노심 설계에 따라 크게 다르다. 정밀 값은 노심 설계 코드로 계산 · i-SMR 무붕산 운전: IAEA SMR Booklet 2022',

S({tag:'HEAT SINK', ov:'수조 시뮬레이션 — 72시간은 어디서 나온 숫자인가',
src:'<b>계산</b> Way–Wigner 붕괴열 적분(250 MWt, t₀ = 10⁸ s) · c_p = 4.18 kJ/(kg·K), h_fg = 2,257 kJ/kg, 초기 수온 30 °C. <b>열이 전부 수조로 들어간다고 본 상한 추정</b> — 실제로는 열교환기 성능 한계·성층화·외부 열손실이 작용한다',
html:`<h2 class="t">“72시간 무조작”은 마법이 아니라 <em>물통 크기를 정하는 계산</em>이다</h2>
<ul class="b">
  <li>정지 후 72시간 누적 붕괴 에너지는 <code>약 315 GJ</code> — 현열만으로 받으려면 물 <b class="cool">약 1,000 t</b></li>
  <li>잠열이 현열의 <b>약 8배</b>. 끓기 시작한 뒤에도 한참을 더 버틴다 — 대신 증기 배출과 보충수가 새 설계 문제</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 310" role="img" aria-label="붕괴열을 받는 수조의 온도가 오르고 끓어 증발하는 과정을 수조 체적별로 보여주는 시뮬레이션">
    <rect x="60" y="40" width="170" height="240" fill="none" stroke="var(--cool)" stroke-width="1.6"/>
    <rect id="hs-w" x="63" y="43" width="164" height="234" fill="var(--cool)" opacity=".28"/>
    <g id="hs-bub"></g>
    <text x="145" y="30" text-anchor="middle" class="ttl">수조</text>
    <rect x="106" y="200" width="78" height="64" rx="3" fill="var(--hot)"/>
    <text x="145" y="238" text-anchor="middle" font-size="13" fill="#fff" font-family="var(--sans)">노심 250 MWt</text>
    <g id="hs-ax"></g>
    <polyline id="hs-c" points="" fill="none" stroke="var(--cool)" stroke-width="2.6"/>
    <line id="hs-72" y1="52" y2="256" stroke="var(--amber)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text id="hs-72t" y="44" class="lbl" fill="var(--amber)" text-anchor="middle">72 h</text>
    <circle id="hs-p" r="6" fill="var(--hot)"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout"><span class="k">경과 시간</span><span class="v" id="hs-t">0<small>시간</small></span></div>
    <div class="readout hi"><span class="k">수조 온도</span><span class="v" id="hs-T">30<small>°C</small></span></div>
    <div class="readout good" id="hs-box"><span class="k">남은 물</span><span class="v" id="hs-m">100<small>%</small></span></div>
    <div class="ctl"><label>수조 체적 <span id="hs-vs">1,000 m³</span></label>
      <input type="range" id="hs-v" min="200" max="4000" step="100" value="1000"></div>
  </div>
</div>`,
init(el){
  /* 붕괴 에너지 누적 (0 ~ 1000 h) */
  const N=1400, ts=[], Es=[]; let E=0, tp=0;
  for(let i=0;i<=N;i++){ const t=Math.pow(10,i/N*Math.log10(3.6e6));
    E+= (t-tp)*0.5*(decay(t)+decay(Math.max(tp,1)))*250e6; ts.push(t); Es.push(E); tp=t; }
  const Eat=h=>{ const t=h*3600; if(t<=1) return 0;
    let lo=0,hi=N; while(hi-lo>1){const m=(lo+hi)>>1; if(ts[m]<t)lo=m;else hi=m;}
    return lerp(Es[lo],Es[hi],(t-ts[lo])/(ts[hi]-ts[lo])); };
  const X=h=>300+h/400*360, Y=T=>256-(T-20)/90*204;
  let ax='<line x1="300" y1="256" x2="666" y2="256" class="axis"/><line x1="300" y1="256" x2="300" y2="48" class="axis"/>';
  [0,100,200,300,400].forEach(h=>ax+=`<text x="${X(h)}" y="278" class="lbl" text-anchor="middle">${h}</text>`);
  [30,60,100].forEach(T=>{ ax+=`<line x1="300" y1="${Y(T)}" x2="666" y2="${Y(T)}" class="grid"/>`
    +`<text x="294" y="${Y(T)+4}" class="lbl" text-anchor="end">${T} °C</text>`; });
  ax+='<text x="666" y="298" class="lbl" text-anchor="end">경과시간 (시간)</text>';
  el.querySelector('#hs-ax').innerHTML=ax;
  el.querySelector('#hs-72').setAttribute('x1',X(72));el.querySelector('#hs-72').setAttribute('x2',X(72));
  el.querySelector('#hs-72t').setAttribute('x',X(72));
  const SV='http://www.w3.org/2000/svg', bg=el.querySelector('#hs-bub'), bub=[];
  for(let i=0;i<16;i++){ const c=document.createElementNS(SV,'circle');
    c.setAttribute('r',2+Math.random()*2.6); c.setAttribute('fill','#fff'); c.setAttribute('opacity',0);
    c.dataset.x=70+Math.random()*150; c.dataset.p=Math.random(); bg.appendChild(c); bub.push(c); }
  const sl=el.querySelector('#hs-v'); let H=0;
  function state(h){
    const V=+sl.value, M=V*1000, Esen=M*4180*70, Elat=M*2.257e6, e=Eat(h);
    let T, frac;
    if(e<Esen){ T=30+70*e/Esen; frac=1; } else { T=100; frac=Math.max(0,1-(e-Esen)/Elat); }
    return {T,frac,V};
  }
  function draw(h){
    const s=state(h);
    const top=43+234*(1-s.frac);
    el.querySelector('#hs-w').setAttribute('y',top);
    el.querySelector('#hs-w').setAttribute('height',Math.max(2,277-top));
    const hot=(s.T-30)/70;
    el.querySelector('#hs-w').setAttribute('fill', hot>0.99?'var(--hot)':'var(--cool)');
    el.querySelector('#hs-w').setAttribute('opacity',0.22+0.22*hot);
    let pts=[]; for(let k=0;k<=80;k++){ const hh=Math.min(h,400*k/80); pts.push([X(hh),Y(state(hh).T)]); if(hh>=h) break; }
    el.querySelector('#hs-c').setAttribute('points',poly(pts));
    el.querySelector('#hs-p').setAttribute('cx',X(h));el.querySelector('#hs-p').setAttribute('cy',Y(s.T));
    el.querySelector('#hs-t').innerHTML=fmt(h,0)+'<small>시간</small>';
    el.querySelector('#hs-T').innerHTML=fmt(s.T,0)+'<small>°C</small>';
    el.querySelector('#hs-m').innerHTML=fmt(s.frac*100,0)+'<small>%</small>';
    el.querySelector('#hs-box').className='readout '+(s.frac>0.35?'good':(s.frac>0.05?'warn':'warn'));
    el.querySelector('#hs-vs').textContent=fmt(+sl.value)+' m³';
    bub.forEach((c,i)=>{ if(s.T<99.5){c.setAttribute('opacity',0);return;}
      const p=((H*0.5)+ +c.dataset.p)%1;
      c.setAttribute('cx',+c.dataset.x); c.setAttribute('cy',277-(277-top)*p);
      c.setAttribute('opacity',0.7*(1-p)); });
  }
  sl.oninput=()=>draw(H);
  if(RM){ H=200; draw(200); return; }
  raf(t=>{ H=(t*34)%420; draw(Math.min(H,400)); });
}});

</div>`,
init(el){
  const X=t=>70+Math.log10(t)/4*660, Y=p=>270-p/16*228;
  const B=[[8,16,'고압안전주입 (HPSI) · CMT','var(--cool)'],
           [3.5,8,'축압기 (Accumulator)','var(--amber)'],
           [0,3.5,'저압안전주입 (LPSI) · 중력 보충','var(--ok)']];
  let bh='';
  B.forEach(b=>{ bh+=`<rect x="70" y="${Y(b[1])}" width="660" height="${Y(b[0])-Y(b[1])}" fill="${b[3]}" opacity=".07"/>`
    +`<text x="82" y="${(Y(b[0])+Y(b[1]))/2+5}" class="lbl" fill="${b[3]}" font-size="13.5">${b[2]}</text>`; });
  bh+=`<line x1="70" y1="${Y(4.9)}" x2="730" y2="${Y(4.9)}" stroke="var(--hot)" stroke-width="1.2" stroke-dasharray="5 4"/>`
     +`<text x="726" y="${Y(4.9)-7}" class="lbl" fill="var(--hot)" text-anchor="end">축압기 질소 충전압 4.9 MPa</text>`;
  el.querySelector('#pt-band').innerHTML=bh;
  let ax='<line x1="70" y1="270" x2="736" y2="270" class="axis"/><line x1="70" y1="270" x2="70" y2="34" class="axis"/>';
  [1,10,100,1000,10000].forEach(t=>ax+=`<text x="${X(t)}" y="292" class="lbl" text-anchor="middle">${t>=1000?fmt(t):t} s</text>`);
  [0,4,8,12,16].forEach(p=>ax+=`<text x="62" y="${Y(p)+4}" class="lbl" text-anchor="end">${p}</text>`);
  ax+='<text x="736" y="312" class="lbl" text-anchor="end">사고 후 경과시간</text>'
     +'<text x="70" y="24" class="lbl">RCS 압력 (MPa)</text>';
  el.querySelector('#pt-ax').innerHTML=ax;
  const P=t=>15.5*Math.exp(-Math.pow(Math.log10(t)/1.55,2.2))+0.15;
  let d=''; for(let i=0;i<=200;i++){ const t=Math.pow(10,i/200*4); d+=(d?'L':'M')+X(t)+','+Y(P(t)); }
  el.querySelector('#pt-c').setAttribute('d',d);
  const pt=el.querySelector('#pt-p');
  function at(t){ const p=P(t);
    pt.setAttribute('cx',X(t));pt.setAttribute('cy',Y(p));
    el.querySelector('#pt-P').innerHTML=p.toFixed(1)+'<small>MPa</small>';
    el.querySelector('#pt-t').innerHTML=(t<1000?fmt(t,0):fmt(t/60,0))+'<small>'+(t<1000?'초':'분')+'</small>';
    const b=B.find(x=>p>=x[0]&&p<x[1])||B[2];
    el.querySelector('#pt-S').textContent=b[2].split(' (')[0];
    el.querySelector('#pt-S').parentNode.className='readout hi';
    pt.setAttribute('fill',b[3]);
  }
  if(RM){ at(300); return; }
  at(1); raf(t=>{ const u=(t%8)/8; at(Math.pow(10,u*4)); });
}});

S({tag:'CONTAINMENT PRESSURE', ov:'격납 압력 — 계산이 포화압에 막힌다',
src:'<b>예제 조건</b> 자유체적 3,000 m³ · 초기 공기 1기압 20 °C · 평형 온도 150 °C · R_v = 461.5 J/(kg·K) · 150 °C 포화압 0.476 MPa. 이상기체 근사만으로는 답이 틀린다는 것을 보이기 위한 예제',
html:`<h2 class="t">이상기체로 계산하면 <s>틀린다</s> — 초과분은 <em>응축</em>한다</h2>
<ul class="b">
  <li>계산된 증기 분압이 그 온도의 <b>포화압</b>을 넘으면 물리적으로 불가능 → 증기 일부가 액체가 됨</li>
  <li>결국 <b class="cool">격납 압력은 증기 질량이 아니라 평형 온도가 결정</b>한다. 그래서 격납 해석의 핵심은 열 균형</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 300" role="img" aria-label="방출 증기 질량에 따른 격납 압력 — 이상기체 계산값과 포화압에 의해 제한된 실제 압력 비교">
    <g id="cp-ax"></g>
    <rect id="cp-ideal" x="150" width="120" fill="var(--hot)" opacity=".6" stroke="var(--hot)" stroke-width="1.2"/>
    <rect id="cp-real" x="330" width="120" fill="var(--cool)" opacity=".8"/>
    <rect id="cp-air" x="330" width="120" fill="var(--ink-3)" opacity=".55"/>
    <line id="cp-sat" x1="110" x2="620" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text id="cp-satt" x="616" class="lbl" fill="var(--amber)" text-anchor="end">150 °C 포화압 0.476 MPa</text>
    <text x="210" y="292" text-anchor="middle" class="lbl">이상기체 계산 (증기 분압)</text>
    <text x="390" y="292" text-anchor="middle" class="lbl">실제 (포화 제한 + 공기)</text>
    <text id="cp-msg" x="282" y="120" class="lbl" fill="var(--hot)" font-size="14.5"></text>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">이상기체 증기 분압</span><span class="v" id="cp-i">1.30<small>MPa</small></span></div>
    <div class="readout hi"><span class="k">실제 격납 압력</span><span class="v" id="cp-r">0.62<small>MPa</small></span></div>
    <div class="ctl"><label>방출 증기 질량 <span id="cp-ms">20 t</span></label>
      <input type="range" id="cp-m" min="1" max="40" step="0.5" value="20"></div>
    <div class="src">공기 분압은 온도만 보정 — 0.1013 × 423/293 = <b>0.146 MPa</b>.</div>
  </div>
</div>`,
init(el){
  const Y=p=>250-p/1.5*210;
  let ax='<line x1="110" y1="250" x2="626" y2="250" class="axis"/>';
  [0,0.5,1.0,1.5].forEach(p=>{ ax+=`<line x1="110" y1="${Y(p)}" x2="626" y2="${Y(p)}" class="grid"/>`
    +`<text x="102" y="${Y(p)+4}" class="lbl" text-anchor="end">${p.toFixed(1)}</text>`; });
  ax+='<text x="110" y="26" class="lbl">압력 (MPa)</text>';
  el.querySelector('#cp-ax').innerHTML=ax;
  const sat=0.476, air=0.146;
  el.querySelector('#cp-sat').setAttribute('y1',Y(sat));el.querySelector('#cp-sat').setAttribute('y2',Y(sat));
  el.querySelector('#cp-satt').setAttribute('y',Y(sat)-8);
  const sl=el.querySelector('#cp-m');
  function upd(){
    const m=+sl.value*1000, pv=m*461.5*423/3000/1e6, real=air+Math.min(pv,sat);
    const I=el.querySelector('#cp-ideal'), R=el.querySelector('#cp-real'), A=el.querySelector('#cp-air');
    I.setAttribute('y',Y(Math.min(pv,1.5)));I.setAttribute('height',Math.max(1,250-Y(Math.min(pv,1.5))));
    A.setAttribute('y',Y(air));A.setAttribute('height',250-Y(air));
    R.setAttribute('y',Y(real));R.setAttribute('height',Y(air)-Y(real));
    el.querySelector('#cp-i').innerHTML=pv.toFixed(2)+'<small>MPa</small>';
    el.querySelector('#cp-r').innerHTML=real.toFixed(2)+'<small>MPa</small>';
    el.querySelector('#cp-ms').textContent=(+sl.value).toFixed(1)+' t';
    const msg=el.querySelector('#cp-msg');
    if(pv>sat){ msg.textContent='← 초과분 '+((pv-sat)/pv*100).toFixed(0)+' % 는 응축';
      msg.setAttribute('x',282); msg.setAttribute('y',Y(Math.min((pv+sat)/2,1.42))); } else msg.textContent='';
  }
  sl.oninput=upd; upd();
  if(RM) return;
  raf(t=>{ if(t>2.2) return; sl.value=(lerp(4,20,clamp(t/2,0,1))).toFixed(1); upd(); });
}});

S({tag:'TRACEABILITY', ov:'요건 → 기능 → 계통 추적',
src:'<b>출처</b> 10 CFR 50 Appendix A의 GDC, IAEA SSR-2/1 (Rev.1)의 기본안전기능, 그리고 6~9장에서 다룬 계통을 대응시킨 것',
html:`<h2 class="t">설계는 요건에서 시작해 계통으로 끝난다 — <s>거꾸로 읽으면 근거를 잃는다</s></h2>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 320" role="img" aria-label="규제 요건에서 기본안전기능을 거쳐 공학적안전설비로 이어지는 추적 관계">
  <defs><marker id="tr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--rule)"/></marker></defs>
  <g id="tr-hd">
    <rect x="40" y="14" width="330" height="38" fill="var(--cool)"/>
    <text x="205" y="39" text-anchor="middle" font-family="var(--mono)" font-size="15" fill="#071018" font-weight="600">규제 요건</text>
    <rect x="395" y="14" width="300" height="38" fill="var(--ok)"/>
    <text x="545" y="39" text-anchor="middle" font-family="var(--mono)" font-size="15" fill="#071018" font-weight="600">기본 안전기능</text>
    <rect x="720" y="14" width="360" height="38" fill="var(--hot)"/>
    <text x="900" y="39" text-anchor="middle" font-family="var(--mono)" font-size="15" fill="#071018" font-weight="600">계통 (ESF)</text>
  </g>
  <g id="tr-rows"></g>
</svg>
</div></div>`,
init(el){
  const R=[['GDC 25 · 26 · 27','반응도 제어','제어봉 · 붕산 주입 · (무붕산 설계)'],
    ['GDC 34','노심 잔열 제거','PRHR · DHRS · ICS · PAFS'],
    ['GDC 35 · 10 CFR 50.46','노심 냉각재 보충','축압기 · CMT · SI 펌프 · RVV/RRV'],
    ['GDC 16 · 38 · 41 · 50~57','방사성물질 격납','격납건물 · 살수 · 격리밸브 · PAR']];
  const g=el.querySelector('#tr-rows');
  R.forEach((r,i)=>{ const y=74+i*58;
    g.insertAdjacentHTML('beforeend',
      `<g data-r="${i}" opacity="0">
       <rect x="40" y="${y}" width="330" height="44" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.2"/>
       <text x="58" y="${y+28}" font-family="var(--mono)" font-size="15" fill="var(--cool)">${r[0]}</text>
       <rect x="395" y="${y}" width="300" height="44" fill="var(--panel)" stroke="var(--ok)" stroke-width="1.2"/>
       <text x="545" y="${y+28}" text-anchor="middle" font-family="var(--sans)" font-size="18" fill="var(--ok)">${r[1]}</text>
       <rect x="720" y="${y}" width="360" height="44" fill="var(--panel)" stroke="var(--hot)" stroke-width="1.2"/>
       <text x="900" y="${y+28}" text-anchor="middle" font-family="var(--sans)" font-size="16" fill="var(--hot)">${r[2]}</text>
       <path d="M374,${y+22} H391" stroke="var(--rule)" stroke-width="1.4" marker-end="url(#tr-a)"/>
       <path d="M699,${y+22} H716" stroke="var(--rule)" stroke-width="1.4" marker-end="url(#tr-a)"/></g>`); });
  g.insertAdjacentHTML('beforeend',
    '<text x="560" y="314" text-anchor="middle" class="lbl">이 표를 거꾸로 읽으면 설계 검토 체크리스트가 된다</text>');
  const rows=[...g.querySelectorAll('[data-r]')];
  if(RM){ rows.forEach(r=>r.setAttribute('opacity',1)); return; }
  rows.forEach((r,i)=>r.animate([{opacity:0},{opacity:1}],{duration:420,delay:180*i,fill:'forwards'}));
}});
