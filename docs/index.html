<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMR 설계요건과 공학적안전설비</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   THINK Lab · SMR 설계요건과 공학적안전설비 — 발표용 HTML
   제어실 미믹 패널(control-room mimic) 시각 언어
   ============================================================ */
:root{
  --ground:#070E18;      /* 근흑 네이비 바탕 */
  --panel:#0E1B2C;       /* 패널면 */
  --panel-2:#13263C;     /* 한 단계 밝은 패널 */
  --rule:#1E3450;        /* 미믹 라인·헤어라인 */
  --ink:#FFFFFF;         /* 본문 */
  --ink-2:#C9D9EC;       /* 보조 텍스트 — 회색 아님, 청백색 */
  --ink-3:#8FA8C6;       /* 라벨 전용(캡션·단위). 본문에는 쓰지 않음 */
  --cool:#4CC9F0;        /* 강조색 = 냉각재 */
  --hot:#FF7A45;         /* 열·노심·위험 */
  --ok:#5DD39E;          /* 피동·성공 */
  --amber:#FFC55C;       /* 규제 조문 */
  --sans:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular','D2Coding',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--ground);color:var(--ink);
  font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center}

/* ---------- 무대: 1280x720 고정, 뷰포트에 맞춰 스케일 ---------- */
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;
  background:var(--ground);flex:none}
.slide{position:absolute;inset:0;padding:30px 54px 26px;display:none;
  flex-direction:column;opacity:0;transition:opacity .28s ease}
.slide.on{display:flex;opacity:1}

/* ---------- 상단 레일 ---------- */
.rail{display:flex;align-items:baseline;gap:14px;flex:none;
  border-bottom:1px solid var(--rule);padding-bottom:9px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cool)}
.tag b{color:var(--ink);font-weight:600}
.rail .sp{flex:1}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.08em}

/* ---------- 제목 ---------- */
h2.t{font-size:36px;line-height:1.2;font-weight:600;margin:16px 0 0;
  letter-spacing:-.015em;text-wrap:balance}
h2.t em{font-style:normal;color:var(--cool)}
h2.t s{text-decoration:none;color:var(--hot)}
p.sub{margin:8px 0 0;font-size:19px;color:var(--ink-2);font-weight:300;line-height:1.45}

/* ---------- 불릿(상단 2~4개) ---------- */
ul.b{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.b li{font-size:19.5px;line-height:1.42;color:var(--ink);padding-left:20px;position:relative;
  font-weight:300}
ul.b li::before{content:'';position:absolute;left:0;top:.62em;width:8px;height:2px;
  background:var(--cool)}
ul.b li b{font-weight:600}
ul.b li .q{color:var(--ink-2)}
ul.b li code,.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.hot{color:var(--hot)} .ok{color:var(--ok)} .cool{color:var(--cool)} .amb{color:var(--amber)}

/* ---------- 본문 영역 ---------- */
.body{flex:1;min-height:0;display:flex;gap:26px;margin-top:14px}
.body.col{flex-direction:column}
.fig{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:center}
.fig svg{width:100%;height:auto;display:block}
.side{width:330px;flex:none;display:flex;flex-direction:column;gap:12px;justify-content:center}

/* ---------- 하단 레일 ---------- */
.foot{flex:none;display:flex;align-items:center;gap:12px;padding-top:9px;
  border-top:1px solid var(--rule);margin-top:12px}
.src{font-size:12.5px;color:var(--ink-3);font-weight:300;line-height:1.35}
.src b{color:var(--ink-2);font-weight:500}
.foot .sp{flex:1}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-3)}

/* ---------- 계기 판독 ---------- */
.readout{background:var(--panel);border:1px solid var(--rule);padding:11px 14px 12px}
.readout .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:3px}
.readout .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.readout .v small{font-size:15px;font-weight:400;color:var(--ink-2);margin-left:4px}
.readout.hi{border-color:var(--cool)}
.readout.hi .v{color:var(--cool)}
.readout.warn{border-color:var(--hot)} .readout.warn .v{color:var(--hot)}
.readout.good{border-color:var(--ok)} .readout.good .v{color:var(--ok)}

/* ---------- 컨트롤 ---------- */
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline}
.ctl label span{font-size:15px;color:var(--cool);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;
  cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule)}
input[type=range]::-moz-range-track{height:3px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  margin-top:-6px;background:var(--cool);border:0;border-radius:50%}
input[type=range]::-moz-range-thumb{width:15px;height:15px;background:var(--cool);border:0;
  border-radius:50%}
input[type=range]:focus-visible{outline:2px solid var(--cool);outline-offset:4px}
a.btn{text-decoration:none;display:inline-block}
.btn{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);padding:8px 13px;cursor:pointer;
  transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--cool);color:var(--cool)}
.btn.act{border-color:var(--cool);color:var(--cool);background:#0d2438}
.btn.danger:hover{border-color:var(--hot);color:var(--hot)}
.btn:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 표 ---------- */
table.d{width:100%;border-collapse:collapse;font-size:16px}
table.d th{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cool);text-align:left;font-weight:500;padding:0 12px 8px 0;
  border-bottom:1px solid var(--cool)}
table.d td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);color:var(--ink-2);
  font-weight:300;vertical-align:top;line-height:1.35}
table.d td:first-child{color:var(--ink);font-weight:500}
table.d td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
table.d tr.mark td{color:var(--cool)}
table.d tr.mark td:first-child{color:var(--cool)}
table.d.sm{font-size:14.5px}
table.d.sm td{padding:6px 10px 6px 0}

/* ---------- 인용/조문 ---------- */
blockquote.q{margin:0;padding:14px 18px;background:var(--panel);
  border-left:3px solid var(--amber);font-size:17px;line-height:1.5;color:var(--ink-2);
  font-weight:300}
blockquote.q b{color:var(--ink);font-weight:600}
blockquote.q .cite{display:block;margin-top:9px;font-family:var(--mono);font-size:12px;
  color:var(--amber);letter-spacing:.04em}
.formula{font-family:var(--mono);font-size:24px;color:var(--ink);text-align:center;
  padding:16px 0;letter-spacing:.01em}
.formula .op{color:var(--cool)}
.formula small{font-size:14px;color:var(--ink-3)}

/* ---------- 표지 ---------- */
.cover{justify-content:center;padding:0 90px}
.cover .kick{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--cool);
  text-transform:uppercase}
.cover h1{font-size:66px;line-height:1.06;margin:20px 0 0;font-weight:600;letter-spacing:-.03em}
.cover h1 span{color:var(--cool)}
.cover .ln{width:120px;height:2px;background:var(--hot);margin:26px 0}
.cover .meta{font-size:17px;color:var(--ink-2);line-height:1.7;font-weight:300}
.cover .meta b{color:var(--ink);font-weight:500}
.cover .hint{margin-top:26px;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);
  letter-spacing:.04em}
.cover .hint kbd{background:var(--panel);border:1px solid var(--rule);padding:2px 7px;
  color:var(--ink-2);font-family:var(--mono);font-size:12px}

/* ---------- 섹션 구분 ---------- */
.div{justify-content:center;padding:0 90px}
.div .no{font-family:var(--mono);font-size:150px;line-height:.85;font-weight:600;
  color:var(--panel-2);letter-spacing:-.04em}
.div h2{font-size:52px;margin:-46px 0 0;font-weight:600;letter-spacing:-.025em;position:relative}
.div p{font-size:20px;color:var(--ink-2);margin:16px 0 0;max-width:760px;font-weight:300;
  line-height:1.5}
.div .ln{width:90px;height:2px;background:var(--cool);margin:22px 0 0}

/* ---------- 진행 표시 ---------- */
#prog{position:fixed;left:0;bottom:0;height:2px;background:var(--cool);width:0;
  transition:width .28s ease;z-index:40}
#help{position:fixed;right:14px;bottom:12px;font-family:var(--mono);font-size:11px;
  color:var(--ink-3);letter-spacing:.06em;z-index:40;opacity:.7}

/* ---------- 오버뷰 ---------- */
#ov{position:fixed;inset:0;background:rgba(7,14,24,.97);z-index:50;display:none;
  overflow-y:auto;padding:26px}
#ov.on{display:block}
#ov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
#ov .it{background:var(--panel);border:1px solid var(--rule);padding:11px 12px;cursor:pointer;
  min-height:78px;display:flex;flex-direction:column;gap:5px}
#ov .it:hover{border-color:var(--cool)}
#ov .it .n{font-family:var(--mono);font-size:11px;color:var(--cool)}
#ov .it .t{font-size:13.5px;line-height:1.3;color:var(--ink-2);font-weight:300}
#ov h3{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:22px 0 10px;font-weight:500}
#ov h3:first-child{margin-top:0}

/* ---------- SVG 공통 ---------- */
.lbl{font-family:var(--mono);font-size:12px;fill:var(--ink-3);letter-spacing:.04em}
.lbl.b{fill:var(--ink-2)}
.val{font-family:var(--mono);font-size:15px;fill:var(--ink);font-variant-numeric:tabular-nums}
.ttl{font-family:var(--sans);font-size:14px;fill:var(--ink);font-weight:500}
.axis{stroke:var(--rule);stroke-width:1}
.grid{stroke:var(--rule);stroke-width:.6;stroke-dasharray:2 4}

/* ---------- 언어·PDF 조작부 ---------- */
#hud{position:fixed;right:14px;bottom:30px;z-index:41;display:flex;gap:6px;align-items:center;
  opacity:.72;transition:opacity .5s}
#hud:hover{opacity:1!important}
#hud button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);
  background:var(--panel);border:1px solid var(--rule);padding:4px 9px;cursor:pointer;
  transition:color .15s,border-color .15s}
#hud button:hover{color:var(--cool);border-color:var(--cool)}
#hud button.on{color:var(--cool);border-color:var(--cool);background:#0d2438}
#hud .gap{width:5px}

/* ---------- 인쇄(PDF) 모드 — 46장을 한 번에 지면에 펼친다 ---------- */
#sheets{display:none}
#ptool{display:none}
body.printing{display:block;place-items:initial;overflow:auto;height:auto}
body.printing #stage,body.printing #prog,body.printing #help,body.printing #ov,
body.printing #hud{display:none}
body.printing #sheets{display:block;padding:0 0 40px}
body.printing #ptool{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 26px;border-bottom:1px solid var(--rule);background:var(--panel);
  position:sticky;top:0;z-index:5}
#ptool .msg{font-size:13.5px;color:var(--ink-2);font-weight:300;line-height:1.5;flex:1;min-width:280px}
#ptool .msg b{color:var(--ink);font-weight:600}
#ptool .sp{flex:1}
.sheet{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--ground);
  margin:22px auto 0;border:1px solid var(--rule);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .slide{position:absolute;inset:0;display:flex;opacity:1;transition:none}
body.printing .cover .hint{display:none}   /* 지면에서는 조작키 안내가 의미 없다 */

@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;height:auto;background:var(--ground)}
  .noprint{display:none!important}
  body.printing #sheets{padding:0}
  .sheet{margin:0;border:0;break-after:page;page-break-after:always;break-inside:avoid}
  .sheet:last-child{break-after:auto;page-break-after:auto}
}

@media (prefers-reduced-motion:reduce){
  .slide{transition:none}
  #prog{transition:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="prog"></div>
<div id="help">← → 이동 · O 목차 · L 한/영 · P 인쇄·PDF · F 전체화면</div>
<div id="hud" class="noprint">
  <button id="lang-ko" type="button">KO</button>
  <button id="lang-en" type="button">EN</button>
  <span class="gap"></span>
  <button id="topdf" type="button">PDF ↓</button>
</div>
<div id="ov"><div class="grid" id="ovg"></div></div>
<div id="ptool" class="noprint">
  <span class="msg" id="pt-msg"></span>
  <button class="btn" id="pt-print" type="button">Ctrl+P · PDF로 저장</button>
  <a class="btn" id="pt-dl" href="NUE4067_SMR_safety_ko.pdf" download>미리 만든 PDF 내려받기</a>
  <button class="btn" id="pt-back" type="button">슬라이드로 돌아가기</button>
</div>
<div id="sheets"></div>
<script>
/* ================================================================
   덱 엔진 — 슬라이드 등록·렌더·내비게이션, 애니메이션 프리미티브
              한/영 전환(i18n) · 인쇄(PDF) 모드
   ================================================================ */
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const D = [];                       // 슬라이드 목록
const SEC = [];                     // 섹션 경계 { at, name }
function S(o){ D.push(o); return D.length-1; }
function SECT(name){ SEC.push({at:D.length, name}); }

/* ================================================================
   언어 — [[한국어||English]] 토큰을 렌더 직전에 치환한다.
   · 마크업 안의 고정 문구는 토큰으로 쓴다(SVG <text> 안에서도 동작).
   · init() 안에서 JS로 만드는 문자열은 TX('한국어','English') 로 쓴다.
   ================================================================ */
const QS   = new URLSearchParams(location.search);
const PRINT= QS.has('print');
let LANG   = QS.get('lang') || store('smrLang') || 'ko';
if(LANG!=='en') LANG='ko';

function store(k,v){ try{ return v===undefined? localStorage.getItem(k)
                                               : localStorage.setItem(k,v); }catch(e){ return null; } }
function TX(ko,en){ return LANG==='en' && en!=null ? en : ko; }
const I18N = /\[\[([\s\S]*?)\|\|([\s\S]*?)\]\]/g;
function tr(s){ return String(s).replace(I18N, (m,ko,en)=> LANG==='en' ? en : ko); }

/* 언어에 따라 바뀌는 고정 UI */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = TX('SMR 설계요건과 공학적안전설비',
                     'SMR Design Requirements and Engineered Safety Features');
  const h=document.getElementById('help');
  if(h) h.textContent = TX('← → 이동 · O 목차 · L 한/영 · P 인쇄·PDF · F 전체화면',
                          '← → Move · O Index · L KO/EN · P Print·PDF · F Fullscreen');
  const q=(id)=>document.getElementById(id);
  if(q('lang-ko')) q('lang-ko').classList.toggle('on', LANG==='ko');
  if(q('lang-en')) q('lang-en').classList.toggle('on', LANG==='en');
  if(q('topdf'))   q('topdf').title = TX('인쇄·PDF 모드로 전환 (P)','Switch to print · PDF mode (P)');
  if(q('pt-msg'))  q('pt-msg').innerHTML = tr(PT_MSG);
  if(q('pt-print'))q('pt-print').textContent = TX('Ctrl+P · PDF로 저장','Ctrl+P · Save as PDF');
  if(q('pt-dl'))   q('pt-dl').textContent = TX('미리 만든 PDF 내려받기','Download prepared PDF');
  if(q('pt-back')) q('pt-back').textContent = TX('슬라이드로 돌아가기','Back to the slides');
  if(q('pt-dl'))   q('pt-dl').href = 'NUE4067_SMR_safety_'+LANG+'.pdf';
}
const PT_MSG = '[[슬라이드 <b>46장</b>을 한 장씩 지면에 펼쳤음 · 배경색이 나오도록 인쇄 설정에서'
             + ' <b>배경 그래픽</b>을 켤 것 · 용지는 <b>가로</b>, 배율 <b>기본(100 %)</b>'
             + '||All <b>46 slides</b> laid out one per page · turn on <b>Background graphics</b>'
             + ' in the print dialog · paper <b>landscape</b>, scale <b>default (100 %)</b>]]';

function setLang(l){
  if(l===LANG) return;
  LANG = (l==='en') ? 'en' : 'ko';
  store('smrLang', LANG);
  try{ const u=new URL(location.href); u.searchParams.set('lang',LANG);
       history.replaceState(null,'',u); }catch(e){}
  applyStatic();
  if(PRINT){ buildPrint(); }
  else { buildOv(); const i=cur; cur=-1; go(i); }
}

/* ---------- 정리 대상(슬라이드 떠날 때 멈춤) ---------- */
let CLEAN = [];
let FREEZE = 0;                     // >0 이면 그 초 뒤 애니메이션 정지(인쇄 모드)
function onClean(fn){ CLEAN.push(fn); }
function raf(fn){
  let id, t0 = performance.now(), live = true;
  function step(t){
    if(!live) return;
    /* rAF 타임스탬프가 t0보다 이를 수 있어 첫 프레임의 경과시간이 음수로 나온다.
       log·pow 를 쓰는 슬라이드가 NaN 으로 깨지므로 0 아래로는 내리지 않는다. */
    const e=Math.max(0,(t-t0)/1000); fn(e, t);
    if(FREEZE && e>FREEZE){ live=false; return; }   // 인쇄: 한 장면으로 고정
    id = requestAnimationFrame(step);
  }
  id = requestAnimationFrame(step);
  onClean(()=>{ live=false; cancelAnimationFrame(id); });
  return ()=>{ live=false; cancelAnimationFrame(id); };
}

/* ---------- 수치 유틸 ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function decay(t,t0=1e8){ return 0.0622*(Math.pow(t,-0.2)-Math.pow(t+t0,-0.2)); }
function rhoW(T){ return 1006.0-0.2646*T-0.002424*T*T; }

/* ---------- SVG 경로 위를 흐르는 입자 ---------- */
function flow(path, opt={}){
  const n=opt.n||10, col=opt.color||'var(--cool)', r=opt.r||3.6;
  const L=path.getTotalLength(), g=path.ownerSVGElement, dots=[];
  const layer=document.createElementNS('http://www.w3.org/2000/svg','g');
  path.parentNode.appendChild(layer);
  for(let i=0;i<n;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',r); c.setAttribute('fill',col); layer.appendChild(c); dots.push(c);
  }
  const st={speed:opt.speed==null?0.14:opt.speed, on:true, dir:1};
  raf((t)=>{
    for(let i=0;i<n;i++){
      let p=((t*st.speed*st.dir)+i/n)%1; if(p<0)p+=1;
      const pt=path.getPointAtLength(p*L);
      dots[i].setAttribute('cx',pt.x); dots[i].setAttribute('cy',pt.y);
      dots[i].setAttribute('opacity', st.on? (opt.fade? 0.35+0.65*Math.sin(Math.PI*p):1) : 0);
    }
  });
  st.el=layer; return st;
}

/* ---------- 값이 부드럽게 따라가는 판독기 ---------- */
function track(obj,key,get,k=6){
  raf((t,abs)=>{ obj[key]=lerp(obj[key],get(),Math.min(1,k*0.016)); });
}

/* ---------- 선 그래프 ---------- */
function poly(pts){ return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }

/* ---------- 슬라이드 한 장의 뼈대(레일·본문·푸터) ---------- */
function frame(s,i){
  if(s.bare) return s.html;
  const sec = SEC.filter(x=>x.at<=i).slice(-1)[0];
  return '<div class="rail"><span class="tag">'+(s.tag||(sec?sec.name:''))+'</span>'
       + '<span class="sp"></span><span class="num">'+String(i+1).padStart(2,'0')+' / '+D.length+'</span></div>'
       + s.html
       + '<div class="foot"><span class="src">'+(s.src||'')+'</span><span class="sp"></span>'
       + '<span class="brand">THINK LAB · HANYANG</span></div>';
}

/* ---------- 렌더 ---------- */
const stage=document.getElementById('stage');
let cur=-1;
function go(i,dir){
  i=clamp(i,0,D.length-1); if(i===cur) return;
  CLEAN.forEach(f=>{try{f()}catch(e){}}); CLEAN=[];
  cur=i; const s=D[i];
  stage.innerHTML = tr('<div class="slide on'+(s.cls?' '+s.cls:'')+'">'+frame(s,i)+'</div>');
  document.getElementById('prog').style.width=((i+1)/D.length*100)+'%';
  if(s.init){ try{ s.init(stage.querySelector('.slide')); }catch(e){ console.error(e); } }
}
function replay(){ const i=cur; cur=-1; go(i); }

/* ---------- 인쇄(PDF) 모드 — 46장을 한 번에 지면에 펼친다 ---------- */
function buildPrint(){
  document.body.classList.add('printing');
  FREEZE = 3.4;                                   // 3.4 초 뒤 모든 애니메이션 정지
  const sh=document.getElementById('sheets');
  let h='';
  D.forEach((s,i)=>{
    h+='<div class="sheet"><div class="slide on'+(s.cls?' '+s.cls:'')+'">'+frame(s,i)+'</div></div>';
  });
  sh.innerHTML = tr(h);
  D.forEach((s,i)=>{
    if(!s.init) return;
    const root=sh.children[i].firstElementChild;
    try{ s.init(root); }catch(e){ console.error('slide '+(i+1)+':', e); }
  });
  /* 애니메이션이 멎으면 표시 — PDF 생성 스크립트가 이 신호를 기다린다 */
  document.documentElement.removeAttribute('data-print-ready');
  const t0=performance.now();
  (function step(){
    if(performance.now()-t0 > FREEZE*1000+600){
      document.documentElement.setAttribute('data-print-ready','1'); return;
    }
    requestAnimationFrame(step);
  })();
}
function toPrint(){
  const u=new URL(location.href);
  u.searchParams.set('print','1'); u.searchParams.set('lang',LANG);
  location.href=u.toString();
}
function toDeck(){
  const u=new URL(location.href);
  u.searchParams.delete('print'); u.searchParams.set('lang',LANG);
  location.href=u.toString();
}

/* ---------- 스케일 ---------- */
function fit(){
  if(PRINT) return;
  const k=Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform='scale('+k+')';
}
addEventListener('resize',fit); fit();

/* ---------- 내비게이션 ---------- */
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='l'||e.key==='L'){ setLang(LANG==='ko'?'en':'ko'); return; }
  if(PRINT){ if(e.key==='Escape') toDeck(); return; }
  const ov=document.getElementById('ov');
  if(e.key==='Escape'){ ov.classList.remove('on'); return; }
  if(e.key==='o'||e.key==='O'){ ov.classList.toggle('on'); return; }
  if(ov.classList.contains('on')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(D.length-1); }
  else if(e.key==='r'||e.key==='R'){ replay(); }
  else if(e.key==='p'||e.key==='P'){ toPrint(); }
  else if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
});
addEventListener('click',e=>{
  if(PRINT) return;
  if(e.target.closest('input,button,a,#ov,#hud,label')) return;
  if(document.getElementById('ov').classList.contains('on')) return;
  go(cur + (e.clientX < innerWidth*0.28 ? -1 : 1));
});

/* ---------- 조작 안내·언어/PDF 버튼 자동 숨김 ---------- */
(function(){
  const els=['help','hud'].map(id=>document.getElementById(id)).filter(Boolean);
  if(!els.length) return; let tm;
  function poke(){ els.forEach(e=>e.style.opacity=.72);
    clearTimeout(tm); tm=setTimeout(()=>els.forEach(e=>e.style.opacity=0),4000); }
  els.forEach(e=>e.style.transition='opacity .5s');
  addEventListener('mousemove',poke); addEventListener('keydown',poke); poke();
})();

/* ---------- 오버뷰 ---------- */
function buildOv(){
  const g=document.getElementById('ovg'); let h='';
  D.forEach((s,i)=>{
    h+='<div class="it" data-i="'+i+'"><span class="n">'+String(i+1).padStart(2,'0')
      +'</span><span class="t">'+(s.ov||s.tag||'')+'</span></div>';
  });
  g.innerHTML=tr(h);
  g.querySelectorAll('.it').forEach(el=>el.onclick=()=>{
    document.getElementById('ov').classList.remove('on'); go(+el.dataset.i);
  });
}

/* ---------- 시작 ---------- */
function boot(){
  const b=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  b('lang-ko',()=>setLang('ko')); b('lang-en',()=>setLang('en'));
  b('topdf',toPrint);             b('pt-back',toDeck);
  b('pt-print',()=>print());
  applyStatic();
  if(PRINT){ buildPrint(); } else { buildOv(); go(0); }
}

    +'<text x="70" y="12" class="lbl">[[비 자본비 (USD/kWe)||Specific capital cost (USD/kWe)]]</text>';

}
function ecCurve(){ let d=''; for(let P=150;P<=1500;P+=10){ d+=(d?'L':'M')+EC.sx(P).toFixed(1)+','+EC.sy(EC.C(P)).toFixed(1); } return d; }

S({tag:'ECONOMY', ov:'[[규모의 경제 — 작게 만드는 대가||Economies of scale - the price of going small]]',
src:'[[<b>출처</b> L.M. Boldon, P. Sabharwall, INL/EXT-14-32616 (2014) §6.1 — NEA 평균 <i>n</i> = 0.51 채택. <b>유의</b> 상관식 검증 구간은 300~1300 MWe이므로 그 아래에서는 불확실성이 커진다||<b>Source</b> L.M. Boldon, P. Sabharwall, INL/EXT-14-32616 (2014) &#167;6.1 - NEA average <i>n</i> = 0.51 adopted. <b>Caution</b> the correlation is validated over 300-1300 MWe, so uncertainty grows below that range]]',
html:`<h2 class="t">[[출력을 줄이면 <s>kW당 비용이 오른다</s> — 얼마나 오르는지가 전부||Shrink the output and <s>cost per kW rises</s> - how much it rises is the whole question]]</h2>
<ul class="b">
  <li>[[용기·배관·구조물 비용은 <b>표면적</b>에 비례하고 출력은 <b>체적</b>에 비례 → 규모지수 <code>n ≈ 0.4~0.7</code>||Vessel, piping and structure cost follows <b>surface area</b> while power follows <b>volume</b> &#8594; scaling exponent <code>n &#8776; 0.4-0.7</code>]]</li>
  <li>[[총 자본비가 아니라 <b class="cool">kW당 비용</b>을 봐야 함. 두 값은 반대 방향으로 움직임||Watch <b class="cool">cost per kW</b>, not total capital cost. The two move in opposite directions]]</li>
</ul>
<div class="body">
  <div class="fig">
    <div class="formula" style="white-space:nowrap;font-size:21px;padding:10px 0 14px">C₂/C₁ <span class="op">=</span> (P₂/P₁)<sup>n</sup>
      &nbsp;&nbsp;<span class="op">→</span>&nbsp;&nbsp;
      (C/P)₂/(C/P)₁ <span class="op">=</span> (P₂/P₁)<sup>n−1</sup>,&nbsp; <small>n − 1 &lt; 0</small></div>
    <svg viewBox="0 0 700 345" role="img" aria-label="[[정격 출력에 따른 비 자본비 곡선. 출력이 작아질수록 kW당 비용이 급격히 오른다||Specific capital cost against rated output. The smaller the output, the steeper the cost per kW]]">

      <text id="ecreft" x="686" y="0" class="lbl" text-anchor="end">[[대형 경수로 기준 1,400 MWe · 4,000||Large LWR reference 1,400 MWe · 4,000]]</text>
      <line id="ecvl" x1="0" y1="300" x2="0" y2="0" stroke="var(--hot)" stroke-width="1.2"/>

  <div class="side">
    <div class="readout warn"><span class="k">[[정격 전기출력||Rated electrical output]]</span><span class="v" id="ro-p">180<small>MWe</small></span></div>
    <div class="readout hi"><span class="k">[[비 자본비||Specific capital cost]]</span><span class="v" id="ro-c">10,900<small>USD/kWe</small></span></div>
    <div class="readout"><span class="k">[[1,400 MWe 대비||Relative to 1,400 MWe]]</span><span class="v" id="ro-r">2.72<small>[[배||x]]</small></span></div>

      <input type="range" id="ec-slider" min="150" max="1400" step="10" value="180"></div>

</div>`.replace('{AXES}',''),
init(el){
  const svg=el.querySelector('svg');
  svg.insertAdjacentHTML('afterbegin', ecAxes());
  const cv=el.querySelector('#ecc'); cv.setAttribute('d',ecCurve());
  const L=cv.getTotalLength();
  const ref=el.querySelector('#ecref'), reft=el.querySelector('#ecreft');
  ref.setAttribute('y1',EC.sy(4000)); ref.setAttribute('y2',EC.sy(4000));
  reft.setAttribute('y',EC.sy(4000)-8);
  const vl=el.querySelector('#ecvl'), pt=el.querySelector('#ecpt');
  const sl=el.querySelector('#ec-slider');
  function upd(P){
    const C=EC.C(P), x=EC.sx(P), y=EC.sy(C);
    vl.setAttribute('x1',x);vl.setAttribute('x2',x);vl.setAttribute('y2',y);
    pt.setAttribute('cx',x);pt.setAttribute('cy',y);
    el.querySelector('#ro-p').innerHTML=fmt(P)+'<small>MWe</small>';
    el.querySelector('#ro-c').innerHTML=fmt(C)+'<small>USD/kWe</small>';
    el.querySelector('#ro-r').innerHTML=(C/4000).toFixed(2)+'<small>'+TX('배','x')+'</small>';
    el.querySelector('#ro-s').textContent=fmt(P)+' MWe';
  }
  sl.oninput=()=>upd(+sl.value); upd(180);
  if(RM) return;
  cv.style.strokeDasharray=L; cv.style.strokeDashoffset=L;
  cv.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,fill:'forwards',easing:'ease-in-out'});
  // 1400 → 180 으로 미끄러지며 대가를 보여줌
  let t0=null; sl.value=1400; upd(1400);
  raf((t)=>{ if(t<1.0) return; const u=clamp((t-1.0)/1.6,0,1);
    const e=1-Math.pow(1-u,3); const P=lerp(1400,180,e); sl.value=Math.round(P); upd(P); });
}});

S({tag:'ECONOMY', ov:'[[2.7배를 되돌리는 네 가지 인자||Four factors that claw back the 2.7x]]',
src:'[[<b>출처</b> Boldon &amp; Sabharwall, INL/EXT-14-32616 (2014) §5.5·§6.1, Eq.3~6·Eq.12 — 원 보고서는 NEA/OECD(2011), Carelli et al.(2010), Wilton(2012)을 인용. <b>모두 반복 건설을 전제</b>한다||<b>Source</b> Boldon &amp; Sabharwall, INL/EXT-14-32616 (2014) &#167;5.5·&#167;6.1, Eq.3-6·Eq.12 - the original report cites NEA/OECD (2011), Carelli et al. (2010) and Wilton (2012). <b>All of them assume repeated construction</b>]]',
html:`<h2 class="t">[[2.7배를 되돌리는 <em>네 가지 인자</em> — 버튼을 눌러 하나씩 적용||<em>Four factors</em> that claw back the 2.7x - press a button to apply them one by one]]</h2>
<ul class="b">

<div class="body">

      <text id="rc-reft" x="686" y="0" class="lbl" text-anchor="end">[[대형 경수로 4,000 USD/kWe||Large LWR 4,000 USD/kWe]]</text>

      4기 부지 학습계수 0.81~0.90 · 정격 2배당 4.5 %||Shared indivisible cost · 15 % on unit 1 plus 5 % each on units 2-4 ·
      learning factor 0.81-0.90 for a four-unit site · 4.5 % per doubling of rating]]</div>

init(el){

  const ref=el.querySelector('#rc-ref'), reft=el.querySelector('#rc-reft');
  ref.setAttribute('y1',EC.sy(4000));ref.setAttribute('y2',EC.sy(4000));reft.setAttribute('y',EC.sy(4000)-8);
  const VAL=[10900,9700,8100,6300,4700];
  const NAME=['Co-siting','Modular design','Plant configuration','NOAK'];
  const X=EC.sx(180);

      +`<text x="686" y="${y-7}" class="lbl" fill="var(--ok)" text-anchor="end">${NAME[i]} → ${fmt(v)}</text></g>`); });
  const bar=el.querySelector('#rc-bar'), pt=el.querySelector('#rc-pt'), vt=el.querySelector('#rc-val');
  bar.setAttribute('x1',X);bar.setAttribute('x2',X);bar.setAttribute('y1',EC.sy(10900));
  let on=0, shown=10900, target=10900;
  function apply(){
    target=VAL[on];
    el.querySelectorAll('#rc-btns .btn').forEach(b=>{
      const i=+b.dataset.i; if(i>=0) b.classList.toggle('act', i<on); });
    [...g.children].forEach((c,i)=>c.setAttribute('opacity', i<on?1:0));
  }
  raf(()=>{ shown=lerp(shown,target,0.10);
    const y=EC.sy(shown); bar.setAttribute('y2',y); pt.setAttribute('cx',X);pt.setAttribute('cy',y);
    vt.setAttribute('x',X+15);vt.setAttribute('y',y+6);vt.textContent=fmt(shown)+' USD/kWe';
    el.querySelector('#rc-ro').innerHTML=fmt(shown)+'<small>USD/kWe</small>';

    const i=+b.dataset.i; if(i<0){on=0;} else {on = (i<on)? i : i+1;} apply(); });
  apply();
}});
</script>
<script>
S({tag:'LAYOUT · [[루프형||Loop type]]', ov:'[[루프형 대형 경수로 — 대구경 배관이 곧 LBLOCA||Loop-type large LWR - the large pipe is the LBLOCA]]',
src:'[[<b>개념도</b> 자체 작성. 배관 수·기기 배치를 축약한 모식도이며 축척은 임의. <b>GDC 4</b>는 파단확률이 극히 낮으면 동적효과를 배제할 수 있게 한다(LBB 근거)||<b>Schematic</b> drawn for this course. Pipe count and equipment layout are simplified and the scale is arbitrary. <b>GDC 4</b> allows dynamic effects to be excluded where break probability is extremely low (the basis for LBB)]]',
html:`<h2 class="t">[[루프형 — 대구경 배관 하나가 <s>최악의 설계기준사고</s>를 정의한다||Loop type - a single large pipe defines <s>the worst design basis accident</s>]]</h2>
<ul class="b">
  <li>[[원자로용기와 증기발생기를 잇는 <b class="hot">대구경 고온관·저온관</b>이 존재 → 그 순간 파단이 <b>대형 LOCA</b>||A <b class="hot">large-bore hot leg and cold leg</b> join the vessel to the steam generator &#8594; break one and you have a <b>large LOCA</b>]]</li>
  <li>[[냉각재는 <b>펌프</b>가 돌린다. 펌프가 멈추면 유량이 곧바로 사라짐||The coolant is driven by <b>pumps</b>. Stop the pumps and the flow is gone at once]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 360" role="img" aria-label="[[루프형 경수로의 냉각재 순환 경로와 대구경 배관 파단 시 거동||Coolant circulation path of a loop-type LWR and its behaviour when a large pipe breaks]]">
    <path id="lp" d="M150,300 L150,110 L480,110 L480,300 Z" fill="none" stroke="var(--rule)" stroke-width="12"/>
    <rect x="105" y="88" width="90" height="234" rx="18" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>
    <rect id="lvl" x="108" y="118" width="84" height="201" fill="var(--cool)" opacity="0.16"/>
    <rect id="lcore" x="127" y="248" width="46" height="56" rx="3" fill="var(--hot)"/>
    <text x="150" y="282" text-anchor="middle" font-size="13" font-family="var(--sans)" [[fill="#fff">노심</text>||fill="#fff">Core</text>]]

    <rect x="435" y="76" width="90" height="208" rx="10" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>
    <text x="480" y="66" text-anchor="middle" [[class="ttl">증기발생기</text>||class="ttl">Steam generator</text>]]
    <circle cx="315" cy="300" r="23" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>
    <text x="315" y="345" text-anchor="middle" class="lbl b">[[냉각재펌프||Coolant pump]]</text>
    <text x="315" y="98" text-anchor="middle" class="lbl" fill="var(--hot)">[[고온관 (대구경)||Hot leg (large bore)]]</text>
    <text x="300" y="272" text-anchor="middle" class="lbl">[[저온관 (대구경)||Cold leg (large bore)]]</text>

      <circle cx="350" cy="110" r="14" fill="none" stroke="var(--hot)" stroke-width="2"/>

  </svg>
  </div>

    <div class="readout hi"><span class="k">[[순환 구동||Circulation driven by]]</span><span class="v" id="lp-drv">[[펌프||Pumps]]</span></div>

</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const p=el.querySelector('#lp'), f=flow(p,{n:14,speed:0.13,r:4.2,color:'var(--cool)'});
  const lvl=el.querySelector('#lvl'), core=el.querySelector('#lcore'),
        brk=el.querySelector('#brk'), msg=el.querySelector('#msg'), esc=el.querySelector('#esc');
  let st='ok', lv=1, T=0;
  function reset(){ st='ok'; lv=1; f.speed=0.13; brk.setAttribute('opacity',0);
    msg.setAttribute('opacity',0); esc.innerHTML=''; core.setAttribute('fill','var(--hot)');
    el.querySelector('#lp-drv').textContent=TX('펌프','Pumps');
    el.querySelector('#lp-lvbox').className='readout'; }
  el.querySelector('#lp-reset').onclick=reset;
  el.querySelector('#lp-break').onclick=()=>{ if(st!=='ok') return; st='brk'; T=0;
    brk.setAttribute('opacity',1); el.querySelector('#lp-drv').textContent=TX('상실','Lost');
    el.querySelector('#lp-lvbox').className='readout warn';
    for(let i=0;i<26;i++){ const c=document.createElementNS(SV,'circle');
      c.setAttribute('r',3.4); c.setAttribute('fill','var(--hot)');
      c.dataset.a=(-0.25-Math.random()*2.6); c.dataset.v=(70+Math.random()*130);
      c.dataset.t=(Math.random()*1.4); esc.appendChild(c); } };
  raf((t,abs)=>{
    if(st==='brk'){ T+=1/60;
      lv=Math.max(0.12,1-T*0.30); f.speed=Math.max(0.02,0.13+0.5*Math.exp(-T*1.4)-T*0.05);
      if(T>1.6) msg.setAttribute('opacity',Math.min(1,(T-1.6)));
      core.setAttribute('fill', T>2.0?'#ff3b1f':'var(--hot)');
      [...esc.children].forEach(c=>{ let u=(T-+c.dataset.t); if(u<0){c.setAttribute('opacity',0);return;}
        u=u%2.0; const a=+c.dataset.a, v=+c.dataset.v;
        c.setAttribute('cx',350+Math.cos(a)*v*u); c.setAttribute('cy',110+Math.sin(a)*v*u+40*u*u);
        c.setAttribute('opacity',Math.max(0,1-u/1.6)); });
    }
    const y=118+(319-118)*(1-lv)*0.86;
    lvl.setAttribute('y',y); lvl.setAttribute('height',Math.max(2,319-y));
    el.querySelector('#lp-lv').innerHTML=fmt(lv*100)+'<small>%</small>';
  });
}});

    <g id="ig-x" opacity="0">

      <text x="110" y="176" text-anchor="middle" font-family="var(--mono)" font-size="15" [[fill="var(--ink-3)">저온관</text>||fill="var(--ink-3)">Cold leg</text>]]

    <div class="readout"><span class="k">[[대구경 배관 파단||Large-pipe break]]</span><span class="v ok" style="font-size:22px">[[설계에서 배제||Designed out]]</span></div>
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn danger" id="ig-break">[[파단시켜 보기||Try breaking it]]</button>
    </div>
    <div class="src">[[단, 대가가 있다 — 대형 단조 용기, 관통부 증가, 용기 내장 증기발생기의 정비 접근성.||There is a price: a large forged vessel, more penetrations, and poor maintenance access to the in-vessel steam generator.]]</div>

init(el){
  const L=el.querySelector('#ig-l'), R=el.querySelector('#ig-r');

  flow(R,{n:8,speed:0.10,r:4,color:'var(--cool)'});
  const x=el.querySelector('#ig-x');

      {duration:400,fill:'forwards',easing:'cubic-bezier(.2,.8,.3,1.2)'}); };
  if(RM) return;
  const hp=el.querySelector('#ig-heat path');
  raf(t=>{ hp.setAttribute('opacity',0.45+0.55*Math.abs(Math.sin(t*1.8))); });
}});

S({tag:'SUMMARY', ov:'[[SMR의 특징을 물리적 근거로 다시 쓰기||Rewriting SMR claims as physical arguments]]',
src:'[[<b>왼쪽 열</b> 2025-2학기 강의자료 「Design Specification and Requirement for SMR」의 항목. <b>오른쪽 두 열</b>은 본 교재에서 근거를 붙인 것||<b>Left column</b> items from the 2025 fall lecture notes <i>Design Specification and Requirement for SMR</i>. <b>The two right columns</b> are the supporting arguments added in this text]]',
html:`<h2 class="t">[[홍보 문장을 <em>근거</em>로 바꿔 읽기||Reading the sales pitch as an <em>argument</em>]]</h2>
<div class="body col">
<table class="d">
<tr><th style="width:26%">[[흔히 말하는 특징||Common claim]]</th><th style="width:37%">[[실제 근거||What actually supports it]]</th><th>[[유의할 점||What to watch]]</th></tr>
<tr><td>[[작아서 운반·설치가 쉽다||Small, so easy to ship and install]]</td><td>[[운반 한계 안에 드는 크기 → 공장 제작 가능||Size fits inside transport limits &#8594; factory fabrication becomes possible]]</td><td>[[운반 가능한 크기가 곧 경제적 크기는 아님||A shippable size is not automatically an economic size]]</td></tr>
<tr><td>[[규모를 늘리고 줄이기 쉽다||Easy to scale up or down]]</td><td>[[모듈 추가로 출력 증설, 수요 성장에 대응||Add modules to add output and follow demand growth]]</td><td>[[다수 모듈 동시 운전의 인허가·운전원 배치는 별도 문제||Licensing and operator staffing for many modules at once is a separate problem]]</td></tr>
<tr><td>[[안전성이 향상된다||Safety improves]]</td><td>[[붕괴열 절대량 감소, 자연순환 성립, 대구경 배관 배제||Less decay heat in absolute terms, natural circulation becomes viable, large pipes are eliminated]]</td><td>[[<span class="cool">“더 안전”이 아니라 “다른 방식으로 안전”</span> — 2장에서 정량 확인||<span class="cool">Not &#8220;safer&#8221; but &#8220;safe in a different way&#8221;</span> - quantified in Ch. 2]]</td></tr>
<tr class="mark"><td>[[자본비가 낮다||Capital cost is lower]]</td><td>[[총 자본비(절대액)는 낮음 → 투자 위험 감소||Total capital cost in absolute terms is lower &#8594; less investment risk]]</td><td>[[<b>kW당 비용은 오히려 높다.</b> 두 값을 반드시 구분||<b>Cost per kW is in fact higher.</b> Always keep the two apart]]</td></tr>
<tr><td>[[적용처가 넓다||Wider range of applications]]</td><td>[[열·전기 동시 공급, 오지·산업단지·선박||Heat and power together; remote sites, industrial parks, ships]]</td><td>[[대부분 아직 실증 전 단계||Most of it is still short of demonstration]]</td></tr>
</table>
</div>`});
</script>
<script>
SECT('02 · [[작아지면 무엇이 달라지는가||What changes when it gets small]]');
S({bare:true, cls:'div', ov:'[[§02 작아지면 무엇이 달라지는가||&#167;02 What changes when it gets small]]',
html:`[[<div class="no">02</div><h2>작아지면 무엇이 달라지는가</h2><div class="ln"></div>
<p>SMR의 안전 논리를 지탱하는 두 개의 물리. 하나는 붕괴열의 <b>절대량</b>이고, 다른 하나는 자연순환의 <b>구동수두</b>다.
이 두 숫자가 이후 모든 계통 설계를 규정한다.</p>||<div class="no">02</div><h2>What changes when it gets small</h2><div class="ln"></div>
<p>Two pieces of physics carry the whole SMR safety argument: the <b>absolute amount</b> of decay heat,
and the <b>driving head</b> of natural circulation. These two numbers set every system design that follows.</p>]]`});

S({tag:'DECAY HEAT', ov:'[[붕괴열 — 비율은 같고 절대량이 준다||Decay heat - same fraction, smaller absolute load]]',
src:'[[<b>계산</b> Way–Wigner 근사 <span class="mono">P_d/P₀ = 0.0622 [ t<sup>−0.2</sup> − (t+t₀)<sup>−0.2</sup> ]</span>, t₀ = 10⁸ s. 인허가 해석에는 ANSI/ANS-5.1을 쓴다 · 정격 열출력 출처 IAEA SMR Booklet 2022 · KHNP||<b>Calculation</b> Way-Wigner approximation <span class="mono">P_d/P₀ = 0.0622 [ t<sup>−0.2</sup> − (t+t₀)<sup>−0.2</sup> ]</span>, t₀ = 10⁸ s. Licensing analyses use ANSI/ANS-5.1 · rated thermal power from IAEA SMR Booklet 2022 · KHNP]]',
html:`<h2 class="t">[[비율은 같다. <em>절대량</em>이 다르다 — 슬라이더로 시간을 흘려보자||The fraction is the same. The <em>absolute amount</em> is not - run the slider and watch]]</h2>
<ul class="b">
  <li>[[붕괴열 <b>비율</b>은 노심 크기와 거의 무관. 정지 1시간 뒤 어느 노형이든 정격의 약 <code>1 %</code>||The decay heat <b>fraction</b> barely depends on core size. One hour after shutdown any reactor sits near <code>1 %</code> of rating]]</li>
  <li>[[달라지는 건 <b class="hot">절대량</b> — 3,983 MWt의 1 %는 40 MW, 250 MWt의 1 %는 2.6 MW. <b>15배</b> 차이||What differs is the <b class="hot">absolute load</b> - 1 % of 3,983 MWt is 40 MW, 1 % of 250 MWt is 2.6 MW. A factor of <b>15</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 1120 330" role="img" aria-label="[[정지 후 시간에 따른 붕괴열 비율 곡선과 세 노형의 절대 붕괴열 비교||Decay heat fraction against time after shutdown, with the absolute decay heat of three reactors]]">
    <g id="dk-ax"></g>
    <path id="dk-c" d="" fill="none" stroke="var(--cool)" stroke-width="2.4"/>
    <line id="dk-v" y1="292" y2="40" stroke="var(--hot)" stroke-width="1.2"/>
    <circle id="dk-p" r="6.5" fill="var(--hot)"/>
    <text x="300" y="18" text-anchor="middle" class="lbl b">[[붕괴열 / 정격 열출력||Decay heat / rated thermal power]]</text>
    <text x="860" y="18" text-anchor="middle" class="lbl b">[[붕괴열 절대량 (MW, 로그 눈금)||Absolute decay heat (MW, log scale)]]</text>
    <g id="dk-bars"></g>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">[[정지 후 경과||Time since shutdown]]</span><span class="v" id="dk-t">1<small>[[시간||h]]</small></span></div>
    <div class="readout hi"><span class="k">[[정격 대비 비율||Fraction of rating]]</span><span class="v" id="dk-f">1.05<small>%</small></span></div>
    <div class="ctl"><label>[[시간||Time]] <span id="dk-s">1 [[시간||h]]</span></label>
      <input type="range" id="dk-sl" min="0" max="600" step="1" value="257"></div>
    <div class="src">[[1 초 → 1 주. 로그 눈금이라 슬라이더 한 칸이 뒤로 갈수록 긴 시간을 뜻한다.||1 s to 1 week. The scale is logarithmic, so one step of the slider covers more time the further right it goes.]]</div>
  </div>
</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const LX=t=>70+(Math.log10(t))/6*450;               // 1 .. 1e6 s → 70..520
  const LY=f=>292-(Math.log10(f)-Math.log10(0.1))/(Math.log10(20)-Math.log10(0.1))*252;
  const BX=mw=>640+(Math.log10(Math.max(mw,0.1))+1)/(Math.log10(300)+1)*430;
  let ax='';
  [[1,'1 s'],[60,TX('1 분','1 min')],[3600,TX('1 시간','1 h')],[86400,TX('1 일','1 day')],
   [604800,TX('1 주','1 week')]].forEach(d=>{
    const x=LX(d[0]); ax+=`<line x1="${x}" y1="292" x2="${x}" y2="40" class="grid"/>`
      +`<text x="${x}" y="312" class="lbl" text-anchor="middle">${d[1]}</text>`; });
  [0.1,1,10].forEach(f=>{ const y=LY(f);
    ax+=`<line x1="70" y1="${y}" x2="520" y2="${y}" class="grid"/>`
      +`<text x="62" y="${y+4}" class="lbl" text-anchor="end">${f} %</text>`; });
  ax+='<line x1="70" y1="292" x2="520" y2="292" class="axis"/><line x1="70" y1="292" x2="70" y2="34" class="axis"/>';
  [0.1,1,10,100].forEach(m=>{ const x=BX(m);
    ax+=`<line x1="${x}" y1="60" x2="${x}" y2="300" class="grid"/>`
      +`<text x="${x}" y="318" class="lbl" text-anchor="middle">${m}</text>`; });
  el.querySelector('#dk-ax').innerHTML=ax;
  let d=''; for(let i=0;i<=300;i++){ const t=Math.pow(10,i/300*6);
    d+=(d?'L':'M')+LX(t).toFixed(1)+','+LY(decay(t)*100).toFixed(1); }
  el.querySelector('#dk-c').setAttribute('d',d);
  const REA=[['APR1400',3983,'var(--ink-2)'],['BWRX-300',870,'var(--amber)'],['NuScale NPM',250,'var(--ok)']];
  const bg=el.querySelector('#dk-bars'); const bars=[];
  REA.forEach((r,i)=>{ const y=100+i*68;
    bg.insertAdjacentHTML('beforeend',
      `<text x="640" y="${y-10}" class="lbl b">${r[0]} · ${fmt(r[1])} MWt</text>`
      +`<rect x="640" y="${y}" height="22" width="0" fill="${r[2]}" opacity=".85" data-b="${i}"/>`
      +`<text x="646" y="${y+40}" class="val" fill="${r[2]}" data-v="${i}"></text>`); });
  const sl=el.querySelector('#dk-sl'), vl=el.querySelector('#dk-v'), pt=el.querySelector('#dk-p');
  function upd(v){
    const t=Math.pow(10,v/600*6), f=decay(t);
    vl.setAttribute('x1',LX(t));vl.setAttribute('x2',LX(t));
    vl.setAttribute('y2',LY(f*100));
    pt.setAttribute('cx',LX(t));pt.setAttribute('cy',LY(f*100));
    const lab = t<90? fmt(t,0)+TX(' 초',' s') : t<5400? fmt(t/60,0)+TX(' 분',' min')
              : t<172800? fmt(t/3600,1)+TX(' 시간',' h') : fmt(t/86400,1)+TX(' 일',' day');
    el.querySelector('#dk-t').innerHTML=lab.split(' ')[0]+'<small>'+lab.split(' ')[1]+'</small>';
    el.querySelector('#dk-f').innerHTML=(f*100).toFixed(2)+'<small>%</small>';
    el.querySelector('#dk-s').textContent=lab;
    REA.forEach((r,i)=>{ const mw=f*r[1];
      el.querySelector(`[data-b="${i}"]`).setAttribute('width',Math.max(0,BX(mw)-640));
      el.querySelector(`[data-v="${i}"]`).textContent=(mw>=10?fmt(mw,0):mw.toFixed(2))+' MW'; });
  }
  sl.oninput=()=>upd(+sl.value); upd(257);
  if(RM) return;
  const c=el.querySelector('#dk-c'), L=c.getTotalLength();
  c.style.strokeDasharray=L;c.style.strokeDashoffset=L;
  c.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,fill:'forwards'});
  raf(t=>{ if(t<1.1||t>4.6) return; const u=(t-1.1)/3.5; sl.value=Math.round(u*600); upd(+sl.value); });
}});

S({tag:'NATURAL CIRCULATION', ov:'[[자연순환 — 구동수두 인터랙티브||Natural circulation - driving head, interactive]]',
src:'[[<b>계산</b> Δp = (ρ_c − ρ_h) g H, u = √[2Δp / ρ(fL/D + ΣK)] · 압축수 밀도 근사(10~16 MPa) · 유로 K = 25, 단면적 2 m², 저온측 250 °C 기준. 펌프 양정 600 kPa는 대형 PWR의 개념적 대표값||<b>Calculation</b> Δp = (ρ_c − ρ_h) g H, u = √[2Δp / ρ(fL/D + ΣK)] · compressed-water density fit (10-16 MPa) · loop K = 25, flow area 2 m², cold side at 250 °C. The 600 kPa pump head is a representative figure for a large PWR]]',
html:`<h2 class="t">[[펌프가 없으면 <em>밀도차</em>가 밀어야 한다 — 그 힘은 얼마인가||With no pump, <em>density difference</em> has to push - so how hard does it push]]</h2>
<ul class="b">
  <li>[[열중심 높이차 <code>H</code>와 온도차 <code>ΔT</code>가 만드는 부력이 유일한 구동력||The only driving force is buoyancy from the thermal-centre height <code>H</code> and the temperature difference <code>ΔT</code>]]</li>
  <li>[[구동수두가 작으니 <b>유량도 작다</b> → 같은 출력을 빼려면 노심 출입구 <b class="hot">온도차가 커진다</b>||A small driving head means <b>small flow</b> &#8594; to remove the same power the <b class="hot">core temperature rise must grow</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 340" role="img" aria-label="[[자연순환 루프의 구동수두와 유속이 높이차·온도차에 따라 변하는 모습||How driving head and velocity in a natural circulation loop respond to height and temperature difference]]">
    <path id="nc-p" d="M260,300 L260,90 L470,90 L470,300 Z" fill="none" stroke="var(--rule)" stroke-width="11"/>
    <rect x="222" y="238" width="76" height="74" rx="4" fill="var(--hot)"/>
    <text x="260" y="282" text-anchor="middle" font-size="13" fill="#fff" [[font-family="var(--sans)">노심</text>||font-family="var(--sans)">Core</text>]]
    <rect x="432" y="72" width="76" height="96" rx="4" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.5"/>
    <text x="470" y="126" text-anchor="middle" class="lbl" [[fill="var(--cool)">열교환기</text>||fill="var(--cool)">Heat exchanger</text>]]
    <line id="nc-h" x1="150" x2="150" stroke="var(--ok)" stroke-width="1.6"/>
    <path id="nc-h1" d="" stroke="var(--ok)" stroke-width="1.6"/>
    <text id="nc-ht" x="140" y="190" text-anchor="end" class="val" fill="var(--ok)">H</text>
    <text x="365" y="72" text-anchor="middle" class="lbl" fill="var(--hot)">[[뜨거운 쪽 (가벼움)||Hot side (lighter)]]</text>
    <text x="365" y="326" text-anchor="middle" class="lbl" fill="var(--cool)">[[차가운 쪽 (무거움)||Cold side (heavier)]]</text>
    <g id="nc-cmp">
      <text x="560" y="200" class="lbl b">[[구동 압력 비교||Driving pressure, compared]]</text>
      <rect x="560" y="212" width="110" height="16" fill="var(--ink-3)" opacity=".5"/>
      <text x="560" y="246" class="lbl">[[대형 PWR 펌프 600 kPa||Large PWR pump 600 kPa]]</text>
      <rect id="nc-bar" x="560" y="262" width="4" height="16" fill="var(--ok)"/>
      <text id="nc-bart" x="560" y="296" class="lbl" [[fill="var(--ok)">자연순환</text>||fill="var(--ok)">Natural circulation</text>]]
    </g>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">[[구동수두 Δp||Driving head Δp]]</span><span class="v" id="nc-dp">11.3<small>kPa</small></span></div>
    <div class="readout hi"><span class="k">[[자연순환 유속||Circulation velocity]]</span><span class="v" id="nc-u">0.87<small>m/s</small></span></div>
    <div class="readout warn"><span class="k">[[노심 ΔT · 250 MWt||Core ΔT · 250 MWt]]</span><span class="v" id="nc-dt">36<small>K</small></span></div>
    <div class="ctl">[[<label>열중심 높이차 <span||<label>Thermal-centre height <span]] id="nc-hs">10.0 m</span></label>
      <input type="range" id="nc-sh" min="2" max="14" step="0.2" value="10"></div>
    <div class="ctl">[[<label>노심 출입구 온도차 <span||<label>Core inlet-outlet ΔT <span]] id="nc-ts">67 K</span></label>
      <input type="range" id="nc-st" min="20" max="110" step="1" value="67"></div>
  </div>
</div>`,
init(el){
  const p=el.querySelector('#nc-p'), f=flow(p,{n:16,speed:0.12,r:4.2,color:'var(--cool)'});
  const sh=el.querySelector('#nc-sh'), stt=el.querySelector('#nc-st');
  const hl=el.querySelector('#nc-h'), h1=el.querySelector('#nc-h1');
  let target=0.12;
  function upd(){
    const H=+sh.value, dT=+stt.value, Tc=250;
    const drho=rhoW(Tc)-rhoW(Tc+dT), dp=drho*9.81*H, u=Math.sqrt(2*dp/(750*25));
    const mdot=750*u*2, dTc=250e6/(mdot*5300);
    el.querySelector('#nc-dp').innerHTML=(dp/1000).toFixed(1)+'<small>kPa</small>';
    el.querySelector('#nc-u').innerHTML=u.toFixed(2)+'<small>m/s</small>';
    el.querySelector('#nc-dt').innerHTML=fmt(dTc,0)+'<small>K</small>';
    el.querySelector('#nc-hs').textContent=H.toFixed(1)+' m';
    el.querySelector('#nc-ts').textContent=dT+' K';
    // 높이 치수선 (H = 2..14 m → 화면 210 px 내에서)
    const y0=290, y1=290-(H/14)*200;
    hl.setAttribute('y1',y0);hl.setAttribute('y2',y1);
    h1.setAttribute('d',`M142,${y0} H158 M142,${y1} H158`);
    el.querySelector('#nc-ht').setAttribute('y',(y0+y1)/2+5);
    el.querySelector('#nc-ht').textContent='H '+H.toFixed(1)+' m';
    const w=Math.max(3,(dp/1000)/600*110);
    el.querySelector('#nc-bar').setAttribute('width',w);
    el.querySelector('#nc-bart').textContent=TX('자연순환 ','Nat. circ. ')+(dp/1000).toFixed(1)+' kPa';
    target=0.030+u*0.115;
  }
  sh.oninput=upd; stt.oninput=upd; upd();
  raf(()=>{ f.speed=lerp(f.speed,target,0.08); });
  if(RM) return;
  raf(t=>{ if(t>2.4) return; const u=clamp(t/2.2,0,1);
    sh.value=(lerp(3,10,u)).toFixed(1); stt.value=Math.round(lerp(30,67,u)); upd(); });
}});

S({tag:'THERMAL INERTIA', ov:'[[열관성 — 5배 느리게 데워진다||Thermal inertia - heats up five times slower]]',
src:'[[<b>계산</b> dT/dt = P_d /(M c_p), c_p = 5.3 kJ/(kg·K), 정지 1시간 후 붕괴열(SMR 2.6 MW / 대형로 41.8 MW) 기준. 냉각이 <b>완전히 끊긴</b> 가장 보수적인 상한이며 실제로는 용기 열손실과 잔열제거계통이 함께 작동한다||<b>Calculation</b> dT/dt = P_d /(M c_p), c_p = 5.3 kJ/(kg·K), using decay heat one hour after shutdown (2.6 MW for the SMR, 41.8 MW for the large unit). This is the most conservative bound, with cooling <b>completely lost</b>; in reality vessel heat loss and the residual heat removal system also act]]',

S({tag:'DEFENCE IN DEPTH', ov:'[[심층방어 5단계 — 사고가 어디서 멈추는가||Five levels of defence in depth - where the accident stops]]',
src:'[[<b>출처</b> IAEA, <i>Safety of Nuclear Power Plants: Design</i>, SSR-2/1 (Rev.1) Requirement 7 — “The levels of defence in depth shall be <b>independent as far as is practicable</b>.”||<b>Source</b> IAEA, <i>Safety of Nuclear Power Plants: Design</i>, SSR-2/1 (Rev.1) Requirement 7 - &#8220;The levels of defence in depth shall be <b>independent as far as is practicable</b>.&#8221;]]',
html:`<h2 class="t">[[사고는 <em>겹</em>을 하나씩 뚫는다 — 어디서 멈추게 할 것인가||An accident pierces the <em>layers</em> one at a time - where do you make it stop]]</h2>
<ul class="b">
  <li>[[공학적안전설비(ESF)가 지키는 곳은 <b class="cool">Level 3</b>. 이 교재가 다루는 범위다||Engineered safety features hold <b class="cool">Level 3</b>. That is the scope of this text]]</li>
  <li>[[단계를 나눠도 <b class="hot">같은 원인으로 함께 죽으면 겹이 아니다</b> — 후쿠시마가 그랬다||Splitting into levels means nothing if <b class="hot">one cause kills them together</b> - which is what happened at Fukushima]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 860 330" role="img" aria-label="[[심층방어 5단계를 사고가 통과하는 모습. 정상 설계에서는 Level 3의 공학적안전설비에서 멈춘다||An accident travelling through the five levels of defence in depth. In a sound design it stops at the Level 3 engineered safety features]]">
    <g id="dd-lv"></g>
    <circle id="dd-tok" cx="700" cy="6" r="11" fill="var(--hot)"/>
    <text id="dd-toklbl" x="700" y="-8" class="lbl" [[fill="var(--hot)" text-anchor="middle">사고</text>||fill="var(--hot)" text-anchor="middle">Accident</text>]]
    <text id="dd-res" x="430" y="318" text-anchor="middle" font-family="var(--sans)" font-size="19"
          font-weight="600" fill="var(--ok)" opacity="0"></text>
  </svg>
  </div>
  <div class="side">
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn act" id="dd-n">[[정상 설계 — 재생||Sound design - replay]]</button>
      <button class="btn danger" id="dd-f">[[후쿠시마 — 공통원인 재생||Fukushima - common cause replay]]</button>
    </div>
    <blockquote class="q" style="border-left-color:var(--hot)">[[지진과 쓰나미라는 <b>하나의 사건</b>이 외부전원(Level 1~2 지원),
      비상디젤발전기(Level 3), 최종 열침원(Level 3~4)을 <b>동시에</b> 무력화했다.
      <span class="cite">→ 그래서 SMR은 전원을 필요로 하지 않는 계통을 강조한다</span>||<b>One event</b>, an earthquake and a tsunami, disabled offsite power (support for Levels 1-2),
      the emergency diesel generators (Level 3) and the ultimate heat sink (Levels 3-4) <b>at the same time</b>.
      <span class="cite">&#8594; hence the SMR emphasis on systems that need no electrical power</span>]]</blockquote>
  </div>
</div>`,
init(el){
  const LV=[['Level 1',TX('정상운전 이탈 예방','Prevent departure from normal operation'),
     TX('보수적 설계 · 여유도 · 품질보증','Conservative design · margin · quality assurance'),'var(--cool)'],
    ['Level 2',TX('이탈의 감지와 제어','Detect and control the departure'),
     TX('제어·감시계통 · 운전절차서','Control and monitoring · operating procedures'),'var(--cool)'],
    ['Level 3',TX('설계기준사고 제어','Control design basis accidents'),
     TX('공학적안전설비 (ESF)','Engineered safety features (ESF)'),'var(--ok)'],
    ['Level 4',TX('중대사고 완화','Mitigate severe accidents'),
     TX('중대사고 관리설비 · 격납 건전성','Severe accident equipment · containment integrity'),'var(--amber)'],
    ['Level 5',TX('소외 영향 완화','Mitigate offsite consequences'),
     TX('비상대응 · 방재계획','Emergency response · protective planning'),'var(--ink-3)']];
  const g=el.querySelector('#dd-lv');
  LV.forEach((l,i)=>{ const y=18+i*56;
    g.insertAdjacentHTML('beforeend',
      `<g data-l="${i}"><rect x="30" y="${y}" width="800" height="42" fill="var(--panel)" stroke="${l[3]}" stroke-width="${i===2?2:1.2}"/>`
      +`<text x="48" y="${y+26}" font-family="var(--mono)" font-size="14" fill="${l[3]}">${l[0]}</text>`
      +`<text x="140" y="${y+26}" font-family="var(--sans)" font-size="17" fill="var(--ink)">${l[1]}</text>`
      +`<text x="820" y="${y+26}" class="lbl" text-anchor="end">${l[2]}</text></g>`); });
  const tok=el.querySelector('#dd-tok'), tl=el.querySelector('#dd-toklbl'), res=el.querySelector('#dd-res');
  const rows=[...g.querySelectorAll('[data-l]')];
  let mode='n', T=0, run=false;
  function start(m){ mode=m; T=0; run=true; res.setAttribute('opacity',0);
    rows.forEach(r=>{ r.setAttribute('opacity',1);
      r.querySelector('rect').setAttribute('fill','var(--panel)'); });
    el.querySelector('#dd-n').classList.toggle('act',m==='n');
    el.querySelector('#dd-f').classList.toggle('act',m==='f'); }
  el.querySelector('#dd-n').onclick=()=>start('n');
  el.querySelector('#dd-f').onclick=()=>start('f');
  if(RM){ tok.setAttribute('cy',18+2*56+21); res.setAttribute('opacity',1);
    res.textContent=TX('Level 3 공학적안전설비에서 정지','Stopped at the Level 3 engineered safety features'); return; }
  start('n');
  raf(()=>{ if(!run) return; T+=1/60;
    const stopAt = mode==='n'? 2 : 4;
    if(mode==='f' && T>0.35){ [0,1,2,3].forEach(i=>{
      rows[i].setAttribute('opacity',0.32);
      rows[i].querySelector('rect').setAttribute('fill','#1a1010'); }); }
    const yTarget = 18+stopAt*56+21;
    const y = Math.min(yTarget, -6 + T*150);
    tok.setAttribute('cy',y); tl.setAttribute('y',y-18);
    if(y>=yTarget-0.5){
      run=false;
      if(mode==='n'){ res.setAttribute('fill','var(--ok)');
        res.textContent=TX('Level 3 — 공학적안전설비가 사고를 설계기준 안에서 멈춘다',
                           'Level 3 - the engineered safety features hold the accident inside the design basis'); }
      else { res.setAttribute('fill','var(--hot)');
        res.textContent=TX('단계가 독립이 아니면, 다섯 겹도 한 겹이다',
                           'If the levels are not independent, five layers are one layer'); }
      res.setAttribute('opacity',1);
      const r=rows[stopAt].querySelector('rect');
      r.animate([{strokeWidth:2},{strokeWidth:5},{strokeWidth:2}],{duration:700,iterations:2});
    }
  });
}});
</script>
<script>
S({tag:'SINGLE FAILURE', ov:'[[단일고장기준 — 원문과 세 가지 함정||Single failure criterion - the text and three traps]]',
src:'[[<b>출처</b> 10 CFR Part 50, Appendix A, “Definitions and Explanations” (eCFR 원문 확인) · IAEA SSR-2/1 (Rev.1) Requirement 25||<b>Source</b> 10 CFR Part 50, Appendix A, &#8220;Definitions and Explanations&#8221; (verified against eCFR) · IAEA SSR-2/1 (Rev.1) Requirement 25]]',
html:`<h2 class="t">[[하나는 고장 났다고 <em>치고</em> 설계한다 — 단, 세 가지를 정확히||Design as if one thing <em>has already failed</em> - but get three points right]]</h2>
<div class="body">
  <div class="fig" style="justify-content:flex-start;padding-top:4px">
    <blockquote class="q" style="font-size:15.5px;line-height:1.55">
      “A single failure means an occurrence which results in the loss of capability of a component to perform its
      intended safety functions. <b>Multiple failures resulting from a single occurrence are considered to be a
      single failure.</b> Fluid and electric systems are considered to be designed against an assumed single failure
      if neither (1) a single failure of any <b>active</b> component (assuming passive components function properly)
      nor (2) a single failure of a <b>passive</b> component (assuming active components function properly),
      results in a loss of the capability of the system to perform its safety functions.”
      <span class="cite">10 CFR 50 Appendix A · Definitions and Explanations</span></blockquote>
  </div>
  <div class="side" style="width:420px">
    <div class="readout"><span class="k">[[함정 ①||Trap &#9312;]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[단일고장기준은 <b>GDC 본문이 아니라</b> 부록 서두의 <b class="amb">정의</b>에 있다. 조문 인용 시 가장 흔히 틀리는 지점.||The single failure criterion sits <b>not in the GDC themselves</b> but in the <b class="amb">definitions</b> at the head of the appendix. This is where citations most often go wrong.]]</div></div>
    <div class="readout"><span class="k">[[함정 ②||Trap &#9313;]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[능동 고장과 피동 고장을 <b class="cool">각각 따로</b> 가정한다. 둘을 <b>동시에</b> 가정하지 않는다.||An active failure and a passive failure are assumed <b class="cool">one at a time</b>. Never <b>both at once</b>.]]</div></div>
    <div class="readout"><span class="k">[[함정 ③||Trap &#9314;]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[하나의 사건에서 비롯된 다중 고장은 <b>단일 고장으로 센다</b>. 전원반 하나가 죽어 밸브 여럿이 멈춰도 단일 고장.||Multiple failures from one occurrence <b>count as a single failure</b>. One dead power panel stopping several valves is still one failure.]]</div></div>
    <div class="readout warn"><span class="k">[[아직 미정||Still open]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[유체계통 <b>피동 부품</b>의 단일고장 적용 조건은 원문에 <span class="mono hot">under development</span>로 남아 있다.
        피동계통에 기대는 SMR이 규제상 새 질문을 만드는 지점.||How the criterion applies to <b>passive components</b> in fluid systems is still marked <span class="mono hot">under development</span> in the text.
        This is where an SMR leaning on passive systems raises a genuinely new regulatory question.]]</div></div>
  </div>
</div>`});

S({tag:'PLANT STATES', ov:'[[플랜트 상태 — 빈도가 낮을수록 허용 결과가 느슨해진다||Plant states - rarer events, looser limits]]',
src:'[[<b>출처</b> IAEA SSR-2/1 (Rev.1) Requirement 19(설계기준사고)·Requirement 20(설계확장조건). 빈도 구간은 관례적 크기이며 규제·설계마다 경계가 다르다||<b>Source</b> IAEA SSR-2/1 (Rev.1) Requirement 19 (design basis accidents) and Requirement 20 (design extension conditions). The frequency bands are conventional magnitudes; the boundaries differ between regulators and designs]]',
html:`<h2 class="t">[[무엇에 대비하는가 — <em>빈도</em>가 <em>허용 결과</em>를 정한다||What you design against - <em>frequency</em> sets the <em>allowable outcome</em>]]</h2>
<ul class="b">
  <li>[[매년 일어날 수 있는 이탈에서 연료가 손상되면 안 되지만, 백만 년에 한 번은 <b>격납만 지키면</b> 된다||A transient that can happen every year must not damage fuel; for a once-in-a-million-year event it is enough to <b>keep containment intact</b>]]</li>
  <li>[[심층방어 단계 구분(앞 슬라이드)이 이 <b class="cool">빈도–결과 축</b>과 정확히 대응한다||The levels of defence in depth from the previous slide map exactly onto this <b class="cool">frequency-consequence axis</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 330" role="img" aria-label="[[발생 빈도에 따른 플랜트 상태 구분과 각 구간에서 허용되는 결과||Plant states by frequency of occurrence and the outcome allowed in each band]]">
  <g id="ps-ax"></g><g id="ps-b"></g>
</svg>
</div></div>`,
init(el){
  const X=e=>120+(-e)/7*900;     // 10^0 .. 10^-7 /yr
  let ax='<line x1="120" y1="266" x2="1030" y2="266" class="axis"/>';
  for(let e=0;e>=-7;e--){ ax+=`<line x1="${X(e)}" y1="40" x2="${X(e)}" y2="266" class="grid"/>`
    +`<text x="${X(e)}" y="288" class="lbl" text-anchor="middle">10<tspan dy="-6" font-size="10">${e}</tspan></text>`; }
  ax+='<text x="1030" y="312" class="lbl" text-anchor="end">'
     +TX('발생 빈도 (1/년) — 오른쪽으로 갈수록 드묾','Frequency (per year) - rarer towards the right')+'</text>';
  el.querySelector('#ps-ax').innerHTML=ax;
  const B=[[TX('정상운전','Normal operation'),0,-2,'var(--ok)',
     TX('방사선 방출이 규제 한도 이내','Releases stay inside the regulatory limit'),236],
    [TX('예상운전과도 · AOO','Anticipated operational occurrence · AOO'),-2,-4,'var(--cool)',
     TX('연료설계한계 초과 금지 · 계통 손상 없음','No fuel design limit exceeded · no system damage'),186],
    [TX('설계기준사고 · DBA','Design basis accident · DBA'),-4,-6,'var(--amber)',
     TX('연료 일부 손상 허용 · 방사선 기준 만족','Some fuel damage allowed · dose criteria met'),136],
    [TX('설계확장조건 · DEC','Design extension condition · DEC'),-6,-7,'var(--hot)',
     TX('노심용융 포함 · 격납 건전성 유지','Core melt included · containment holds'),86]];
  const g=el.querySelector('#ps-b');
  B.forEach((b,i)=>{ const x0=X(b[1]),x1=X(b[2]),y=b[5];
    g.insertAdjacentHTML('beforeend',
      `<g data-p="${i}" opacity="0"><rect x="${x0}" y="${y}" width="${x1-x0}" height="${266-y}" fill="${b[3]}" opacity=".12"/>`
      +`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${b[3]}" stroke-width="2.5"/>`
      +`<text x="${(x0+x1)/2}" y="${y-26}" text-anchor="middle" font-family="var(--sans)" font-size="17" fill="${b[3]}" font-weight="500">${b[0]}</text>`
      +`<text x="${(x0+x1)/2}" y="${y-8}" text-anchor="middle" class="lbl">${b[4]}</text></g>`); });
  g.insertAdjacentHTML('beforeend',
    '<text x="120" y="30" class="lbl b">'+TX('↑ 허용되는 결과가 느슨해진다','↑ the allowable outcome loosens')+'</text>');
  const items=[...g.querySelectorAll('[data-p]')];
  if(RM){ items.forEach(i=>i.setAttribute('opacity',1)); return; }
  items.forEach((it,i)=>it.animate([{opacity:0},{opacity:1}],{duration:420,delay:220*i,fill:'forwards'}));
}});

S({tag:'GDC MAP', ov:'[[GDC 지도 — 요건이 계통을 부른다||A map of the GDC - requirements calling for systems]]',
src:'[[<b>출처</b> 10 CFR Part 50, Appendix A(eCFR·Cornell LII 확인). 국내 대응은 「원자로시설 등의 기술기준에 관한 규칙」 제20·23·24·29·30조||<b>Source</b> 10 CFR Part 50, Appendix A (verified against eCFR and Cornell LII). The Korean counterpart is the Rules on Technical Standards for Nuclear Reactor Facilities, Articles 20, 23, 24, 29 and 30]]',
html:`<h2 class="t">[[막히면 <em>GDC 원문</em>을 찾아 읽는 것이 가장 빠르다||When stuck, reading the <em>GDC text itself</em> is the fastest way out]]</h2>
<div class="body col">
<table class="d sm">
[[<tr><th style="width:12%">분류</th><th style="width:9%">GDC</th><th style="width:34%">제목</th><th>요구의 핵심</th></tr>||<tr><th style="width:12%">Group</th><th style="width:9%">GDC</th><th style="width:34%">Title</th><th>What it demands</th></tr>]]
<tr>[[<td rowspan="4">설계 원칙</td>||<td rowspan="4">Design principles</td>]]<td class="n">2</td><td>Design Bases for Protection Against Natural Phenomena</td><td>[[부지 이력상 가장 심한 자연현상 + 여유도 + 복합효과||The most severe natural phenomena in the site history, plus margin, plus combined effects]]</td></tr>
<tr><td class="n">4</td><td>Environmental and Dynamic Effects Design Bases</td><td>[[파단 반력·비산물·제트 대응. 파단확률이 극히 낮으면 동적효과 배제 가능||Withstand break reaction, missiles and jets. Dynamic effects may be excluded where break probability is extremely low]]</td></tr>

<tr><td class="n">38</td><td>Containment Heat Removal</td><td>[[사고 후 압력·온도를 신속히 낮추고 유지||Bring pressure and temperature down rapidly after an accident and hold them]]</td></tr>
<tr><td class="n">55·56·57</td><td>Containment Isolation Valves</td><td>[[관통 배관 격리밸브 <b>네 가지 배열</b> 중 하나 (9장)||One of <b>four isolation valve arrangements</b> on each penetrating line (Ch. 9)]]</td></tr>

S({tag:'PASSIVE CATEGORIES', ov:'[[피동 Category A~D — 어디까지가 피동인가||Passive Categories A-D - how passive is passive]]',
src:'[[<b>출처</b> IAEA-TECDOC-626, <i>Safety Related Terms for Advanced Nuclear Plants</i> (1991)||<b>Source</b> IAEA-TECDOC-626, <i>Safety Related Terms for Advanced Nuclear Plants</i> (1991)]]',
html:`<h2 class="t">[[“피동”은 <em>이분법이 아니다</em> — 네 등급으로 갈린다||&#8220;Passive&#8221; is <em>not a yes-or-no</em> - it splits into four grades]]</h2>
<ul class="b">
  <li>[[범주가 오른쪽으로 갈수록 <b class="hot">고장 가능성이 있는 요소</b>가 하나씩 늘어난다||Moving right through the categories adds <b class="hot">one more thing that can fail</b> at each step]]</li>
  <li>[[실제 SMR의 “피동 안전계통”은 대부분 <b>Category C 또는 D</b> — 피동이라고 고장 나지 않는 게 아니다||Most real SMR &#8220;passive safety systems&#8221; are <b>Category C or D</b> - passive does not mean it cannot fail]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 340" role="img" aria-label="[[IAEA 피동안전계통 Category A부터 D까지의 구성 요소와 예시||Constituent elements and examples of IAEA passive safety system Categories A to D]]">
  <g id="pc-cols"></g>
  <text x="560" y="332" text-anchor="middle" class="lbl" fill="var(--hot)">[[← 완전한 피동 &nbsp;&nbsp;·&nbsp;&nbsp; 움직이는 부품과 개시 신호가 늘어난다 →||&#8592; fully passive &nbsp;&nbsp;·&nbsp;&nbsp; moving parts and actuation signals accumulate &#8594;]]</text>
</svg>
</div></div>`,
init(el){
  const C=[['Category A',[0,0,0],
     TX('연료피복재 · 압력경계\\n복사 · 전도 냉각','Fuel cladding · pressure boundary\\nRadiation and conduction'),'var(--ok)'],
    ['Category B',[1,0,0],
     TX('수조 침수 열교환기\\n자연순환 · 자연대류','Pool-submerged heat exchanger\\nNatural circulation and convection'),'var(--cool)'],
    ['Category C',[1,1,0],
     TX('축압기 + 체크밸브\\n안전방출밸브 · 파열판','Accumulator with check valve\\nSafety relief valve · rupture disc'),'var(--amber)'],
    ['Category D',[1,1,1],
     TX('중력구동 비상냉각\\n중력낙하 제어봉','Gravity-driven emergency cooling\\nGravity-drop control rods'),'var(--hot)']];
  const LAMP=[TX('작동유체 이동','Working fluid moves'),TX('기계 가동부','Moving mechanical part'),
              TX('개시 신호·저장에너지','Signal · stored energy')];
  const g=el.querySelector('#pc-cols');
  C.forEach((c,i)=>{ const x=40+i*272, w=248;
    let h=`<g data-c="${i}" opacity="0">`
      +`<rect x="${x}" y="24" width="${w}" height="270" fill="var(--panel)" stroke="${c[3]}" stroke-width="1.6"/>`
      +`<rect x="${x}" y="24" width="${w}" height="40" fill="${c[3]}"/>`
      +`<text x="${x+w/2}" y="51" text-anchor="middle" font-family="var(--mono)" font-size="16" fill="#071018" font-weight="600">${c[0]}</text>`;
    c[1].forEach((on,j)=>{ const y=94+j*38;
      h+=`<circle cx="${x+26}" cy="${y}" r="7" fill="${on?c[3]:'none'}" stroke="${on?c[3]:'var(--rule)'}" stroke-width="1.6"/>`
        +`<text x="${x+44}" y="${y+5}" class="lbl" fill="${on?'var(--ink)':'var(--ink-3)'}">${LAMP[j]}</text>`; });
    h+=`<line x1="${x+18}" y1="216" x2="${x+w-18}" y2="216" stroke="var(--rule)"/>`;
    c[2].split('\\n').forEach((t,k)=>{
      h+=`<text x="${x+w/2}" y="${248+k*22}" text-anchor="middle" font-family="var(--sans)" font-size="15" fill="var(--ink-2)">${t}</text>`; });
    h+='</g>'; g.insertAdjacentHTML('beforeend',h);
    if(i<3) g.insertAdjacentHTML('beforeend',
      `<path d="M${x+w+6},159 L${x+w+18},159" stroke="var(--rule)" stroke-width="2"/>`);
  });
  const cols=[...g.querySelectorAll('[data-c]')];
  if(RM){ cols.forEach(c=>c.setAttribute('opacity',1)); return; }
  cols.forEach((c,i)=>c.animate([{opacity:0},{opacity:1}],{duration:400,delay:200*i,fill:'forwards'}));
}});

S({tag:'ESF DESIGN', ov:'[[ESF가 갖춰야 할 다섯 가지 성질||Five properties an ESF must have]]',
src:'[[<b>왼쪽 두 열</b> 2025-2학기 강의자료 「Safety Requirements for SMR」의 “Design Characteristics of ESF” 항목. <b>오른쪽 열</b>은 10 CFR 50 Appendix A 및 IAEA SSR-2/1 (Rev.1)에서 대응시킨 것||<b>The two left columns</b> follow the &#8220;Design Characteristics of ESF&#8221; items in the 2025 fall lecture notes <i>Safety Requirements for SMR</i>. <b>The right column</b> maps them onto 10 CFR 50 Appendix A and IAEA SSR-2/1 (Rev.1)]]',
html:`<h2 class="t">[[다섯 가지 성질은 <em>각각 조문</em>을 갖고 있다||Each of the five properties has <em>a rule behind it</em>]]</h2>
<ul class="b">
  <li>[[조문과 함께 외우면 실무에서 훨씬 쓸모 있음 — “왜 이렇게 만들었나”가 곧 “어느 조문 때문인가”||Learn them together with the rule and they become useful in practice - &#8220;why is it built this way&#8221; is &#8220;which rule demands it&#8221;]]</li>
</ul>
<div class="body">
  <div class="fig" style="justify-content:flex-start">
  <table class="d">
    [[<tr><th style="width:20%">성질</th><th style="width:44%">뜻</th><th>대응 요건</th></tr>||<tr><th style="width:20%">Property</th><th style="width:44%">What it means</th><th>Matching requirement</th></tr>]]
    <tr><td>[[다중성 Redundancy||Redundancy]]</td><td>[[개별 계열(train)이 각각 요구 기능을 만족할 충분한 용량||Each train on its own has enough capacity to meet the required function]]</td><td class="mono" style="font-size:13.5px">[[단일고장기준 · GDC 34·35·38||Single failure criterion · GDC 34·35·38]]</td></tr>
    <tr><td>[[다양성 Diversity||Diversity]]</td><td>[[서로 다른 원리·제작사·기술로 <b>공통원인고장</b>을 피함||Different principles, vendors or technologies, to escape <b>common cause failure</b>]]</td><td class="mono" style="font-size:13.5px">GDC 22 · GDC 26 · SSR-2/1 Req.24</td></tr>
    <tr><td>[[독립성 Independency||Independence]]</td><td>[[이중화된 계열이 물리적으로 분리되어 서로 영향 없음||Redundant trains are physically separated so one cannot affect the other]]</td><td class="mono" style="font-size:13.5px">GDC 22·24 · SSR-2/1 Req.21</td></tr>
    <tr class="mark"><td>[[Fail-safe 설계||Fail-safe design]]</td><td>[[실패했을 때의 결과가 <b>안전한 쪽</b>이 되도록 체계적으로||Arrange systematically so that failure lands on the <b>safe side</b>]]</td><td class="mono" style="font-size:13.5px">GDC 23 · SSR-2/1 Req.26</td></tr>
    <tr><td>[[인터록 Interlock||Interlock]]</td><td>[[정해진 조건에서만, 또는 조건이 성립하면 반드시 작동||Act only under defined conditions, or act without fail once they are met]]</td><td class="mono" style="font-size:13.5px">GDC 21·24</td></tr>
  </table>
  </div>
  <div class="side">
    <blockquote class="q" style="border-left-color:var(--ok)">
      [[<b>Fail-safe의 가장 좋은 예 — 제어봉.</b><br>
      전원이 끊기면 전자석이 풀리고 제어봉이 <b>중력으로</b> 떨어진다.
      “전원 상실”이라는 고장이 곧 “정지”라는 안전한 결과가 된다.<br><br>
      반대로 밀어 넣는 데 전기가 필요한 설계였다면 정전이 곧 <b class="hot">정지 불능</b>이다.
      <span class="cite">같은 부품, 반대의 논리</span>||<b>The clearest fail-safe there is: the control rod.</b><br>
      Cut the power and the electromagnet lets go, so the rod falls <b>under gravity</b>.
      The failure called &#8220;loss of power&#8221; <i>is</i> the safe outcome called &#8220;shutdown&#8221;.<br><br>
      Had the design needed electricity to push the rod in, a blackout would mean <b class="hot">no shutdown at all</b>.
      <span class="cite">Same part, opposite logic</span>]]</blockquote>
  </div>
</div>`});
</script>
<script>

S({tag:'SCRAM', ov:'[[제어봉 낙하 — S-곡선과 stuck rod||Rod drop - the S-curve and the stuck rod]]',
src:'[[<b>계산</b> 코사인 중성자속 분포를 가정한 표준 S-곡선 <span class="mono">ρ(x)/ρ_total = x − sin(2πx)/2π</span> · stuck rod 영향 18 % 손실로 예시. 실제 값은 노심 설계·연소도에 따라 다르다||<b>Calculation</b> the standard S-curve for an assumed cosine flux shape, <span class="mono">ρ(x)/ρ_total = x − sin(2πx)/2π</span> · the stuck rod is shown as an 18 % loss. Real values depend on core design and burn-up]]',
html:`<h2 class="t">[[삽입 초기와 말기는 <s>효율이 낮다</s> — 그래서 낙하 시간이 요건이 된다||The first and last part of the stroke are <s>inefficient</s> - which is why drop time becomes a requirement]]</h2>
<ul class="b">
  <li>[[중성자속이 높은 <b>노심 중앙부</b>를 지날 때 반응도가 급격히 들어감 — 곡선이 S자인 이유||Reactivity goes in fastest while the rod crosses the <b>high-flux centre</b> of the core - that is why the curve is S-shaped]]</li>
  <li>[[<b class="hot">GDC 26</b> — 최대 반응도가 봉 1개가 <b>삽입되지 않는다</b>는 가정에서도 요구 성능을 만족해야 함||<b class="hot">GDC 26</b> - the requirement must still be met assuming the single most reactive rod <b>fails to insert</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 1120 320" role="img" aria-label="[[제어봉이 노심에 떨어지면서 삽입 반응도가 S자 곡선을 그리는 모습과 stuck rod의 영향||Reactivity inserted as the rods fall into the core, tracing an S-curve, and the effect of a stuck rod]]">
    <rect x="60" y="60" width="290" height="210" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.5"/>
    <text x="205" y="48" text-anchor="middle" [[class="ttl">노심 단면</text>||class="ttl">Core cross-section</text>]]
    <g id="sc-rods"></g>
    <g id="sc-ax"></g>
    <path id="sc-a" d="" fill="none" stroke="var(--cool)" stroke-width="2.8"/>
    <path id="sc-b" d="" fill="none" stroke="var(--hot)" stroke-width="2.2" stroke-dasharray="6 4"/>
    <circle id="sc-pa" r="6" fill="var(--cool)"/>
    <text x="620" y="48" class="lbl b">[[전 제어봉 삽입||All rods inserted]]</text>
    <text x="790" y="48" class="lbl" fill="var(--hot)">[[최대 반응도가 1개 미삽입 (stuck rod)||Most reactive rod not inserted (stuck rod)]]</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout hi"><span class="k">[[낙하 경과||Time since release]]</span><span class="v" id="sc-t">0.0<small>[[초||s]]</small></span></div>
    <div class="readout warn"><span class="k">[[삽입 반응도 (전체 대비)||Reactivity inserted (of total)]]</span><span class="v" id="sc-r">0<small>%</small></span></div>
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn act" id="sc-go">[[원자로 트립 — 재생||Reactor trip - replay]]</button>
      <button class="btn" id="sc-stuck">[[stuck rod 가정 켜기||Assume a stuck rod]]</button>
    </div>
    <div class="src">[[전원이 끊기면 전자석이 풀려 <b>중력으로</b> 떨어진다 — GDC 23 fail-safe.||Cut the power, the magnet lets go and the rod falls <b>under gravity</b> - GDC 23 fail-safe.]]</div>
  </div>
</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const X=x=>420+x*640, Y=r=>268-r*208;
  let ax='<line x1="420" y1="268" x2="1075" y2="268" class="axis"/><line x1="420" y1="268" x2="420" y2="56" class="axis"/>';
  [0,25,50,75,100].forEach(p=>{ ax+=`<text x="${X(p/100)}" y="290" class="lbl" text-anchor="middle">${p}</text>`;
    ax+=`<line x1="${X(p/100)}" y1="268" x2="${X(p/100)}" y2="60" class="grid"/>`; });
  [0,50,100].forEach(p=>{ ax+=`<text x="412" y="${Y(p/100)+4}" class="lbl" text-anchor="end">${p} %</text>`; });
  ax+='<text x="1075" y="312" class="lbl" text-anchor="end">'+TX('제어봉 삽입 분율 (%)','Rod insertion (%)')+'</text>'
     +'<text x="420" y="44" class="lbl">'+TX('삽입 반응도','Reactivity inserted')+'</text>';
  el.querySelector('#sc-ax').innerHTML=ax;
  const S=x=>x-Math.sin(2*Math.PI*x)/(2*Math.PI);
  let da='',db=''; for(let i=0;i<=100;i++){ const x=i/100;
    da+=(da?'L':'M')+X(x)+','+Y(S(x)); db+=(db?'L':'M')+X(x)+','+Y(S(x)*0.82); }
  el.querySelector('#sc-a').setAttribute('d',da); el.querySelector('#sc-b').setAttribute('d',db);
  const rg=el.querySelector('#sc-rods'); const rods=[];
  for(let i=0;i<5;i++){ const x=88+i*54;
    rg.insertAdjacentHTML('beforeend',
      `<rect x="${x}" y="62" width="22" height="200" fill="var(--panel-2)" opacity=".7"/>`);
    const r=document.createElementNS(SV,'rect');
    r.setAttribute('x',x);r.setAttribute('width',22);r.setAttribute('y',62);r.setAttribute('height',12);
    r.setAttribute('fill', i===2?'var(--hot)':'var(--cool)'); rg.appendChild(r); rods.push(r); }
  rg.insertAdjacentHTML('beforeend','<text x="205" y="288" text-anchor="middle" class="lbl">'
    +TX('제어봉 5개 · 가운데가 최대 반응도가','Five rods · the centre one is the most reactive')+'</text>');
  let T=0, run=true, stuck=false;
  const pa=el.querySelector('#sc-pa');
  el.querySelector('#sc-go').onclick=()=>{T=0;run=true;};
  el.querySelector('#sc-stuck').onclick=(e)=>{ stuck=!stuck; e.target.classList.toggle('act',stuck);
    e.target.textContent = stuck?TX('stuck rod 가정 끄기','Drop the stuck rod assumption')
                                 :TX('stuck rod 가정 켜기','Assume a stuck rod'); T=0; run=true; };
  if(RM){ rods.forEach(r=>r.setAttribute('height',200)); return; }
  raf(()=>{ if(!run) return; T+=1/60;
    const x=clamp(T/3.0,0,1);
    rods.forEach((r,i)=>{ const f=(stuck&&i===2)?0.12:x; r.setAttribute('height',12+188*f); });
    const rho=S(x)*(stuck?0.82:1);
    pa.setAttribute('cx',X(x));pa.setAttribute('cy',Y(rho));
    pa.setAttribute('fill',stuck?'var(--hot)':'var(--cool)');
    el.querySelector('#sc-t').innerHTML=Math.min(T,3).toFixed(1)+'<small>'+TX('초','s')+'</small>';
    el.querySelector('#sc-r').innerHTML=fmt(rho*100,0)+'<small>%</small>';
    if(T>3.4) run=false;
  });
}});

S({tag:'SHUTDOWN MARGIN', ov:'[[정지여유도 계산기||Shutdown margin calculator]]',

    <div class="ctl">[[<label>냉각 되돌아옴 ρ_defect <span||<label>Cool-down return ρ_defect <span]] id="sd-l2">2.0 %</span></label>

S({tag:'FEEDBACK', ov:'[[고유안전성 — 반응도 계수와 무붕산 설계||Inherent safety - reactivity coefficients and boron-free design]]',
src:'[[<b>대표 크기</b>이며 실제 값은 연소도·붕소 농도·노심 설계에 따라 크게 다르다. 정밀 값은 노심 설계 코드로 계산 · i-SMR 무붕산 운전: IAEA SMR Booklet 2022||<b>Representative magnitudes</b>; actual values vary widely with burn-up, boron concentration and core design, and are computed with core design codes · i-SMR boron-free operation: IAEA SMR Booklet 2022]]',
html:`<h2 class="t">[[신호보다 <em>먼저</em> 작동하는 것 — 노심 자체의 물리||What acts <em>before</em> any signal - the physics of the core itself]]</h2>
<ul class="b">
  <li>[[<b>도플러 계수</b> <code>−2~−4 pcm/K</code> — 연료 온도가 곧바로 반응, <b class="hot">즉각적</b>. 급격한 반응도 삽입의 1차 저지선||<b>Doppler coefficient</b> <code>−2 to −4 pcm/K</code> - the fuel temperature responds at once, <b class="hot">immediate</b>. The first line against a rapid reactivity insertion]]</li>
  <li>[[<b>감속재온도계수</b> <code>−10~−60 pcm/K</code> — 열이 냉각재로 전달된 뒤 작동, <b class="cool">지연</b>||<b>Moderator temperature coefficient</b> <code>−10 to −60 pcm/K</code> - acts only after the heat reaches the coolant, <b class="cool">delayed</b>]]</li>
  <li>[[붕소가 녹아 있으면 온도 상승 시 <b>흡수체도 함께 빠져나가</b> 음수 크기를 깎는다 → 무붕산 설계의 이점||With boron dissolved, a temperature rise <b>drives absorber out along with the water</b> and eats into that negative value &#8594; the case for a boron-free design]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 250" role="img" aria-label="[[온도 상승 시 도플러 되먹임이 먼저, 감속재 되먹임이 나중에 작동하는 시간 차이||The time gap between the Doppler feedback, which acts first, and the moderator feedback, which follows]]">
