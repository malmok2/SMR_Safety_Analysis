/* ============================================================
   THINK Lab · SMR 설계요건과 공학적안전설비 — 발표용 HTML
   제어실 미믹 패널(control-room mimic) 시각 언어
   ============================================================ */
/*@TOKENS-START@*/
:root{
  --ground:#070E18;      /* 근흑 네이비 바탕 */
  --panel:#0E1B2C;       /* 패널면 */
  --panel-2:#13263C;     /* 한 단계 밝은 패널 */
  --rule:#1E3450;        /* 미믹 라인·헤어라인 */
  --ink:#FFFFFF;         /* 본문 */
  --ink-2:#C9D9EC;       /* 보조 텍스트 — 회색 아님, 청백색 */
  --ink-3:#8FA8C6;       /* 라벨 전용(캡션·단위). 본문에는 쓰지 않음 */
  --cool:#4CC9F0;        /* 강조색 = 냉각재 */
  --hot:#FF7A45;         /* 열·노심·위험 */
  --ok:#5DD39E;          /* 피동·성공 */
  --amber:#FFC55C;       /* 규제 조문 */
  --on-accent:#071018;   /* 강조색으로 꽉 채운 면 위에 얹는 글자 */
  --hot-2:#FF3B1F;       /* 과열 — --hot 보다 한 단계 위 */
  --dead:#1A1010;        /* 무력화된 패널 */
  --bubble:#FFFFFF;      /* 수조 기포 */
  --act:#0D2438;         /* 눌린 버튼 바탕 */
  --veil:rgba(7,14,24,.97);  /* 개요 화면 덮개 */
  /* 심어 둔 서브셋이 먼저. 서브셋에 없는 글자만 CDN·설치본·시스템 글꼴로 넘어간다.
     --mono 뒤쪽에 Pretendard 를 둔 이유 — Plex Mono 에는 한글이 없어서,
     넣지 않으면 축 라벨·판독기 키의 한글이 OS 기본 글꼴로 떨어진다. */
  --sans:'PretendardSub','Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',
         system-ui,sans-serif;
  --mono:'PlexMonoSub','IBM Plex Mono','SFMono-Regular',Consolas,
         'PretendardSub','Pretendard Variable','Pretendard','Malgun Gothic',monospace;
}

/* ---------- 라이트 테마 (T 키) ----------
   인쇄·PDF 의 기본값이다. 강의실이 밝거나 프로젝터가 약할 때도 이쪽을 쓴다.
   색이 지는 의미(냉각재·열·피동·규제)는 그대로 두고 명도만 뒤집었다.
   강조 4색은 흰 바탕에서 WCAG AA(4.5:1)를 넘도록 어둡게 다시 잡았다. */
:root[data-theme="light"]{
  --ground:#FFFFFF;
  --panel:#F2F6FA;
  --panel-2:#E4ECF4;
  --rule:#C3D2E0;
  --ink:#0B1725;
  --ink-2:#2C4257;
  --ink-3:#5A7390;
  --cool:#0B7FA8;
  --hot:#C1440E;
  --ok:#17795A;
  --amber:#8A6100;
  --on-accent:#FFFFFF;
  --hot-2:#A81E00;
  --dead:#F0DEDA;
  --bubble:#0B7FA8;
  --act:#E3F1F7;
  --veil:rgba(255,255,255,.97);
}
/*@TOKENS-END@*/
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--ground);color:var(--ink);
  font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center}

/* ---------- 무대: 1280x720 고정, 뷰포트에 맞춰 스케일 ---------- */
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;
  background:var(--ground);flex:none}
.slide{position:absolute;inset:0;padding:30px 54px 26px;display:none;
  flex-direction:column;opacity:0;transition:opacity .28s ease}
.slide.on{display:flex;opacity:1}

/* ---------- 상단 레일 ---------- */
.rail{display:flex;align-items:baseline;gap:14px;flex:none;
  border-bottom:1px solid var(--rule);padding-bottom:9px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cool)}
.tag b{color:var(--ink);font-weight:600}
.rail .sp{flex:1}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.08em}

/* ---------- 제목 ---------- */
h2.t{font-size:36px;line-height:1.2;font-weight:600;margin:16px 0 0;
  letter-spacing:-.015em;text-wrap:balance}
h2.t em{font-style:normal;color:var(--cool)}
h2.t s{text-decoration:none;color:var(--hot)}
p.sub{margin:8px 0 0;font-size:19px;color:var(--ink-2);font-weight:300;line-height:1.45}

/* ---------- 불릿(상단 2~4개) ---------- */
ul.b{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.b li{font-size:19.5px;line-height:1.42;color:var(--ink);padding-left:20px;position:relative;
  font-weight:300}
ul.b li::before{content:'';position:absolute;left:0;top:.62em;width:8px;height:2px;
  background:var(--cool)}
ul.b li b{font-weight:600}
ul.b li .q{color:var(--ink-2)}
ul.b li code,.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.hot{color:var(--hot)} .ok{color:var(--ok)} .cool{color:var(--cool)} .amb{color:var(--amber)}

/* ---------- 본문 영역 ---------- */
.body{flex:1;min-height:0;display:flex;gap:26px;margin-top:14px}
.body.col{flex-direction:column}
.fig{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:center}
.fig svg{width:100%;height:auto;display:block}
.side{width:330px;flex:none;display:flex;flex-direction:column;gap:12px;justify-content:center}

/* ---------- 하단 레일 ---------- */
.foot{flex:none;display:flex;align-items:center;gap:12px;padding-top:9px;
  border-top:1px solid var(--rule);margin-top:12px}
.src{font-size:12.5px;color:var(--ink-3);font-weight:300;line-height:1.35}
.src b{color:var(--ink-2);font-weight:500}
/* 약어 풀이 — 푸터 맨 윗줄. 어려운 약어가 나오는 장에서 그 자리에 뜻을 단다.
   본문이 아니라 각주이므로 --ink-3 을 쓰고, 약어 자체만 --ink-2 로 한 단계 올린다. */
.abbr{display:block;margin-bottom:6px;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);letter-spacing:.02em;line-height:1.6}
.abbr b{color:var(--ink-2);font-weight:600;letter-spacing:.06em}
.foot .sp{flex:1}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-3)}

/* ---------- 계기 판독 ---------- */
.readout{background:var(--panel);border:1px solid var(--rule);padding:11px 14px 12px}
.readout .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:3px}
.readout .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.readout .v small{font-size:15px;font-weight:400;color:var(--ink-2);margin-left:4px}
.readout.hi{border-color:var(--cool)}
.readout.hi .v{color:var(--cool)}
.readout.warn{border-color:var(--hot)} .readout.warn .v{color:var(--hot)}
.readout.good{border-color:var(--ok)} .readout.good .v{color:var(--ok)}

/* ---------- 컨트롤 ---------- */
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline}
.ctl label span{font-size:15px;color:var(--cool);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;
  cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule)}
input[type=range]::-moz-range-track{height:3px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  margin-top:-6px;background:var(--cool);border:0;border-radius:50%}
input[type=range]::-moz-range-thumb{width:15px;height:15px;background:var(--cool);border:0;
  border-radius:50%}
input[type=range]:focus-visible{outline:2px solid var(--cool);outline-offset:4px}
a.btn{text-decoration:none;display:inline-block}
.btn{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);padding:8px 13px;cursor:pointer;
  transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--cool);color:var(--cool)}
.btn.act{border-color:var(--cool);color:var(--cool);background:var(--act)}
.btn.danger:hover{border-color:var(--hot);color:var(--hot)}
.btn:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 표 ---------- */
table.d{width:100%;border-collapse:collapse;font-size:16px}
table.d th{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cool);text-align:left;font-weight:500;padding:0 12px 8px 0;
  border-bottom:1px solid var(--cool)}
table.d td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);color:var(--ink-2);
  font-weight:300;vertical-align:top;line-height:1.35}
table.d td:first-child{color:var(--ink);font-weight:500}
table.d td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
table.d tr.mark td{color:var(--cool)}
table.d tr.mark td:first-child{color:var(--cool)}
table.d.sm{font-size:14.5px}
table.d.sm td{padding:6px 10px 6px 0}

/* ---------- 인용/조문 ---------- */
blockquote.q{margin:0;padding:14px 18px;background:var(--panel);
  border-left:3px solid var(--amber);font-size:17px;line-height:1.5;color:var(--ink-2);
  font-weight:300}
blockquote.q b{color:var(--ink);font-weight:600}

   ================================================================ */

function store(k,v){ try{ return v===undefined? localStorage.getItem(k)
                                               : localStorage.setItem(k,v); }catch(e){ return null; } }

/* ---------- 배경 테마 ----------
   발표는 다크가 기본, 인쇄·PDF 는 라이트가 기본이다. 주소에 theme= 이 있으면 그것이 이긴다.

let THEME = QS.get('theme') || (PRINT ? 'light' : (store('smrTheme') || 'dark'));
if(THEME!=='light') THEME='dark';
document.documentElement.setAttribute('data-theme', THEME);

  applyStatic();
}
function TX(ko,en){ return LANG==='en' && en!=null ? en : ko; }
const I18N = /\[\[([\s\S]*?)\|\|([\s\S]*?)\]\]/g;
function tr(s){ return String(s).replace(I18N, (m,ko,en)=> LANG==='en' ? en : ko); }

/* 언어에 따라 바뀌는 고정 UI */

  if(q('pt-back')) q('pt-back').textContent = TX('슬라이드로 돌아가기','Back to the slides');
  /* 미리 만든 PDF 는 덱 옆에 그 파일이 같이 있을 때만 쓸모가 있다. HTML 하나만 떼어
     배포하면(zip · LMS 첨부) 옆에 PDF 가 없으므로 버튼을 감춘다 — 죽은 링크를 보이지 않는다.
     file:// 은 fetch 가 막혀 확인할 수 없다. 그때도 감춘다: 옆에 PDF 가 있으면 학생이
     직접 열면 되고, 없으면 바로 옆 'Ctrl+P · PDF로 저장' 으로 만들면 된다. */
  const dl=q('pt-dl');
  if(dl){

    dl.hidden = true;

             + '||All <b>46 slides</b> laid out one per page · a <b>light background</b> by default, for printing ·'
             + ' paper <b>landscape</b>, scale <b>default (100 %)</b> · turn on <b>Background graphics</b> to keep the colours]]';

function setLang(l){

  LANG = (l==='en') ? 'en' : 'ko';
  store('smrLang', LANG);

       history.replaceState(null,'',u); }catch(e){}
  applyStatic();
  if(PRINT){ buildPrint(); }
  else { buildOv(); const i=cur; cur=-1; go(i); }
}

/* ---------- 정리 대상(슬라이드 떠날 때 멈춤) ---------- */
let CLEAN = [];
let FREEZE = 0;                     // >0 이면 그 초 뒤 애니메이션 정지(인쇄 모드)
function onClean(fn){ CLEAN.push(fn); }
function raf(fn){
  let id, t0 = performance.now(), live = true;
  function step(t){
    if(!live) return;
    /* rAF 타임스탬프가 t0보다 이를 수 있어 첫 프레임의 경과시간이 음수로 나온다.
       log·pow 를 쓰는 슬라이드가 NaN 으로 깨지므로 0 아래로는 내리지 않는다. */
    const e=Math.max(0,(t-t0)/1000); fn(e, t);
    if(FREEZE && e>FREEZE){ live=false; return; }   // 인쇄: 한 장면으로 고정
    id = requestAnimationFrame(step);
  }
  id = requestAnimationFrame(step);
  onClean(()=>{ live=false; cancelAnimationFrame(id); });
  return ()=>{ live=false; cancelAnimationFrame(id); };
}

/* ---------- 수치 유틸 ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function decay(t,t0=1e8){ return 0.0622*(Math.pow(t,-0.2)-Math.pow(t+t0,-0.2)); }
function rhoW(T){ return 1006.0-0.2646*T-0.002424*T*T; }

/* ---------- SVG 경로 위를 흐르는 입자 ---------- */
function flow(path, opt={}){
  const n=opt.n||10, col=opt.color||'var(--cool)', r=opt.r||3.6;
  const L=path.getTotalLength(), g=path.ownerSVGElement, dots=[];
  const layer=document.createElementNS('http://www.w3.org/2000/svg','g');
  path.parentNode.appendChild(layer);
  for(let i=0;i<n;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',r); c.setAttribute('fill',col); layer.appendChild(c); dots.push(c);
  }
  const st={speed:opt.speed==null?0.14:opt.speed, on:true, dir:1};
  raf((t)=>{
    for(let i=0;i<n;i++){
      let p=((t*st.speed*st.dir)+i/n)%1; if(p<0)p+=1;
      const pt=path.getPointAtLength(p*L);
      dots[i].setAttribute('cx',pt.x); dots[i].setAttribute('cy',pt.y);
      dots[i].setAttribute('opacity', st.on? (opt.fade? 0.35+0.65*Math.sin(Math.PI*p):1) : 0);
    }
  });
  st.el=layer; return st;
}

/* ---------- 값이 부드럽게 따라가는 판독기 ---------- */
function track(obj,key,get,k=6){
  raf((t,abs)=>{ obj[key]=lerp(obj[key],get(),Math.min(1,k*0.016)); });
}

/* ---------- 선 그래프 ---------- */
function poly(pts){ return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }

/* ---------- SVG 안에서 줄을 나눈다 ----------
   SVG <text> 에는 자동 줄바꿈이 없다. 한글은 공백이 드물어 단어 기준으로 자르면 칸을 넘으므로
   글자 폭으로 센다 — 한글 1.0, 라틴 lat(기본 0.5 · 모노는 0.62). 공백이 있으면 거기서 끊고,
   없으면 글자 사이에서 끊는다(한글은 그래도 된다).
   n 은 "한글 몇 자 폭"이다. 폭 W px 칸에 글자 크기 px 로 넣으려면 n = W/px 로 준다. */
const CJK = /[가-힣ㄱ-ㅎㅏ-ㅣ一-龥]/;
function wrapT(s, n, lat){
  lat = lat || 0.5;
  const out=[]; let cur='', w=0, sp=-1;
  for(const c of String(s)){
    const u = CJK.test(c) ? 1 : lat;
    if(w + u > n){
      if(sp > 0){ out.push(cur.slice(0,sp)); cur = cur.slice(sp+1); }
      else { out.push(cur); cur=''; }
      w = 0; for(const d of cur) w += CJK.test(d) ? 1 : lat; sp = -1;
    }
    if(c === ' ') sp = cur.length;
    cur += c; w += u;
  }
  if(cur.trim()) out.push(cur);
  return out.map(x => x.trim());
}
/* 글자열의 어림 폭(px). 칸을 나눠 배치할 때 쓴다. */
function widT(s, px, lat){
  lat = lat || 0.55; let w = 0;
  for(const c of String(s)) w += CJK.test(c) ? px : px*lat;
  return w;
}

/* ---------- 슬라이드 한 장의 뼈대(레일·본문·푸터) ----------
   s.abbr 은 푸터 맨 윗줄에 붙는 약어 풀이다. 어려운 약어가 본문에 나오면
   그 장 안에서 바로 뜻을 볼 수 있게 한다. 형식: '<b>ECCS</b> 비상노심냉각계통 · <b>RVV</b> …' */
function frame(s,i){
  if(s.bare) return s.html;
  const sec = SEC.filter(x=>x.at<=i).slice(-1)[0];
  return '<div class="rail"><span class="tag">'+(s.tag||(sec?sec.name:''))+'</span>'
       + '<span class="sp"></span><span class="num">'+String(i+1).padStart(2,'0')+' / '+D.length+'</span></div>'
       + s.html
       + '<div class="foot"><span class="src">'
       +   (s.abbr ? '<span class="abbr">'+s.abbr+'</span>' : '')
       +   (s.src||'')+'</span><span class="sp"></span>'
       + '<span class="brand">THINK LAB · HANYANG</span></div>';
}

/* ---------- 렌더 ---------- */
const stage=document.getElementById('stage');
let cur=-1;
function go(i,dir){
  i=clamp(i,0,D.length-1); if(i===cur) return;
  CLEAN.forEach(f=>{try{f()}catch(e){}}); CLEAN=[];

  if(s.init){ try{ s.init(stage.querySelector('.slide')); }catch(e){ console.error(e); } }
}
function replay(){ const i=cur; cur=-1; go(i); }

/* ---------- 인쇄(PDF) 모드 — 46장을 한 번에 지면에 펼친다 ---------- */
function buildPrint(){
  document.body.classList.add('printing');
  FREEZE = 3.4;                                   // 3.4 초 뒤 모든 애니메이션 정지
  const sh=document.getElementById('sheets');
  let h='';
  D.forEach((s,i)=>{
    h+='<div class="sheet"><div class="slide on'+(s.cls?' '+s.cls:'')+'">'+frame(s,i)+'</div></div>';
  });
  sh.innerHTML = tr(h);
  D.forEach((s,i)=>{
    if(!s.init) return;
    const root=sh.children[i].firstElementChild;
    try{ s.init(root); }catch(e){ console.error('slide '+(i+1)+':', e); }
  });
  /* 애니메이션이 멎으면 표시 — PDF 생성 스크립트가 이 신호를 기다린다 */
  document.documentElement.removeAttribute('data-print-ready');
  const t0=performance.now();
  (function step(){
    if(performance.now()-t0 > FREEZE*1000+600){
      document.documentElement.setAttribute('data-print-ready','1'); return;
    }
    requestAnimationFrame(step);
  })();
}
function toPrint(){
  const u=new URL(location.href);
  u.searchParams.set('print','1'); u.searchParams.set('lang',LANG);
  u.searchParams.delete('theme');          // 인쇄는 라이트가 기본 — 지면에서 되돌린다
  location.href=u.toString();
}
function toDeck(){
  const u=new URL(location.href);
  u.searchParams.delete('print'); u.searchParams.set('lang',LANG);
  location.href=u.toString();
}

/* ---------- 스케일 ----------
   아래 46 px 은 조작 막대 몫으로 비워 둔다. 전체화면에서는 띠를 없애고 화면을 다 쓴다. */
const BAND = 46;
function fit(){
  if(PRINT) return;
  const band = document.fullscreenElement ? 0 : BAND;
  const k = Math.min(innerWidth/1280, (innerHeight-band)/720);
  stage.style.transform = 'translateY('+(-band/2)+'px) scale('+k+')';
}
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
fit();

/* ---------- 내비게이션 ---------- */
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='l'||e.key==='L'){ setLang(LANG==='ko'?'en':'ko'); return; }
  if(e.key==='t'||e.key==='T'){ setTheme(THEME==='dark'?'light':'dark'); return; }
  if(PRINT){ if(e.key==='Escape') toDeck(); return; }
  const ov=document.getElementById('ov');
  if(e.key==='Escape'){ ov.classList.remove('on'); return; }
  if(e.key==='o'||e.key==='O'){ ov.classList.toggle('on'); return; }
  if(ov.classList.contains('on')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(D.length-1); }
  else if(e.key==='r'||e.key==='R'){ replay(); }
  else if(e.key==='p'||e.key==='P'){ toPrint(); }
  else if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
});
addEventListener('click',e=>{
  if(PRINT) return;
  if(e.target.closest('input,button,a,#ov,#hud,label')) return;
  if(document.getElementById('ov').classList.contains('on')) return;
  go(cur + (e.clientX < innerWidth*0.28 ? -1 : 1));
});

/* ---------- 오버뷰 ---------- */
function buildOv(){
  const g=document.getElementById('ovg'); let h='';
  D.forEach((s,i)=>{
    h+='<div class="it" data-i="'+i+'"><span class="n">'+String(i+1).padStart(2,'0')
      +'</span><span class="t">'+(s.ov||s.tag||'')+'</span></div>';
  });
  g.innerHTML=tr(h);
  g.querySelectorAll('.it').forEach(el=>el.onclick=()=>{
    document.getElementById('ov').classList.remove('on'); go(+el.dataset.i);
  });
}

/* ---------- 시작 ---------- */
function boot(){
  const b=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  b('lang-ko',()=>setLang('ko')); b('lang-en',()=>setLang('en'));
  b('topdf',toPrint);             b('pt-back',toDeck);
  b('theme',   ()=>setTheme(THEME==='dark'?'light':'dark'));
  b('pt-theme',()=>setTheme(THEME==='dark'?'light':'dark'));
  b('pt-print',()=>print());
  applyStatic();
  if(PRINT){ buildPrint(); } else { buildOv(); go(0); }
}

html:`<h2 class="t">[[카드를 읽을 때는 평균이 아니라 <em>가장 낮은 축</em>을 봄||Read the card by its <em>lowest axis</em>, never its average]]</h2>
<ul class="b">
  <li>[[여섯 축이 고르게 3점인 설계와, 다섯 축이 5점이고 한 축이 0점인 설계 중 <b>먼저 지어지는 쪽은 전자</b>임||Between a design scoring a flat 3 on all six and one scoring 5 on five axes and 0 on one, <b>the flat one gets built first</b>]]</li>
  <li>[[설계는 끝났는데 연료를 못 구하거나, 인허가는 났는데 자금이 없는 사례가 <b class="hot">실제로 대부분</b>임||A finished design with no fuel, or a licensed design with no money, is <b class="hot">the common case</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 340" role="img" aria-label="[[여섯 차원 육각형에 고른 설계와 한 축이 빈 설계를 겹쳐 그린 그림||A hexagon of the six dimensions with an even design and a design with one empty axis overlaid]]">
    <g id="sd-web"></g>
  </svg>
  </div>
  <div class="side">
    <table class="d sm">
      <tr><td>[[인허가||Licensing]]</td><td>[[규제기관 사전협의 · 설계승인 · 건설허가||Pre-application, design approval, construction permit]]</td></tr>
      <tr><td>[[부지||Siting]]</td><td>[[부지 소유자의 결정, 건설 인허가 준비도||Site owner’s decision, permitting readiness]]</td></tr>
      <tr><td>[[자금||Financing]]</td><td>[[약정 · 계약 · 투자 유치의 성격과 규모||Nature and size of commitments, contracts, investment]]</td></tr>
      <tr><td>[[공급망||Supply chain]]</td><td>[[양해각서 &#8594; 구속력 있는 계약 &#8594; 합작||MOU &#8594; binding contract &#8594; joint venture]]</td></tr>
      <tr><td>[[수용성||Engagement]]</td><td>[[지역사회 협약 · 공청회 · 이익공유 건수||Community agreements, hearings, benefit sharing]]</td></tr>
      <tr><td>[[연료||Fuel]]</td><td>[[공급 가능성. HALEU가 필요하면 그 확보 경로||Availability; if HALEU is needed, how it is secured]]</td></tr>
    </table>
  </div>
</div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#sd-web'), cx=200, cy=176, R=126;
  const AX=[TX('인허가','Licensing'),TX('부지','Siting'),TX('자금','Financing'),
            TX('공급망','Supply'),TX('수용성','Engage'),TX('연료','Fuel')];
  const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3; return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  for(let k=1;k<=5;k++){
    const p=[]; for(let i=0;i<6;i++) p.push(pt(i,R*k/5));
    G.appendChild(mk('polygon',{points:poly(p),fill:'none',stroke:'var(--rule)','stroke-width':k===5?1.2:0.6}));
  }
  for(let i=0;i<6;i++){
    const e=pt(i,R);
    G.appendChild(mk('line',{x1:cx,y1:cy,x2:e[0],y2:e[1],stroke:'var(--rule)','stroke-width':0.6}));
    const l=pt(i,R+26), t=mk('text',{x:l[0],y:l[1]+5,'text-anchor':'middle',class:'lbl',fill:'var(--ink-2)'});
    t.textContent=AX[i]; G.appendChild(t);
  }
  const mkPoly=(v,col,dash)=>{
    const p=[]; for(let i=0;i<6;i++) p.push(pt(i,R*v[i]/5));
    const g=mk('polygon',{points:poly(p),fill:col,'fill-opacity':0.18,stroke:col,
      'stroke-width':2,opacity:0});
    if(dash) g.setAttribute('stroke-dasharray',dash);
    G.appendChild(g); return g;
  };
  const even = mkPoly([3,3,3,3,3,3],'var(--ok)');
  const spiky= mkPoly([5,5,5,5,5,0.15],'var(--hot)','5 4');
  const lg=mk('g',{transform:'translate(392,128)'}); G.appendChild(lg);
  [[ 'var(--ok)',  TX('고르게 3점 — 먼저 지어진다','flat 3 - gets built first')],
   [ 'var(--hot)', TX('한 축이 0점 — 그 축이 속도를 정한다','one axis at 0 - it sets the pace')]]
   .forEach((L,i)=>{
     lg.appendChild(mk('rect',{x:0,y:i*74,width:11,height:11,fill:L[0]}));
     const w=wrapT(L[1],15);
     w.forEach((ln,j)=>{ const t=mk('text',{x:20,y:i*74+10+j*20,class:'lbl',fill:'var(--ink-2)'});
       t.textContent=ln; lg.appendChild(t); });
   });
  if(RM){ even.setAttribute('opacity',1); spiky.setAttribute('opacity',1); return; }
  even.animate([{opacity:0},{opacity:1}],{duration:500,delay:200,fill:'forwards'});
  spiky.animate([{opacity:0},{opacity:1}],{duration:500,delay:900,fill:'forwards'});
}});


/* ---------------------------------------------------------------- HALEU 병목 */
S({tag:'FUEL BOTTLENECK', ov:'[[HALEU — 배치 순서를 정하는 병목||HALEU - the bottleneck that sets the order of deployment]]',
src:'[[<b>출처</b> 본 교재 2.4.5절 그림 2.17 · 2.18 · 농축도 값은 각 설계의 공개 사양||<b>Source</b> This textbook &#167;2.4.5, Figs. 2.17-2.18 · enrichment values from each design’s published specification]]',
abbr:'[[<b>HALEU</b> 고분석 저농축 우라늄 — 농축도 5~20% 구간 · <b>천연 우라늄</b> U-235 가 0.711% · <b>고농축</b> 20% 초과||<b>HALEU</b> High-Assay Low-Enriched Uranium, 5-20% enrichment · <b>natural uranium</b> 0.711% U-235 · <b>highly enriched</b> above 20%]]',
html:`<h2 class="t">[[먼저 지어지는 이유는 기술 우열이 아니라 <em>공급망 준비도</em>임||The order is set by <em>supply-chain readiness</em>, not merit]]</h2>
<ul class="b">
  <li>[[가스냉각 · 고속 · 용융염 계열은 대개 <b>HALEU</b>를 요구함. 기술적으로 검증된 연료지만 2023년까지 OECD 국가에 <b class="hot">상업 공급이 없었음</b>||Gas-cooled, fast and molten-salt designs mostly need <b>HALEU</b>. It is a proven fuel, but until 2023 there was <b class="hot">no commercial supply</b> in OECD countries]]</li>
  <li>[[경수로형 SMR 셋은 모두 <b class="ok">5% 미만</b> — 기존 연료 공급망을 그대로 씀. 이것이 먼저 배치되는 가장 현실적인 이유임||All three light-water SMRs sit <b class="ok">below 5%</b> and use the existing fuel supply chain. That is the practical reason they go first]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 338" role="img" aria-label="[[천연 우라늄에서 고농축까지의 농축도 계층과 세 노형의 위치, 그리고 두 구간이 사업에 주는 차이||The enrichment ladder with the three designs marked, and what each band means for a project]]">
  <g id="hl-scale"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#hl-scale');
  /* 0~25% 를 비선형으로 펼친다 — 실제로 쓰이는 저농축 구간을 크게 보이게 하려는 것 */
  const X=v=>60+Math.pow(v/25,0.55)*1000;
  const BAND=[[0,0.711,'var(--ink-3)',TX('천연 0.711%','natural 0.711%')],
              [0.711,5,'var(--ok)',   TX('경수로용 3~5%','light-water 3-5%')],
              [5,20,'var(--amber)',   TX('HALEU 5~20%','HALEU 5-20%')],
              [20,25,'var(--hot)',    TX('20% 초과','above 20%')]];
  const hd=mk('text',{x:60,y:26,'font-family':'var(--sans)','font-size':18,fill:'var(--ink)',
    'font-weight':500}); hd.textContent=TX('우라늄 농축도 계층','The uranium enrichment ladder');
  G.appendChild(hd);
  const bars=[];
  BAND.forEach(b=>{
    const x=X(b[0]), w=X(b[1])-x;
    const r=mk('rect',{x:x,y:46,width:0,height:52,fill:b[2],opacity:0.55});
    G.appendChild(r); bars.push([r,w]);
    G.appendChild(mk('line',{x1:x,y1:46,x2:x,y2:98,stroke:b[2],'stroke-width':1.4}));
    const t=mk('text',{x:x+8,y:120,class:'lbl',fill:b[2]}); t.textContent=b[3]; G.appendChild(t);
  });
  G.appendChild(mk('line',{x1:60,y1:98,x2:1060,y2:98,class:'axis'}));

  /* 세 노형 — 축 아래 삼각 표식으로만 찍고, 이름은 아래 한 줄에 모은다 */
  const D=[[4.95,'NuScale US460',TX('4.95% 미만','below 4.95%')],
           [4.60,'i-SMR',        TX('5% 미만','below 5%')],
           [3.81,'BWRX-300',     TX('평균 3.81%','3.81% average')]];
  const pins=[];
  D.forEach(d=>{
    const x=X(d[0]), g=mk('g',{opacity:0});
    g.appendChild(mk('polygon',{points:poly([[x-6,46],[x+6,46],[x,60]]),fill:'var(--ok)'}));
    G.appendChild(g); pins.push(g);
  });
  const row=mk('g',{transform:'translate(60,152)'}); G.appendChild(row);
  let rx=0;
  D.forEach(d=>{
    const g=mk('g',{transform:'translate('+rx+',0)',opacity:0});
    g.appendChild(mk('circle',{cx:7,cy:-5,r:6,fill:'var(--ok)'}));
    const n=mk('text',{x:22,y:1,'font-family':'var(--sans)','font-size':18,fill:'var(--ink)',
      'font-weight':500}); n.textContent=d[1]; g.appendChild(n);
    const nw=22+widT(d[1],18)+16;
    const v=mk('text',{x:nw,y:1,'font-family':'var(--mono)','font-size':15,fill:'var(--ok)'});
    v.textContent=d[2]; g.appendChild(v);
    row.appendChild(g); pins.push(g);
    rx += nw + widT(d[2],15) + 44;
  });

  /* 아래 — 같은 그림이 말하는 대비. 왼쪽 띠에 있으면 바로 짓고, 오른쪽 띠면 연료부터 구해야 한다. */
  const CO=[['var(--ok)',  TX('3~5% 구간의 설계','Designs in the 3-5% band'),
             TX('기존 연료 공급망을 그대로 쓴다. 연료 때문에 멈추는 일이 없다.',
                'They use the existing fuel supply chain. Fuel never stops them.')],
            ['var(--amber)',TX('HALEU 가 필요한 설계','Designs that need HALEU'),
             TX('설계가 끝나도 연료 확보 경로부터 세워야 한다. 2023년까지 OECD 상업 공급이 없었다.',
                'Even with the design finished, a fuel route must be built first. No OECD supply until 2023.')]];
  const boxes=[];
  CO.forEach((c,i)=>{
    const g=mk('g',{transform:'translate('+(60+i*512)+',196)',opacity:0});
    g.appendChild(mk('rect',{width:488,height:118,fill:'var(--panel)',stroke:'var(--rule)'}));
    g.appendChild(mk('rect',{width:488,height:3,fill:c[0]}));
    const h=mk('text',{x:20,y:38,'font-family':'var(--sans)','font-size':19,fill:c[0],
      'font-weight':600}); h.textContent=c[1]; g.appendChild(h);
    wrapT(c[2],31).forEach((ln,j)=>{
      const t=mk('text',{x:20,y:70+j*24,'font-family':'var(--sans)','font-size':16.5,
        fill:'var(--ink-2)','font-weight':300}); t.textContent=ln; g.appendChild(t); });
    G.appendChild(g); boxes.push(g);
  });


  if(RM){ bars.forEach(b=>b[0].setAttribute('width',b[1]));
          pins.forEach(x=>x.setAttribute('opacity',1));
          boxes.forEach(b=>b.setAttribute('opacity',1)); return; }
  bars.forEach((b,i)=>b[0].animate([{width:'0px'},{width:b[1]+'px'}],
    {duration:480,delay:120*i,fill:'forwards',easing:'cubic-bezier(.2,.7,.3,1)'}));
  pins.forEach((x,i)=>x.animate([{opacity:0},{opacity:1}],
    {duration:320,delay:740+110*i,fill:'forwards'}));
  boxes.forEach((b,i)=>b.animate([{opacity:0},{opacity:1}],
    {duration:380,delay:1050+200*i,fill:'forwards'}));
}});

S({tag:'FIVE NUMBERS', ov:'[[같은 대시보드에서 나온 다섯 개의 숫자||Five numbers from the same dashboard]]',
src:'[[<b>출처</b> 본 교재 2.4.7절 표 2.3 · 다섯 다 맞음. 세는 대상과 시점이 다를 뿐임||<b>Source</b> This textbook &#167;2.4.7, Table 2.3 · all five are correct; they count different things at different times]]',
html:`<h2 class="t">[[&#8220;NEA에 따르면 SMR 설계는 <s>OO개</s>&#8221;는 <em>거의 틀린 문장</em>임||&#8220;According to NEA there are <s>N</s> SMR designs&#8221; is <em>almost always wrong</em>]]</h2>
<ul class="b">
  <li>[[한 절 안에만 숫자가 다섯 개 나옴 — <b>98 · 56 · 74 · 129 · 79</b>. 모순처럼 보이지만 다섯 다 맞음||One section alone carries five numbers - <b>98, 56, 74, 129, 79</b>. They look contradictory; all five are right]]</li>
  <li>[[1.1절의 <b class="cool">&#8220;무엇을 세는지가 다르다&#8221;</b>가 여기서 그대로 재현됨. 어느 숫자를 쓰든 <b>무엇을 센 것인지와 시점</b>을 같이 적음||&#167;1.1&#8217;s <b class="cool">&#8220;they count different things&#8221;</b> repeats here. Whichever you use, write down <b>what it counted and when</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 382" role="img" aria-label="[[98·56·74·129·79 다섯 숫자가 각각 무엇을 언제 센 값인지 정리한 표||What each of the five numbers 98, 56, 74, 129 and 79 counted, and when]]">
  <g id="fn-rows"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const R=[
    ['98', 'var(--ink-3)',TX('전 세계에서 확인된 설계 (개발 중단분 포함)','Designs identified worldwide, including discontinued'), TX('제2판 · 2024','2nd Edition · 2024')],
    ['56', 'var(--ink-3)',TX('그중 대시보드가 평가한 설계','Of those, the ones the dashboard scored'),                     TX('제2판 · 2024','2nd Edition · 2024')],
    ['74', 'var(--amber)',TX('제3판 보고서의 평가 대상','The Third Edition report’s scope'),                          TX('제3판 · 2025-07 (기준일 2025-02-14)','3rd Edition · Jul 2025 (cut-off 14 Feb 2025)')],
    ['129','var(--cool)', TX('NEA 가 추적 중인 설계','Designs NEA tracks'),                                              TX('디지털 대시보드 · 상시','Digital dashboard · rolling')],
    ['79', 'var(--cool)', TX('그중 디지털 대시보드에 수록된 설계','Of those, the ones listed on the digital dashboard'),   TX('디지털 대시보드 · 상시','Digital dashboard · rolling')]
  ];
  const G=el.querySelector('#fn-rows'), gs=[];
  G.appendChild(mk('text',{x:118,y:16,class:'lbl'})).textContent=TX('무엇을 센 것인가','what it counted');
  G.appendChild(mk('text',{x:710,y:16,class:'lbl'})).textContent=TX('시점','when');
  R.forEach((r,i)=>{
    const y=34+i*69, g=mk('g',{opacity:0});
    g.appendChild(mk('line',{x1:0,y1:y+58,x2:1084,y2:y+58,stroke:'var(--rule)'}));
    const n=mk('text',{x:96,y:y+40,'text-anchor':'end','font-family':'var(--mono)','font-size':34,
      fill:r[1],'font-weight':600}); n.textContent=r[0]; g.appendChild(n);
    const t=mk('text',{x:118,y:y+40,'font-family':'var(--sans)','font-size':18.5,fill:'var(--ink)',
      'font-weight':300}); t.textContent=r[2]; g.appendChild(t);
    const w=mk('text',{x:710,y:y+40,'font-family':'var(--sans)','font-size':16.5,fill:'var(--ink-2)',
      'font-weight':300}); w.textContent=r[3]; g.appendChild(w);
    G.appendChild(g); gs.push(g);
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],
    {duration:320,delay:150*i,fill:'forwards',easing:'ease-out'}));
}});
</script>
<script>
/* ================================================================

SECT('03 · [[AI로 수집하기||Collecting with AI]]');

S({bare:true, cls:'div', ov:'[[&#167;03 AI로 수집하기||&#167;03 Collecting with AI]]',
html:`[[<div class="no">03</div><h2>AI로 수집하기</h2><div class="ln"></div>
<p>이 장은 “AI로 조사시키기”가 아니라 “AI에게 어디까지 시키고 <b>어디서 끊는가</b>”를 다룬다.

/* ---------------------------------------------------------------- 잘하는 일 / 못하는 일 */
S({tag:'WHAT IT CAN', ov:'[[AI가 잘하는 일과 못하는 일은 갈린다||What AI does well and badly splits cleanly]]',
src:'[[<b>출처</b> 본 교재 3.1절 · 못하는 두 가지는 성능 문제가 아니라 <b>확률적 생성</b>이라는 작동 방식에서 옴||<b>Source</b> This textbook &#167;3.1 · the two failures come from <b>probabilistic generation</b> itself, not from model quality]]',
html:`<h2 class="t">[[못하는 두 가지는 <em>모델을 바꿔도</em> 그대로임||The two failures stay <em>whatever model you use</em>]]</h2>
<ul class="b">
  <li>[[&#8220;숫자를 정확히 옮기는 일&#8221;을 못 하는 것은 성능 부족이 아니라 <b>작동 방식</b>임 — 확률적으로 다음 토큰을 고르는 구조임||Getting a number across intact is not a capability gap but <b>how it works</b> - it picks the next token by probability]]</li>
  <li>[[&#8220;모른다고 말하는 일&#8221;도 마찬가지임. 자료에 없으면 비워 두는 게 맞지만 <b class="hot">그럴듯한 값을 채우는 쪽으로 기움</b>||Same for &#8220;saying it does not know.&#8221; A blank is the right answer, but it <b class="hot">leans towards filling it in plausibly</b>]]</li>

S({tag:'ASK FOR PLACE', ov:'[[값을 묻지 말고 위치를 묻는다||Ask for the place, not the value]]',
src:'[[<b>출처</b> 본 교재 3.3.1절 · 값을 물으면 모델은 <b>생성</b>하고, 위치를 물으면 <b>검색</b>함||<b>Source</b> This textbook &#167;3.3.1 · ask for a value and the model <b>generates</b>; ask for a place and it <b>searches</b>]]',
html:`<h2 class="t">[[생성된 값은 <s>검증이 필요</s>하고, 위치는 <em>열어 보면 끝</em>임||A generated value <s>needs verification</s>; a place is <em>settled by opening it</em>]]</h2>

<div class="body">

  </div>

init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#ap-flow');
  /* 상자 높이를 글 줄 수에서 뽑는다 — 손으로 잡으면 영문에서 반드시 넘친다 */

      const t=mk('text',{x:x+16,y:y+30+j*23,'font-family':mono?'var(--mono)':'var(--sans)',

      t.textContent=ln; g.appendChild(t); });
    G.appendChild(g); return [g,h];
  };
  const gs=[], L=[], R=[];
  L.push(put(0,0,368,TX('i-SMR 의 1차계통 운전압력은 몇 MPa 인가?',

  L.push(put(0,128,368,TX('\u201c15.5 MPa 입니다\u201d \u2014 맞을 수도 있고, 다른 노형 값일 수도 있다',
                          '\u201cIt is 15.5 MPa\u201d - could be right, could be another design\u2019s value'),'var(--ink-2)'));
  L.push(put(0,266,368,TX('확인하려면 결국 원문을 연다 \u2014 절약된 것이 없다',
                          'To be sure you open the source anyway - nothing was saved'),'var(--hot)'));
  R.push(put(422,0,368,TX('그 값이 적힌 1차 자료의 문서명 \u00b7 절 \u00b7 표 번호만 알려 줘',
                          'Name only the document, section and table where that value appears'),'var(--ok)',1));
  R.push(put(422,128,368,TX('\u201cARIS i-SMR Design Status Report, Table 1\u201d',
                            '\u201cARIS i-SMR Design Status Report, Table 1\u201d'),'var(--ink-2)'));
  R.push(put(422,266,368,TX('그 표를 열면 바로 참이거나 거짓 \u2014 한 번에 끝난다',
                            'Open that table and it is true or false at once - one check'),'var(--ok)'));
  L.concat(R).forEach(x=>gs.push(x[0]));

    G.appendChild(mk('path',{d:'M'+x+','+(128+col[1][1])+' V266',stroke:'var(--rule)','stroke-width':1.4,fill:'none'}));
  });
  if(RM){ gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],
    {duration:320,delay:[0,240,480,160,400,640][i],fill:'forwards'}));
}});
</script>

/* ---------------------------------------------------------------- 인용의 세 층위 */
S({tag:'CITED ≠ SUPPORTED', ov:'[[링크가 살아 있다 ≠ 그 문서가 그 말을 한다||A live link is not the source saying it]]',
src:'[[<b>출처</b> 본 교재 4.1절 그림 4.1 · H. Onweller et al., <i>Cited but Not Verified</i>, arXiv:2605.06635 (2026) · 14개 언어모델의 딥리서치 출력을 기계적으로 채점||<b>Source</b> This textbook &#167;4.1, Fig. 4.1 · H. Onweller et al., <i>Cited but Not Verified</i>, arXiv:2605.06635 (2026) · citations from 14 models scored mechanically]]',
html:`<h2 class="t">[[표면 지표는 멀쩡한데 <em>알맹이만</em> 무너져 있음||The surface metrics hold; only <em>the substance</em> collapses]]</h2>
<ul class="b">
  <li>[[딥리서치 출력에는 각주와 링크가 촘촘히 붙고, 눌러 보면 <b>열림</b>. 그래서 신뢰가 감||Deep-research output is dense with footnotes and links, and the links <b>open</b>. That is why it feels trustworthy]]</li>
  <li>[[그런데 인용된 사실의 <b class="hot">23~61%</b>는 그 출처가 실제로 뒷받침하지 않음 — 링크가 열리는 것과 별개의 문제임||Yet <b class="hot">23-61%</b> of cited facts are not actually supported by the source. Opening is a different question from supporting]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 408" role="img" aria-label="[[링크 유효율·주제 관련성·사실 일치율 세 층위의 값이 아래로 갈수록 떨어지는 그림||Link validity, topical relevance and factual support, falling as you go down]]">

</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#cv-bars'), X0=330, W=620;
  const B=[
    [TX('링크가 살아 있는가','Does the link work?'),      0.94, 1.00, 'var(--ok)',   '94%+',
     TX('눌러 보면 열린다','It opens when you click it')],
    [TX('내용이 주제와 관련 있는가','Is the content relevant?'), 0.80, 1.00, 'var(--amber)','80%+',
     TX('그 문서가 그 주제를 다루기는 한다','The document is at least about the topic')],
    [TX('그 출처가 그 사실을 뒷받침하는가','Does it support the claim?'), 0.39, 0.77, 'var(--hot)', '39~77%',
     TX('여기서 무너진다 — 인용의 23~61% 가 근거 없음',
        'This is where it breaks - 23-61% of citations are unsupported')]

      'font-weight':500}); t.textContent=b[0]; G.appendChild(t);
    const s=mk('text',{x:0,y:y+46,'font-family':'var(--sans)','font-size':15.5,fill:'var(--ink-2)',
      'font-weight':300}); s.textContent=b[5]; G.appendChild(s);
    G.appendChild(mk('rect',{x:X0,y:y,width:W,height:40,fill:'var(--panel)',stroke:'var(--rule)'}));
    const lo=mk('rect',{x:X0,y:y,width:'0',height:40,fill:b[3],opacity:0.30});
    const hi=mk('rect',{x:X0,y:y,width:'0',height:40,fill:b[3],opacity:0.70});
    G.appendChild(lo); G.appendChild(hi);
    parts.push([hi,b[1]*W],[lo,b[2]*W]);
    const v=mk('text',{x:X0+W+16,y:y+28,'font-family':'var(--mono)','font-size':21,fill:b[3],
      'font-weight':600,opacity:0}); v.textContent=b[4]; G.appendChild(v); parts.push([v,null]);
  });
  const note=mk('text',{x:0,y:396,class:'lbl'});
  note.textContent=TX('상위 모델 기준. 밝은 구간이 최고값, 옅은 구간이 하한이다.',
                      'Top models. The solid band is the best value, the faint band the lower bound.');

  if(RM){ parts.forEach(p=>{ if(p[1]===null) p[0].setAttribute('opacity',1);

S({tag:'DEEPER = WORSE', ov:'[[깊게 시킬수록 정확도가 떨어진다||Dig deeper and it gets less accurate]]',
src:'[[<b>출처</b> 본 교재 4.1절 · 같은 연구. 도구 호출을 2회에서 150회로 늘린 실험||<b>Source</b> This textbook &#167;4.1 · same study; tool calls raised from 2 to 150 in one run]]',
html:`<h2 class="t">[[&#8220;더 꼼꼼히 조사해 줘&#8221;는 <s>품질을 높이는</s> 주문이 <em>아님</em>||&#8220;Research it more thoroughly&#8221; is <s>not</s> a quality instruction]]</h2>
<ul class="b">
  <li>[[도구 호출을 2회 &#8594; 150회로 늘리면 사실 일치율이 <b class="hot">평균 42%p 떨어짐</b>. 그런데 표면 지표는 <b>92% 이상으로 유지</b>됨||Raise tool calls from 2 to 150 and factual support drops <b class="hot">42 points on average</b> - while the surface metrics <b>hold above 92%</b>]]</li>
  <li>[[범위를 넓히는 대신 <b class="cool">질문을 나눔</b>. 항목 10개를 한 번에 묻지 말고 두세 개씩 나눠 물으면 정확도가 높음||Split the question instead of widening it. Asking two or three fields at a time beats asking ten at once]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 408" role="img" aria-label="[[도구 호출 횟수가 늘어날 때 표면 지표는 유지되고 사실 일치율만 떨어지는 그래프||Surface metrics hold while factual support falls as tool calls increase]]">
    <g id="dw-plot"></g>
  </svg>
  </div>
  <div class="side">
    <blockquote class="q">[[더 오래 찾게 시켰더니 보고서는 <b>더 길고 더 그럴듯해지고 더 틀렸다</b>.
      조사 범위를 넓히면 모델이 다뤄야 할 자료가 늘고, 그 안에서 문장과 출처를 짝짓는 일이 어려워진다.
      <span class="cite">검토자 입장에서 특히 위험함 — 겉보기 신호가 그대로라 눈으로는 구별되지 않음</span>||Told to search longer, the report came back <b>longer, more plausible and more wrong</b>.
      A wider search means more material, and pairing each sentence with the right source gets harder.
      <span class="cite">Dangerous for a reviewer - the visible signals are unchanged, so the eye cannot tell</span>]]</blockquote>
  </div>

init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#dw-plot');
  const X0=70, X1=740, Y0=344, Y1=36;
  const X=n=>X0+(Math.log10(n)-Math.log10(2))/(Math.log10(150)-Math.log10(2))*(X1-X0);
  const Y=v=>Y0-(v-0.3)/0.7*(Y0-Y1);
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X1,y2:Y0,class:'axis'}));
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X0,y2:Y1,class:'axis'}));
  [[2,'2'],[10,'10'],[50,'50'],[150,'150']].forEach(t=>{
    G.appendChild(mk('line',{x1:X(t[0]),y1:Y0,x2:X(t[0]),y2:Y0+5,class:'axis'}));
    const e=mk('text',{x:X(t[0]),y:Y0+22,'text-anchor':'middle',class:'lbl'});
    e.textContent=t[1]; G.appendChild(e);
  });
  [[0.4,'40%'],[0.6,'60%'],[0.8,'80%'],[1.0,'100%']].forEach(t=>{
    const e=mk('text',{x:X0-10,y:Y(t[0])+4,'text-anchor':'end',class:'lbl'});
    e.textContent=t[1]; G.appendChild(e);
    G.appendChild(mk('line',{x1:X0,y1:Y(t[0]),x2:X1,y2:Y(t[0]),class:'grid'}));
  });
  const xl=mk('text',{x:X1,y:Y0+46,'text-anchor':'end',class:'lbl'});
  xl.textContent=TX('한 번의 조사에서 도구를 부른 횟수','tool calls in one research run'); G.appendChild(xl);

  const mkLine=(f,col,dash)=>{
    const pts=[]; for(let i=0;i<=40;i++){ const n=2*Math.pow(75,i/40); pts.push([X(n),Y(f(n))]); }
    const p=mk('polyline',{points:poly(pts),fill:'none',stroke:col,'stroke-width':2.4});
    if(dash) p.setAttribute('stroke-dasharray',dash);
    G.appendChild(p); return p;
  };
  /* 표면 지표는 평평하고, 사실 일치율만 내려간다 */
  const flat = mkLine(n=>0.955-0.03*(Math.log10(n)-Math.log10(2))/1.875,'var(--ok)');
  const fall = mkLine(n=>0.77-0.42*(Math.log10(n)-Math.log10(2))/1.875,'var(--hot)');
  const l1=mk('text',{x:X1-8,y:Y(0.93)-12,'text-anchor':'end','font-family':'var(--sans)',
    'font-size':16,fill:'var(--ok)','font-weight':500,opacity:0});
  l1.textContent=TX('표면 지표 — 92% 이상 유지','surface metrics - hold above 92%'); G.appendChild(l1);
  const l2=mk('text',{x:X1-8,y:Y(0.35)+2,'text-anchor':'end','font-family':'var(--sans)',
    'font-size':16,fill:'var(--hot)','font-weight':500,opacity:0});
  l2.textContent=TX('사실 일치율 — 42%p 하락','factual support - down 42 points'); G.appendChild(l2);

  if(RM){ [l1,l2].forEach(x=>x.setAttribute('opacity',1)); return; }
  [flat,fall].forEach((p,i)=>{ const L=p.getTotalLength();
    p.style.strokeDasharray=p.getAttribute('stroke-dasharray')||L;
    if(!p.getAttribute('stroke-dasharray')) p.style.strokeDashoffset=L;
    p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],
      {duration:900,delay:200+400*i,fill:'forwards',easing:'ease-out'});

  l1.animate([{opacity:0},{opacity:1}],{duration:340,delay:1000,fill:'forwards'});
  l2.animate([{opacity:0},{opacity:1}],{duration:340,delay:1400,fill:'forwards'});
}});

S({tag:'FOUR FAILURES', ov:'[[AI가 수치를 틀리는 네 가지 방식||Four ways AI gets a number wrong]]',

abbr:'[[<b>US600 · US460</b> NuScale 의 구·신 설계 명칭 — 각각 160 MWt · 250 MWt · <b>총발전(gross)</b> 발전기 단자 출력 · <b>송전단(net)</b> 소내 소비를 뺀 출력||<b>US600 / US460</b> NuScale’s earlier and later designs, 160 and 250 MWt · <b>gross</b> output at the generator terminals · <b>net</b> output after in-house consumption]]',
html:`<h2 class="t">[[네 가지 오류는 <em>잡는 법이 각각 다름</em> — 뭉뚱그리면 못 잡음||Each of the four is <em>caught differently</em> - lump them and you catch none]]</h2>
<ul class="b">

init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);

  const R=[
    ['var(--hot)',  TX('세대 혼동','Generation mix-up'),
      TX('같은 노형의 구·신 설계값을 섞는다','Mixes an older and newer design of the same reactor'),

    ['var(--amber)',TX('기준 혼동','Basis mix-up'),
      TX('모듈당과 발전소 전체, 총발전과 송전단을 섞는다','Mixes per-module with per-plant, gross with net'),

S({tag:'WHERE THE STEAM IS MADE', ov:'[[증기를 어디서 만드는가 — PWR과 BWR||Where the steam is made - PWR and BWR]]',

abbr:'[[<b>PWR</b> 가압경수로 · <b>BWR</b> 비등경수로 · <b>랭킨 사이클</b> 물을 끓여 증기로 터빈을 돌리는 열기관 순환 · <b>기수분리기</b> 증기와 물을 갈라 내는 장치||<b>PWR</b> Pressurized Water Reactor · <b>BWR</b> Boiling Water Reactor · <b>Rankine cycle</b> the steam power cycle · <b>steam separator</b> splits steam from water]]',
html:`<h2 class="t">[[갈라지는 지점은 <em>하나</em>뿐임 — 증기를 어디서 만드는가||They split on <em>one thing</em> - where the steam gets made]]</h2>

  <li>[[<b>BWR</b>은 노심에서 직접 끓여 그 증기를 터빈으로 보냄. 증기발생기가 없고 <b class="hot">터빈실도 방사선 구역</b>이 됨||A <b>BWR</b> boils in the core and sends that steam to the turbine. No steam generator - and <b class="hot">the turbine hall becomes a radiation area</b>]]</li>

init(el){

      G.appendChild(mk('path',{d:'M'+(ox+110)+',224 H'+(ox+170)+' V292 H'+(ox+110),fill:'none',

      G.appendChild(mk('path',{d:'M'+(ox+390)+',286 H'+(ox+284),fill:'none',stroke:'var(--cool)',

  loop(el.querySelector('#pb-bwr'), 610, TX('BWR — 노심에서 바로 만든다','BWR - made in the core'), 'var(--hot)', 0);

  if(RM) return;
  paths.forEach(p=>{ const L=p.getTotalLength(); flow(p,{n:6,color:p.getAttribute('stroke'),r:3.4,speed:0.2}); });
}});

S({tag:'CONTROL ROD DIRECTION', ov:'[[제어봉 삽입 방향 — 전원을 잃으면 어떻게 되는가||Control rod direction - what happens when power is lost]]',
src:'[[<b>출처</b> 본 교재 5.1.2절 표 5.1 · 9장 BWRX-300의 FMCRD를 볼 때 이 차이를 기억할 것||<b>Source</b> This textbook &#167;5.1.2, Table 5.1 · remember this when the BWRX-300 FMCRD comes up in ch. 9]]',

<ul class="b">

init(el){

          'Cut the power and they drop - cutting it is the action'));

src:'[[<b>출처</b> 본 교재 6.3절 · 구동수두 <code>Δp = (ρ<sub>c</sub> − ρ<sub>h</sub>) g H</code>가 유로 압력손실 <code>K ṁ² / 2ρA²</code>과 같아지는 곳에서 유량이 정해짐||<b>Source</b> This textbook &#167;6.3 · flow settles where the driving head <code>&#916;p = (&#961;<sub>c</sub> &#8722; &#961;<sub>h</sub>) g H</code> equals the loop loss <code>K &#7745;&#178; / 2&#961;A&#178;</code>]]',
abbr:'[[<b>H</b> 열원(노심) 중심과 열침원(증기발생기) 중심 사이의 높이차 · <b>K</b> 유로 전체의 압력손실 계수 · <b>ρ<sub>c</sub> · ρ<sub>h</sub></b> 찬 쪽과 더운 쪽의 밀도||<b>H</b> height between the centre of the core and the centre of the steam generator · <b>K</b> total loop loss coefficient · <b>&#961;<sub>c</sub>, &#961;<sub>h</sub></b> cold-side and hot-side density]]',
html:`<h2 class="t">[[유량을 2배로 늘리려면 높이를 <em>4배</em>로 벌려야 함||To double the flow you must <em>quadruple</em> the height]]</h2>
<ul class="b">
  <li>[[펌프를 없애면 순환은 부력이 만듦. 유량이 <b class="cool">높이차의 제곱근에 비례</b>함 — 이것이 가늘고 긴 형상의 이유임||Drop the pump and buoyancy drives the loop. Flow goes as <b class="cool">the square root of the height</b> - hence the long, slim shape]]</li>
  <li>[[압력손실 계수 <b>K</b>를 줄이는 일도 높이를 벌리는 일만큼 중요함 — <b class="ok">CFD가 실제로 쓰이는 지점</b>임||Cutting the loss coefficient <b>K</b> matters as much as adding height - <b class="ok">this is where CFD actually earns its keep</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 790 412" role="img" aria-label="[[높이차에 따라 자연순환 유량이 제곱근으로 늘어나는 곡선과 NuScale 모듈의 위치||Natural-circulation flow against height, rising as a square root, with the NuScale module marked]]">
    <g id="nh-plot"></g>
  </svg>
  </div>
  <div class="side">
    <div class="formula" style="font-size:18px;padding:4px 0">ṁ ∝ √( Δρ · H )</div>
    <div class="ctl"><label>[[높이차 H||Height H]] <span id="nh-hv">17.0 m</span></label>
      <input id="nh-h" type="range" min="2" max="30" value="17" step="0.5"></div>
    <div class="readout hi"><span class="k">[[상대 유량||Relative flow]]</span>
      <span class="v" id="nh-q">1.00 <small>&#215;</small></span></div>
    <div class="readout"><span class="k">[[같은 유량에 필요한 높이||Height for the same flow]]</span>
      <span class="v" id="nh-n" style="font-size:20px">[[기준||reference]]</span></div>
    <blockquote class="q" style="font-size:15px;padding:10px 14px">[[모듈이 직경 4.6 m 에 높이 23 m — 가늘고 긴 이유가 여기 있음.
      <b>펌프를 없앤 대가를 형상으로 치른 것</b>임.||The module is 4.6 m across and 23 m tall. <b>The price of dropping the pump is paid in shape.</b>]]</blockquote>
  </div>
</div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#nh-plot');
  const X0=74, X1=756, Y0=336, Y1=36, HMAX=30;
  const X=h=>X0+h/HMAX*(X1-X0), Y=q=>Y0-q/1.4*(Y0-Y1);
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X1,y2:Y0,class:'axis'}));
  G.appendChild(mk('line',{x1:X0,y1:Y0,x2:X0,y2:Y1,class:'axis'}));
  for(let h=0;h<=HMAX;h+=5){
    G.appendChild(mk('line',{x1:X(h),y1:Y0,x2:X(h),y2:Y0+6,class:'axis'}));
    const e=mk('text',{x:X(h),y:Y0+24,'text-anchor':'middle',class:'lbl'});
    e.textContent=String(h); G.appendChild(e);
  }
  [0.5,1.0].forEach(q=>{
    G.appendChild(mk('line',{x1:X0,y1:Y(q),x2:X1,y2:Y(q),class:'grid'}));
    const e=mk('text',{x:X0-10,y:Y(q)+4,'text-anchor':'end',class:'lbl'});
    e.textContent=q.toFixed(1)+'×'; G.appendChild(e);
  });
  G.appendChild(mk('text',{x:X1,y:Y0+50,'text-anchor':'end',class:'lbl'}))
   .textContent=TX('열원과 열침원의 높이차 H (m)','height between core and steam generator, H (m)');
  const pts=[]; for(let i=0;i<=60;i++){ const h=HMAX*i/60; pts.push([X(h),Y(Math.sqrt(h/17))]); }
  const cv=mk('polyline',{points:poly(pts),fill:'none',stroke:'var(--cool)','stroke-width':2.6});
  G.appendChild(cv);
  /* 기준점 — NuScale 모듈 */
  G.appendChild(mk('circle',{cx:X(17),cy:Y(1),r:6,fill:'var(--ok)'}));
  G.appendChild(mk('text',{x:X(17)+14,y:Y(1)-12,'font-family':'var(--sans)','font-size':16,
    fill:'var(--ok)','font-weight':500})).textContent=TX('NuScale 모듈 — 높이 23 m 급','NuScale module - 23 m class');
  const gl=mk('line',{x1:X(17),y1:Y0,x2:X(17),y2:Y(1),stroke:'var(--ok)','stroke-width':1,
    'stroke-dasharray':'3 4'}); G.appendChild(gl);
  const dot=mk('circle',{cx:X(17),cy:Y(1),r:8,fill:'none',stroke:'var(--cool)','stroke-width':2.4});
  G.appendChild(dot);
  const drop=mk('line',{x1:X(17),y1:Y0,x2:X(17),y2:Y(1),stroke:'var(--cool)','stroke-width':1.4});
  G.appendChild(drop);

  const h=el.querySelector('#nh-h'), hv=el.querySelector('#nh-hv'),
        q=el.querySelector('#nh-q'), n=el.querySelector('#nh-n');
  function upd(){
    const H=+h.value, Q=Math.sqrt(H/17);
    hv.textContent=fmt(H,1)+' m';
    q.innerHTML=fmt(Q,2)+' <small>&#215;</small>';
    dot.setAttribute('cx',X(H)); dot.setAttribute('cy',Y(Q));
    drop.setAttribute('x1',X(H)); drop.setAttribute('x2',X(H)); drop.setAttribute('y2',Y(Q));
    n.innerHTML = fmt(17*Q*Q,1)+' <small>m</small>';
  }
  h.oninput=upd; upd();
  if(RM) return;
  const L=cv.getTotalLength(); cv.style.strokeDasharray=L; cv.style.strokeDashoffset=L;
  cv.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,delay:200,fill:'forwards'});
}});

S({tag:'THREE FLOW MODES', ov:'[[하나의 용기 안에서 유로가 세 번 바뀐다||Three flow paths in one vessel]]',
src:'[[<b>출처</b> 본 교재 6.4절 그림 6.4 · 6.5 · (A) 정상운전 자연순환 (B) 잔열제거계통 (C) 비상노심냉각계통||<b>Source</b> This textbook &#167;6.4, Figs. 6.4-6.5 · (A) normal natural circulation, (B) DHRS, (C) ECCS]]',
abbr:'[[<b>DHRS</b> 잔열제거계통 — 2차측에서 도는 닫힌 고리 · <b>ECCS</b> 비상노심냉각계통 · <b>RVV</b> 원자로 배기밸브 · <b>RRV</b> 원자로 재순환밸브||<b>DHRS</b> Decay Heat Removal System, a closed loop on the secondary side · <b>ECCS</b> Emergency Core Cooling System · <b>RVV</b> reactor vent valve · <b>RRV</b> reactor recirculation valve]]',
html:`<h2 class="t">[[안전 논리는 <em>유로가 세 번 바뀐다</em>는 것으로 요약됨||The safety logic in one line - <em>the flow path changes three times</em>]]</h2>

init(el){

    for(const k in at) e.setAttribute(k,at[k]); return e;};

  /* DHRS 응축기 — 격납 밖, 수조 안 */
  G.appendChild(mk('rect',{x:454,y:96,width:58,height:96,fill:'var(--panel)',stroke:'var(--ok)','stroke-width':1.4}));
  G.appendChild(mk('text',{x:483,y:210,'text-anchor':'middle',class:'lbl',fill:'var(--ok)'}))
   .textContent=TX('DHRS 응축기','DHRS condenser');

   .textContent=TX('원자로건물 수조','reactor building pool');
  /* 세 경로 */
  const pA=mk('path',{d:'M'+CX+',276 V140',fill:'none',stroke:'none'});
  const pA2=mk('path',{d:'M'+(CX+62)+',140 V286',fill:'none',stroke:'none'});
  const pB=mk('path',{d:'M'+(CX+72)+',140 H454 M454,178 H'+(CX+72),fill:'none',stroke:'none'});
  const pC=mk('path',{d:'M'+CX+',70 H'+(CX+106)+' V330 H'+(CX+44),fill:'none',stroke:'none'});
  [pA,pA2,pB,pC].forEach(p=>G.appendChild(p));
  const vA =flow(pA ,{n:5,color:'var(--hot)', r:3.4,speed:0.13});
  const vA2=flow(pA2,{n:5,color:'var(--cool)',r:3.4,speed:0.13});
  const vB =flow(pB ,{n:6,color:'var(--ok)',  r:3.4,speed:0.16});
  const vC =flow(pC ,{n:7,color:'var(--hot-2)',r:3.6,speed:0.18});
  const rvv=mk('circle',{cx:CX,cy:70,r:7,fill:'var(--hot-2)',opacity:0});
  const rrv=mk('circle',{cx:CX+44,cy:330,r:7,fill:'var(--cool)',opacity:0});
  G.appendChild(rvv); G.appendChild(rrv);
  const k=el.querySelector('#nm-k'), v=el.querySelector('#nm-v'), out=el.querySelector('#nm-out');
  const M={
    a:['var(--cool)',TX('정상운전 · 자연순환','Normal &#183; natural circulation'),
       TX('노심에서 가열 → 상승관 → 가압기 배플판에서 방향 전환 → 증기발생기 셸측을 지나며 열을 넘김 → 하강관 → 노심. 펌프는 어디에도 없다.',
          'Heated in the core, up the riser, turned at the pressuriser baffle, down past the steam generator shell side, down the downcomer, back to the core. No pump anywhere.')],
    b:['var(--ok)',TX('과도 · DHRS','Transient &#183; DHRS'),
       TX('주증기·급수 격리밸브가 닫히고 DHRS 격리밸브가 열린다. 2차측에서만 도는 닫힌 고리다. 응축기가 수조에 잠겨 있어 응축수는 중력으로 돌아온다.',

    c:['var(--hot)',TX('사고 · ECCS','Accident &#183; ECCS'),
       TX('RVV 가 열려 증기를 격납으로 보낸다. 격납이 수조에 잠겨 있으므로 내벽에서 응축되고, 고인 물이 RRV 로 하강관에 돌아온다. 밖에서 물을 넣지 않는다.',

    v.textContent=M[mode][2];
  }
  ['a','b','c'].forEach(x=>el.querySelector('#nm-'+x).onclick=()=>set(x));
  set('a');
}});

html:`<h2 class="t">[[크기와 설계압력과 ECCS 방식이 <em>한 묶음</em>임||Size, design pressure and the ECCS approach are <em>one package</em>]]</h2>

  const bars=[];
  B.forEach((b,i)=>{
    const y=304+i*50;

html:`<h2 class="t">[[배관을 <s>없애는</s> 대신 <em>문제가 되기 전에 끊음</em>||Instead of <s>removing</s> the pipes, it <em>cuts them before they matter</em>]]</h2>

    [TX('대형 LOCA 대응','Large LOCA approach'),TX('배관 제거','pipes removed'),TX('배관 제거','pipes removed'),TX('격리밸브로 격리','isolated by valves')],
    [TX('잔열 제거','Decay heat removal'),'DHRS','PAFS',TX('ICS — 3계열 × 33 MW','ICS - 3 × 33 MW')],

    [TX('붕산','Soluble boron'),TX('사용','used'),TX('미사용','not used'),TX('사용 (BWR 방식)','used, BWR style')],

S({tag:'WHERE THEY STAND', ov:'[[인허가 경로 — 2026년 9월의 현재 위치||Licensing path - where each stands in September 2026]]',
src:'[[<b>출처</b> 본 교재 10.1절 그림 10.1 · <b>2026년 9월 기준</b> — 이 그림은 반년이면 낡음. 개정 시 우선 갱신할 것||<b>Source</b> This textbook &#167;10.1, Fig. 10.1 · <b>as of September 2026</b> - this figure ages within six months and is the first thing to revise]]',
abbr:'[[<b>사전협의</b> 신청 전에 규제기관과 쟁점을 미리 맞추는 단계 · <b>설계승인</b> 설계 자체를 심사해 받는 승인 · <b>건설허가</b> 특정 부지에 짓도록 받는 허가 · <b>FID</b> 최종투자결정||<b>pre-application</b> aligning issues with the regulator before filing · <b>design approval</b> approval of the design itself · <b>construction permit</b> permission to build at a named site · <b>FID</b> final investment decision]]',
html:`<h2 class="t">[[기술적 완성도와 배치 진척도는 <em>같은 축이 아님</em>||Technical maturity and deployment progress are <em>not the same axis</em>]]</h2>

<div class="body"><div class="fig">

  const G=el.querySelector('#ws-path');
  const ST=[TX('사전협의','pre-application'),TX('심사 중','under review'),TX('설계승인','design approval'),
            TX('최종투자결정','FID'),TX('건설허가','construction permit'),TX('건설 중','under construction')];
  const X0=130, X1=1030, dx=(X1-X0)/(ST.length-1);

  });
  const D=[
    ['NuScale','var(--cool)',3, TX('설계승인(2025-05, US460)을 끝내고 첫 사업의 최종투자결정까지 갔다. 다만 조건부다.',
        'Design approval done (US460, May 2025), and a conditional FID on the first project.')],
    ['i-SMR','var(--ok)',1, TX('2026-02 표준설계인가를 신청해 심사 초기다. 서류 보완 13건, 검증시험 결과 제출은 2028-06 목표다.',
        'Applied February 2026, early in review. 13 items to complete; test results due June 2028.')],
    ['BWRX-300','var(--amber)',5, TX('캐나다에서 건설허가를 받아 실제 공사 단계에 있다. 세 노형 중 가장 앞서 있다.',
        'Holds a construction licence in Canada and is physically building - furthest along.')]
  ];
  const gs=[], bars=[];
  D.forEach((d,i)=>{

    const r=mk('rect',{x:X0-26,y:y,width:'0',height:34,fill:d[1],opacity:0.30});

    const c=mk('circle',{cx:X0+d[2]*dx,cy:y+17,r:9,fill:d[1],opacity:0});
    G.appendChild(c); gs.push(c);

   .textContent=TX('붉은 점이 2026년 9월의 위치','the marks are where each stood in September 2026');

  D.forEach((d,i)=>{
    const g=mk('g',{transform:'translate('+(i*374)+',312)',opacity:0});

    g.appendChild(mk('rect',{width:352,height:3,fill:d[1]}));

      'font-weight':600}); n.textContent=d[0]; g.appendChild(n);
    wrapT(d[3],20).slice(0,3).forEach((ln,j)=>{
      const t=mk('text',{x:22,y:60+j*22,'font-family':'var(--sans)','font-size':15.5,
        fill:'var(--ink-2)','font-weight':300}); t.textContent=ln; g.appendChild(t); });
    G.appendChild(g); gs.push(g);
  });
  if(RM){ bars.forEach(b=>b[0].setAttribute('width',b[1]));
          gs.forEach(g=>g.setAttribute('opacity',1)); return; }
  bars.forEach((b,i)=>b[0].animate([{width:'0px'},{width:b[1]+'px'}],
    {duration:700,delay:150*i,fill:'forwards',easing:'cubic-bezier(.2,.7,.3,1)'}));
  gs.forEach((g,i)=>g.animate([{opacity:0},{opacity:1}],{duration:340,delay:700+130*i,fill:'forwards'}));

S({tag:'ONE PROBLEM, THREE ANSWERS', ov:'[[같은 문제를 어떻게 다르게 풀었나||How they solved the same problem differently]]',
src:'[[<b>출처</b> 본 교재 10.2절 표 10.1 · 읽어야 할 것은 답의 목록이 아니라 <b>답들 사이의 연결</b>임||<b>Source</b> This textbook &#167;10.2, Table 10.1 · what matters is not the list of answers but <b>the links between them</b>]]',
html:`<h2 class="t">[[설계 하나를 바꾸면 <em>세 개가 따라 움직임</em>||Change one choice and <em>three others move with it</em>]]</h2>
<ul class="b">
  <li>[[배관을 없애면 &#8594; 용기가 커지고 &#8594; 증기발생기를 안에 넣어야 하고 &#8594; 나선형을 쓰게 되고 &#8594; <b>출력이 용기 크기에 묶임</b>||Remove the pipes &#8594; the vessel grows &#8594; the SG must go inside &#8594; it becomes helical &#8594; <b>output is tied to vessel size</b>]]</li>
  <li>[[붕산을 없애면 &#8594; CVCS가 단순해지고 &#8594; 정지여유도 부담이 커지고 &#8594; <b class="amb">GDC 26의 두 번째 계통을 따로 설명해야 함</b>||Remove the boron &#8594; the CVCS simplifies &#8594; shutdown margin gets harder &#8594; <b class="amb">GDC 26&#8217;s second system needs its own answer</b>]]</li>
</ul>

  <g id="op-tab"></g>
</svg>
</div></div>`,
init(el){
  const NS='http://www.w3.org/2000/svg', mk=(t,at)=>{const e=document.createElementNS(NS,t);
    for(const k in at) e.setAttribute(k,at[k]); return e;};
  const G=el.querySelector('#op-tab');
  const Q=[
    [TX('대형 LOCA 를 어떻게 할 것인가','What about the large LOCA?'),
     TX('배관을 없앤다','remove the pipes'),TX('배관을 없앤다','remove the pipes'),
     TX('배관을 남기고 격리한다','keep them, isolate them')],
    [TX('냉각재를 무엇이 미는가','What pushes the coolant?'),
     TX('높이차 (자연순환)','height difference'),TX('펌프 4대','four pumps'),
     TX('기포 부력 (자연순환)','void buoyancy')],
    [TX('잔열을 어디에 버리는가','Where does the decay heat go?'),
     TX('수조 → 공기','pool → air'),TX('냉각수조','cooling tank'),TX('IC 수조','IC pool')],
    [TX('정지 후 반응도를 어떻게 잡는가','How is reactivity held after trip?'),
     TX('제어봉 + 붕산','rods + boric acid'),TX('제어봉 + 가연성흡수체','rods + burnable absorbers'),
     TX('제어봉 + 붕산','rods + boric acid')]
  ];
  const X=[0,392,632,872], COL=['var(--ink-3)','var(--cool)','var(--ok)','var(--amber)'];
  [[TX('네 가지 문제','The four problems'),0],['NuScale',392],['i-SMR',632],['BWRX-300',872]]
    .forEach((h,i)=>{
      const t=mk('text',{x:h[1],y:16,class:'lbl',fill:COL[i]}); t.textContent=h[0]; G.appendChild(t);
    });
  G.appendChild(mk('line',{x1:0,y1:26,x2:1100,y2:26,stroke:'var(--rule)'}));
  const gs=[];
  Q.forEach((q,i)=>{
    const y=44+i*62, g=mk('g',{opacity:0});
    wrapT(q[0],24).forEach((ln,j)=>{
      const k=mk('text',{x:0,y:y+(wrapT(q[0],24).length>1?18:28)+j*22,'font-family':'var(--sans)',
        'font-size':17,fill:'var(--ink)','font-weight':400}); k.textContent=ln; g.appendChild(k); });
    [1,2,3].forEach(c=>{
      wrapT(q[c],14).forEach((ln,j)=>{
        const v=mk('text',{x:X[c],y:y+(wrapT(q[c],14).length>1?18:28)+j*20,'font-family':'var(--sans)',
          'font-size':16,fill:COL[c],'font-weight':400}); v.textContent=ln; g.appendChild(v); });
    });
    g.appendChild(mk('line',{x1:0,y1:y+44,x2:1100,y2:y+44,stroke:'var(--rule)','stroke-opacity':0.6}));
    G.appendChild(g); gs.push(g);
  });
  /* 아래 — 세 개의 연쇄 */
  const CH=[['var(--cool)',TX('배관을 없애면','Remove the pipes'),
             [TX('용기가 커진다','the vessel grows'),TX('증기발생기를 안에','the SG goes inside'),
              TX('나선형을 쓴다','it becomes helical'),TX('출력이 용기에 묶인다','output is tied to the vessel')]],
            ['var(--ok)',TX('펌프를 없애면','Remove the pump'),

}});
