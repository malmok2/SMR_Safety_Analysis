    <g id="dd-lv"></g>
    <circle id="dd-tok" cx="416" cy="6" r="11" fill="var(--hot)"/>
    <text id="dd-toklbl" x="416" y="-8" class="lbl" [[fill="var(--hot)" text-anchor="middle">사고</text>||fill="var(--hot)" text-anchor="middle">Accident</text>]]
    <text id="dd-res" x="430" y="424" text-anchor="middle" font-family="var(--sans)" font-size="20"
          font-weight="600" fill="var(--ok)" opacity="0"></text>
  </svg>
  </div>
  <div class="side">
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn act" id="dd-n">[[정상 설계 — 재생||Sound design - replay]]</button>
      <button class="btn danger" id="dd-f">[[후쿠시마 — 공통원인 재생||Fukushima - common cause replay]]</button>
    </div>
    <blockquote class="q" style="border-left-color:var(--hot)">[[지진과 쓰나미라는 <b>하나의 사건</b>이 외부전원(Level 1~2 지원),
      비상디젤발전기(Level 3), 최종 열침원(Level 3~4)을 <b>동시에</b> 무력화했다.
      <span class="cite">→ 그래서 SMR은 전원을 필요로 하지 않는 계통을 강조한다</span>||<b>One event</b>, an earthquake and a tsunami, disabled offsite power (support for Levels 1-2),
      the emergency diesel generators (Level 3) and the ultimate heat sink (Levels 3-4) <b>at the same time</b>.
      <span class="cite">&#8594; hence the SMR emphasis on systems that need no electrical power</span>]]</blockquote>
  </div>
</div>`,
init(el){
  const LV=[['Level 1',TX('정상운전 이탈 예방','Prevent abnormal operation'),
     TX('보수적 설계 · 여유도 · 품질보증','Conservative design · margin · QA'),'var(--cool)'],
    ['Level 2',TX('이탈의 감지와 제어','Detect and control the departure'),
     TX('제어·감시계통 · 운전절차서','Control and monitoring · operating procedures'),'var(--cool)'],
    ['Level 3',TX('설계기준사고 제어','Control design basis accidents'),
     TX('공학적안전설비 (ESF)','Engineered safety features (ESF)'),'var(--ok)'],
    ['Level 4',TX('중대사고 완화','Mitigate severe accidents'),
     TX('중대사고 관리설비 · 격납 건전성','Severe accident equipment · containment integrity'),'var(--amber)'],
    ['Level 5',TX('소외 영향 완화','Mitigate offsite consequences'),
     TX('비상대응 · 방재계획','Emergency response · protective planning'),'var(--ink-3)']];
  const g=el.querySelector('#dd-lv');
  LV.forEach((l,i)=>{ const y=16+i*77;
    g.insertAdjacentHTML('beforeend',
      `<g data-l="${i}"><rect x="30" y="${y}" width="800" height="60" fill="var(--panel)" stroke="${l[3]}" stroke-width="${i===2?2:1.2}"/>`
      +`<text x="48" y="${y+36}" font-family="var(--mono)" font-size="15" fill="${l[3]}">${l[0]}</text>`
      +`<text x="140" y="${y+36}" font-family="var(--sans)" font-size="18" fill="var(--ink)">${l[1]}</text>`
      +`<text x="820" y="${y+36}" class="lbl" text-anchor="end">${l[2]}</text></g>`); });
  const tok=el.querySelector('#dd-tok'), tl=el.querySelector('#dd-toklbl'), res=el.querySelector('#dd-res');
  const rows=[...g.querySelectorAll('[data-l]')];
  let mode='n', T=0, run=false;
  function start(m){ mode=m; T=0; run=true; res.setAttribute('opacity',0);
    rows.forEach(r=>{ r.setAttribute('opacity',1);
      r.querySelector('rect').setAttribute('fill','var(--panel)'); });
    el.querySelector('#dd-n').classList.toggle('act',m==='n');
    el.querySelector('#dd-f').classList.toggle('act',m==='f'); }
  el.querySelector('#dd-n').onclick=()=>start('n');
  el.querySelector('#dd-f').onclick=()=>start('f');
  if(RM){ tok.setAttribute('cy',16+2*77+30); res.setAttribute('opacity',1);
    res.textContent=TX('Level 3 공학적안전설비에서 정지','Stopped at the Level 3 engineered safety features'); return; }
  start('n');
  raf(()=>{ if(!run) return; T+=1/60;
    const stopAt = mode==='n'? 2 : 4;
    if(mode==='f' && T>0.35){ [0,1,2,3].forEach(i=>{
      rows[i].setAttribute('opacity',0.32);
      rows[i].querySelector('rect').setAttribute('fill','var(--dead)'); }); }
    const yTarget = 16+stopAt*77+30;
    const y = Math.min(yTarget, -6 + T*190);
    tok.setAttribute('cy',y); tl.setAttribute('y',y-18);
    if(y>=yTarget-0.5){
      run=false;
      if(mode==='n'){ res.setAttribute('fill','var(--ok)');
        res.textContent=TX('Level 3 — 공학적안전설비가 사고를 설계기준 안에서 멈춘다',
                           'Level 3 - the engineered safety features hold the accident inside the design basis'); }
      else { res.setAttribute('fill','var(--hot)');
        res.textContent=TX('단계가 독립이 아니면, 다섯 겹도 한 겹이다',
                           'If the levels are not independent, five layers are one layer'); }
      res.setAttribute('opacity',1);
      const r=rows[stopAt].querySelector('rect');
      r.animate([{strokeWidth:2},{strokeWidth:5},{strokeWidth:2}],{duration:700,iterations:2});
    }
  });
}});
</script>
<script>
S({tag:'SINGLE FAILURE', ov:'[[단일고장기준 — 원문과 세 가지 함정||Single failure criterion - the text and three traps]]',
src:'[[<b>출처</b> 10 CFR Part 50, Appendix A, “Definitions and Explanations” (eCFR 원문 확인) · IAEA SSR-2/1 (Rev.1) Requirement 25||<b>Source</b> 10 CFR Part 50, Appendix A, &#8220;Definitions and Explanations&#8221; (verified against eCFR) · IAEA SSR-2/1 (Rev.1) Requirement 25]]',
html:`<h2 class="t">[[하나는 고장 났다고 <em>치고</em> 설계한다 — 단, 세 가지를 정확히||Design as if one thing <em>has already failed</em> - but get three points right]]</h2>
<div class="body">
  <div class="fig" style="justify-content:flex-start;padding-top:4px">
    <blockquote class="q" style="font-size:15.5px;line-height:1.55">
      “A single failure means an occurrence which results in the loss of capability of a component to perform its
      intended safety functions. <b>Multiple failures resulting from a single occurrence are considered to be a
      single failure.</b> Fluid and electric systems are considered to be designed against an assumed single failure
      if neither (1) a single failure of any <b>active</b> component (assuming passive components function properly)
      nor (2) a single failure of a <b>passive</b> component (assuming active components function properly),
      results in a loss of the capability of the system to perform its safety functions.”
      <span class="cite">10 CFR 50 Appendix A · Definitions and Explanations</span></blockquote>
  </div>
  <div class="side" style="width:420px">
    <div class="readout"><span class="k">[[함정 ①||Trap &#9312;]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[단일고장기준은 <b>GDC 본문이 아니라</b> 부록 서두의 <b class="amb">정의</b>에 있다. 조문 인용 시 가장 흔히 틀리는 지점.||The single failure criterion sits <b>not in the GDC themselves</b> but in the <b class="amb">definitions</b> at the head of the appendix. This is where citations most often go wrong.]]</div></div>
    <div class="readout"><span class="k">[[함정 ②||Trap &#9313;]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[능동 고장과 피동 고장을 <b class="cool">각각 따로</b> 가정한다. 둘을 <b>동시에</b> 가정하지 않는다.||An active failure and a passive failure are assumed <b class="cool">one at a time</b>. Never <b>both at once</b>.]]</div></div>
    <div class="readout"><span class="k">[[함정 ③||Trap &#9314;]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[하나의 사건에서 비롯된 다중 고장은 <b>단일 고장으로 센다</b>. 전원반 하나가 죽어 밸브 여럿이 멈춰도 단일 고장.||Multiple failures from one occurrence <b>count as a single failure</b>. One dead power panel stopping several valves is still one failure.]]</div></div>
    <div class="readout warn"><span class="k">[[아직 미정||Still open]]</span>
      <div style="font-size:16px;line-height:1.45;color:var(--ink);font-weight:300;margin-top:4px">
        [[유체계통 <b>피동 부품</b>의 단일고장 적용 조건은 원문에 <span class="mono hot">under development</span>로 남아 있다.
        피동계통에 기대는 SMR이 규제상 새 질문을 만드는 지점.||How the criterion applies to <b>passive components</b> in fluid systems is still marked <span class="mono hot">under development</span> in the text.
        This is where an SMR leaning on passive systems raises a genuinely new regulatory question.]]</div></div>
  </div>
</div>`});

S({tag:'PLANT STATES', ov:'[[플랜트 상태 — 빈도가 낮을수록 허용 결과가 느슨해진다||Plant states - rarer events, looser limits]]',
src:'[[<b>출처</b> IAEA SSR-2/1 (Rev.1) Requirement 19(설계기준사고)·Requirement 20(설계확장조건). 빈도 구간은 관례적 크기이며 규제·설계마다 경계가 다르다||<b>Source</b> IAEA SSR-2/1 (Rev.1) Requirement 19 (design basis accidents) and Requirement 20 (design extension conditions). The frequency bands are conventional magnitudes; the boundaries differ between regulators and designs]]',
html:`<h2 class="t">[[무엇에 대비하는가 — <em>빈도</em>가 <em>허용 결과</em>를 정한다||What you design against - <em>frequency</em> sets the <em>allowable outcome</em>]]</h2>
<ul class="b">
  <li>[[매년 일어날 수 있는 이탈에서 연료가 손상되면 안 되지만, 백만 년에 한 번은 <b>격납만 지키면</b> 된다||A transient that can happen every year must not damage fuel; for a once-in-a-million-year event it is enough to <b>keep containment intact</b>]]</li>
  <li>[[심층방어 단계 구분(앞 슬라이드)이 이 <b class="cool">빈도–결과 축</b>과 정확히 대응한다||The levels of defence in depth from the previous slide map exactly onto this <b class="cool">frequency-consequence axis</b>]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 395" role="img" aria-label="[[발생 빈도에 따른 플랜트 상태 구분과 각 구간에서 허용되는 결과||Plant states by frequency of occurrence and the outcome allowed in each band]]">
  <g id="ps-ax"></g><g id="ps-b"></g>
</svg>
</div></div>`,
init(el){
  const X=e=>120+(-e)/7*900;     // 10^0 .. 10^-7 /yr
  let ax='<line x1="120" y1="330" x2="1030" y2="330" class="axis"/>';
  for(let e=0;e>=-7;e--){ ax+=`<line x1="${X(e)}" y1="46" x2="${X(e)}" y2="330" class="grid"/>`
    +`<text x="${X(e)}" y="352" class="lbl" text-anchor="middle">10<tspan dy="-6" font-size="10">${e}</tspan></text>`; }
  ax+='<text x="1030" y="378" class="lbl" text-anchor="end">'
     +TX('발생 빈도 (1/년) — 오른쪽으로 갈수록 드묾','Frequency (per year) - rarer towards the right')+'</text>';
  el.querySelector('#ps-ax').innerHTML=ax;
  const B=[[TX('정상운전','Normal operation'),0,-2,'var(--ok)',
     TX('방사선 방출이 규제 한도 이내','Releases stay inside the regulatory limit'),296],
    [TX('예상운전과도 · AOO','Anticipated operational occurrence · AOO'),-2,-4,'var(--cool)',
     TX('연료설계한계 초과 금지 · 계통 손상 없음','No fuel design limit exceeded · no system damage'),224],
    [TX('설계기준사고 · DBA','Design basis accident · DBA'),-4,-6,'var(--amber)',
     TX('연료 일부 손상 허용 · 방사선 기준 만족','Some fuel damage allowed · dose criteria met'),152],
    [TX('설계확장조건 · DEC','Design extension condition · DEC'),-6,-7,'var(--hot)',
     TX('노심용융 포함 · 격납 건전성 유지','Core melt included · containment holds'),80]];
  const g=el.querySelector('#ps-b');
  B.forEach((b,i)=>{ const x0=X(b[1]),x1=X(b[2]),y=b[5];
    g.insertAdjacentHTML('beforeend',
      `<g data-p="${i}" opacity="0"><rect x="${x0}" y="${y}" width="${x1-x0}" height="${330-y}" fill="${b[3]}" opacity=".12"/>`
      +`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${b[3]}" stroke-width="2.5"/>`
      +`<text x="${(x0+x1)/2}" y="${y-26}" text-anchor="middle" font-family="var(--sans)" font-size="17" fill="${b[3]}" font-weight="500">${b[0]}</text>`
      +`<text x="${(x0+x1)/2}" y="${y-8}" text-anchor="middle" class="lbl">${b[4]}</text></g>`); });
  g.insertAdjacentHTML('beforeend',
    '<text x="120" y="34" class="lbl b">'+TX('↑ 허용되는 결과가 느슨해진다','↑ the allowable outcome loosens')+'</text>');
  const items=[...g.querySelectorAll('[data-p]')];
  if(RM){ items.forEach(i=>i.setAttribute('opacity',1)); return; }
  items.forEach((it,i)=>it.animate([{opacity:0},{opacity:1}],{duration:420,delay:220*i,fill:'forwards'}));
}});

S({tag:'GDC MAP', ov:'[[GDC 지도 — 요건이 계통을 부른다||A map of the GDC - requirements calling for systems]]',
src:'[[<b>출처</b> 10 CFR Part 50, Appendix A(eCFR·Cornell LII 확인). 국내 대응은 「원자로시설 등의 기술기준에 관한 규칙」 제20·23·24·29·30조||<b>Source</b> 10 CFR Part 50, Appendix A (verified against eCFR and Cornell LII). The Korean counterpart is the Rules on Technical Standards for Nuclear Reactor Facilities, Articles 20, 23, 24, 29 and 30]]',
html:`<h2 class="t">[[막히면 <em>GDC 원문</em>을 찾아 읽는 것이 가장 빠르다||When stuck, reading the <em>GDC text itself</em> is the fastest way out]]</h2>

[[<tr><th style="width:12%">분류</th><th style="width:9%">GDC</th><th style="width:34%">제목</th><th>요구의 핵심</th></tr>||<tr><th style="width:12%">Group</th><th style="width:9%">GDC</th><th style="width:34%">Title</th><th>What it demands</th></tr>]]
<tr>[[<td rowspan="4">설계 원칙</td>||<td rowspan="4">Design principles</td>]]<td class="n">2</td><td>Design Bases for Protection Against Natural Phenomena</td><td>[[부지 이력상 가장 심한 자연현상 + 여유도 + 복합효과||The most severe natural phenomena in the site history, plus margin, plus combined effects]]</td></tr>
<tr><td class="n">4</td><td>Environmental and Dynamic Effects Design Bases</td><td>[[파단 반력·비산물·제트 대응. 파단확률이 극히 낮으면 동적효과 배제 가능||Withstand break reaction, missiles and jets. Dynamic effects may be excluded where break probability is extremely low]]</td></tr>
<tr><td class="n">17</td><td>Electric Power Systems</td><td>[[물리적으로 독립된 외부전원 2회선 + 소내전원||Two physically independent offsite circuits plus onsite power]]</td></tr>
<tr><td class="n">23</td><td>Protection System Failure Modes</td><td>[[단선·전원상실 시 <b class="ok">안전한 상태로 실패(fail-safe)</b>||On a broken wire or loss of power, <b class="ok">fail into the safe state</b>]]</td></tr>
<tr class="mark">[[<td rowspan="2">반응도</td>||<td rowspan="2">Reactivity</td>]]<td class="n">26</td><td>Reactivity Control System Redundancy and Capability</td><td>[[<b>서로 다른 설계원리의 독립 2계통</b> · stuck rod 가정||<b>Two independent systems on different design principles</b> · stuck rod assumed]]</td></tr>
<tr class="mark"><td class="n">27</td><td>Combined Reactivity Control Systems Capability</td><td>[[ECCS 붕산과 조합해 냉각 가능 상태로 정지·유지||Combined with ECCS boron, bring to and hold a coolable shutdown state]]</td></tr>
<tr>[[<td rowspan="2">열 제거</td>||<td rowspan="2">Heat removal</td>]]<td class="n">34</td><td>Residual Heat Removal</td><td>[[소내전원만 / 소외전원만 <b>각각의 경우</b>에 단일고장 가정||Assume a single failure <b>in each case</b>: onsite power only, and offsite power only]]</td></tr>
<tr><td class="n">35</td><td>Emergency Core Cooling</td><td>[[LOCA 시 충분한 노심냉각 · 금속–물 반응 제한||Adequate core cooling during a LOCA and a limited metal-water reaction]]</td></tr>
<tr>[[<td rowspan="3">격납</td>||<td rowspan="3">Containment</td>]]<td class="n">16</td><td>Containment Design</td><td>[[“essentially leak-tight barrier” 제공||Provide an &#8220;essentially leak-tight barrier&#8221;]]</td></tr>
<tr><td class="n">38</td><td>Containment Heat Removal</td><td>[[사고 후 압력·온도를 신속히 낮추고 유지||Bring pressure and temperature down rapidly after an accident and hold them]]</td></tr>
<tr><td class="n">55·56·57</td><td>Containment Isolation Valves</td><td>[[관통 배관 격리밸브 <b>네 가지 배열</b> 중 하나 (9장)||One of <b>four isolation valve arrangements</b> on each penetrating line (Ch. 9)]]</td></tr>
</table>
</div>`});

S({bare:true, cls:'div', ov:'[[§05 공학적안전설비 (ESF)||&#167;05 Engineered safety features (ESF)]]',
html:`[[<div class="no">05</div><h2>공학적안전설비</h2><div class="ln"></div>
<p>ESF의 정의, 능동과 피동의 구분, 설계가 반드시 갖춰야 할 다섯 가지 성질.

S({tag:'PASSIVE CATEGORIES', ov:'[[피동 Category A~D — 어디까지가 피동인가||Passive Categories A-D - how passive is passive]]',
src:'[[<b>출처</b> IAEA-TECDOC-626, <i>Safety Related Terms for Advanced Nuclear Plants</i> (1991)||<b>Source</b> IAEA-TECDOC-626, <i>Safety Related Terms for Advanced Nuclear Plants</i> (1991)]]',
html:`<h2 class="t">[[“피동”은 <em>이분법이 아니다</em> — 네 등급으로 갈린다||&#8220;Passive&#8221; is <em>not a yes-or-no</em> - it splits into four grades]]</h2>
<ul class="b">
  <li>[[범주가 오른쪽으로 갈수록 <b class="hot">고장 가능성이 있는 요소</b>가 하나씩 늘어난다||Moving right through the categories adds <b class="hot">one more thing that can fail</b> at each step]]</li>
  <li>[[실제 SMR의 “피동 안전계통”은 대부분 <b>Category C 또는 D</b> — 피동이라고 고장 나지 않는 게 아니다||Most real SMR &#8220;passive safety systems&#8221; are <b>Category C or D</b> - passive does not mean it cannot fail]]</li>
</ul>
<div class="body"><div class="fig">
<svg viewBox="0 0 1120 396" role="img" aria-label="[[IAEA 피동안전계통 Category A부터 D까지의 구성 요소와 예시||Constituent elements and examples of IAEA passive safety system Categories A to D]]">
  <g id="pc-cols"></g>
  <text x="560" y="386" text-anchor="middle" class="lbl" fill="var(--hot)">[[← 완전한 피동 &nbsp;&nbsp;·&nbsp;&nbsp; 움직이는 부품과 개시 신호가 늘어난다 →||&#8592; fully passive &nbsp;&nbsp;·&nbsp;&nbsp; moving parts and actuation signals accumulate &#8594;]]</text>
</svg>
</div></div>`,
init(el){
  const C=[['Category A',[0,0,0],
     TX('연료피복재 · 압력경계\\n복사 · 전도 냉각','Fuel cladding · pressure boundary\\nRadiation and conduction'),'var(--ok)'],
    ['Category B',[1,0,0],
     TX('수조 침수 열교환기\\n자연순환 · 자연대류','Pool-submerged heat exchanger\\nNatural circulation and convection'),'var(--cool)'],
    ['Category C',[1,1,0],
     TX('축압기 + 체크밸브\\n안전방출밸브 · 파열판','Accumulator with check valve\\nSafety relief valve · rupture disc'),'var(--amber)'],
    ['Category D',[1,1,1],
     TX('중력구동 비상냉각\\n중력낙하 제어봉','Gravity-driven emergency cooling\\nGravity-drop control rods'),'var(--hot)']];
  const LAMP=[TX('작동유체 이동','Working fluid moves'),TX('기계 가동부','Moving mechanical part'),
              TX('개시 신호·저장에너지','Signal · stored energy')];
  const g=el.querySelector('#pc-cols');
  C.forEach((c,i)=>{ const x=40+i*272, w=248;
    let h=`<g data-c="${i}" opacity="0">`
      +`<rect x="${x}" y="24" width="${w}" height="336" fill="var(--panel)" stroke="${c[3]}" stroke-width="1.6"/>`
      +`<rect x="${x}" y="24" width="${w}" height="46" fill="${c[3]}"/>`
      +`<text x="${x+w/2}" y="56" text-anchor="middle" font-family="var(--mono)" font-size="17" fill="var(--on-accent)" font-weight="600">${c[0]}</text>`;
    c[1].forEach((on,j)=>{ const y=114+j*52;
      h+=`<circle cx="${x+26}" cy="${y}" r="7" fill="${on?c[3]:'none'}" stroke="${on?c[3]:'var(--rule)'}" stroke-width="1.6"/>`
        +`<text x="${x+44}" y="${y+5}" class="lbl" fill="${on?'var(--ink)':'var(--ink-3)'}">${LAMP[j]}</text>`; });
    h+=`<line x1="${x+18}" y1="278" x2="${x+w-18}" y2="278" stroke="var(--rule)"/>`;
    c[2].split('\\n').forEach((t,k)=>{
      h+=`<text x="${x+w/2}" y="${312+k*26}" text-anchor="middle" font-family="var(--sans)" font-size="16" fill="var(--ink-2)">${t}</text>`; });
    h+='</g>'; g.insertAdjacentHTML('beforeend',h);
    if(i<3) g.insertAdjacentHTML('beforeend',
      `<path d="M${x+w+6},192 L${x+w+18},192" stroke="var(--rule)" stroke-width="2"/>`);
  });
  const cols=[...g.querySelectorAll('[data-c]')];
  if(RM){ cols.forEach(c=>c.setAttribute('opacity',1)); return; }
  cols.forEach((c,i)=>c.animate([{opacity:0},{opacity:1}],{duration:400,delay:200*i,fill:'forwards'}));
}});

S({tag:'ESF DESIGN', ov:'[[ESF가 갖춰야 할 다섯 가지 성질||Five properties an ESF must have]]',
src:'[[<b>왼쪽 두 열</b> 2025-2학기 강의자료 「Safety Requirements for SMR」의 “Design Characteristics of ESF” 항목. <b>오른쪽 열</b>은 10 CFR 50 Appendix A 및 IAEA SSR-2/1 (Rev.1)에서 대응시킨 것||<b>The two left columns</b> follow the &#8220;Design Characteristics of ESF&#8221; items in the 2025 fall lecture notes <i>Safety Requirements for SMR</i>. <b>The right column</b> maps them onto 10 CFR 50 Appendix A and IAEA SSR-2/1 (Rev.1)]]',
html:`<h2 class="t">[[다섯 가지 성질은 <em>각각 조문</em>을 갖고 있다||Each of the five properties has <em>a rule behind it</em>]]</h2>
<ul class="b">
  <li>[[조문과 함께 외우면 실무에서 훨씬 쓸모 있음 — “왜 이렇게 만들었나”가 곧 “어느 조문 때문인가”||Learn them together with the rule and they become useful in practice - &#8220;why is it built this way&#8221; is &#8220;which rule demands it&#8221;]]</li>
</ul>
<div class="body">
  <div class="fig" style="justify-content:flex-start">
  <table class="d">
    [[<tr><th style="width:20%">성질</th><th style="width:44%">뜻</th><th>대응 요건</th></tr>||<tr><th style="width:20%">Property</th><th style="width:44%">What it means</th><th>Matching requirement</th></tr>]]
    <tr><td>[[다중성 Redundancy||Redundancy]]</td><td>[[개별 계열(train)이 각각 요구 기능을 만족할 충분한 용량||Each train on its own has enough capacity to meet the required function]]</td><td class="mono" style="font-size:13.5px">[[단일고장기준 · GDC 34·35·38||Single failure criterion · GDC 34·35·38]]</td></tr>
    <tr><td>[[다양성 Diversity||Diversity]]</td><td>[[서로 다른 원리·제작사·기술로 <b>공통원인고장</b>을 피함||Different principles, vendors or technologies, to escape <b>common cause failure</b>]]</td><td class="mono" style="font-size:13.5px">GDC 22 · GDC 26 · SSR-2/1 Req.24</td></tr>
    <tr><td>[[독립성 Independency||Independence]]</td><td>[[이중화된 계열이 물리적으로 분리되어 서로 영향 없음||Redundant trains are physically separated so one cannot affect the other]]</td><td class="mono" style="font-size:13.5px">GDC 22·24 · SSR-2/1 Req.21</td></tr>
    <tr class="mark"><td>[[Fail-safe 설계||Fail-safe design]]</td><td>[[실패했을 때의 결과가 <b>안전한 쪽</b>이 되도록 체계적으로||Arrange systematically so that failure lands on the <b>safe side</b>]]</td><td class="mono" style="font-size:13.5px">GDC 23 · SSR-2/1 Req.26</td></tr>
    <tr><td>[[인터록 Interlock||Interlock]]</td><td>[[정해진 조건에서만, 또는 조건이 성립하면 반드시 작동||Act only under defined conditions, or act without fail once they are met]]</td><td class="mono" style="font-size:13.5px">GDC 21·24</td></tr>
  </table>
  </div>
  <div class="side">
    <blockquote class="q" style="border-left-color:var(--ok)">
      [[<b>Fail-safe의 가장 좋은 예 — 제어봉.</b><br>
      전원이 끊기면 전자석이 풀리고 제어봉이 <b>중력으로</b> 떨어진다.
      “전원 상실”이라는 고장이 곧 “정지”라는 안전한 결과가 된다.<br><br>
      반대로 밀어 넣는 데 전기가 필요한 설계였다면 정전이 곧 <b class="hot">정지 불능</b>이다.
      <span class="cite">같은 부품, 반대의 논리</span>||<b>The clearest fail-safe there is: the control rod.</b><br>
      Cut the power and the electromagnet lets go, so the rod falls <b>under gravity</b>.
      The failure called &#8220;loss of power&#8221; <i>is</i> the safe outcome called &#8220;shutdown&#8221;.<br><br>
      Had the design needed electricity to push the rod in, a blackout would mean <b class="hot">no shutdown at all</b>.
      <span class="cite">Same part, opposite logic</span>]]</blockquote>
  </div>
</div>`});
</script>
<script>
SECT('06 · [[정지계통||Shutdown systems]]');
S({bare:true, cls:'div', ov:'[[§06 정지계통||&#167;06 Shutdown systems]]',
html:`[[<div class="no">06</div><h2>정지계통</h2><div class="ln"></div>

S({tag:'SCRAM', ov:'[[제어봉 낙하 — S-곡선과 stuck rod||Rod drop - the S-curve and the stuck rod]]',
src:'[[<b>계산</b> 코사인 중성자속 분포를 가정한 표준 S-곡선 <span class="mono">ρ(x)/ρ_total = x − sin(2πx)/2π</span> · stuck rod 영향 18 % 손실로 예시. 실제 값은 노심 설계·연소도에 따라 다르다||<b>Calculation</b> the standard S-curve for an assumed cosine flux shape, <span class="mono">ρ(x)/ρ_total = x − sin(2πx)/2π</span> · the stuck rod is shown as an 18 % loss. Real values depend on core design and burn-up]]',
html:`<h2 class="t">[[삽입 초기와 말기는 <s>효율이 낮다</s> — 그래서 낙하 시간이 요건이 된다||Inefficient at <s>both ends of the stroke</s> - hence a drop-time limit]]</h2>
<ul class="b">
  <li>[[중성자속이 높은 <b>노심 중앙부</b>를 지날 때 반응도가 급격히 들어감 — 곡선이 S자인 이유||Reactivity goes in fastest while the rod crosses the <b>high-flux centre</b> of the core - that is why the curve is S-shaped]]</li>
  <li>[[<b class="hot">GDC 26</b> — 최대 반응도가 봉 1개가 <b>삽입되지 않는다</b>는 가정에서도 요구 성능을 만족해야 함||<b class="hot">GDC 26</b> - the requirement must still be met assuming the single most reactive rod <b>fails to insert</b>]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 820 420" role="img" aria-label="[[제어봉이 노심에 떨어지면서 삽입 반응도가 S자 곡선을 그리는 모습과 stuck rod의 영향||Reactivity inserted as the rods fall into the core, tracing an S-curve, and the effect of a stuck rod]]">
    <rect x="20" y="66" width="215" height="290" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.5"/>
    <text x="127" y="52" text-anchor="middle" [[class="ttl">노심 단면</text>||class="ttl">Core cross-section</text>]]
    <g id="sc-rods"></g>
    <g id="sc-ax"></g>
    <path id="sc-a" d="" fill="none" stroke="var(--cool)" stroke-width="3"/>
    <path id="sc-b" d="" fill="none" stroke="var(--hot)" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle id="sc-pa" r="7" fill="var(--cool)"/>
    <text x="766" y="62" class="lbl b" text-anchor="end">[[전 제어봉 삽입||All rods inserted]]</text>
    <text x="766" y="150" class="lbl" fill="var(--hot)" text-anchor="end">[[최대 반응도가 1개 미삽입 (stuck rod)||Most reactive rod not inserted (stuck rod)]]</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout hi"><span class="k">[[낙하 경과||Time since release]]</span><span class="v" id="sc-t">0.0<small>[[초||s]]</small></span></div>
    <div class="readout warn"><span class="k">[[삽입 반응도 (전체 대비)||Reactivity inserted (of total)]]</span><span class="v" id="sc-r">0<small>%</small></span></div>
    <div class="btnrow" style="flex-direction:column;gap:7px">
      <button class="btn act" id="sc-go">[[원자로 트립 — 재생||Reactor trip - replay]]</button>
      <button class="btn" id="sc-stuck">[[stuck rod 가정 켜기||Assume a stuck rod]]</button>
    </div>
    <div class="src">[[전원이 끊기면 전자석이 풀려 <b>중력으로</b> 떨어진다 — GDC 23 fail-safe.||Cut the power, the magnet lets go and the rod falls <b>under gravity</b> - GDC 23 fail-safe.]]</div>
  </div>
</div>`,
init(el){
  const SV='http://www.w3.org/2000/svg';
  const X=x=>300+x*470, Y=r=>352-r*280;
  let ax='<line x1="300" y1="352" x2="780" y2="352" class="axis"/><line x1="300" y1="352" x2="300" y2="64" class="axis"/>';
  [0,25,50,75,100].forEach(p=>{ ax+=`<text x="${X(p/100)}" y="376" class="lbl" text-anchor="middle">${p}</text>`;
    ax+=`<line x1="${X(p/100)}" y1="352" x2="${X(p/100)}" y2="70" class="grid"/>`; });
  [0,50,100].forEach(p=>{ ax+=`<text x="292" y="${Y(p/100)+4}" class="lbl" text-anchor="end">${p} %</text>`; });
  ax+='<text x="780" y="402" class="lbl" text-anchor="end">'+TX('제어봉 삽입 분율 (%)','Rod insertion (%)')+'</text>'
     +'<text x="300" y="56" class="lbl">'+TX('삽입 반응도','Reactivity inserted')+'</text>';
  el.querySelector('#sc-ax').innerHTML=ax;
  const S=x=>x-Math.sin(2*Math.PI*x)/(2*Math.PI);
  let da='',db=''; for(let i=0;i<=100;i++){ const x=i/100;
    da+=(da?'L':'M')+X(x)+','+Y(S(x)); db+=(db?'L':'M')+X(x)+','+Y(S(x)*0.82); }
  el.querySelector('#sc-a').setAttribute('d',da); el.querySelector('#sc-b').setAttribute('d',db);
  const rg=el.querySelector('#sc-rods'); const rods=[];
  for(let i=0;i<5;i++){ const x=36+i*40;
    rg.insertAdjacentHTML('beforeend',
      `<rect x="${x}" y="70" width="26" height="282" fill="var(--panel-2)" opacity=".7"/>`);
    const r=document.createElementNS(SV,'rect');
    r.setAttribute('x',x);r.setAttribute('width',26);r.setAttribute('y',70);r.setAttribute('height',16);
    r.setAttribute('fill', i===2?'var(--hot)':'var(--cool)'); rg.appendChild(r); rods.push(r); }
  rg.insertAdjacentHTML('beforeend',                       // 패널 폭(215)에 맞춰 두 줄로
    '<text x="127" y="376" text-anchor="middle" class="lbl b">'+TX('제어봉 5개','Five rods')+'</text>'
   +'<text x="127" y="394" text-anchor="middle" class="lbl">'
    +TX('가운데가 최대 반응도가','the centre one is strongest')+'</text>');
  let T=0, run=true, stuck=false;
  const pa=el.querySelector('#sc-pa');
  el.querySelector('#sc-go').onclick=()=>{T=0;run=true;};
  el.querySelector('#sc-stuck').onclick=(e)=>{ stuck=!stuck; e.target.classList.toggle('act',stuck);
    e.target.textContent = stuck?TX('stuck rod 가정 끄기','Drop the stuck rod assumption')
                                 :TX('stuck rod 가정 켜기','Assume a stuck rod'); T=0; run=true; };
  if(RM){ rods.forEach(r=>r.setAttribute('height',282)); return; }
  raf(()=>{ if(!run) return; T+=1/60;
    const x=clamp(T/3.0,0,1);
    rods.forEach((r,i)=>{ const f=(stuck&&i===2)?0.12:x; r.setAttribute('height',16+266*f); });
    const rho=S(x)*(stuck?0.82:1);
    pa.setAttribute('cx',X(x));pa.setAttribute('cy',Y(rho));
    pa.setAttribute('fill',stuck?'var(--hot)':'var(--cool)');
    el.querySelector('#sc-t').innerHTML=Math.min(T,3).toFixed(1)+'<small>'+TX('초','s')+'</small>';
    el.querySelector('#sc-r').innerHTML=fmt(rho*100,0)+'<small>%</small>';
    if(T>3.4) run=false;
  });
}});

S({tag:'SHUTDOWN MARGIN', ov:'[[정지여유도 계산기||Shutdown margin calculator]]',
src:'[[<b>식</b> SDM = ρ<sub>rod,total</sub> − ρ<sub>stuck</sub> − ρ<sub>defect</sub> − ρ<sub>uncertainty</sub> · 요구 최소치는 설계별 기술지침서에서 정해지며 흔히 Δρ 기준 1 % 이상||<b>Equation</b> SDM = ρ<sub>rod,total</sub> − ρ<sub>stuck</sub> − ρ<sub>defect</sub> − ρ<sub>uncertainty</sub> · the minimum is set in each plant&#8217;s technical specifications, commonly at least 1 % Δρ]]',
html:`<h2 class="t">[[정지여유도 — <em>확보한 것에서 깎이는 것</em>을 뺀 나머지||Shutdown margin - <em>what you have</em> minus <em>what gets taken away</em>]]</h2>
<ul class="b">
  <li>[[냉각이 진행되면 감속재 밀도가 커져 반응도가 <b class="hot">양의 방향으로 되돌아온다</b>. 그 몫까지 미리 덮어야 함||As the plant cools the moderator gets denser and reactivity <b class="hot">comes back positive</b>. That much has to be covered in advance]]</li>
  <li>[[슬라이더를 움직여 각 항이 여유도를 어떻게 깎는지 확인 — 교재 연습문제 6.2의 조건이 기본값||Move the sliders to see how each term eats into the margin - the defaults are the conditions of Exercise 6.2 in the text]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 780 390" role="img" aria-label="[[정지여유도 계산 — 전 제어봉 반응도가에서 stuck rod, 냉각 되돌아옴, 불확실도를 뺀 나머지||Shutdown margin - total rod worth less the stuck rod, the cool-down return and the uncertainty allowance]]">
    <g id="sd-bars"></g>
    <line id="sd-req" x1="60" x2="660" stroke="var(--amber)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text id="sd-reqt" x="668" class="lbl" fill="var(--amber)" text-anchor="start">[[요구 ≥ 1 %||Required ≥ 1 %]]</text>
  </svg>
  </div>
  <div class="side">
    <div class="readout good" id="sd-box"><span class="k">[[정지여유도 SDM||Shutdown margin SDM]]</span><span class="v" id="sd-v">7.34<small>% Δρ</small></span></div>
    <div class="ctl">[[<label>전 제어봉 반응도가 <span||<label>Total rod worth <span]] id="sd-l0">12.0 %</span></label>
      <input type="range" id="sd-0" min="4" max="18" step="0.1" value="12"></div>
    <div class="ctl">[[<label>stuck rod 손실 <span||<label>Stuck rod loss <span]] id="sd-l1">18 %</span></label>
      <input type="range" id="sd-1" min="0" max="40" step="1" value="18"></div>
    <div class="ctl">[[<label>냉각 되돌아옴 ρ_defect <span||<label>Cool-down return ρ_defect <span]] id="sd-l2">2.0 %</span></label>
      <input type="range" id="sd-2" min="0" max="6" step="0.1" value="2"></div>
    <div class="ctl">[[<label>불확실도 여유 <span||<label>Uncertainty allowance <span]] id="sd-l3">0.5 %</span></label>
      <input type="range" id="sd-3" min="0" max="2" step="0.1" value="0.5"></div>
  </div>
</div>`,
init(el){
  const Y=v=>330-v/18*280;
  const g=el.querySelector('#sd-bars');
  const req=el.querySelector('#sd-req'), reqt=el.querySelector('#sd-reqt');
  req.setAttribute('y1',Y(1));req.setAttribute('y2',Y(1));reqt.setAttribute('y',Y(1)+4);
  function upd(){
    const t=+el.querySelector('#sd-0').value, s=+el.querySelector('#sd-1').value/100,
          d=+el.querySelector('#sd-2').value, u=+el.querySelector('#sd-3').value;
    const loss=t*s, sdm=t-loss-d-u;
    el.querySelector('#sd-l0').textContent=t.toFixed(1)+' %';
    el.querySelector('#sd-l1').textContent=Math.round(s*100)+' %';
    el.querySelector('#sd-l2').textContent=d.toFixed(1)+' %';
    el.querySelector('#sd-l3').textContent=u.toFixed(1)+' %';
    el.querySelector('#sd-v').innerHTML=sdm.toFixed(2)+'<small>% Δρ</small>';
    el.querySelector('#sd-box').className='readout '+(sdm>=1?'good':'warn');
    const seg=[[TX('확보 · 전 제어봉','Available · all rods'),t,'var(--cool)'],['− stuck rod',loss,'var(--hot)'],
      [TX('− 냉각 되돌아옴','− cool-down return'),d,'var(--hot)'],
      [TX('− 불확실도','− uncertainty'),u,'var(--hot)'],
      ['= SDM',Math.max(sdm,0),sdm>=1?'var(--ok)':'var(--hot)']];
    let h='<line x1="60" y1="330" x2="660" y2="330" class="axis"/>';
    seg.forEach((s2,i)=>{ const x=76+i*118, hh=Math.max(2,330-Y(s2[1]));
      h+=`<rect x="${x}" y="${330-hh}" width="72" height="${hh}" fill="${s2[2]}" opacity=".85"/>`
        +`<text x="${x+36}" y="${330-hh-12}" text-anchor="middle" class="val" font-size="16" fill="${s2[2]}">${s2[1].toFixed(1)}</text>`
        +`<text x="${x+36}" y="356" text-anchor="middle" class="lbl">${s2[0]}</text>`; });
    g.innerHTML=h;
  }
  [0,1,2,3].forEach(i=>el.querySelector('#sd-'+i).oninput=upd); upd();
}});

S({tag:'FEEDBACK', ov:'[[고유안전성 — 반응도 계수와 무붕산 설계||Inherent safety - reactivity coefficients and boron-free design]]',
src:'[[<b>대표 크기</b>이며 실제 값은 연소도·붕소 농도·노심 설계에 따라 크게 다르다. 정밀 값은 노심 설계 코드로 계산 · i-SMR 무붕산 운전: IAEA SMR Booklet 2022||<b>Representative magnitudes</b>; actual values vary widely with burn-up, boron concentration and core design, and are computed with core design codes · i-SMR boron-free operation: IAEA SMR Booklet 2022]]',
html:`<h2 class="t">[[신호보다 <em>먼저</em> 작동하는 것 — 노심 자체의 물리||What acts <em>before</em> any signal - the physics of the core itself]]</h2>
<ul class="b">
  <li>[[<b>도플러 계수</b> <code>−2~−4 pcm/K</code> — 연료 온도가 곧바로 반응, <b class="hot">즉각적</b>. 급격한 반응도 삽입의 1차 저지선||<b>Doppler coefficient</b> <code>−2 to −4 pcm/K</code> - the fuel temperature responds at once, <b class="hot">immediate</b>. The first line against a rapid reactivity insertion]]</li>
  <li>[[<b>감속재온도계수</b> <code>−10~−60 pcm/K</code> — 열이 냉각재로 전달된 뒤 작동, <b class="cool">지연</b>||<b>Moderator temperature coefficient</b> <code>−10 to −60 pcm/K</code> - acts only after the heat reaches the coolant, <b class="cool">delayed</b>]]</li>
  <li>[[붕소가 녹아 있으면 온도 상승 시 <b>흡수체도 함께 빠져나가</b> 음수 크기를 깎는다 → 무붕산 설계의 이점||With boron dissolved, a temperature rise <b>drives absorber out along with the water</b> and eats into that negative value &#8594; the case for a boron-free design]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 325" role="img" aria-label="[[온도 상승 시 도플러 되먹임이 먼저, 감속재 되먹임이 나중에 작동하는 시간 차이||The time gap between the Doppler feedback, which acts first, and the moderator feedback, which follows]]">
    <g id="fb-ax"></g>
    <path id="fb-d" d="" fill="none" stroke="var(--hot)" stroke-width="2.6"/>
    <path id="fb-m" d="" fill="none" stroke="var(--cool)" stroke-width="2.6"/>
    <text x="130" y="34" class="lbl b" fill="var(--hot)">[[도플러 — 즉각||Doppler - immediate]]</text>
    <text x="330" y="34" class="lbl b" fill="var(--cool)">[[감속재 — 지연||Moderator - delayed]]</text>
  </svg>
  </div>
  <div class="side">
    <blockquote class="q" style="border-left-color:var(--ok)">
      [[<b>무붕산 설계가 얻는 것</b><br>
      붕산 계통(저장·농도 조절·정화·배관)이 통째로 사라지고, 붕소 희석사고 시나리오도 사라진다.
      감속재온도계수가 전 주기에 걸쳐 확실히 음수로 유지된다.<br><br>
      <b class="hot">대신 지는 부담</b> — GDC 26이 요구하는 두 번째 독립 계통을 무엇으로 만족시킬 것인가.
      그리고 장주기 반응도 변화를 제어봉과 온도 되먹임만으로 흡수해야 한다.
      <span class="cite">i-SMR · KINS 심사의 쟁점</span>||<b>What a boron-free design gains</b><br>
      The whole boron system - storage, concentration control, purification, piping - goes,
      and the boron dilution accident goes with it. The moderator coefficient stays firmly negative all cycle.<br><br>
      <b class="hot">What it takes on</b>: what satisfies the second independent system GDC 26 demands,
      and how to absorb a whole cycle of reactivity on rods and feedback alone.
      <span class="cite">i-SMR · a focal point of the KINS review</span>]]</blockquote>

</div>`,
init(el){
  const X=t=>90+t/6*570, Y=r=>256-r*200;

     +'<text x="84" y="64" class="lbl" text-anchor="end">'+TX('음의','Negative')

  let dd='',dm=''; for(let i=0;i<=120;i++){ const t=i/20;
    dd+=(dd?'L':'M')+X(t)+','+Y(0.62*(1-Math.exp(-t/0.28)));
    dm+=(dm?'L':'M')+X(t)+','+Y(0.92*(1-Math.exp(-t/2.1))); }
  const D1=el.querySelector('#fb-d'), M1=el.querySelector('#fb-m');

  if(RM) return;

S({tag:'HEAT SINK', ov:'[[수조 시뮬레이션 — 72시간은 어디서 나온 숫자인가||Pool simulation - where the 72 hours comes from]]',
src:'[[<b>계산</b> Way–Wigner 붕괴열 적분(250 MWt, t₀ = 10⁸ s) · c_p = 4.18 kJ/(kg·K), h_fg = 2,257 kJ/kg, 초기 수온 30 °C. <b>열이 전부 수조로 들어간다고 본 상한 추정</b> — 실제로는 열교환기 성능 한계·성층화·외부 열손실이 작용한다||<b>Calculation</b> Way-Wigner decay heat integrated (250 MWt, t₀ = 10⁸ s) · c_p = 4.18 kJ/(kg·K), h_fg = 2,257 kJ/kg, initial water temperature 30 °C. <b>A bounding estimate that sends all the heat into the pool</b> - in reality heat exchanger capacity, stratification and heat loss all intervene]]',
html:`<h2 class="t">[[“72시간 무조작”은 마법이 아니라 <em>물통 크기를 정하는 계산</em>이다||&#8220;72 hours&#8221; is not magic - it is <em>what sizes the tank</em>]]</h2>
<ul class="b">
  <li>[[정지 후 72시간 누적 붕괴 에너지는 <code>약 315 GJ</code> — 현열만으로 받으려면 물 <b class="cool">약 1,000 t</b>||The decay energy accumulated in 72 hours is <code>about 315 GJ</code> - taking it on sensible heat alone needs <b class="cool">about 1,000 t</b> of water]]</li>
  <li>[[잠열이 현열의 <b>약 8배</b>. 끓기 시작한 뒤에도 한참을 더 버틴다 — 대신 증기 배출과 보충수가 새 설계 문제||Latent heat is <b>about eight times</b> the sensible heat, so it holds out far longer once boiling starts - at the price of a new design problem: venting the steam and making up the water]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 310" role="img" aria-label="[[붕괴열을 받는 수조의 온도가 오르고 끓어 증발하는 과정을 수조 체적별로 보여주는 시뮬레이션||A pool taking decay heat: how it warms, boils and evaporates for a given pool volume]]">
    <rect x="60" y="40" width="170" height="240" fill="none" stroke="var(--cool)" stroke-width="1.6"/>
    <rect id="hs-w" x="63" y="43" width="164" height="234" fill="var(--cool)" opacity=".28"/>
    <g id="hs-bub"></g>
    <text x="145" y="30" text-anchor="middle" [[class="ttl">수조</text>||class="ttl">Pool</text>]]
    <rect x="106" y="200" width="78" height="64" rx="3" fill="var(--hot)"/>
    <text x="145" y="238" text-anchor="middle" font-size="13" fill="#fff" font-family="var(--sans)">[[노심 250 MWt||Core 250 MWt]]</text>
    <g id="hs-ax"></g>
    <polyline id="hs-c" points="" fill="none" stroke="var(--cool)" stroke-width="2.6"/>
    <line id="hs-72" y1="52" y2="256" stroke="var(--amber)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text id="hs-72t" y="44" class="lbl" fill="var(--amber)" text-anchor="middle">72 h</text>
    <circle id="hs-p" r="6" fill="var(--hot)"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout"><span class="k">[[경과 시간||Elapsed time]]</span><span class="v" id="hs-t">0<small>[[시간||h]]</small></span></div>
    <div class="readout hi"><span class="k">[[수조 온도||Pool temperature]]</span><span class="v" id="hs-T">30<small>°C</small></span></div>
    <div class="readout good" id="hs-box"><span class="k">[[남은 물||Water remaining]]</span><span class="v" id="hs-m">100<small>%</small></span></div>
    <div class="ctl">[[<label>수조 체적 <span||<label>Pool volume <span]] id="hs-vs">1,000 m³</span></label>
      <input type="range" id="hs-v" min="200" max="4000" step="100" value="1000"></div>
  </div>
</div>`,
init(el){
  /* 붕괴 에너지 누적 (0 ~ 1000 h) */
  const N=1400, ts=[], Es=[]; let E=0, tp=0;
  for(let i=0;i<=N;i++){ const t=Math.pow(10,i/N*Math.log10(3.6e6));
    E+= (t-tp)*0.5*(decay(t)+decay(Math.max(tp,1)))*250e6; ts.push(t); Es.push(E); tp=t; }
  const Eat=h=>{ const t=h*3600; if(t<=1) return 0;
    let lo=0,hi=N; while(hi-lo>1){const m=(lo+hi)>>1; if(ts[m]<t)lo=m;else hi=m;}
    return lerp(Es[lo],Es[hi],(t-ts[lo])/(ts[hi]-ts[lo])); };
  const X=h=>300+h/400*360, Y=T=>256-(T-20)/90*204;
  let ax='<line x1="300" y1="256" x2="666" y2="256" class="axis"/><line x1="300" y1="256" x2="300" y2="48" class="axis"/>';
  [0,100,200,300,400].forEach(h=>ax+=`<text x="${X(h)}" y="278" class="lbl" text-anchor="middle">${h}</text>`);
  [30,60,100].forEach(T=>{ ax+=`<line x1="300" y1="${Y(T)}" x2="666" y2="${Y(T)}" class="grid"/>`
    +`<text x="294" y="${Y(T)+4}" class="lbl" text-anchor="end">${T} °C</text>`; });
  ax+='<text x="666" y="298" class="lbl" text-anchor="end">'+TX('경과시간 (시간)','Elapsed time (h)')+'</text>';
  el.querySelector('#hs-ax').innerHTML=ax;
  el.querySelector('#hs-72').setAttribute('x1',X(72));el.querySelector('#hs-72').setAttribute('x2',X(72));
  el.querySelector('#hs-72t').setAttribute('x',X(72));
  const SV='http://www.w3.org/2000/svg', bg=el.querySelector('#hs-bub'), bub=[];
  for(let i=0;i<16;i++){ const c=document.createElementNS(SV,'circle');
    c.setAttribute('r',2+Math.random()*2.6); c.setAttribute('fill','var(--bubble)'); c.setAttribute('opacity',0);
    c.dataset.x=70+Math.random()*150; c.dataset.p=Math.random(); bg.appendChild(c); bub.push(c); }
  const sl=el.querySelector('#hs-v'); let H=0;
  function state(h){
    const V=+sl.value, M=V*1000, Esen=M*4180*70, Elat=M*2.257e6, e=Eat(h);
    let T, frac;
    if(e<Esen){ T=30+70*e/Esen; frac=1; } else { T=100; frac=Math.max(0,1-(e-Esen)/Elat); }
    return {T,frac,V};
  }
  function draw(h){
    const s=state(h);
    const top=43+234*(1-s.frac);
    el.querySelector('#hs-w').setAttribute('y',top);
    el.querySelector('#hs-w').setAttribute('height',Math.max(2,277-top));
    const hot=(s.T-30)/70;
    el.querySelector('#hs-w').setAttribute('fill', hot>0.99?'var(--hot)':'var(--cool)');
    el.querySelector('#hs-w').setAttribute('opacity',0.22+0.22*hot);
    let pts=[]; for(let k=0;k<=80;k++){ const hh=Math.min(h,400*k/80); pts.push([X(hh),Y(state(hh).T)]); if(hh>=h) break; }
    el.querySelector('#hs-c').setAttribute('points',poly(pts));
    el.querySelector('#hs-p').setAttribute('cx',X(h));el.querySelector('#hs-p').setAttribute('cy',Y(s.T));
    el.querySelector('#hs-t').innerHTML=fmt(h,0)+'<small>'+TX('시간','h')+'</small>';
    el.querySelector('#hs-T').innerHTML=fmt(s.T,0)+'<small>°C</small>';
    el.querySelector('#hs-m').innerHTML=fmt(s.frac*100,0)+'<small>%</small>';
    el.querySelector('#hs-box').className='readout '+(s.frac>0.35?'good':(s.frac>0.05?'warn':'warn'));
    el.querySelector('#hs-vs').textContent=fmt(+sl.value)+' m³';
    bub.forEach((c,i)=>{ if(s.T<99.5){c.setAttribute('opacity',0);return;}
      const p=((H*0.5)+ +c.dataset.p)%1;
      c.setAttribute('cx',+c.dataset.x); c.setAttribute('cy',277-(277-top)*p);
      c.setAttribute('opacity',0.7*(1-p)); });
  }
  sl.oninput=()=>draw(H);
  if(RM){ H=200; draw(200); return; }
  raf(t=>{ H=(t*34)%420; draw(Math.min(H,400)); });
}});

S({tag:'GRACE PERIOD', ov:'[[대처시간 비교 — 무엇을 기준으로 센 값인가||Grace period compared - counted against what]]',
src:'[[<b>출처</b> K.H. Bae et al., <i>Nucl. Eng. Des.</i> <b>379</b> (2021) 111247 (SMART100) · IAEA SMR Booklet 2022 (i-SMR·BWRX-300·CAREM·NuScale) · NRC ADAMS ML15230A043 (AP1000). <b>모두 설계자 제시값</b>||<b>Source</b> K.H. Bae et al., <i>Nucl. Eng. Des.</i> <b>379</b> (2021) 111247 (SMART100) · IAEA SMR Booklet 2022 (i-SMR, BWRX-300, CAREM, NuScale) · NRC ADAMS ML15230A043 (AP1000). <b>All are vendor-stated values</b>]]',
html:`<h2 class="t">[[“72시간”이 설계마다 <s>다른 것을 뜻한다</s>||&#8220;72 hours&#8221; <s>means different things</s> in different designs]]</h2>

  <li>[[세 정의가 주는 숫자는 서로 크게 다르다 — 비교할 때 <b class="hot">반드시 정의를 확인</b>||The three definitions give very different numbers - when comparing, <b class="hot">always check which one is meant</b>]]</li>

<tr><td>AP1000</td><td>PRHR HX + PCCS</td><td>[[IRWST 침수 C자형 열교환기 + 외벽 살수||A C-shaped heat exchanger submerged in the IRWST plus external shell spray]]</td><td class="n">[[PCCWST <b>72 h</b> 배수||PCCWST drains over <b>72 h</b>]]</td></tr>
<tr><td>CAREM-25</td><td>[[PRHRS · 2계열||PRHRS · 2 trains]]</td><td>[[수평 U-튜브 응축기||Horizontal U-tube condenser]]</td><td class="n">[[2계열 중 1계열로 <b>36 h</b>||<b>36 h</b> on one of the two trains]]</td></tr>
<tr><td>NuScale NPM</td><td>[[DHRS · 2계열 (각 100 %)||DHRS · 2 trains (100 % each)]]</td><td>[[2상 자연순환 폐루프, 응축기 수조 침수||A two-phase natural circulation closed loop with the condenser submerged in the pool]]</td><td class="n">[[원자로 수조로 장기 제열||Long-term heat removal into the reactor pool]]</td></tr>
</table>
</div>`});

S({tag:'10 CFR 50.46', ov:'[[ECCS 허용기준 — 다섯 개의 합격선||ECCS acceptance criteria - five pass marks]]',
src:'[[<b>출처</b> 10 CFR 50.46 (최종 개정 2007-08-28, 72 FR 49494) eCFR 원문. <b>유의</b> 성능기반 대체기준 50.46c는 2024-04 위원회 반려로 <b>2026년 현재 미제정</b>이며, 50.46a는 ECCS가 아니라 <b>원자로냉각재계통 배기계통</b> 조문이다||<b>Source</b> 10 CFR 50.46 (last amended 2007-08-28, 72 FR 49494), eCFR text. <b>Note</b> the performance-based alternative 50.46c was remanded by the Commission in April 2024 and is <b>still not issued as of 2026</b>; 50.46a is not about ECCS at all but about the <b>reactor coolant system venting</b>]]',
html:`<h2 class="t">[[인허가 안전해석의 <em>합격선</em> — 정확히 외울 값||The <em>pass mark</em> for a licensing safety analysis - learn these exactly]]</h2>
<div class="body">
  <div class="fig" style="justify-content:flex-start">
  <table class="d">
    [[<tr><th style="width:12%">항</th><th style="width:36%">기준</th><th>수치</th></tr>||<tr><th style="width:12%">Clause</th><th style="width:36%">Criterion</th><th>Value</th></tr>]]
    <tr class="mark"><td class="mono">(b)(1)</td><td>[[최고 피복재 온도 (PCT)||Peak cladding temperature (PCT)]]</td><td class="n">[[<b>2,200 °F</b> (약 1,204 °C) 초과 금지||Shall not exceed <b>2,200 °F</b> (about 1,204 °C)]]</td></tr>
    <tr><td class="mono">(b)(2)</td><td>[[최대 국부 산화율||Maximum local oxidation]]</td><td class="n">[[산화 전 피복재 두께의 <b>0.17배</b>를 어디에서도 초과 금지||Nowhere more than <b>0.17 times</b> the pre-oxidation cladding thickness]]</td></tr>
    <tr><td class="mono">(b)(3)</td><td>[[총 수소 발생량||Total hydrogen generation]]</td><td class="n">[[전부 반응했을 때 가상 발생량의 <b>0.01배</b> 초과 금지||No more than <b>0.01 times</b> the hypothetical amount if all the cladding reacted]]</td></tr>
    <tr><td class="mono">(b)(4)</td><td>[[냉각 가능 형상||Coolable geometry]]</td><td>[[노심 형상 변화가 <b>냉각 가능한 상태</b>를 유지||Core geometry changes shall leave it <b>coolable</b>]]</td></tr>
    <tr>[[<td class="mono">(b)(5)</td><td>장기 냉각</td>||<td class="mono">(b)(5)</td><td>Long-term cooling</td>]]<td>[[초기 ECCS 성공 후에도 <b>장기간 붕괴열을 제거</b>||Decay heat shall be removed <b>for an extended period</b> after the initial ECCS success]]</td></tr>
  </table>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">[[왜 온도가 기준인가||Why temperature is the criterion]]</span>
      <div style="font-size:16px;line-height:1.5;color:var(--ink);font-weight:300;margin-top:6px">
        <span class="mono">Zr + 2H₂O → ZrO₂ + 2H₂ + Q</span><br><br>
        [[이 반응은 <b>발열</b>이다. 온도가 오르면 빨라지고, 반응열이 다시 온도를 올린다 —
        <b class="hot">양의 되먹임</b>.<br><br>
        1,204 °C는 그 폭주가 일어나지 않고 피복재가 급랭 시 부서지지 않을 연성을 유지하는 경계.
        부산물인 수소는 격납에서 폭발 위험이 되므로 (b)(3)이 총량을 묶는다 —
        <b class="cool">여기서 8장과 9장이 이어진다</b>.||The reaction is <b>exothermic</b>. The hotter it gets the faster it runs, and its own heat raises the temperature further -
        <b class="hot">positive feedback</b>.<br><br>
        1,204 °C is the line below which that runaway does not start and the cladding keeps enough ductility not to shatter on quench.
        The hydrogen it produces becomes an explosion hazard inside containment, so (b)(3) caps the total -
        <b class="cool">this is where Chapters 8 and 9 join up</b>.]]</div></div>
  </div>
</div>`});

S({tag:'PRESSURE TIERS', ov:'[[압력 계층 — 주입계통의 순차 인계||Pressure tiers - injection systems handing over]]',
src:'[[<b>개념도</b> 자체 작성. 압력 이력은 소형 파단의 전형적 형태 예시이며 특정 설계의 해석 결과가 아니다. 축압기 충전압 4.9 MPa(약 700 psig)는 AP1000 기준값 (NRC ADAMS ML15230A043)||<b>Schematic</b> drawn for this course. The pressure history is a typical small-break shape, not any design&#8217;s analysis. Accumulator charge 4.9 MPa (about 700 psig) is the AP1000 value (NRC ADAMS ML15230A043)]]',
html:`<h2 class="t">[[압력이 떨어지며 <em>차례로 인계</em>한다 — 하나로는 안 된다||As the pressure falls they <em>hand over in turn</em> - no single system can do it]]</h2>
<ul class="b">
  <li>[[사고 초기에는 압력이 높아 저압 펌프가 못 밀고, 나중에는 고압 계통의 유량이 부족함||Early on the pressure is too high for a low-pressure pump to push against; later the high-pressure system cannot deliver enough flow]]</li>
  <li>[[그래서 <b class="cool">압력 구간마다 다른 주입 수단</b>을 준비한다 — 이것이 ECCS의 기본 골격||So <b class="cool">each pressure band gets its own means of injection</b> - that is the skeleton of an ECCS]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 780 395" role="img" aria-label="[[냉각재상실사고 중 압력이 떨어지면서 고압주입, 축압기, 저압주입이 순차적으로 작동하는 영역||The bands in which high-pressure injection, the accumulator and low-pressure injection act as pressure falls during a loss of coolant accident]]">
    <g id="pt-band"></g><g id="pt-ax"></g>
    <path id="pt-c" d="" fill="none" stroke="var(--ink)" stroke-width="2.8"/>
    <circle id="pt-p" r="7" fill="var(--hot)"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">[[RCS 압력||RCS pressure]]</span><span class="v" id="pt-P">15.5<small>MPa</small></span></div>
    <div class="readout hi"><span class="k">[[지금 인계한 계통||System now in charge]]</span><span class="v" id="pt-S" style="font-size:21px">[[고압주입 · CMT||High-pressure injection · CMT]]</span></div>
    <div class="readout"><span class="k">[[사고 후 경과||Time since the accident]]</span><span class="v" id="pt-t">1<small>[[초||s]]</small></span></div>
    <div class="src">[[축압기는 밸브 조작 없이 <b>체크밸브만으로</b> 열린다 — Category C 피동.
      CMT는 RCS 전압력에서도 <b>중력</b>으로 흐른다.||The accumulator opens <b>on a check valve alone</b>, with no valve operation - Category C passive.
      The CMT flows <b>by gravity</b> even at full RCS pressure.]]</div>
  </div>
</div>`,
init(el){
  const X=t=>70+Math.log10(t)/4*660, Y=p=>340-p/16*292;
  const B=[[8,16,TX('고압안전주입 (HPSI) · CMT','High-pressure injection (HPSI) · CMT'),'var(--cool)'],
           [3.5,8,TX('축압기 (Accumulator)','Accumulator (Accumulator)'),'var(--amber)'],
           [0,3.5,TX('저압안전주입 (LPSI) · 중력 보충','Low-pressure injection (LPSI) · gravity make-up'),'var(--ok)']];
  let bh='';
  B.forEach(b=>{ bh+=`<rect x="70" y="${Y(b[1])}" width="660" height="${Y(b[0])-Y(b[1])}" fill="${b[3]}" opacity=".07"/>`
    +`<text x="82" y="${(Y(b[0])+Y(b[1]))/2+5}" class="lbl" fill="${b[3]}" font-size="13.5">${b[2]}</text>`; });
  bh+=`<line x1="70" y1="${Y(4.9)}" x2="730" y2="${Y(4.9)}" stroke="var(--hot)" stroke-width="1.2" stroke-dasharray="5 4"/>`
     +`<text x="726" y="${Y(4.9)-7}" class="lbl" fill="var(--hot)" text-anchor="end">${TX('축압기 질소 충전압 4.9 MPa','Accumulator nitrogen charge 4.9 MPa')}</text>`;
  el.querySelector('#pt-band').innerHTML=bh;
  let ax='<line x1="70" y1="340" x2="736" y2="340" class="axis"/><line x1="70" y1="340" x2="70" y2="40" class="axis"/>';
  [1,10,100,1000,10000].forEach(t=>ax+=`<text x="${X(t)}" y="364" class="lbl" text-anchor="middle">${t>=1000?fmt(t):t} s</text>`);
  [0,4,8,12,16].forEach(p=>ax+=`<text x="62" y="${Y(p)+4}" class="lbl" text-anchor="end">${p}</text>`);
  ax+='<text x="736" y="390" class="lbl" text-anchor="end">'+TX('사고 후 경과시간','Time since the accident')+'</text>'
     +'<text x="70" y="30" class="lbl">'+TX('RCS 압력 (MPa)','RCS pressure (MPa)')+'</text>';
  el.querySelector('#pt-ax').innerHTML=ax;
  const P=t=>15.5*Math.exp(-Math.pow(Math.log10(t)/1.55,2.2))+0.15;
  let d=''; for(let i=0;i<=200;i++){ const t=Math.pow(10,i/200*4); d+=(d?'L':'M')+X(t)+','+Y(P(t)); }
  el.querySelector('#pt-c').setAttribute('d',d);
  const pt=el.querySelector('#pt-p');
  function at(t){ const p=P(t);
    pt.setAttribute('cx',X(t));pt.setAttribute('cy',Y(p));
    el.querySelector('#pt-P').innerHTML=p.toFixed(1)+'<small>MPa</small>';
    el.querySelector('#pt-t').innerHTML=(t<1000?fmt(t,0):fmt(t/60,0))
      +'<small>'+(t<1000?TX('초','s'):TX('분','min'))+'</small>';
    const b=B.find(x=>p>=x[0]&&p<x[1])||B[2];
    el.querySelector('#pt-S').textContent=b[2].split(' (')[0];
    el.querySelector('#pt-S').parentNode.className='readout hi';
    pt.setAttribute('fill',b[3]);
  }
  if(RM){ at(300); return; }
  at(1); raf(t=>{ const u=(t%8)/8; at(Math.pow(10,u*4)); });
}});

S({tag:'NuScale ECCS', ov:'[[폐루프 — 물을 밖에서 넣지 않는다||A closed loop - no water added from outside]]',
src:'[[<b>개념도</b> 자체 작성. NuScale NPM의 ECCS는 RVV 3개 + RRV 2개로 구성되며 펌프·축압기가 없다 (IAEA SMR Booklet 2022). 8장·9장의 경계가 사라지는 지점||<b>Schematic</b> drawn for this course. The NuScale NPM ECCS is three RVVs and two RRVs, with no pump and no accumulator (IAEA SMR Booklet 2022). This is where the line between Chapters 8 and 9 disappears]]',
html:`<h2 class="t">[[잃은 물을 밖에서 넣는 대신 <em>가둬 두고 순환</em>시킨다||Instead of adding water, it <em>keeps it in and circulates</em>]]</h2>
<ul class="b">
  <li>[[① <b>RVV</b>를 열어 증기를 격납으로 방출 → ② 침수된 격납 벽면에서 <b class="cool">응축</b>, 열은 수조로 → ③ <b>RRV</b>로 응축수를 용기로 복귀||&#9312; open the <b>RVVs</b> and vent steam into containment &#8594; &#9313; it <b class="cool">condenses</b> on the submerged containment wall and the heat goes to the pool &#8594; &#9314; the <b>RRVs</b> return the condensate to the vessel]]</li>
  <li>[[수원이 계 밖에 없어도 순환이 유지되므로 <b class="ok">50.46(b)(5) 장기 냉각</b>이 성립한다||Circulation holds with no water source outside the system, which is how <b class="ok">50.46(b)(5) long-term cooling</b> is met]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 760 385" role="img" aria-label="[[NuScale ECCS의 폐루프 — 원자로 벤트밸브로 증기를 내보내고 격납 벽면에서 응축된 물을 재순환밸브로 되돌린다||The NuScale ECCS closed loop: steam out through the reactor vent valves, condensate off the containment wall and back through the recirculation valves]]">
    <rect x="120" y="40" width="520" height="310" fill="var(--cool)" opacity=".10" stroke="var(--cool)" stroke-width="1.4"/>
    <text x="380" y="30" text-anchor="middle" class="ttl">[[침수 격납용기 (CNV) · 정상운전 중 진공||Submerged containment vessel (CNV) · under vacuum in normal operation]]</text>
    <rect x="255" y="80" width="250" height="250" rx="22" fill="var(--panel)" stroke="var(--cool)" stroke-width="1.6"/>
    <text x="266" y="126" text-anchor="start" [[class="lbl b">원자로용기</text>||class="lbl b">Reactor vessel</text>]]
    <rect x="342" y="262" width="76" height="60" rx="3" fill="var(--hot)"/>
    <text x="380" y="300" text-anchor="middle" font-size="14" fill="#fff" [[font-family="var(--sans)">노심</text>||font-family="var(--sans)">Core</text>]]
    <path id="ec-r" d="M380,262 L380,104 L560,104 L560,318 L418,318" fill="none" stroke="var(--rule)" stroke-width="8"/>
    <path id="ec-l" d="M380,262 L380,104 L200,104 L200,318 L342,318" fill="none" stroke="var(--rule)" stroke-width="8"/>
    <rect x="356" y="74" width="14" height="14" fill="var(--ok)"/><rect x="390" y="74" width="14" height="14" fill="var(--ok)"/>
    <text x="380" y="64" text-anchor="middle" class="lbl" fill="var(--ok)">[[RVV · 증기 방출||RVV · steam release]]</text>
    <rect x="246" y="312" width="12" height="16" fill="var(--ok)"/><rect x="502" y="312" width="12" height="16" fill="var(--ok)"/>
    <text x="380" y="352" text-anchor="middle" class="lbl" fill="var(--ok)">[[RRV · 응축수 재순환||RRV · condensate recirculation]]</text>
    <g id="ec-drop"></g>
    <text x="132" y="70" class="lbl" [[fill="var(--cool)">벽면 응축</text>||fill="var(--cool)">Wall condensation</text>]]
    <text x="648" y="180" class="lbl" fill="var(--cool)" [[text-anchor="start">열은</text>||text-anchor="start">Heat to</text>]]
    <text x="648" y="200" class="lbl" fill="var(--cool)" [[text-anchor="start">수조로</text>||text-anchor="start">the pool</text>]]
    <path d="M642,170 L676,170 M642,212 L676,212" stroke="var(--cool)" stroke-width="2"/>
  </svg>
  </div>
  <div class="side">
    <div class="readout good"><span class="k">[[외부 수원||External water source]]</span><span class="v" style="font-size:22px">[[필요 없음||Not needed]]</span></div>
    <div class="readout"><span class="k">[[구동력||Driving force]]</span><span class="v" style="font-size:22px">[[응축 압력차||Condensation Δp]]</span></div>
    <blockquote class="q" style="border-left-color:var(--cool)">
      [[일체형 SMR에서 <b>안전주입계통과 격납계통은 사실상 하나의 계통</b>이다.
      나눠 배웠지만 실제 설계에서는 그 경계가 사라진다.
      <span class="cite">i-SMR의 EDV 3 + ERV 2도 같은 논리</span>||In an integral SMR the <b>safety injection system and the containment system are effectively one system</b>.
      We teach them apart, but in a real design the boundary is gone.
      <span class="cite">The i-SMR, with three EDVs and two ERVs, follows the same logic</span>]]</blockquote>
  </div>
</div>`,

S({tag:'CONTAINMENT PRESSURE', ov:'[[격납 압력 — 계산이 포화압에 막힌다||Containment pressure - the calculation hits saturation]]',
src:'[[<b>예제 조건</b> 자유체적 3,000 m³ · 초기 공기 1기압 20 °C · 평형 온도 150 °C · R_v = 461.5 J/(kg·K) · 150 °C 포화압 0.476 MPa. 이상기체 근사만으로는 답이 틀린다는 것을 보이기 위한 예제||<b>Worked example</b> free volume 3,000 m³ · initial air at 1 atm and 20 °C · equilibrium temperature 150 °C · R_v = 461.5 J/(kg·K) · saturation pressure at 150 °C is 0.476 MPa. The point of the example is that the ideal gas approximation alone gives the wrong answer]]',
html:`<h2 class="t">[[이상기체로 계산하면 <s>틀린다</s> — 초과분은 <em>응축</em>한다||Treat it as an ideal gas and you get it <s>wrong</s> - the excess <em>condenses</em>]]</h2>
<ul class="b">
  <li>[[계산된 증기 분압이 그 온도의 <b>포화압</b>을 넘으면 물리적으로 불가능 → 증기 일부가 액체가 됨||A computed steam partial pressure above the <b>saturation pressure</b> at that temperature is physically impossible &#8594; part of the steam turns liquid]]</li>
  <li>[[결국 <b class="cool">격납 압력은 증기 질량이 아니라 평형 온도가 결정</b>한다. 그래서 격납 해석의 핵심은 열 균형||In the end <b class="cool">containment pressure is set by the equilibrium temperature, not by the mass of steam</b>. Which is why containment analysis is really a heat balance]]</li>
</ul>
<div class="body">
  <div class="fig">
  <svg viewBox="0 0 700 355" role="img" aria-label="[[방출 증기 질량에 따른 격납 압력 — 이상기체 계산값과 포화압에 의해 제한된 실제 압력 비교||Containment pressure against the mass of steam released: the ideal gas figure beside the real pressure limited by saturation]]">
    <g id="cp-ax"></g>
    <rect id="cp-ideal" x="150" width="120" fill="var(--hot)" opacity=".6" stroke="var(--hot)" stroke-width="1.2"/>
    <rect id="cp-real" x="330" width="120" fill="var(--cool)" opacity=".8"/>
    <rect id="cp-air" x="330" width="120" fill="var(--ink-3)" opacity=".55"/>
    <line id="cp-sat" x1="110" x2="620" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text id="cp-satt" x="616" class="lbl" fill="var(--amber)" [[text-anchor="end">150 °C 포화압 0.476 MPa</text>||text-anchor="end">Saturation at 150 °C, 0.476 MPa</text>]]
    <text x="210" y="342" text-anchor="middle" class="lbl">[[이상기체 계산 (증기 분압)||Ideal gas · steam only]]</text>
    <text x="390" y="342" text-anchor="middle" class="lbl">[[실제 (포화 제한 + 공기)||Real · saturation + air]]</text>
    <text id="cp-msg" x="282" y="120" class="lbl" fill="var(--hot)" font-size="14.5"></text>
  </svg>
  </div>
  <div class="side">
    <div class="readout warn"><span class="k">[[이상기체 증기 분압||Ideal gas steam pressure]]</span><span class="v" id="cp-i">1.30<small>MPa</small></span></div>
    <div class="readout hi"><span class="k">[[실제 격납 압력||Real containment pressure]]</span><span class="v" id="cp-r">0.62<small>MPa</small></span></div>
    <div class="ctl">[[<label>방출 증기 질량 <span||<label>Steam released <span]] id="cp-ms">20 t</span></label>
      <input type="range" id="cp-m" min="1" max="40" step="0.5" value="20"></div>
    <div class="src">[[공기 분압은 온도만 보정 — 0.1013 × 423/293 = <b>0.146 MPa</b>.||The air partial pressure is corrected for temperature only: 0.1013 × 423/293 = <b>0.146 MPa</b>.]]</div>
  </div>
</div>`,
init(el){
  const Y=p=>300-p/1.5*258;
  let ax='<line x1="110" y1="300" x2="626" y2="300" class="axis"/>';
  [0,0.5,1.0,1.5].forEach(p=>{ ax+=`<line x1="110" y1="${Y(p)}" x2="626" y2="${Y(p)}" class="grid"/>`
    +`<text x="102" y="${Y(p)+4}" class="lbl" text-anchor="end">${p.toFixed(1)}</text>`; });
  ax+='<text x="110" y="30" class="lbl">'+TX('압력 (MPa)','Pressure (MPa)')+'</text>';
  el.querySelector('#cp-ax').innerHTML=ax;
  const sat=0.476, air=0.146;
  el.querySelector('#cp-sat').setAttribute('y1',Y(sat));el.querySelector('#cp-sat').setAttribute('y2',Y(sat));
  el.querySelector('#cp-satt').setAttribute('y',Y(sat)-8);
  const sl=el.querySelector('#cp-m');
  function upd(){
    const m=+sl.value*1000, pv=m*461.5*423/3000/1e6, real=air+Math.min(pv,sat);
    const I=el.querySelector('#cp-ideal'), R=el.querySelector('#cp-real'), A=el.querySelector('#cp-air');
    I.setAttribute('y',Y(Math.min(pv,1.5)));I.setAttribute('height',Math.max(1,300-Y(Math.min(pv,1.5))));
    A.setAttribute('y',Y(air));A.setAttribute('height',300-Y(air));
    R.setAttribute('y',Y(real));R.setAttribute('height',Y(air)-Y(real));
    el.querySelector('#cp-i').innerHTML=pv.toFixed(2)+'<small>MPa</small>';
    el.querySelector('#cp-r').innerHTML=real.toFixed(2)+'<small>MPa</small>';
    el.querySelector('#cp-ms').textContent=(+sl.value).toFixed(1)+' t';
    const msg=el.querySelector('#cp-msg');
    if(pv>sat){ msg.textContent=TX('← 초과분 ','← ')+((pv-sat)/pv*100).toFixed(0)
        +TX(' % 는 응축',' % of it condenses');
      msg.setAttribute('x',282); msg.setAttribute('y',Y(Math.min((pv+sat)/2,1.42))); } else msg.textContent='';
  }
  sl.oninput=upd; upd();
  if(RM) return;
  raf(t=>{ if(t>2.2) return; sl.value=(lerp(4,20,clamp(t/2,0,1))).toFixed(1); upd(); });
}});

  g.insertAdjacentHTML('beforeend',

S({tag:'CHECKLIST', ov:'[[마무리 — 네 줄 체크리스트||Closing - a four-line checklist]]',
src:'[[다음 단계: 5~8주차 계통코드. 이 네 질문에 답할 수 있으면 노드화의 요구사항이 이미 정해진 것이다||Next: system codes in weeks 5-8. Answer these four questions and the nodalisation requirements are already settled]]',
html:`<h2 class="t">[[설계 자료를 받았을 때 <em>이 네 줄</em>을 채울 수 있는가||Handed a design, can you fill in <em>these four lines</em>]]</h2>
<div class="body col">
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
    <div class="readout" style="border-left:3px solid var(--hot)">
      <span class="k">[[① 반응도 제어||&#9312; Reactivity control]]</span>
      <div style="font-size:19px;color:var(--ink);font-weight:300;margin-top:4px">
        [[반응도를 죽이는 <b>두 개의 독립 수단</b>은 무엇인가. stuck rod 가정에서도 정지여유도가 확보되는가||What are the <b>two independent means</b> of killing reactivity? Is the shutdown margin still there with a stuck rod assumed?]]</div></div>
    <div class="readout" style="border-left:3px solid var(--cool)">
      <span class="k">[[② 열 제거||&#9313; Heat removal]]</span>
      <div style="font-size:19px;color:var(--ink);font-weight:300;margin-top:4px">
        [[정지 후 붕괴열의 <b>최종 열침원</b>은 무엇인가. 무조작으로 며칠을 버티며, 그 며칠은 <b>무슨 계산</b>에서 나왔는가||What is the <b>ultimate heat sink</b> for decay heat after shutdown? How many days without action, and <b>from what calculation</b> does that number come?]]</div></div>
    <div class="readout" style="border-left:3px solid var(--cool)">
      <span class="k">[[③ 냉각재 보충||&#9314; Coolant make-up]]</span>
      <div style="font-size:19px;color:var(--ink);font-weight:300;margin-top:4px">
        [[냉각재를 잃었을 때 <b>압력 구간별 주입 수단</b>은 무엇인가. 장기 냉각은 어떻게 성립하는가||On losing coolant, what injects <b>in each pressure band</b>? How is long-term cooling established?]]</div></div>
    <div class="readout" style="border-left:3px solid var(--ok)">
      <span class="k">[[④ 격납||&#9315; Containment]]</span>

        [[격납은 방출 에너지를 <b>어디에 흡수</b>시키는가. 수소는 어떻게 처리하는가||<b>Where</b> does the containment absorb the released energy? What happens to the hydrogen?]]</div></div>
  </div>
</div>`});

S({bare:true, cls:'cover', ov:'[[맺음||Closing]]',

<div class="meta">
  [[코드는 여러분이 넣은 가정을 계산할 뿐이다.<br>
